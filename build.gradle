def lockedBackpressureValidationRequested = gradle.startParameter.taskNames.any {
	it == "minecraftMetalFxLockedBackpressureValidation"
			|| it.endsWith(":minecraftMetalFxLockedBackpressureValidation")
}
def minecraftMetalFxValidationRequested = gradle.startParameter.taskNames.any {
	it == "minecraftMetalFxClientValidation" || it.endsWith(":minecraftMetalFxClientValidation")
			|| it == "renderContractMinecraftValidation" || it.endsWith(":renderContractMinecraftValidation")
}
def renderContractMinecraftValidationRequested = gradle.startParameter.taskNames.any {
	it == "renderContractMinecraftValidation" || it.endsWith(":renderContractMinecraftValidation")
}
def renderContractMinecraftDiagnoseRequested = gradle.startParameter.taskNames.any {
	it == "renderContractMinecraftDiagnose" || it.endsWith(":renderContractMinecraftDiagnose")
}
def renderContractValidationRequested = gradle.startParameter.taskNames.any {
		it == "renderContractValidation" || it.endsWith(":renderContractValidation")
}
// The aggregate contract task includes the real Minecraft producer; reuse the
// Metal validation runClient configuration instead of allowing an OpenGL fallback.
minecraftMetalFxValidationRequested = minecraftMetalFxValidationRequested
		|| renderContractValidationRequested || renderContractMinecraftDiagnoseRequested
def renderContractManifestValidationRequested = gradle.startParameter.taskNames.any {
	it == "renderContractManifestValidation" || it.endsWith(":renderContractManifestValidation")
}
renderContractManifestValidationRequested = renderContractManifestValidationRequested
		|| renderContractValidationRequested
def renderContractPersistRequested = (providers.gradleProperty("renderContractPersist").orNull
		?: System.getProperty("metallum.renderContract.persist", "false")).toString().toBoolean()
renderContractMinecraftValidationRequested = renderContractMinecraftValidationRequested
		|| renderContractValidationRequested || renderContractMinecraftDiagnoseRequested
renderContractPersistRequested = renderContractPersistRequested || renderContractMinecraftDiagnoseRequested
def nativeFullscreenBaselineRequested = gradle.startParameter.taskNames.any {
	it == "minecraftNativeFullscreenBaseline" || it.endsWith(":minecraftNativeFullscreenBaseline")
}
def nativeRenderEfficiencyValidationRequested = gradle.startParameter.taskNames.any {
	it == "minecraftNativeRenderEfficiencyValidation"
			|| it.endsWith(":minecraftNativeRenderEfficiencyValidation")
}
nativeFullscreenBaselineRequested = nativeFullscreenBaselineRequested
		|| nativeRenderEfficiencyValidationRequested
def nativeFrameGenerationValidationRequested = gradle.startParameter.taskNames.any {
	it == "minecraftNativeFrameGenerationValidation"
			|| it.endsWith(":minecraftNativeFrameGenerationValidation")
}
if (minecraftMetalFxValidationRequested || lockedBackpressureValidationRequested
		|| nativeFullscreenBaselineRequested || nativeFrameGenerationValidationRequested) {
	def requestedValidationOutput = System.getProperty("metallum.validation.output")
	def renderContractTempOutput = null
	if (renderContractMinecraftValidationRequested && !renderContractPersistRequested
			&& (requestedValidationOutput == null || requestedValidationOutput.isBlank())) {
		renderContractTempOutput = java.nio.file.Files.createTempDirectory(
				"metallum-render-contract-minecraft-").toFile()
	}
	def validationOutputDir = requestedValidationOutput == null || requestedValidationOutput.isBlank()
			? (renderContractTempOutput != null
					? renderContractTempOutput
					: renderContractMinecraftDiagnoseRequested
					? file("${buildDir}/render-contract/minecraft-diagnose-current")
					: file("${buildDir}/metal-validation/"
			+ (nativeFrameGenerationValidationRequested
					? "minecraft-native-framegen-current"
					: nativeRenderEfficiencyValidationRequested
					? "minecraft-native-render-efficiency-current"
					: nativeFullscreenBaselineRequested
					? "minecraft-native-fullscreen-current"
					: lockedBackpressureValidationRequested
					? "minecraft-client-locked-backpressure-current"
					: "minecraft-client-current")))
			: file(requestedValidationOutput)
	def requestedFrameGeneration = nativeFrameGenerationValidationRequested
			? "true"
			: lockedBackpressureValidationRequested
			? "true"
			: System.getProperty("metallum.metalfx.frameGeneration", "false")
	def requestedObjectMotionProducer = nativeFrameGenerationValidationRequested
			? "true"
			: lockedBackpressureValidationRequested
			? "true"
			: System.getProperty("metallum.metalfx.objectMotionProducer", "false")
	def requestedFrameGenerationOutputWidth = System.getProperty(
			"metallum.metalfx.frameGenerationOutputWidth", "1280")
	def expectedFrameGenerationPresentPath = System.getProperty(
			"metallum.opt.metal4Present", "false").toBoolean() ? "metal4" : "metal3"
		def normalizedFrameGenerationOutputWidth = requestedFrameGenerationOutputWidth
				.trim().toLowerCase(Locale.ROOT)
	tasks.named("runClient") {
		doFirst {
			if (lockedBackpressureValidationRequested) {
				def reason = lockedConsoleValidationReason()
				if (reason == null || !reason.startsWith("the macOS console is locked")) {
					throw new GradleException(
							"Locked FrameGen backpressure validation requires a confirmed locked console;"
									+ " found: ${reason ?: 'console is unlocked'}."
					)
				}
				} else if (requestedFrameGeneration.toBoolean() || nativeFullscreenBaselineRequested) {
					requireUnlockedConsoleForPresentation()
			}
			delete validationOutputDir
		}
		systemProperty "metallum.validation.enabled", "true"
		systemProperty "metallum.validation.output", validationOutputDir.absolutePath
		// Validation must never silently exercise the OpenGL fallback after a
		// previous client crash persisted preferredGraphicsBackend=opengl.
		systemProperty "metallum.validation.forceMetal", "true"
		systemProperty "metallum.validation.requireMetal", "true"
		systemProperty "metallum.renderContract.enabled", renderContractMinecraftValidationRequested ? "true" : "false"
		systemProperty "metallum.renderContract.runId",
				renderContractMinecraftDiagnoseRequested ? "minecraft-diagnose-current"
						: renderContractMinecraftValidationRequested ? "minecraft-current" : "disabled"
		systemProperty "metallum.validation.sourceCommit", renderContractSourceCommit
		// Normal Minecraft runs retain the complete logical pass graph and
		// producer counts, but not every binding snapshot. A diagnostic rerun can
		// opt into full producer evidence with -Dmetallum.renderContract.captureProducers=true.
		systemProperty "metallum.renderContract.captureProducers", System.getProperty(
				"metallum.renderContract.captureProducers",
				renderContractMinecraftDiagnoseRequested ? "true"
						: renderContractMinecraftValidationRequested ? "false" : "true"
		)
		["metallum.renderContract.tracePass", "metallum.renderContract.producerRange",
				"metallum.validation.tracePass", "metallum.validation.producerRange"].each { propertyName ->
			def requestedValue = System.getProperty(propertyName)
			if (requestedValue != null) {
				systemProperty propertyName, requestedValue
			}
		}
		["metallum.opt.metal4", "metallum.opt.metal4MainRenderer"].each { propertyName ->
			def requestedValue = System.getProperty(propertyName)
			if (requestedValue != null) {
				systemProperty propertyName, requestedValue
			}
		}
		systemProperty "metallum.metalfx.mode",
				nativeFullscreenBaselineRequested ? "OFF" : "TEMPORAL"
			if (nativeFullscreenBaselineRequested || nativeFrameGenerationValidationRequested) {
				systemProperty "metallum.validation.performanceOnly", "true"
				systemProperty "metallum.validation.gpuTiming", "true"
			}
			if (nativeRenderEfficiencyValidationRequested) {
				systemProperty "metallum.validation.gpuPassTiming", "true"
				systemProperty "metallum.opt.metal4", "true"
				systemProperty "metallum.opt.metal4MainQueuePilot", "true"
				systemProperty "metallum.opt.metal4MainRenderer", System.getProperty(
						"metallum.opt.metal4MainRenderer", "false")
			}
		if (nativeFrameGenerationValidationRequested) {
			systemProperty "metallum.metalfx.nativeDirectFrameGeneration", "true"
			systemProperty "metallum.opt.metal4", "true"
			systemProperty "metallum.opt.metal4Compiler", "true"
			systemProperty "metallum.opt.metal4Present", "true"
		}
		def requestedScale = System.getProperty("metallum.metalfx.scale")
		if (requestedScale != null) {
			systemProperty "metallum.metalfx.scale", requestedScale
		}
		systemProperty "metallum.metalfx.debug", "true"
		// Frame generation stays off by default: the readback captures are the
		// deterministic attachment gate, and an asynchronous presenter would race
		// them. The attended 13.4 visual/pacing QA run turns it on explicitly with
		//   -Dmetallum.metalfx.frameGeneration=true
		//   -Dmetallum.metalfx.objectMotionProducer=true
		// (the second one opens the OBJECT_MOTION_PRODUCER_CONNECTED gate without
		// changing what ships).
		systemProperty "metallum.metalfx.frameGeneration",
				nativeFullscreenBaselineRequested ? "false" : requestedFrameGeneration
		systemProperty "metallum.metalfx.objectMotionProducer",
				nativeFullscreenBaselineRequested ? "false" : requestedObjectMotionProducer
		systemProperty "metallum.metalfx.frameGenerationOutputWidth",
				requestedFrameGenerationOutputWidth
		systemProperty "metallum.window.retinaFullscreen",
				nativeFullscreenBaselineRequested || nativeFrameGenerationValidationRequested
						? "true"
						: System.getProperty("metallum.window.retinaFullscreen", "false")
		systemProperty "metallum.validation.preserveFullscreen",
				nativeFullscreenBaselineRequested || nativeFrameGenerationValidationRequested
						? "true"
						: System.getProperty("metallum.validation.preserveFullscreen", "false")
		if (requestedFrameGeneration.toBoolean()) {
			environment "METALLUM_METALFX_PRESENT_DIAGNOSTICS_PATH",
					file("${validationOutputDir}/frame-generation-timeline.json").absolutePath
		}
		// Forward backend kill-switch overrides (-Dmetallum.opt.*) from the
		// Gradle invocation to the client JVM for toggle validation runs.
		System.properties.each { key, value ->
			if (key.toString().startsWith("metallum.opt.")) {
				systemProperty key.toString(), value.toString()
			}
		}
			[
					"metallum.metalfx.stableCutoutAlpha",
					"metallum.metalfx.stableTerrainSampler",
					"metallum.metalfx.handReactiveWeight",
					"metallum.validation.lenient"
		].each { propertyName ->
			def requestedValue = System.getProperty(propertyName)
			if (requestedValue != null) {
				systemProperty propertyName, requestedValue
			}
		}
		args "--quickPlaySingleplayer",
				System.getProperty("metallum.validation.world", "New World"),
				// Pin the window (and with it the framebuffer) size: macOS
				// window management can zoom/tile the client window, and a
				// different framebuffer size makes golden captures
				// incomparable across runs.
				"--width", "854",
				"--height", "480"
		environment "MTL_DEBUG_LAYER",
				nativeFullscreenBaselineRequested || nativeFrameGenerationValidationRequested
						? System.getProperty("metallum.validation.metalDebugLayer", "0")
						: System.getProperty("metallum.validation.metalDebugLayer", "1")
		environment "MTL_SHADER_VALIDATION", "0"
		// A run that validated nothing must not pass by omission.
		// MetalValidationClient.finishRunState is the only writer of
		// run-state.json, and the client calls minecraft.stop() only on its
		// success path, so an absent file means the scripted timeline never
		// ran to completion. That is reachable without any error: if the
		// window opens unfocused the pause screen can open on the same frame
		// the player joins, the compositor throttles the paused unfocused
		// client to ~0 frames, and beforeFrame never reaches a frame with a
		// non-null level. Three such runs on 2026-07-27 captured zero GPU
		// readbacks and still reported BUILD SUCCESSFUL.
		doLast {
			if (nativeFullscreenBaselineRequested) {
				def baselineFile = file("${validationOutputDir}/native-fullscreen-baseline.json")
				if (!baselineFile.isFile()) {
					throw new GradleException("Native fullscreen baseline is missing at ${baselineFile}")
				}
				def baseline = new groovy.json.JsonSlurper().parseText(baselineFile.getText("UTF-8"))
				if (!nativeFrameGenerationValidationRequested
						&& (!(baseline.nativeMainReadback?.completed as boolean)
						|| !(baseline.nativeMainReadback?.passed as boolean))) {
					throw new GradleException("Native main-render GPU readback did not complete successfully")
				}
				if (System.getProperty("metallum.opt.metal4MainRenderer", "false").toBoolean()) {
					if (!(baseline.metal4MainRendererEngaged as boolean)) {
						throw new GradleException("Metal 4 main renderer was requested but did not engage")
					}
					if (!(baseline.residencySetEnabled as boolean)
							|| (baseline.metal4MainRenderer.commandBuffersCreated as long) != 3L
							|| (baseline.metal4MainRenderer.commandBufferFactoryCallsAvoided as long) <= 0L) {
						throw new GradleException("Metal 4 main renderer residency/reuse evidence is incomplete")
					}
				}
				logger.lifecycle(String.format(Locale.ROOT,
						"Native fullscreen baseline %dx%d: interval p50/p95 %.2f/%.2f ms,"
								+ " GPU p50/p95 %.2f/%.2f ms, stable60=%s",
						baseline.drawableWidth, baseline.drawableHeight,
						baseline.frameIntervalP50Milliseconds, baseline.frameIntervalP95Milliseconds,
						baseline.gpuP50Milliseconds, baseline.gpuP95Milliseconds,
						baseline.stable60Fps))
				return
			}
			if (nativeFrameGenerationValidationRequested) {
				def reportFile = file("${validationOutputDir}/native-direct-frame-generation.json")
				def timelineFile = file("${validationOutputDir}/frame-generation-timeline.json")
				if (!reportFile.isFile() || !timelineFile.isFile()) {
					throw new GradleException(
							"Native-direct FrameGen artifacts missing: report=${reportFile.isFile()},"
									+ " timeline=${timelineFile.isFile()}")
				}
				def report = new groovy.json.JsonSlurper().parseText(reportFile.getText("UTF-8"))
				def timeline = new groovy.json.JsonSlurper().parseText(timelineFile.getText("UTF-8"))
				def percentile = { values, fraction ->
					def ordered = values.findAll { Double.isFinite(it as double) }
							.collect { it as double }.sort()
					if (ordered.isEmpty()) return 0.0d
					def index = Math.ceil((ordered.size() - 1) * (fraction as double)) as int
					return ordered[Math.max(0, Math.min(index, ordered.size() - 1))]
				}
				def bySource = timeline.groupBy { (it.sourceFrameID as Number).longValue() }
				def complete = bySource.values().findAll { records ->
					def kinds = records.collect { it.frameKind }.toSet()
					kinds.contains("generated") && kinds.contains("real")
				}
				def generatedGpu = complete.collect { records ->
					def item = records.find { it.frameKind == "generated" }
					((item.gpuEndTime as Number).doubleValue()
							- (item.gpuStartTime as Number).doubleValue()) * 1000.0d
				}.findAll { it > 0.0d }
				def realGpu = complete.collect { records ->
					def item = records.find { it.frameKind == "real" }
					((item.gpuEndTime as Number).doubleValue()
							- (item.gpuStartTime as Number).doubleValue()) * 1000.0d
				}.findAll { it > 0.0d }
				def totalGpuService = complete.collect { records ->
					def generated = records.find { it.frameKind == "generated" }
					def real = records.find { it.frameKind == "real" }
					def source = ((generated.sourceGpuEndTime as Number).doubleValue()
							- (generated.sourceGpuStartTime as Number).doubleValue()) * 1000.0d
					def generatedDuration = ((generated.gpuEndTime as Number).doubleValue()
							- (generated.gpuStartTime as Number).doubleValue()) * 1000.0d
					def realDuration = ((real.gpuEndTime as Number).doubleValue()
							- (real.gpuStartTime as Number).doubleValue()) * 1000.0d
					source + generatedDuration + realDuration
				}.findAll { it > 0.0d }
				def presentedTimes = timeline.findAll { it.outcome == "presented" }
						.collect { (it.presentedTime as Number).doubleValue() }.sort()
				def presentIntervals = presentedTimes.collate(2, 1, false).collect { pair ->
					(pair[1] - pair[0]) * 1000.0d
				}.findAll { it > 0.0d }
				def generatedP95 = percentile(generatedGpu, 0.95d)
				def realP95 = percentile(realGpu, 0.95d)
				def totalGpuServiceP95 = percentile(totalGpuService, 0.95d)
				def presentP95 = percentile(presentIntervals, 0.95d)
				def sourceGpuP95 = (report.gpuP95Milliseconds as Number).doubleValue()
				def gpuMargin = 16.666667d - totalGpuServiceP95
				def sampleGenerated = timeline.find { it.frameKind == "generated" }
				def result = [
						status: "measured",
						drawableWidth: report.drawableWidth,
						drawableHeight: report.drawableHeight,
						frameIntervalP95Milliseconds: report.frameIntervalP95Milliseconds,
						sourceGpuP95Milliseconds: sourceGpuP95,
						generatedGpuP95Milliseconds: generatedP95,
						realPresentGpuP95Milliseconds: realP95,
						totalGpuServiceP95Milliseconds: totalGpuServiceP95,
						gpuMarginTo60FpsMilliseconds: gpuMargin,
						frameGenerationWidth: sampleGenerated?.frameGenerationWidth ?: 0,
						frameGenerationHeight: sampleGenerated?.frameGenerationHeight ?: 0,
						frameGenerationInputWidth: sampleGenerated?.inputWidth ?: 0,
						frameGenerationInputHeight: sampleGenerated?.inputHeight ?: 0,
						completeSourcePairs: complete.size(),
						presentedRecords: presentedTimes.size(),
						presentIntervalP95Milliseconds: presentP95,
						stable60Source: report.stable60Fps,
						stable120Present: presentP95 > 0.0d && presentP95 <= 8.5d,
				]
				file("${validationOutputDir}/native-direct-performance.json").setText(
						new groovy.json.JsonBuilder(result).toPrettyString() + "\n", "UTF-8")
				logger.lifecycle(String.format(Locale.ROOT,
						"Native-direct FrameGen %dx%d: source interval/GPU p95 %.2f/%.2f ms,"
								+ " generated GPU p95 %.2f ms, total GPU p95 %.2f ms,"
								+ " present p95 %.2f ms, pairs=%d, margin=%.2f ms",
						result.drawableWidth, result.drawableHeight,
						result.frameIntervalP95Milliseconds, result.sourceGpuP95Milliseconds,
						generatedP95, totalGpuServiceP95, presentP95, complete.size(), gpuMargin))
				def failures = []
				if (complete.size() < 120) failures << "complete source pairs ${complete.size()} < 120"
				if (!(report.stable60Fps as boolean)
						|| (report.frameIntervalP95Milliseconds as double) > 18.5d) {
					failures << String.format(Locale.ROOT, "source interval p95 %.2f ms > 18.50 ms",
							report.frameIntervalP95Milliseconds as double)
				}
				if (generatedP95 <= 0.0d || generatedP95 > 7.0d) {
					failures << String.format(Locale.ROOT, "generated GPU p95 %.2f ms outside (0, 7.00] ms",
							generatedP95)
				}
				if (presentP95 <= 0.0d || presentP95 > 8.5d) {
					failures << String.format(Locale.ROOT, "present interval p95 %.2f ms outside (0, 8.50] ms",
							presentP95)
				}
				if (gpuMargin < 3.0d) {
					failures << String.format(Locale.ROOT, "GPU margin %.2f ms < 3.00 ms", gpuMargin)
				}
				if (!failures.isEmpty()) {
					throw new GradleException("Native-direct FrameGen acceptance failed: "
							+ failures.join("; "))
				}
				return
			}
			def runStateFile = file("${validationOutputDir}/run-state.json")
			if (!runStateFile.isFile()) {
				throw new GradleException(
						"Vacuous MetalFX client validation: no run-state.json at ${runStateFile}."
								+ " The client exited without completing its scripted timeline, so no"
								+ " GPU readbacks were captured and nothing was asserted."
				)
			}
			def runState
			try {
				runState = new groovy.json.JsonSlurper().parseText(runStateFile.getText("UTF-8"))
			} catch (Exception parseFailure) {
				throw new GradleException(
						"Could not parse ${runStateFile}: ${parseFailure.message}", parseFailure)
			}
			def status = runState.status
			def completed = runState.completedGpuCaptures
			def expected = runState.expectedGpuCaptures
			if (!(status instanceof String) || !(completed instanceof Number)
					|| !(expected instanceof Number)) {
				throw new GradleException(
						"Malformed ${runStateFile}: status=${status},"
								+ " completedGpuCaptures=${completed}, expectedGpuCaptures=${expected}"
				)
			}
			def problems = []
			if (status != "passed") {
				problems << "status is \"${status}\", expected \"passed\"".toString()
			}
			// Compared against the client's own expectation rather than a
			// literal so the gate follows MetalValidationClient's capture count.
			if (completed != expected) {
				problems << "captured ${completed} of ${expected} GPU readbacks".toString()
			}
			if (renderContractMinecraftValidationRequested) {
				def contractFields = [
						enabled: runState.renderContractEnabled,
						status: runState.renderContractStatus,
						ready: runState.renderContractReady,
						requested: runState.renderContractRequestedCaptures,
						completed: runState.renderContractCompletedCaptures,
						failed: runState.renderContractFailedCaptures,
						pending: runState.renderContractPendingCaptures,
						dropped: runState.renderContractDroppedCaptures,
						passes: runState.renderContractPassCount,
						droppedEvents: runState.renderContractDroppedEvents,
						manifest: runState.renderContractManifestFinalized,
				]
				if (contractFields.enabled != true) problems << "render-contract recorder was not enabled"
				if (contractFields.status != "passed") problems << "render-contract status is ${contractFields.status}"
				if (contractFields.ready != true) problems << "render-contract completion gate is not ready"
				if (!(contractFields.requested instanceof Number) || contractFields.requested <= 0)
					problems << "render-contract recorded no capture requests"
				if (!(contractFields.completed instanceof Number) || contractFields.completed != contractFields.requested)
					problems << "render-contract completed ${contractFields.completed} of ${contractFields.requested} captures"
				if (contractFields.failed != 0 || contractFields.pending != 0 || contractFields.dropped != 0)
					problems << "render-contract capture lifecycle failed: ${contractFields}"
				if (contractFields.droppedEvents != 0) problems << "render-contract dropped ${contractFields.droppedEvents} trace events"
				if (!(contractFields.passes instanceof Number) || contractFields.passes <= 0)
					problems << "render-contract produced no logical passes"
				if (contractFields.manifest != true) problems << "render-contract pass manifest was not finalized"
			}
			if (runState.renderBackend != "Metal") {
				problems << "validation ran on ${runState.renderBackend ?: 'unknown'} instead of Metal"
			}
			def explicitMetal4Master = System.getProperty("metallum.opt.metal4")
			def explicitMetal4Main = System.getProperty("metallum.opt.metal4MainRenderer")
			def metal4MainRequested = explicitMetal4Main?.toBoolean() == true
			if (metal4MainRequested) {
				if (runState.metal4MainRendererEngaged != true) {
					problems << "Metal 4 main renderer was requested but did not engage".toString()
				}
				if (!(runState.metal4MainRendererSubmissions instanceof Number)
						|| runState.metal4MainRendererSubmissions <= 0) {
					problems << "Metal 4 main renderer recorded no submissions".toString()
				}
				if (!(runState.metal4MainRendererFactoryCallsAvoided instanceof Number)
						|| runState.metal4MainRendererFactoryCallsAvoided <= 0) {
					problems << "Metal 4 main renderer recorded no command-buffer reuse".toString()
				}
				if (runState.metal4MetalFxEngaged != true) {
					problems << "Metal 4 main renderer was requested but MetalFX did not receive its queue".toString()
				}
				if (!(runState.metal4AuxiliaryComputeEncodes instanceof Number)
						|| runState.metal4AuxiliaryComputeEncodes <= 0) {
					problems << "Metal 4 Temporal recorded no auxiliary compute encodes".toString()
				}
				if (!(runState.metal4TemporalScalerEncodes instanceof Number)
						|| runState.metal4TemporalScalerEncodes <= 0) {
					problems << "Metal 4 Temporal scaler recorded no encodes".toString()
				}
			}
			if (explicitMetal4Main != null && !explicitMetal4Main.toBoolean()
					&& runState.metal4MainRendererEngaged == true) {
				problems << "Metal 3 kill-switch requested but the Metal 4 main renderer engaged".toString()
			}
			if (explicitMetal4Master != null && !explicitMetal4Master.toBoolean()) {
				def forbiddenMetal4Counts = [
						runState.metal4AuxiliaryComputeEncodes,
						runState.metal4SpatialScalerEncodes,
						runState.metal4TemporalScalerEncodes,
						runState.metal4FrameGenerationInputSubmissions
				]
				if (forbiddenMetal4Counts.any { it instanceof Number && it > 0 }) {
					problems << "Metal 3 kill-switch requested but Metal 4 MetalFX work was recorded".toString()
				}
			}
			if (requestedFrameGeneration.toBoolean()) {
				def queued = runState.frameGenerationFramesQueued
				def enabledAtCompletion = runState.frameGenerationEnabledAtCompletion
				if (!(queued instanceof Number)) {
					problems << "frameGenerationFramesQueued is missing or malformed".toString()
				} else if (queued <= 0) {
					problems << "Frame Generation was requested but queued no source frames".toString()
				}
				if (enabledAtCompletion != true) {
					problems << "Frame Generation was requested but was disabled before validation completed".toString()
				}
				if (metal4MainRequested
						&& (!(runState.metal4FrameGenerationInputSubmissions instanceof Number)
						|| runState.metal4FrameGenerationInputSubmissions <= 0)) {
					problems << "Metal 4 Frame Generation recorded no input submissions".toString()
				}

				if (lockedBackpressureValidationRequested) {
					def admissionFile = file(
							"${validationOutputDir}/frame-generation-source-admission.json")
					if (!admissionFile.isFile()) {
						problems << "Frame Generation source-admission diagnostics are missing at ${admissionFile}".toString()
					} else {
						def admission
						try {
							admission = new groovy.json.JsonSlurper().parseText(admissionFile.getText("UTF-8"))
						} catch (Exception parseFailure) {
							throw new GradleException(
									"Could not parse ${admissionFile}: ${parseFailure.message}", parseFailure)
						}
						def sources = admission.sources
						if (!(sources instanceof List)) {
							problems << "Frame Generation source-admission sources are missing or malformed".toString()
						} else {
							def percentile = { values, fraction ->
								def ordered = values.findAll { Double.isFinite(it as double) }
										.collect { it as double }
										.sort()
								if (ordered.isEmpty()) return 0.0d
								def index = Math.ceil((ordered.size() - 1) * (fraction as double)) as int
								return ordered[Math.max(0, Math.min(index, ordered.size() - 1))]
							}
							def waits = sources.collect { it.cpuWaitMilliseconds as Number }
									.collect { it.doubleValue() }
							def enqueueTimes = sources.collect { it.enqueueTime as Number }
									.collect { it.doubleValue() }
									.sort()
							def enqueueIntervals = enqueueTimes.collate(2, 1, false).collect { pair ->
								(pair[1] - pair[0]) * 1000.0d
							}.findAll { Double.isFinite(it) && it > 0.0d }
							def waitP50 = percentile(waits, 0.50d)
							def waitP95 = percentile(waits, 0.95d)
							def waitMax = waits.isEmpty() ? 0.0d : waits.max()
							def enqueueIntervalP50 = percentile(enqueueIntervals, 0.50d)
							def superseded = admission.supersededSources
							def summary = [
									status: "measured-locked-backpressure-only",
									scanoutValidated: false,
									sourceFrames: sources.size(),
									supersededSources: superseded,
									sourceCpuWaitP50Milliseconds: waitP50,
									sourceCpuWaitP95Milliseconds: waitP95,
									sourceCpuWaitMaximumMilliseconds: waitMax,
									sourceEnqueueIntervalP50Milliseconds: enqueueIntervalP50,
									gates: [
											minimumSourceFrames: 120,
											minimumSupersededSources: 1,
											maximumSourceCpuWaitP95Milliseconds: 16.67d,
											maximumSourceCpuWaitMilliseconds: 100.0d,
									]
							]
							def summaryFile = file(
									"${validationOutputDir}/frame-generation-backpressure.json")
							summaryFile.setText(
									new groovy.json.JsonBuilder(summary).toPrettyString() + "\n", "UTF-8")
							logger.lifecycle(String.format(Locale.ROOT,
									"Locked Frame Generation backpressure: sources %d, superseded %s,"
											+ " presenter wait p50/p95/max %.2f/%.2f/%.2f ms",
									sources.size(), superseded, waitP50, waitP95, waitMax))
							if (sources.size() < 120) {
								problems << "locked backpressure run captured only ${sources.size()} source admissions".toString()
							}
							if (!(superseded instanceof Number) || superseded < 1) {
								problems << "locked backpressure run did not supersede a stalled source".toString()
							}
							if (waitP95 > 16.67d) {
								problems << String.format(Locale.ROOT,
										"locked presenter wait p95 %.2f ms exceeds 16.67 ms", waitP95)
							}
							if (waitMax > 100.0d) {
								problems << String.format(Locale.ROOT,
										"locked presenter wait maximum %.2f ms exceeds 100.00 ms", waitMax)
							}
						}
					}
				}
				if (!lockedBackpressureValidationRequested) {
					def timelineFile = file(
							"${validationOutputDir}/frame-generation-timeline.json")
					if (!timelineFile.isFile()) {
					problems << "Frame Generation timeline is missing at ${timelineFile}".toString()
				} else {
					def timeline
					try {
						timeline = new groovy.json.JsonSlurper().parseText(timelineFile.getText("UTF-8"))
					} catch (Exception parseFailure) {
						throw new GradleException(
								"Could not parse ${timelineFile}: ${parseFailure.message}", parseFailure)
					}
					if (!(timeline instanceof List)) {
						problems << "Frame Generation timeline is not a JSON array".toString()
					} else {
						def presentPaths = timeline.collect { it.presentPath }
								.findAll { it instanceof String }
								.toSet()
						def expectedPresentPaths = [expectedFrameGenerationPresentPath] as Set
						if (presentPaths != expectedPresentPaths) {
							problems << "Frame Generation requested ${expectedFrameGenerationPresentPath}"
									+ " presenter but timeline recorded ${presentPaths ?: 'no path'}"
						}
						def percentile = { values, fraction ->
							def ordered = values.findAll { Double.isFinite(it as double) }
									.collect { it as double }
									.sort()
							if (ordered.isEmpty()) return 0.0d
							def index = Math.ceil((ordered.size() - 1) * (fraction as double)) as int
							return ordered[Math.max(0, Math.min(index, ordered.size() - 1))]
						}
						def bySource = timeline.groupBy { (it.sourceFrameID as Number).longValue() }
						def completeSourceIds = bySource.keySet().sort().findAll { sourceId ->
							def kinds = bySource[sourceId].collect { it.frameKind as String }.toSet()
							kinds.contains("generated") && kinds.contains("real")
						}
						def sourceGpuMilliseconds = []
						def generatedGpuMilliseconds = []
						def realGpuMilliseconds = []
						def totalGpuMilliseconds = []
						def sourceStartById = [:]
						def sourceEnqueueById = [:]
						def sourceCpuWaitById = [:]
						def sourceCpuWaitMilliseconds = []
						def presentedTimes = []
						completeSourceIds.each { sourceId ->
							def records = bySource[sourceId]
							def generated = records.find { it.frameKind == "generated" }
							def real = records.find { it.frameKind == "real" }
							def sourceStart = (records[0].sourceGpuStartTime as Number).doubleValue()
							def sourceEnd = (records[0].sourceGpuEndTime as Number).doubleValue()
							def sourceEnqueue = (records[0].sourceEnqueueTime as Number).doubleValue()
							def sourceCpuWait = (records[0].sourceCpuWaitTime as Number).doubleValue()
							def generatedStart = (generated.gpuStartTime as Number).doubleValue()
							def generatedEnd = (generated.gpuEndTime as Number).doubleValue()
							def realStart = (real.gpuStartTime as Number).doubleValue()
							def realEnd = (real.gpuEndTime as Number).doubleValue()
							def sourceMs = (sourceEnd - sourceStart) * 1000.0d
							def generatedMs = (generatedEnd - generatedStart) * 1000.0d
							def realMs = (realEnd - realStart) * 1000.0d
							if (sourceMs > 0.0d && generatedMs > 0.0d && realMs > 0.0d) {
								sourceGpuMilliseconds << sourceMs
								generatedGpuMilliseconds << generatedMs
								realGpuMilliseconds << realMs
								totalGpuMilliseconds << sourceMs + generatedMs + realMs
								sourceStartById[sourceId] = sourceStart
								if (sourceEnqueue > 0.0d) {
									sourceEnqueueById[sourceId] = sourceEnqueue
									def sourceCpuWaitMs = sourceCpuWait * 1000.0d
									sourceCpuWaitById[sourceId] = sourceCpuWaitMs
									sourceCpuWaitMilliseconds << sourceCpuWaitMs
								}
							}
							[generated, real].each { item ->
								def presented = (item.presentedTime as Number).doubleValue()
								if (item.outcome == "presented" && presented > 0.0d) {
									presentedTimes << presented
								}
							}
						}
						def sourceIntervals = []
						completeSourceIds.collate(2, 1, false).each { pair ->
							if (pair[1] == pair[0] + 1
									&& sourceStartById.containsKey(pair[0])
									&& sourceStartById.containsKey(pair[1])) {
								def interval = (sourceStartById[pair[1]] - sourceStartById[pair[0]]) * 1000.0d
								if (interval > 0.0d) sourceIntervals << interval
							}
						}
						def presentIntervals = []
						presentedTimes.sort().collate(2, 1, false).each { pair ->
							def interval = (pair[1] - pair[0]) * 1000.0d
							if (interval > 0.0d) presentIntervals << interval
						}
						def sourceCpuIntervals = []
						def sourceCpuNonWaitIntervals = []
						completeSourceIds.collate(2, 1, false).each { pair ->
							if (pair[1] == pair[0] + 1
									&& sourceEnqueueById.containsKey(pair[0])
									&& sourceEnqueueById.containsKey(pair[1])) {
								def interval = (sourceEnqueueById[pair[1]] - sourceEnqueueById[pair[0]]) * 1000.0d
								if (interval > 0.0d) {
									sourceCpuIntervals << interval
									if (sourceCpuWaitById.containsKey(pair[1])) {
										sourceCpuNonWaitIntervals << Math.max(
												0.0d, interval - (sourceCpuWaitById[pair[1]] as double))
									}
								}
							}
						}
						def sourceIntervalP50 = percentile(sourceIntervals, 0.50d)
						def sourceIntervalP95 = percentile(sourceIntervals, 0.95d)
						def presentIntervalP50 = percentile(presentIntervals, 0.50d)
						def presentIntervalP95 = percentile(presentIntervals, 0.95d)
						def sourceGpuP95 = percentile(sourceGpuMilliseconds, 0.95d)
						def generatedGpuP95 = percentile(generatedGpuMilliseconds, 0.95d)
						def realGpuP95 = percentile(realGpuMilliseconds, 0.95d)
						def totalGpuP95 = percentile(totalGpuMilliseconds, 0.95d)
						def sourceCpuIntervalP50 = percentile(sourceCpuIntervals, 0.50d)
						def sourceCpuIntervalP95 = percentile(sourceCpuIntervals, 0.95d)
						def sourceCpuWaitP50 = percentile(sourceCpuWaitMilliseconds, 0.50d)
						def sourceCpuWaitP95 = percentile(sourceCpuWaitMilliseconds, 0.95d)
						def sourceCpuNonWaitP50 = percentile(sourceCpuNonWaitIntervals, 0.50d)
						def sourceCpuNonWaitP95 = percentile(sourceCpuNonWaitIntervals, 0.95d)
							def overBudgetFrames = totalGpuMilliseconds.count { it > (1000.0d / 60.0d) }
							def presentedCount = timeline.count { it.outcome == "presented" }
							def sampleGenerated = timeline.find { it.frameKind == "generated" }
							def summary = [
									status: "measured",
									presentPath: presentPaths.size() == 1 ? presentPaths.first() : "mixed",
									frameGenerationOutputWidthPolicy: normalizedFrameGenerationOutputWidth,
									frameGenerationOutputWidth: sampleGenerated?.frameGenerationWidth ?: 0,
									frameGenerationOutputHeight: sampleGenerated?.frameGenerationHeight ?: 0,
									frameGenerationInputWidth: sampleGenerated?.inputWidth ?: 0,
									frameGenerationInputHeight: sampleGenerated?.inputHeight ?: 0,
								records: timeline.size(),
								completeSourcePairs: totalGpuMilliseconds.size(),
								presentedRecords: presentedCount,
								presentedRatio: timeline.isEmpty() ? 0.0d : presentedCount / (double) timeline.size(),
								sourceIntervalP50Milliseconds: sourceIntervalP50,
								sourceIntervalP95Milliseconds: sourceIntervalP95,
								sourceCpuIntervalP50Milliseconds: sourceCpuIntervalP50,
								sourceCpuIntervalP95Milliseconds: sourceCpuIntervalP95,
								sourceCpuIntervalP95MarginTo16_67Milliseconds:
										(1000.0d / 60.0d) - sourceCpuIntervalP95,
								sourceCpuWaitP50Milliseconds: sourceCpuWaitP50,
								sourceCpuWaitP95Milliseconds: sourceCpuWaitP95,
								sourceCpuNonWaitP50Milliseconds: sourceCpuNonWaitP50,
								sourceCpuNonWaitP95Milliseconds: sourceCpuNonWaitP95,
								sourceCpuNonWaitP95MarginTo16_67Milliseconds:
										(1000.0d / 60.0d) - sourceCpuNonWaitP95,
								presentIntervalP50Milliseconds: presentIntervalP50,
								presentIntervalP95Milliseconds: presentIntervalP95,
								sourceGpuP95Milliseconds: sourceGpuP95,
								generatedGpuP95Milliseconds: generatedGpuP95,
								realGpuP95Milliseconds: realGpuP95,
								totalGpuP95Milliseconds: totalGpuP95,
								totalGpuP95MarginTo16_67Milliseconds: (1000.0d / 60.0d) - totalGpuP95,
								over16_67MillisecondFrames: overBudgetFrames,
								gates: [
										minimumCompleteSourcePairs: 120,
										minimumPresentedRatio: 0.95d,
										maximumSourceIntervalP95Milliseconds: 18.5d,
										maximumPresentIntervalP95Milliseconds: 8.5d,
										maximumGeneratedGpuP95Milliseconds: 7.0d,
										minimumTotalGpuP95MarginMilliseconds: 3.0d,
										maximumOver16_67MillisecondFrames: 0
								]
							]
						def summaryFile = file(
								"${validationOutputDir}/frame-generation-performance.json")
						summaryFile.setText(new groovy.json.JsonBuilder(summary).toPrettyString() + "\n", "UTF-8")
						logger.lifecycle(String.format(Locale.ROOT,
								"Frame Generation steady-state: source interval p95 %.2f ms, source CPU interval p95 %.2f ms,"
										+ " CPU non-wait p95 %.2f ms, presenter wait p95 %.2f ms, present p95 %.2f ms,"
										+ " total GPU p95 %.2f ms (%.2f ms margin), presented %d/%d",
								sourceIntervalP95, sourceCpuIntervalP95, sourceCpuNonWaitP95, sourceCpuWaitP95,
								presentIntervalP95, totalGpuP95,
								(1000.0d / 60.0d) - totalGpuP95, presentedCount, timeline.size()))
						if (totalGpuMilliseconds.size() < 120) {
							problems << "Frame Generation steady-state captured only ${totalGpuMilliseconds.size()} complete source pairs".toString()
						}
						if (summary.presentedRatio < 0.95d) {
							problems << String.format(Locale.ROOT,
									"presented ratio %.3f is below 0.950", summary.presentedRatio)
						}
						if (sourceIntervalP95 > 18.5d) {
							problems << String.format(Locale.ROOT,
									"source interval p95 %.2f ms exceeds 18.50 ms", sourceIntervalP95)
						}
						if (presentIntervalP95 > 8.5d) {
							problems << String.format(Locale.ROOT,
									"present interval p95 %.2f ms exceeds 8.50 ms", presentIntervalP95)
						}
						if (generatedGpuP95 > 7.0d) {
							problems << String.format(Locale.ROOT,
									"generated-frame GPU p95 %.2f ms exceeds 7.00 ms", generatedGpuP95)
						}
						if (totalGpuP95 > (1000.0d / 60.0d - 3.0d)) {
							problems << String.format(Locale.ROOT,
									"total GPU p95 %.2f ms leaves less than 3.00 ms headroom", totalGpuP95)
						}
						if (overBudgetFrames > 0) {
							problems << "${overBudgetFrames} steady-state source pairs exceeded 16.67 ms GPU time".toString()
						}
					}
				}
				}
			}
			if (!problems.isEmpty()) {
				problems.each { logger.error("VALIDATION ${it}") }
				throw new GradleException(
						"MetalFX client validation did not pass: ${problems.join('; ')}."
								+ " See ${runStateFile}."
				)
			}
			logger.lifecycle(
					"MetalFX client validation: PASS (${completed}/${expected} GPU readbacks,"
							+ " ${runState.failedGpuCaptures} failed)"
			)
			if (renderContractTempOutput != null) {
				delete renderContractTempOutput
				logger.lifecycle("Render-contract temporary validation output removed after PASS: ${renderContractTempOutput}")
			}
		}
	}
}

// P2-1 golden-frame regression tooling. minecraftMetalFxClientValidation
// already dumps every captured pass plane as raw bytes
// (frame-*/<plane>.bin); goldenFrameRecord snapshots the latest run as the
// baseline, and goldenFrameCompare byte-compares a later run against it.
// Workflow:
//   ./gradlew minecraftMetalFxClientValidation && ./gradlew goldenFrameRecord
//   <make a change>
//   ./gradlew minecraftMetalFxClientValidation && ./gradlew goldenFrameCompare
// Any byte difference fails the compare; -PgoldenTolerate=plane1,plane2
// downgrades named planes (e.g. temporal-output) to logged-only.

def goldenBaselineDir = file("${buildDir}/metal-validation/golden-baseline")
def goldenCurrentDir = file("${buildDir}/metal-validation/minecraft-client-current")

tasks.register("goldenFrameRecord", Sync) {
	group = "verification"
	description = "Snapshots the latest minecraftMetalFxClientValidation captures as the golden baseline."
	from goldenCurrentDir
	into goldenBaselineDir
	doFirst {
		if (!goldenCurrentDir.directory) {
			throw new GradleException("No captures at ${goldenCurrentDir}; run minecraftMetalFxClientValidation first")
		}
	}
}

tasks.register("goldenFrameCompare") {
	group = "verification"
	description = "Byte-compares the latest validation captures against the recorded golden baseline."
	doLast {
		if (!goldenBaselineDir.directory) {
			throw new GradleException("No golden baseline at ${goldenBaselineDir}; run goldenFrameRecord first")
		}
		if (!goldenCurrentDir.directory) {
			throw new GradleException("No captures at ${goldenCurrentDir}; run minecraftMetalFxClientValidation first")
		}
		Set tolerated = (findProperty("goldenTolerate") ?: "").toString()
				.split(",").findAll { !it.isEmpty() } as Set
		def failures = []
		int compared = 0
		def frameDirs = goldenBaselineDir.listFiles()
				.findAll { it.directory && it.name.startsWith("frame-") }
				.sort { it.name }
		frameDirs.each { frameDir ->
			frameDir.listFiles().findAll { it.name.endsWith(".bin") }.sort { it.name }.each { baseFile ->
				def rel = "${frameDir.name}/${baseFile.name}"
				def plane = baseFile.name - ".bin"
				def curFile = new File(goldenCurrentDir, rel)
				compared++
				if (!curFile.file) {
					failures << "${rel}: missing in current run".toString()
					return
				}
				byte[] a = baseFile.bytes
				byte[] b = curFile.bytes
				if (java.util.Arrays.equals(a, b)) {
					return
				}
				String msg
				if (a.length != b.length) {
					msg = "${rel}: size ${a.length} vs ${b.length}"
				} else {
					int diffs = 0
					int first = -1
					int maxDelta = 0
					for (int i = 0; i < a.length; i++) {
						if (a[i] != b[i]) {
							diffs++
							if (first < 0) first = i
							int delta = Math.abs((a[i] & 0xFF) - (b[i] & 0xFF))
							if (delta > maxDelta) maxDelta = delta
						}
					}
					msg = String.format(
							"%s: %d differing bytes (%.3f%%), first at byte %d, max byte delta %d",
							rel, diffs, 100.0d * diffs / a.length, first, maxDelta)
				}
				if (tolerated.contains(plane)) {
					logger.lifecycle("TOLERATED ${msg}")
				} else {
					failures << msg
				}
			}
		}
		// A run that silently produced fewer frames must not pass by omission.
		def baselineFrames = frameDirs.collect { it.name } as Set
		goldenCurrentDir.listFiles()
				.findAll { it.directory && it.name.startsWith("frame-") }
				.each { if (!baselineFrames.contains(it.name)) failures << "${it.name}: not present in baseline".toString() }
		logger.lifecycle("Golden frame compare: ${compared} planes vs ${goldenBaselineDir.name}")
		if (!failures.isEmpty()) {
			failures.each { logger.error("GOLDEN DIFF ${it}") }
			throw new GradleException("Golden frame regression: ${failures.size()} plane(s) differ")
		}
		logger.lifecycle("Golden frame compare: PASS (byte-identical)")
	}
}

// Cross-backend final-target comparison. Each client run must explicitly set
// metallum.backend.compare.name to `metal` or `vulkan`; the task compares the
// common RGBA8 readback frames exactly and writes a machine-readable report.
tasks.register("backendFrameCompare") {
	group = "verification"
	description = "Compares final RGBA8 framebuffer captures from Metal and Vulkan runs."
	doLast {
		def metalDir = file(findProperty("backendCompareMetal") ?: "${buildDir}/backend-compare/metal")
		def vulkanDir = file(findProperty("backendCompareVulkan") ?: "${buildDir}/backend-compare/vulkan")
		if (!metalDir.directory || !vulkanDir.directory) {
			throw new GradleException("Need both capture directories: ${metalDir} and ${vulkanDir}")
		}
		def metalFrames = metalDir.listFiles().findAll { it.name ==~ /frame-\d+\.bin/ }
				.collectEntries { [(it.name): it] }
		def vulkanFrames = vulkanDir.listFiles().findAll { it.name ==~ /frame-\d+\.bin/ }
				.collectEntries { [(it.name): it] }
		def common = (metalFrames.keySet() as Set).intersect(vulkanFrames.keySet() as Set).sort()
		def missingMetal = (vulkanFrames.keySet() as Set) - metalFrames.keySet()
		def missingVulkan = (metalFrames.keySet() as Set) - vulkanFrames.keySet()
		if (common.isEmpty() || !missingMetal.isEmpty() || !missingVulkan.isEmpty()) {
			throw new GradleException(
					"Frame sets do not match; common=${common}, missingMetal=${missingMetal}, missingVulkan=${missingVulkan}"
			)
		}
		int maxAllowedDelta = Integer.parseInt((findProperty("backendCompareMaxChannelDelta") ?: "0").toString())
		long maxAllowedPixels = Long.parseLong((findProperty("backendCompareMaxDifferingPixels") ?: "0").toString())
		def results = []
		def failures = []
		common.each { name ->
			byte[] metal = metalFrames[name].bytes
			byte[] vulkan = vulkanFrames[name].bytes
			if (metal.length != vulkan.length || metal.length % 4 != 0) {
				failures << "${name}: byte lengths ${metal.length} vs ${vulkan.length}"
				return
			}
			long differingPixels = 0
			long differingChannels = 0
			long absoluteDelta = 0
			long squaredDelta = 0
			int maxDelta = 0
			for (int offset = 0; offset < metal.length; offset += 4) {
				boolean pixelDiffers = false
				for (int channel = 0; channel < 4; channel++) {
					int delta = Math.abs((metal[offset + channel] & 0xff) - (vulkan[offset + channel] & 0xff))
					if (delta != 0) {
						pixelDiffers = true
						differingChannels++
					}
					absoluteDelta += delta
					squaredDelta += (long) delta * delta
					maxDelta = Math.max(maxDelta, delta)
				}
				if (pixelDiffers) {
					differingPixels++
				}
			}
			long pixels = metal.length / 4
			def result = [
					frame: name,
					pixels: pixels,
					differingPixels: differingPixels,
					differingChannels: differingChannels,
					maxChannelDelta: maxDelta,
					meanAbsoluteChannelDelta: metal.length == 0 ? 0.0 : absoluteDelta / (double) metal.length,
					rmse: metal.length == 0 ? 0.0 : Math.sqrt(squaredDelta / (double) metal.length),
					exact: differingChannels == 0
			]
			results << result
			if (maxDelta > maxAllowedDelta || differingPixels > maxAllowedPixels) {
				failures << "${name}: ${differingPixels}/${pixels} pixels differ, max channel delta ${maxDelta}"
			}
		}
		def report = [
				schema: 1,
				metalDirectory: metalDir.absolutePath,
				vulkanDirectory: vulkanDir.absolutePath,
				frames: results,
				maxAllowedChannelDelta: maxAllowedDelta,
				maxAllowedDifferingPixels: maxAllowedPixels,
				status: failures.isEmpty() ? "passed" : "failed",
				failures: failures
		]
		def reportFile = file(findProperty("backendCompareReport") ?: "${buildDir}/backend-compare/comparison.json")
		reportFile.parentFile.mkdirs()
		reportFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(report)) + "\n"
		logger.lifecycle("Backend frame compare: ${report.status}; frames=${results.size()}; report=${reportFile}")
		if (!failures.isEmpty()) {
			failures.each { logger.error("BACKEND FRAME DIFF ${it}") }
			throw new GradleException("Metal/Vulkan final framebuffer comparison failed (${failures.size()} frame(s))")
		}
	}
}

def nonIrisControlCaptureRequested = gradle.startParameter.taskNames.any {
	it == "minecraftNonIrisControlCapture" || it.endsWith(":minecraftNonIrisControlCapture")
}
def nonIrisTreatmentCaptureRequested = gradle.startParameter.taskNames.any {
	it == "minecraftNonIrisTreatmentCapture" || it.endsWith(":minecraftNonIrisTreatmentCapture")
}
if (nonIrisControlCaptureRequested && nonIrisTreatmentCaptureRequested) {
	throw new GradleException(
			"Non-Iris control and treatment require separate isolated game directories and launches."
	)
}

["minecraftNonIrisControlCapture", "minecraftNonIrisTreatmentCapture"].each { taskName ->
	def lane = taskName.contains("Control") ? "control" : "treatment"
	tasks.register(taskName) {
		group = "verification"
		description = "Captures the isolated shaders-off non-Iris ${lane} lane on native Metal."
		if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
			dependsOn "runClient"
		} else {
			doLast {
				logger.lifecycle("${taskName} SKIPPED: macOS Metal is required")
			}
		}
		doLast {
			if (!org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
				return
			}
			def root = file(findProperty("nonIrisRoot")
					?: "${buildDir}/iris-runtime/non-iris-current")
			def session = new File(new File(root, lane), "session.json")
			if (!session.isFile()) {
				throw new GradleException("${taskName} produced no session receipt at ${session}")
			}
			def receipt = new groovy.json.JsonSlurper().parse(session)
			if (receipt.status != "passed" || receipt.failedCaptures != 0) {
				throw new GradleException(
						"${taskName} did not pass: status=${receipt.status},"
								+ " failedCaptures=${receipt.failedCaptures}"
				)
			}
			logger.lifecycle("${taskName}: PASS; evidence=${session.parentFile}")
		}
	}
}

def nonIrisCaptureRequested =
		nonIrisControlCaptureRequested || nonIrisTreatmentCaptureRequested
if (nonIrisCaptureRequested && org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
	def lane = nonIrisControlCaptureRequested ? "control" : "treatment"
	def gameDirProperty = nonIrisControlCaptureRequested
			? "nonIrisControlGameDir"
			: "nonIrisTreatmentGameDir"
	def requestedGameDir = findProperty(gameDirProperty)?.toString()
	def gameDir = requestedGameDir == null ? null : new File(requestedGameDir)
	def root = file(findProperty("nonIrisRoot")
			?: "${buildDir}/iris-runtime/non-iris-current")
	def laneOutput = new File(root, lane)
	def worldName = (findProperty("nonIrisWorld") ?: "New World").toString()
	def scenarioId = (findProperty("nonIrisScenario") ?: "non-iris-clear-dusk-v1").toString()
	def frames = (findProperty("nonIrisFrames") ?: "160,220").toString()
	def fixedClock = (findProperty("nonIrisClock") ?: "108500").toString()
	def playerName = (findProperty("nonIrisPlayerName") ?: "MetalRegression").toString()
	def playerUuid = (findProperty("nonIrisPlayerUuid")
			?: "8f16930a-42ad-4f9b-9d59-02698f26b145").toString()
	def fixedCamera = (findProperty("nonIrisCamera")
			?: "579.4938336701937,90.45083448610046,-177.71662902161114,"
			+ "-164.09991455078125,29.249996185302734").toString()

	def hashWorldSnapshot = { File worldDirectory ->
		def digest = java.security.MessageDigest.getInstance("SHA-256")
		def files = []
		worldDirectory.eachFileRecurse(groovy.io.FileType.FILES) { candidate ->
			files << candidate
		}
		files.sort { left, right ->
			def leftRelative = worldDirectory.toPath().relativize(left.toPath()).toString()
			def rightRelative = worldDirectory.toPath().relativize(right.toPath()).toString()
			leftRelative <=> rightRelative
		}
		def buffer = new byte[64 * 1024]
		files.each { candidate ->
			def relative = worldDirectory.toPath().relativize(candidate.toPath())
					.toString().replace(File.separatorChar, '/' as char)
			digest.update(relative.getBytes(java.nio.charset.StandardCharsets.UTF_8))
			digest.update((byte) 0)
			candidate.withInputStream { input ->
				int read
				while ((read = input.read(buffer)) >= 0) {
					if (read > 0) {
						digest.update(buffer, 0, read)
					}
				}
			}
		}
		java.util.HexFormat.of().formatHex(digest.digest())
	}

	if (gameDir != null) {
		// Loom's AbstractRunTask overwrites JavaExec.workingDir from the run
		// configuration immediately before launch. Configure that source of
		// truth so Log4j and every other relative runtime path stay inside the
		// same isolated directory as Minecraft's --gameDir.
		loom.runs.named("client") {
			runDir project.relativePath(gameDir)
		}
	}

	tasks.named("runClient") {
		doFirst {
			if (gameDir == null || !gameDir.isAbsolute()) {
				throw new GradleException(
						"-P${gameDirProperty}=<absolute isolated game directory> is required."
				)
			}
			if (playerName.isBlank() || playerName.length() > 16) {
				throw new GradleException(
						"nonIrisPlayerName must contain 1 to 16 characters, found '${playerName}'."
				)
			}
			try {
				java.util.UUID.fromString(playerUuid)
			} catch (IllegalArgumentException invalidUuid) {
				throw new GradleException(
						"nonIrisPlayerUuid must be a canonical UUID, found '${playerUuid}'.",
						invalidUuid
				)
			}
			def worldDirectory = new File(new File(gameDir, "saves"), worldName)
			if (!new File(worldDirectory, "level.dat").isFile()) {
				throw new GradleException(
						"${gameDirProperty} has no '${worldName}' save: ${worldDirectory}"
				)
			}
			def irisConfig = new File(new File(gameDir, "config"), "iris.properties")
			if (!irisConfig.isFile()) {
				throw new GradleException("Missing shaders-off Iris config: ${irisConfig}")
			}
			def irisProperties = new Properties()
			irisConfig.withInputStream { irisProperties.load(it) }
			if (!"false".equalsIgnoreCase(irisProperties.getProperty("enableShaders", ""))) {
				throw new GradleException(
						"${irisConfig} must contain enableShaders=false for the non-Iris gate."
				)
			}
			if (laneOutput.exists()) {
				throw new GradleException(
						"Refusing to overwrite existing non-Iris evidence: ${laneOutput}"
				)
			}
			def snapshotSha256 = hashWorldSnapshot(worldDirectory)
			systemProperty(
					"metallum.backend.compare.world-snapshot-sha256",
					snapshotSha256
			)
			logger.lifecycle(
					"Non-Iris ${lane}: gameDir=${gameDir}, worldSnapshotSha256=${snapshotSha256}"
			)
		}
		systemProperty "metallum.backend.compare.enabled", "true"
		systemProperty "metallum.backend.compare.auto-stop", "true"
		systemProperty "metallum.backend.compare.output", root.absolutePath
		systemProperty "metallum.backend.compare.name", lane
		systemProperty "metallum.backend.compare.scenario-id", scenarioId
		systemProperty "metallum.backend.compare.world-name", worldName
		systemProperty(
				"metallum.backend.compare.game-directory",
				gameDir == null ? "" : gameDir.absolutePath
		)
		systemProperty "metallum.backend.compare.player-name", playerName
		systemProperty "metallum.backend.compare.player-uuid", playerUuid
		systemProperty "metallum.backend.compare.frames", frames
		systemProperty "metallum.backend.compare.fixed-clock-ticks", fixedClock
		systemProperty "metallum.backend.compare.fixed-camera", fixedCamera
		systemProperty "metallum.backend.compare.fixed-iris-frame-millis", "16"
		systemProperty "metallum.backend.compare.freeze-simulation", "true"
		systemProperty "metallum.backend.compare.freeze-atlas-animation", "true"
		systemProperty "metallum.backend.compare.fixed-weather", "clear"
		systemProperty "metallum.backend.compare.stable-scene-frames", "240"
		systemProperty "metallum.backend.compare.stable-scene-millis", "8000"
		systemProperty "metallum.backend.compare.iris-reload-frame", "-1"
		systemProperty(
				"metallum.iris.semantic",
				nonIrisTreatmentCaptureRequested ? "true" : "false"
		)
		systemProperty "metallum.metalfx.mode", "OFF"
		systemProperty "metallum.metalfx.frameGeneration", "false"
		systemProperty "metallum.metalfx.objectMotionProducer", "false"
		systemProperty "metallum.metal.hud", "false"
		// Loom's runDir does not set Minecraft's parsed gameDirectory. Pass the
		// same directory through the real client option so both identities can
		// be verified independently in the runtime receipt.
		args "--gameDir", gameDir == null ? "" : gameDir.absolutePath
		args "--username", playerName, "--uuid", playerUuid
		args "--quickPlaySingleplayer", worldName, "--width", "854", "--height", "480"
		environment "MTL_DEBUG_LAYER", "1"
		environment "MTL_SHADER_VALIDATION", "0"
	}
}

// Shaders-off safety gate. The two client lanes are launched deliberately and
// stored as durable evidence; this task is an offline consumer and never
// starts Minecraft or deletes a capture directory.
tasks.register("nonIrisRegressionCompare", JavaExec) {
	group = "verification"
	description = "Fail-closed comparison of semantic-off and semantic-on/shaders-off native Metal captures."
	dependsOn tasks.named("classes")
	classpath = sourceSets.main.runtimeClasspath
	mainClass = "com.metallum.client.validation.NonIrisRegressionVerifier"
	workingDir projectDir
	doFirst {
		def root = file(findProperty("nonIrisRoot")
				?: "${buildDir}/iris-runtime/non-iris-current")
		def control = file(findProperty("nonIrisControl") ?: new File(root, "control"))
		def treatment = file(findProperty("nonIrisTreatment") ?: new File(root, "treatment"))
		def report = file(findProperty("nonIrisReport") ?: new File(root, "comparison.json"))
		setArgs([
				control.absolutePath,
				treatment.absolutePath,
				report.absolutePath
		])
	}
}

// Builds the Metallum native bridge as a dylib targeting iOS arm64. The
// resulting artifact must be embedded in the iOS app bundle's Frameworks
// directory and signed with the app's signing identity; iOS forbids loading
// unsigned dylibs from writable tmp directories at runtime, so the produced
// file is consumed by PojavLauncher's packaging step rather than extracted
// from the jar at runtime.
//
// Requires Xcode with an iOS toolchain. Skipped automatically if the host
// is not macOS or if the iOS SDK is unavailable.
//
// Note: swiftc's `-sdk` flag does NOT resolve SDK names through xcrun the
// way `-target` does; passing the literal "iphoneos" makes swiftc look for
// a *directory* named "iphoneos" and fail with "no such sysroot directory".
// We must resolve the full SDK path ourselves via xcrun and pass that.

def iosSdkPath = {
	if (!org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
		return null
	}
	def out = new ByteArrayOutputStream()
	def err = new ByteArrayOutputStream()
	def proc = ["xcrun", "--sdk", "iphoneos", "--show-sdk-path"].execute()
	proc.waitForProcessOutput(out, err)
	def path = out.toString().trim()
	def errStr = err.toString().trim()
	if (proc.exitValue() == 0 && errStr.empty && !path.empty
		&& path.contains("iPhoneOS") && new File(path).isDirectory()) {
		return path
	}
	return null
}()

tasks.register("buildIOSNative", Exec) {
	onlyIf { iosSdkPath != null }

	workingDir project.projectDir
	doFirst {
		file("src/main/resources/natives/ios").mkdirs()
	}

	// The dylib is built with `-static`-style linking of the Swift stdlib so it
	// can be loaded directly via dlopen on a jailbroken/signable device.
	if (iosSdkPath != null) {
		commandLine "swiftc",
			"-O",
			"-whole-module-optimization",
			"-emit-library",
			"-module-name", "metallum_native",
			"-target", "arm64-apple-ios14.0",
			"-sdk", iosSdkPath,
			"-framework", "Foundation",
			"-framework", "Metal",
			"-framework", "QuartzCore",
			"-framework", "UIKit",
			"-o", "src/main/resources/natives/ios/libmetallum.dylib",
			"src/main/native/MetalFrameGenerationLifecycle.swift",
			"src/main/native/MetallumInterface.swift",
			"src/main/native/MetallumNative.swift"
	}
}

// Builds a full-featured libspvc.dylib (SPIRV-Cross C API with MSL backend)
// for iOS arm64. This is required because Amethyst's bundled libMoltenVK.dylib
// statically links SPIRV-Cross with only the Vulkan backend — LWJGL's spvc
// bindings pick up MoltenVK's stripped symbols via dlsym(RTLD_DEFAULT),
// causing spvc_context_create_compiler(SPVC_BACKEND_MSL) to fail with -4
// "Invalid backend".
//
// We build SPIRV-Cross from source with SPIRV_CROSS_C_API=ON and
// SPIRV_CROSS_ENABLE_MSL=ON, then bundle the resulting libspvc.dylib in the
// jar. At runtime, MetalCrossShaderCompiler extracts it and sets
// Configuration.SPVC_LIBRARY_NAME so LWJGL uses our full version instead of
// MoltenVK's stripped one.
tasks.register("buildIOSSpvc") {
	onlyIf { iosSdkPath != null }

	def spvcSourceDir = file("${buildDir}/spirv-cross-src")
	def spvcBuildDir = file("${buildDir}/spirv-cross-build")
	def spvcOutput = file("src/main/resources/natives/ios/libspvc.dylib")
	def spvcTag = "vulkan-sdk-1.3.290.0"

	inputs.property "tag", spvcTag
	outputs.file spvcOutput

	doLast {
		file("src/main/resources/natives/ios").mkdirs()
		if (spvcOutput.exists()) {
			logger.lifecycle("[buildIOSSpvc] libspvc.dylib already exists, skipping build")
			return
		}

		// Helper: run a command and throw on failure
		def runCmd = { List<String> cmd, File workDir = null ->
			logger.lifecycle("[buildIOSSpvc] Running: " + cmd.join(" "))
			// Groovy list literals are ArrayList<Object>; ProcessBuilder needs List<String>
			def strCmd = new ArrayList<String>(cmd.size())
			for (String s : cmd) strCmd.add(s)
			def pb = new ProcessBuilder(strCmd)
			if (workDir != null) pb.directory(workDir)
			pb.redirectErrorStream(true)
			def proc = pb.start()
			proc.inputStream.eachLine { line -> logger.lifecycle("[buildIOSSpvc] " + line) }
			def exitCode = proc.waitFor()
			if (exitCode != 0) {
				throw new GradleException("Command failed (exit " + exitCode + "): " + cmd.join(" "))
			}
		}

		// 1. Clone SPIRV-Cross (shallow, specific tag)
		if (!spvcSourceDir.exists()) {
			runCmd(["git", "clone", "--depth", "1", "--branch", spvcTag,
				"https://github.com/KhronosGroup/SPIRV-Cross.git", spvcSourceDir.absolutePath])
		}

		// 2. CMake configure + build (use built-in iOS support, no toolchain file)
		spvcBuildDir.mkdirs()
		// SPIRV-Cross option names (see CMakeLists.txt for vulkan-sdk-1.3.290.0):
		//   SPIRV_CROSS_SHARED  - builds the C API as a single shared library (libspirv-cross-c-shared.dylib)
		//   SPIRV_CROSS_STATIC  - static libs (off, we only want shared)
		//   SPIRV_CROSS_CLI     - CLI binary, requires HLSL/GLSL/MSL/CPP/REFLECT/UTIL; turn off so we can trim backends
		//   SPIRV_CROSS_ENABLE_TESTS - tests (off)
		// The shared lib target is `spirv-cross-c-shared`; the dylib carries VERSION/SOVERSION symlinks.
		runCmd(["cmake",
			"-G", "Unix Makefiles",
			"-DCMAKE_SYSTEM_NAME=iOS",
			"-DCMAKE_OSX_DEPLOYMENT_TARGET=14.0",
			"-DCMAKE_OSX_ARCHITECTURES=arm64",
			"-DCMAKE_MAKE_PROGRAM=/usr/bin/make",
			"-DSPIRV_CROSS_SHARED=ON",
			"-DSPIRV_CROSS_STATIC=OFF",
			"-DSPIRV_CROSS_CLI=OFF",
			"-DSPIRV_CROSS_ENABLE_TESTS=OFF",
			"-DSPIRV_CROSS_ENABLE_C_API=ON",
			"-DSPIRV_CROSS_ENABLE_MSL=ON",
			"-DSPIRV_CROSS_ENABLE_GLSL=ON",
			"-DSPIRV_CROSS_ENABLE_HLSL=OFF",
			"-DSPIRV_CROSS_ENABLE_CPP=OFF",
			"-DSPIRV_CROSS_ENABLE_REFLECT=OFF",
			"-DSPIRV_CROSS_ENABLE_UTIL=OFF",
			"-DCMAKE_BUILD_TYPE=Release",
			spvcSourceDir.absolutePath], spvcBuildDir)
		runCmd(["cmake", "--build", ".", "--config", "Release", "-j", "4"], spvcBuildDir)

		// 3. Locate built dylib. The shared target is `spirv-cross-c-shared`, so the
		// file is `libspirv-cross-c-shared.dylib` (with versioned symlinks). Resolve
		// the real file via canonical path to avoid copying a symlink.
		def candidates = [
			"${spvcBuildDir}/libspirv-cross-c-shared.dylib",
			"${spvcBuildDir}/Release/libspirv-cross-c-shared.dylib",
			"${spvcBuildDir}/src/libspirv-cross-c-shared.dylib"
		]
		def builtLib = null
		for (String p : candidates) {
			def f = file(p)
			if (f.exists()) {
				builtLib = f
				break
			}
		}
		if (builtLib == null) {
			// Fall back to a directory scan for the real (non-symlink) dylib.
			def found = []
			spvcBuildDir.eachFileRecurse { f ->
				if (f.isFile() && f.name.startsWith("libspirv-cross-c-shared") && f.name.endsWith(".dylib")) {
					found << f
				}
			}
			if (found.size() > 0) {
				// Prefer the shortest name (the unversioned symlink target resolved to a file)
				builtLib = found.sort { it.name.length() }[0]
			}
		}
		if (builtLib == null) {
			throw new GradleException("libspirv-cross-c-shared.dylib not found in build output: ${spvcBuildDir}")
		}
		spvcOutput.parentFile.mkdirs()
		builtLib.withInputStream { ins ->
			spvcOutput.withOutputStream { outs -> outs << ins }
		}
		logger.lifecycle("[buildIOSSpvc] Built libspvc.dylib -> ${spvcOutput}")

		// 4. Verify MSL backend is actually compiled in. The C API's
		//    spvc_context_create_compiler switch has `case SPVC_BACKEND_MSL:`
		//    wrapped in `#if SPIRV_CROSS_C_API_MSL`. If the macro wasn't defined
		//    at build time (e.g. SPIRV_CROSS_ENABLE_MSL didn't propagate), the
		//    case is absent and runtime calls fail with -4 "Invalid backend".
		//    When MSL is enabled, the dylib contains CompilerMSL symbols and
		//    the "spvc_compiler_msl_*" C API entry points.
		try {
			def out = new ByteArrayOutputStream()
			def proc = ["nm", "-gU", builtLib.absolutePath].execute()
			proc.waitForProcessOutput(out, null)
			def nmOutput = out.toString()
			def hasMslSymbols = nmOutput.contains("CompilerMSL") || nmOutput.contains("spvc_compiler_msl")
			logger.lifecycle("[buildIOSSpvc] MSL backend symbols present: ${hasMslSymbols}")
			if (!hasMslSymbols) {
				throw new GradleException(
						"[buildIOSSpvc] FATAL: libspvc.dylib was built WITHOUT MSL backend support. " +
						"spvc_context_create_compiler(SPVC_BACKEND_MSL) will fail at runtime with -4. " +
						"Check that SPIRV_CROSS_ENABLE_MSL=ON propagated to the spirv-cross-c-shared target. " +
						"nm output excerpt: " + nmOutput.substring(0, Math.min(nmOutput.length(), 500))
				)
			}
		} catch (IOException ignored) {
			logger.lifecycle("[buildIOSSpvc] nm not available, skipping MSL symbol verification")
		}

		// 5. Verify the dylib targets iOS (not macOS). CMake with
		//    CMAKE_SYSTEM_NAME=iOS should produce a Mach-O with LC_BUILD_VERSION
		//    platform=ios. If CMake silently fell back to the host (macOS), the
		//    dylib would be a macOS arm64 binary that iOS refuses to load
		//    (dlopen fails with "no suitable image found") or, worse, loads via
		//    the simulator path on Apple Silicon Macs.
		//    `lipo -info` shows architecture; `otool -l` shows the LC_BUILD_VERSION
		//    load command whose `platform` field distinguishes iOS (2) from macOS (1).
		try {
			def lipoOut = new ByteArrayOutputStream()
			def lipoProc = ["lipo", "-info", builtLib.absolutePath].execute()
			lipoProc.waitForProcessOutput(lipoOut, null)
			logger.lifecycle("[buildIOSSpvc] Architecture: " + lipoOut.toString().trim())

			def otoolOut = new ByteArrayOutputStream()
			def otoolProc = ["otool", "-l", builtLib.absolutePath].execute()
			otoolProc.waitForProcessOutput(otoolOut, null)
			def otoolOutput = otoolOut.toString()
			// LC_BUILD_VERSION or LC_VERSION_MIN_IPHONEOS indicates iOS targeting
			def isIOS = otoolOutput.contains("LC_VERSION_MIN_IPHONEOS") ||
					(otoolOutput.contains("LC_BUILD_VERSION") && otoolOutput.contains("platform 2"))
			def isMacOS = otoolOutput.contains("LC_VERSION_MIN_MACOSX") ||
					(otoolOutput.contains("LC_BUILD_VERSION") && otoolOutput.contains("platform 1"))
			logger.lifecycle("[buildIOSSpvc] LC_BUILD_VERSION platform: " +
					(isIOS ? "iOS" : isMacOS ? "macOS" : "unknown"))
			if (!isIOS) {
				throw new GradleException(
						"[buildIOSSpvc] FATAL: libspvc.dylib was built for macOS, not iOS. " +
						"CMAKE_SYSTEM_NAME=iOS did not take effect — the dylib cannot be loaded on iOS devices. " +
						"Ensure the iOS SDK is installed (xcrun --sdk iphoneos --show-sdk-path) and " +
						"CMake picks it up. otool output excerpt: " +
						otoolOutput.substring(0, Math.min(otoolOutput.length(), 800))
				)
			}
		} catch (IOException ignored) {
			logger.lifecycle("[buildIOSSpvc] lipo/otool not available, skipping platform verification")
		}
	}
}

