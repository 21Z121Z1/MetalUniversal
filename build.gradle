tasks.register("metalMrtBackendIntegrationTest", Test) {
	group = "verification"
	description = "Runs the macOS Java RenderPass -> FFM -> Swift indexed MRT GPU readback integration suite."
	onlyIf {
		org.gradle.internal.os.OperatingSystem.current().isMacOsX()
	}
	dependsOn tasks.named("buildMacNative")
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	filter {
		includeTestsMatching "com.metallum.client.metal.render.MetalMrtBackendIntegrationTest"
	}
	jvmArgs "--enable-native-access=ALL-UNNAMED"
	environment "MTL_DEBUG_LAYER", "1"
	environment "MTL_SHADER_VALIDATION", "1"
}

tasks.named("check") {
	dependsOn "metalFrameGenerationLifecycleTest"
	dependsOn "metalMrtBackendIntegrationTest"
	dependsOn "metalFxOffscreenValidation"
	dependsOn "metalFxPerformanceValidation"
	dependsOn "metalMrtSmokeTest"
	// Windowed CAMetalDisplayLink pacing/resize/shutdown acceptance. Requires
	// a WindowServer session; headless CI should exclude it with -x.
	dependsOn "metalFrameGenerationPresentationValidation"
}

tasks.register("minecraftMetalFxClientValidation") {
	group = "verification"
	description = "Runs the deterministic Minecraft client MetalFX attachment readback validation and exits automatically."
	if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
		dependsOn "runClient"
	} else {
		doLast {
			logger.lifecycle("minecraftMetalFxClientValidation SKIPPED: macOS Metal is required")
		}
	}
}

if (gradle.startParameter.taskNames.any {
	it == "minecraftMetalFxClientValidation" || it.endsWith(":minecraftMetalFxClientValidation")
}) {
	tasks.named("runClient") {
		doFirst {
			if (System.getProperty("metallum.metalfx.frameGeneration", "false").toBoolean()) {
				requireUnlockedConsoleForPresentation()
			}
			delete file("${buildDir}/metal-validation/minecraft-client-current")
		}
		systemProperty "metallum.validation.enabled", "true"
		systemProperty "metallum.validation.output",
				file("${buildDir}/metal-validation/minecraft-client-current").absolutePath
		systemProperty "metallum.metalfx.mode", "TEMPORAL"
		systemProperty "metallum.metalfx.debug", "true"
		// Frame generation stays off by default: the readback captures are the
		// deterministic attachment gate, and an asynchronous presenter would race
		// them. The attended 13.4 visual/pacing QA run turns it on explicitly with
		//   -Dmetallum.metalfx.frameGeneration=true
		//   -Dmetallum.metalfx.objectMotionProducer=true
		// (the second one opens the OBJECT_MOTION_PRODUCER_CONNECTED gate without
		// changing what ships).
		systemProperty "metallum.metalfx.frameGeneration",
				System.getProperty("metallum.metalfx.frameGeneration", "false")
		systemProperty "metallum.metalfx.objectMotionProducer",
				System.getProperty("metallum.metalfx.objectMotionProducer", "false")
		systemProperty "metallum.metalfx.frameGenerationOutputWidth",
				System.getProperty("metallum.metalfx.frameGenerationOutputWidth", "1280")
		if (System.getProperty("metallum.metalfx.frameGeneration", "false").toBoolean()) {
			environment "METALLUM_METALFX_PRESENT_DIAGNOSTICS_PATH",
					file("${buildDir}/metal-validation/minecraft-client-current/frame-generation-timeline.json").absolutePath
		}
		// Forward backend kill-switch overrides (-Dmetallum.opt.*) from the
		// Gradle invocation to the client JVM for toggle validation runs.
		System.properties.each { key, value ->
			if (key.toString().startsWith("metallum.opt.")) {
				systemProperty key.toString(), value.toString()
			}
		}
		args "--quickPlaySingleplayer",
				System.getProperty("metallum.validation.world", "New World"),
				// Pin the window (and with it the framebuffer) size: macOS
				// window management can zoom/tile the client window, and a
				// different framebuffer size makes golden captures
				// incomparable across runs.
				"--width", "854",
				"--height", "480"
		environment "MTL_DEBUG_LAYER", "1"
		environment "MTL_SHADER_VALIDATION", "0"
		// A run that validated nothing must not pass by omission.
		// MetalValidationClient.finishRunState is the only writer of
		// run-state.json, and the client calls minecraft.stop() only on its
		// success path, so an absent file means the scripted timeline never
		// ran to completion. That is reachable without any error: if the
		// window opens unfocused the pause screen can open on the same frame
		// the player joins, the compositor throttles the paused unfocused
		// client to ~0 frames, and beforeFrame never reaches a frame with a
		// non-null level. Three such runs on 2026-07-27 captured zero GPU
		// readbacks and still reported BUILD SUCCESSFUL.
		doLast {
			def runStateFile = file(
					"${buildDir}/metal-validation/minecraft-client-current/run-state.json")
			if (!runStateFile.isFile()) {
				throw new GradleException(
						"Vacuous MetalFX client validation: no run-state.json at ${runStateFile}."
								+ " The client exited without completing its scripted timeline, so no"
								+ " GPU readbacks were captured and nothing was asserted."
				)
			}
			def runState
			try {
				runState = new groovy.json.JsonSlurper().parseText(runStateFile.getText("UTF-8"))
			} catch (Exception parseFailure) {
				throw new GradleException(
						"Could not parse ${runStateFile}: ${parseFailure.message}", parseFailure)
			}
			def status = runState.status
			def completed = runState.completedGpuCaptures
			def expected = runState.expectedGpuCaptures
			if (!(status instanceof String) || !(completed instanceof Number)
					|| !(expected instanceof Number)) {
				throw new GradleException(
						"Malformed ${runStateFile}: status=${status},"
								+ " completedGpuCaptures=${completed}, expectedGpuCaptures=${expected}"
				)
			}
			def problems = []
			if (status != "passed") {
				problems << "status is \"${status}\", expected \"passed\"".toString()
			}
			// Compared against the client's own expectation rather than a
			// literal so the gate follows MetalValidationClient's capture count.
			if (completed != expected) {
				problems << "captured ${completed} of ${expected} GPU readbacks".toString()
			}
			if (System.getProperty("metallum.metalfx.frameGeneration", "false").toBoolean()) {
				def queued = runState.frameGenerationFramesQueued
				def enabledAtCompletion = runState.frameGenerationEnabledAtCompletion
				if (!(queued instanceof Number)) {
					problems << "frameGenerationFramesQueued is missing or malformed".toString()
				} else if (queued <= 0) {
					problems << "Frame Generation was requested but queued no source frames".toString()
				}
				if (enabledAtCompletion != true) {
					problems << "Frame Generation was requested but was disabled before validation completed".toString()
				}

				def timelineFile = file(
						"${buildDir}/metal-validation/minecraft-client-current/frame-generation-timeline.json")
				if (!timelineFile.isFile()) {
					problems << "Frame Generation timeline is missing at ${timelineFile}".toString()
				} else {
					def timeline
					try {
						timeline = new groovy.json.JsonSlurper().parseText(timelineFile.getText("UTF-8"))
					} catch (Exception parseFailure) {
						throw new GradleException(
								"Could not parse ${timelineFile}: ${parseFailure.message}", parseFailure)
					}
					if (!(timeline instanceof List)) {
						problems << "Frame Generation timeline is not a JSON array".toString()
					} else {
						def percentile = { values, fraction ->
							def ordered = values.findAll { Double.isFinite(it as double) }
									.collect { it as double }
									.sort()
							if (ordered.isEmpty()) return 0.0d
							def index = Math.ceil((ordered.size() - 1) * (fraction as double)) as int
							return ordered[Math.max(0, Math.min(index, ordered.size() - 1))]
						}
						def bySource = timeline.groupBy { (it.sourceFrameID as Number).longValue() }
						def completeSourceIds = bySource.keySet().sort().findAll { sourceId ->
							def kinds = bySource[sourceId].collect { it.frameKind as String }.toSet()
							kinds.contains("generated") && kinds.contains("real")
						}
						def sourceGpuMilliseconds = []
						def generatedGpuMilliseconds = []
						def realGpuMilliseconds = []
						def totalGpuMilliseconds = []
						def sourceStartById = [:]
						def sourceEnqueueById = [:]
						def sourceCpuWaitMilliseconds = []
						def presentedTimes = []
						completeSourceIds.each { sourceId ->
							def records = bySource[sourceId]
							def generated = records.find { it.frameKind == "generated" }
							def real = records.find { it.frameKind == "real" }
							def sourceStart = (records[0].sourceGpuStartTime as Number).doubleValue()
							def sourceEnd = (records[0].sourceGpuEndTime as Number).doubleValue()
							def sourceEnqueue = (records[0].sourceEnqueueTime as Number).doubleValue()
							def sourceCpuWait = (records[0].sourceCpuWaitTime as Number).doubleValue()
							def generatedStart = (generated.gpuStartTime as Number).doubleValue()
							def generatedEnd = (generated.gpuEndTime as Number).doubleValue()
							def realStart = (real.gpuStartTime as Number).doubleValue()
							def realEnd = (real.gpuEndTime as Number).doubleValue()
							def sourceMs = (sourceEnd - sourceStart) * 1000.0d
							def generatedMs = (generatedEnd - generatedStart) * 1000.0d
							def realMs = (realEnd - realStart) * 1000.0d
							if (sourceMs > 0.0d && generatedMs > 0.0d && realMs > 0.0d) {
								sourceGpuMilliseconds << sourceMs
								generatedGpuMilliseconds << generatedMs
								realGpuMilliseconds << realMs
								totalGpuMilliseconds << sourceMs + generatedMs + realMs
								sourceStartById[sourceId] = sourceStart
								if (sourceEnqueue > 0.0d) {
									sourceEnqueueById[sourceId] = sourceEnqueue
									sourceCpuWaitMilliseconds << sourceCpuWait * 1000.0d
								}
							}
							[generated, real].each { item ->
								def presented = (item.presentedTime as Number).doubleValue()
								if (item.outcome == "presented" && presented > 0.0d) {
									presentedTimes << presented
								}
							}
						}
						def sourceIntervals = []
						completeSourceIds.collate(2, 1, false).each { pair ->
							if (pair[1] == pair[0] + 1
									&& sourceStartById.containsKey(pair[0])
									&& sourceStartById.containsKey(pair[1])) {
								def interval = (sourceStartById[pair[1]] - sourceStartById[pair[0]]) * 1000.0d
								if (interval > 0.0d) sourceIntervals << interval
							}
						}
						def presentIntervals = []
						presentedTimes.sort().collate(2, 1, false).each { pair ->
							def interval = (pair[1] - pair[0]) * 1000.0d
							if (interval > 0.0d) presentIntervals << interval
						}
						def sourceCpuIntervals = []
						completeSourceIds.collate(2, 1, false).each { pair ->
							if (pair[1] == pair[0] + 1
									&& sourceEnqueueById.containsKey(pair[0])
									&& sourceEnqueueById.containsKey(pair[1])) {
								def interval = (sourceEnqueueById[pair[1]] - sourceEnqueueById[pair[0]]) * 1000.0d
								if (interval > 0.0d) sourceCpuIntervals << interval
							}
						}
						def sourceIntervalP50 = percentile(sourceIntervals, 0.50d)
						def sourceIntervalP95 = percentile(sourceIntervals, 0.95d)
						def presentIntervalP50 = percentile(presentIntervals, 0.50d)
						def presentIntervalP95 = percentile(presentIntervals, 0.95d)
						def sourceGpuP95 = percentile(sourceGpuMilliseconds, 0.95d)
						def generatedGpuP95 = percentile(generatedGpuMilliseconds, 0.95d)
						def realGpuP95 = percentile(realGpuMilliseconds, 0.95d)
						def totalGpuP95 = percentile(totalGpuMilliseconds, 0.95d)
						def sourceCpuIntervalP50 = percentile(sourceCpuIntervals, 0.50d)
						def sourceCpuIntervalP95 = percentile(sourceCpuIntervals, 0.95d)
						def sourceCpuWaitP50 = percentile(sourceCpuWaitMilliseconds, 0.50d)
						def sourceCpuWaitP95 = percentile(sourceCpuWaitMilliseconds, 0.95d)
						def overBudgetFrames = totalGpuMilliseconds.count { it > (1000.0d / 60.0d) }
						def presentedCount = timeline.count { it.outcome == "presented" }
						def summary = [
								status: "measured",
								frameGenerationOutputWidth: Integer.parseInt(System.getProperty(
										"metallum.metalfx.frameGenerationOutputWidth", "1280")),
								records: timeline.size(),
								completeSourcePairs: totalGpuMilliseconds.size(),
								presentedRecords: presentedCount,
								presentedRatio: timeline.isEmpty() ? 0.0d : presentedCount / (double) timeline.size(),
								sourceIntervalP50Milliseconds: sourceIntervalP50,
								sourceIntervalP95Milliseconds: sourceIntervalP95,
								sourceCpuIntervalP50Milliseconds: sourceCpuIntervalP50,
								sourceCpuIntervalP95Milliseconds: sourceCpuIntervalP95,
								sourceCpuIntervalP95MarginTo16_67Milliseconds:
										(1000.0d / 60.0d) - sourceCpuIntervalP95,
								sourceCpuWaitP50Milliseconds: sourceCpuWaitP50,
								sourceCpuWaitP95Milliseconds: sourceCpuWaitP95,
								presentIntervalP50Milliseconds: presentIntervalP50,
								presentIntervalP95Milliseconds: presentIntervalP95,
								sourceGpuP95Milliseconds: sourceGpuP95,
								generatedGpuP95Milliseconds: generatedGpuP95,
								realGpuP95Milliseconds: realGpuP95,
								totalGpuP95Milliseconds: totalGpuP95,
								totalGpuP95MarginTo16_67Milliseconds: (1000.0d / 60.0d) - totalGpuP95,
								over16_67MillisecondFrames: overBudgetFrames,
								gates: [
										minimumCompleteSourcePairs: 120,
										minimumPresentedRatio: 0.95d,
										maximumSourceIntervalP95Milliseconds: 18.5d,
										maximumPresentIntervalP95Milliseconds: 8.5d,
										maximumGeneratedGpuP95Milliseconds: 7.0d,
										minimumTotalGpuP95MarginMilliseconds: 3.0d,
										maximumOver16_67MillisecondFrames: 0
								]
						]
						def summaryFile = file(
								"${buildDir}/metal-validation/minecraft-client-current/frame-generation-performance.json")
						summaryFile.setText(new groovy.json.JsonBuilder(summary).toPrettyString() + "\n", "UTF-8")
						logger.lifecycle(String.format(Locale.ROOT,
								"Frame Generation steady-state: source GPU p95 %.2f ms, source CPU p95 %.2f ms,"
										+ " presenter wait p95 %.2f ms, present p95 %.2f ms,"
										+ " total GPU p95 %.2f ms (%.2f ms margin), presented %d/%d",
								sourceIntervalP95, sourceCpuIntervalP95, sourceCpuWaitP95,
								presentIntervalP95, totalGpuP95,
								(1000.0d / 60.0d) - totalGpuP95, presentedCount, timeline.size()))
						if (totalGpuMilliseconds.size() < 120) {
							problems << "Frame Generation steady-state captured only ${totalGpuMilliseconds.size()} complete source pairs".toString()
						}
						if (summary.presentedRatio < 0.95d) {
							problems << String.format(Locale.ROOT,
									"presented ratio %.3f is below 0.950", summary.presentedRatio)
						}
						if (sourceIntervalP95 > 18.5d) {
							problems << String.format(Locale.ROOT,
									"source interval p95 %.2f ms exceeds 18.50 ms", sourceIntervalP95)
						}
						if (presentIntervalP95 > 8.5d) {
							problems << String.format(Locale.ROOT,
									"present interval p95 %.2f ms exceeds 8.50 ms", presentIntervalP95)
						}
						if (generatedGpuP95 > 7.0d) {
							problems << String.format(Locale.ROOT,
									"generated-frame GPU p95 %.2f ms exceeds 7.00 ms", generatedGpuP95)
						}
						if (totalGpuP95 > (1000.0d / 60.0d - 3.0d)) {
							problems << String.format(Locale.ROOT,
									"total GPU p95 %.2f ms leaves less than 3.00 ms headroom", totalGpuP95)
						}
						if (overBudgetFrames > 0) {
							problems << "${overBudgetFrames} steady-state source pairs exceeded 16.67 ms GPU time".toString()
						}
					}
				}
			}
			if (!problems.isEmpty()) {
				problems.each { logger.error("VALIDATION ${it}") }
				throw new GradleException(
						"MetalFX client validation did not pass: ${problems.join('; ')}."
								+ " See ${runStateFile}."
				)
			}
			logger.lifecycle(
					"MetalFX client validation: PASS (${completed}/${expected} GPU readbacks,"
							+ " ${runState.failedGpuCaptures} failed)"
			)
		}
	}
}

// P2-1 golden-frame regression tooling. minecraftMetalFxClientValidation
// already dumps every captured pass plane as raw bytes
// (frame-*/<plane>.bin); goldenFrameRecord snapshots the latest run as the
// baseline, and goldenFrameCompare byte-compares a later run against it.
// Workflow:
//   ./gradlew minecraftMetalFxClientValidation && ./gradlew goldenFrameRecord
//   <make a change>
//   ./gradlew minecraftMetalFxClientValidation && ./gradlew goldenFrameCompare
// Any byte difference fails the compare; -PgoldenTolerate=plane1,plane2
// downgrades named planes (e.g. temporal-output) to logged-only.

def goldenBaselineDir = file("${buildDir}/metal-validation/golden-baseline")
def goldenCurrentDir = file("${buildDir}/metal-validation/minecraft-client-current")

tasks.register("goldenFrameRecord", Sync) {
	group = "verification"
	description = "Snapshots the latest minecraftMetalFxClientValidation captures as the golden baseline."
	from goldenCurrentDir
	into goldenBaselineDir
	doFirst {
		if (!goldenCurrentDir.directory) {
			throw new GradleException("No captures at ${goldenCurrentDir}; run minecraftMetalFxClientValidation first")
		}
	}
}

tasks.register("goldenFrameCompare") {
	group = "verification"
	description = "Byte-compares the latest validation captures against the recorded golden baseline."
	doLast {
		if (!goldenBaselineDir.directory) {
			throw new GradleException("No golden baseline at ${goldenBaselineDir}; run goldenFrameRecord first")
		}
		if (!goldenCurrentDir.directory) {
			throw new GradleException("No captures at ${goldenCurrentDir}; run minecraftMetalFxClientValidation first")
		}
		Set tolerated = (findProperty("goldenTolerate") ?: "").toString()
				.split(",").findAll { !it.isEmpty() } as Set
		def failures = []
		int compared = 0
		def frameDirs = goldenBaselineDir.listFiles()
				.findAll { it.directory && it.name.startsWith("frame-") }
				.sort { it.name }
		frameDirs.each { frameDir ->
			frameDir.listFiles().findAll { it.name.endsWith(".bin") }.sort { it.name }.each { baseFile ->
				def rel = "${frameDir.name}/${baseFile.name}"
				def plane = baseFile.name - ".bin"
				def curFile = new File(goldenCurrentDir, rel)
				compared++
				if (!curFile.file) {
					failures << "${rel}: missing in current run".toString()
					return
				}
				byte[] a = baseFile.bytes
				byte[] b = curFile.bytes
				if (java.util.Arrays.equals(a, b)) {
					return
				}
				String msg
				if (a.length != b.length) {
					msg = "${rel}: size ${a.length} vs ${b.length}"
				} else {
					int diffs = 0
					int first = -1
					int maxDelta = 0
					for (int i = 0; i < a.length; i++) {
						if (a[i] != b[i]) {
							diffs++
							if (first < 0) first = i
							int delta = Math.abs((a[i] & 0xFF) - (b[i] & 0xFF))
							if (delta > maxDelta) maxDelta = delta
						}
					}
					msg = String.format(
							"%s: %d differing bytes (%.3f%%), first at byte %d, max byte delta %d",
							rel, diffs, 100.0d * diffs / a.length, first, maxDelta)
				}
				if (tolerated.contains(plane)) {
					logger.lifecycle("TOLERATED ${msg}")
				} else {
					failures << msg
				}
			}
		}
		// A run that silently produced fewer frames must not pass by omission.
		def baselineFrames = frameDirs.collect { it.name } as Set
		goldenCurrentDir.listFiles()
				.findAll { it.directory && it.name.startsWith("frame-") }
				.each { if (!baselineFrames.contains(it.name)) failures << "${it.name}: not present in baseline".toString() }
		logger.lifecycle("Golden frame compare: ${compared} planes vs ${goldenBaselineDir.name}")
		if (!failures.isEmpty()) {
			failures.each { logger.error("GOLDEN DIFF ${it}") }
			throw new GradleException("Golden frame regression: ${failures.size()} plane(s) differ")
		}
		logger.lifecycle("Golden frame compare: PASS (byte-identical)")
	}
}

// Builds the Metallum native bridge as a dylib targeting iOS arm64. The
// resulting artifact must be embedded in the iOS app bundle's Frameworks
// directory and signed with the app's signing identity; iOS forbids loading
// unsigned dylibs from writable tmp directories at runtime, so the produced
// file is consumed by PojavLauncher's packaging step rather than extracted
// from the jar at runtime.
//
// Requires Xcode with an iOS toolchain. Skipped automatically if the host
// is not macOS or if the iOS SDK is unavailable.
//
// Note: swiftc's `-sdk` flag does NOT resolve SDK names through xcrun the
// way `-target` does; passing the literal "iphoneos" makes swiftc look for
// a *directory* named "iphoneos" and fail with "no such sysroot directory".
// We must resolve the full SDK path ourselves via xcrun and pass that.

def iosSdkPath = {
	if (!org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
		return null
	}
	def out = new ByteArrayOutputStream()
	def err = new ByteArrayOutputStream()
	def proc = ["xcrun", "--sdk", "iphoneos", "--show-sdk-path"].execute()
	proc.waitForProcessOutput(out, err)
	def path = out.toString().trim()
	def errStr = err.toString().trim()
	if (proc.exitValue() == 0 && errStr.empty && !path.empty
		&& path.contains("iPhoneOS") && new File(path).isDirectory()) {
		return path
	}
	return null
}()

tasks.register("buildIOSNative", Exec) {
	onlyIf { iosSdkPath != null }

	workingDir project.projectDir
	doFirst {
		file("src/main/resources/natives/ios").mkdirs()
	}

	// The dylib is built with `-static`-style linking of the Swift stdlib so it
	// can be loaded directly via dlopen on a jailbroken/signable device.
	if (iosSdkPath != null) {
		commandLine "swiftc",
			"-O",
			"-whole-module-optimization",
			"-emit-library",
			"-module-name", "metallum_native",
			"-target", "arm64-apple-ios14.0",
			"-sdk", iosSdkPath,
			"-framework", "Foundation",
			"-framework", "Metal",
			"-framework", "QuartzCore",
			"-framework", "UIKit",
			"-o", "src/main/resources/natives/ios/libmetallum.dylib",
			"src/main/native/MetallumInterface.swift",
			"src/main/native/MetallumNative.swift"
	}
}

// Builds a full-featured libspvc.dylib (SPIRV-Cross C API with MSL backend)
// for iOS arm64. This is required because Amethyst's bundled libMoltenVK.dylib
// statically links SPIRV-Cross with only the Vulkan backend — LWJGL's spvc
// bindings pick up MoltenVK's stripped symbols via dlsym(RTLD_DEFAULT),
// causing spvc_context_create_compiler(SPVC_BACKEND_MSL) to fail with -4
// "Invalid backend".
//
// We build SPIRV-Cross from source with SPIRV_CROSS_C_API=ON and
// SPIRV_CROSS_ENABLE_MSL=ON, then bundle the resulting libspvc.dylib in the
// jar. At runtime, MetalCrossShaderCompiler extracts it and sets
// Configuration.SPVC_LIBRARY_NAME so LWJGL uses our full version instead of
// MoltenVK's stripped one.
tasks.register("buildIOSSpvc") {
	onlyIf { iosSdkPath != null }

	def spvcSourceDir = file("${buildDir}/spirv-cross-src")
	def spvcBuildDir = file("${buildDir}/spirv-cross-build")
	def spvcOutput = file("src/main/resources/natives/ios/libspvc.dylib")
	def spvcTag = "vulkan-sdk-1.3.290.0"

	inputs.property "tag", spvcTag
	outputs.file spvcOutput

	doLast {
		file("src/main/resources/natives/ios").mkdirs()
		if (spvcOutput.exists()) {
			logger.lifecycle("[buildIOSSpvc] libspvc.dylib already exists, skipping build")
			return
		}

		// Helper: run a command and throw on failure
		def runCmd = { List<String> cmd, File workDir = null ->
			logger.lifecycle("[buildIOSSpvc] Running: " + cmd.join(" "))
			// Groovy list literals are ArrayList<Object>; ProcessBuilder needs List<String>
			def strCmd = new ArrayList<String>(cmd.size())
			for (String s : cmd) strCmd.add(s)
			def pb = new ProcessBuilder(strCmd)
			if (workDir != null) pb.directory(workDir)
			pb.redirectErrorStream(true)
			def proc = pb.start()
			proc.inputStream.eachLine { line -> logger.lifecycle("[buildIOSSpvc] " + line) }
			def exitCode = proc.waitFor()
			if (exitCode != 0) {
				throw new GradleException("Command failed (exit " + exitCode + "): " + cmd.join(" "))
			}
		}

		// 1. Clone SPIRV-Cross (shallow, specific tag)
		if (!spvcSourceDir.exists()) {
			runCmd(["git", "clone", "--depth", "1", "--branch", spvcTag,
				"https://github.com/KhronosGroup/SPIRV-Cross.git", spvcSourceDir.absolutePath])
		}

		// 2. CMake configure + build (use built-in iOS support, no toolchain file)
		spvcBuildDir.mkdirs()
		// SPIRV-Cross option names (see CMakeLists.txt for vulkan-sdk-1.3.290.0):
		//   SPIRV_CROSS_SHARED  - builds the C API as a single shared library (libspirv-cross-c-shared.dylib)
		//   SPIRV_CROSS_STATIC  - static libs (off, we only want shared)
		//   SPIRV_CROSS_CLI     - CLI binary, requires HLSL/GLSL/MSL/CPP/REFLECT/UTIL; turn off so we can trim backends
		//   SPIRV_CROSS_ENABLE_TESTS - tests (off)
		// The shared lib target is `spirv-cross-c-shared`; the dylib carries VERSION/SOVERSION symlinks.
		runCmd(["cmake",
			"-G", "Unix Makefiles",
			"-DCMAKE_SYSTEM_NAME=iOS",
			"-DCMAKE_OSX_DEPLOYMENT_TARGET=14.0",
			"-DCMAKE_OSX_ARCHITECTURES=arm64",
			"-DCMAKE_MAKE_PROGRAM=/usr/bin/make",
			"-DSPIRV_CROSS_SHARED=ON",
			"-DSPIRV_CROSS_STATIC=OFF",
			"-DSPIRV_CROSS_CLI=OFF",
			"-DSPIRV_CROSS_ENABLE_TESTS=OFF",
			"-DSPIRV_CROSS_ENABLE_C_API=ON",
			"-DSPIRV_CROSS_ENABLE_MSL=ON",
			"-DSPIRV_CROSS_ENABLE_GLSL=ON",
			"-DSPIRV_CROSS_ENABLE_HLSL=OFF",
			"-DSPIRV_CROSS_ENABLE_CPP=OFF",
			"-DSPIRV_CROSS_ENABLE_REFLECT=OFF",
			"-DSPIRV_CROSS_ENABLE_UTIL=OFF",
			"-DCMAKE_BUILD_TYPE=Release",
			spvcSourceDir.absolutePath], spvcBuildDir)
		runCmd(["cmake", "--build", ".", "--config", "Release", "-j", "4"], spvcBuildDir)

		// 3. Locate built dylib. The shared target is `spirv-cross-c-shared`, so the
		// file is `libspirv-cross-c-shared.dylib` (with versioned symlinks). Resolve
		// the real file via canonical path to avoid copying a symlink.
		def candidates = [
			"${spvcBuildDir}/libspirv-cross-c-shared.dylib",
			"${spvcBuildDir}/Release/libspirv-cross-c-shared.dylib",
			"${spvcBuildDir}/src/libspirv-cross-c-shared.dylib"
		]
		def builtLib = null
		for (String p : candidates) {
			def f = file(p)
			if (f.exists()) {
				builtLib = f
				break
			}
		}
		if (builtLib == null) {
			// Fall back to a directory scan for the real (non-symlink) dylib.
			def found = []
			spvcBuildDir.eachFileRecurse { f ->
				if (f.isFile() && f.name.startsWith("libspirv-cross-c-shared") && f.name.endsWith(".dylib")) {
					found << f
				}
			}
			if (found.size() > 0) {
				// Prefer the shortest name (the unversioned symlink target resolved to a file)
				builtLib = found.sort { it.name.length() }[0]
			}
		}
		if (builtLib == null) {
			throw new GradleException("libspirv-cross-c-shared.dylib not found in build output: ${spvcBuildDir}")
		}
		spvcOutput.parentFile.mkdirs()
		builtLib.withInputStream { ins ->
			spvcOutput.withOutputStream { outs -> outs << ins }
		}
		logger.lifecycle("[buildIOSSpvc] Built libspvc.dylib -> ${spvcOutput}")

		// 4. Verify MSL backend is actually compiled in. The C API's
		//    spvc_context_create_compiler switch has `case SPVC_BACKEND_MSL:`
		//    wrapped in `#if SPIRV_CROSS_C_API_MSL`. If the macro wasn't defined
		//    at build time (e.g. SPIRV_CROSS_ENABLE_MSL didn't propagate), the
		//    case is absent and runtime calls fail with -4 "Invalid backend".
		//    When MSL is enabled, the dylib contains CompilerMSL symbols and
		//    the "spvc_compiler_msl_*" C API entry points.
		try {
			def out = new ByteArrayOutputStream()
			def proc = ["nm", "-gU", builtLib.absolutePath].execute()
			proc.waitForProcessOutput(out, null)
			def nmOutput = out.toString()
			def hasMslSymbols = nmOutput.contains("CompilerMSL") || nmOutput.contains("spvc_compiler_msl")
			logger.lifecycle("[buildIOSSpvc] MSL backend symbols present: ${hasMslSymbols}")
			if (!hasMslSymbols) {
				throw new GradleException(
						"[buildIOSSpvc] FATAL: libspvc.dylib was built WITHOUT MSL backend support. " +
						"spvc_context_create_compiler(SPVC_BACKEND_MSL) will fail at runtime with -4. " +
						"Check that SPIRV_CROSS_ENABLE_MSL=ON propagated to the spirv-cross-c-shared target. " +
						"nm output excerpt: " + nmOutput.substring(0, Math.min(nmOutput.length(), 500))
				)
			}
		} catch (IOException ignored) {
			logger.lifecycle("[buildIOSSpvc] nm not available, skipping MSL symbol verification")
		}

		// 5. Verify the dylib targets iOS (not macOS). CMake with
		//    CMAKE_SYSTEM_NAME=iOS should produce a Mach-O with LC_BUILD_VERSION
		//    platform=ios. If CMake silently fell back to the host (macOS), the
		//    dylib would be a macOS arm64 binary that iOS refuses to load
		//    (dlopen fails with "no suitable image found") or, worse, loads via
		//    the simulator path on Apple Silicon Macs.
		//    `lipo -info` shows architecture; `otool -l` shows the LC_BUILD_VERSION
		//    load command whose `platform` field distinguishes iOS (2) from macOS (1).
		try {
			def lipoOut = new ByteArrayOutputStream()
			def lipoProc = ["lipo", "-info", builtLib.absolutePath].execute()
			lipoProc.waitForProcessOutput(lipoOut, null)
			logger.lifecycle("[buildIOSSpvc] Architecture: " + lipoOut.toString().trim())

			def otoolOut = new ByteArrayOutputStream()
			def otoolProc = ["otool", "-l", builtLib.absolutePath].execute()
			otoolProc.waitForProcessOutput(otoolOut, null)
			def otoolOutput = otoolOut.toString()
			// LC_BUILD_VERSION or LC_VERSION_MIN_IPHONEOS indicates iOS targeting
			def isIOS = otoolOutput.contains("LC_VERSION_MIN_IPHONEOS") ||
					(otoolOutput.contains("LC_BUILD_VERSION") && otoolOutput.contains("platform 2"))
			def isMacOS = otoolOutput.contains("LC_VERSION_MIN_MACOSX") ||
					(otoolOutput.contains("LC_BUILD_VERSION") && otoolOutput.contains("platform 1"))
			logger.lifecycle("[buildIOSSpvc] LC_BUILD_VERSION platform: " +
					(isIOS ? "iOS" : isMacOS ? "macOS" : "unknown"))
			if (!isIOS) {
				throw new GradleException(
						"[buildIOSSpvc] FATAL: libspvc.dylib was built for macOS, not iOS. " +
						"CMAKE_SYSTEM_NAME=iOS did not take effect — the dylib cannot be loaded on iOS devices. " +
						"Ensure the iOS SDK is installed (xcrun --sdk iphoneos --show-sdk-path) and " +
						"CMake picks it up. otool output excerpt: " +
						otoolOutput.substring(0, Math.min(otoolOutput.length(), 800))
				)
			}
		} catch (IOException ignored) {
			logger.lifecycle("[buildIOSSpvc] lipo/otool not available, skipping platform verification")
		}
	}
}

tasks.named("processResources") {
	dependsOn(tasks.named("buildMacNative"))
	// The iOS native is only built on a macOS host with the iOS SDK installed.
	// It is optional: if the toolchain is missing the task is skipped and the
	// iOS dylib is simply not packaged in the jar.
	dependsOn(tasks.named("buildIOSNative"))
	dependsOn(tasks.named("buildIOSSpvc"))
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// sourcesJar (created above by `java { withSourcesJar() }`) also scans
// src/main/resources, so it must declare an explicit dependency on the native
// build tasks that write into that directory. Without this, Gradle 9 fails
// with "uses this output of task ':buildIOSSpvc' without declaring an explicit
// dependency". Must be placed AFTER `java { withSourcesJar() }` because the
// task is created by that block.
tasks.named("sourcesJar") {
	dependsOn(tasks.named("buildMacNative"))
	dependsOn(tasks.named("buildIOSNative"))
	dependsOn(tasks.named("buildIOSSpvc"))
}

jar {
	inputs.property "projectName", project.name

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
