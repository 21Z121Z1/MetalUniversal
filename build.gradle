plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

loom {
	accessWidenerPath = file("src/main/resources/metallum.accesswidener")
}

repositories {
	maven { url "https://api.modrinth.com/maven" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "maven.modrinth:sodium:${project.sodium_version}"
	// Iris ships as an unobfuscated MC 26.2 mod (no refmap); a plain
	// implementation dependency puts it on the dev classpath where the
	// Fabric loader discovers and loads it as a mod. The metallum iris.*
	// compat mixins (gated on the mod being present) keep it dormant on
	// the Metal backend until the Iris-on-Metal semantic layer lands.
	implementation "maven.modrinth:iris:${project.iris_version}"
	testImplementation "org.junit.jupiter:junit-jupiter:5.12.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.12.2"
}

tasks.test {
	useJUnitPlatform()
	exclude "**/MetalMrtBackendIntegrationTest.class"
	exclude "**/MetalComputeBackendIntegrationTest.class"
	exclude "**/MetalIrisTargetsIntegrationTest.class"
	if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
		jvmArgs "--enable-native-access=ALL-UNNAMED"
		environment "MTL_DEBUG_LAYER", "1"
		environment "MTL_SHADER_VALIDATION", "1"
	}
}

// Gradle system properties do not automatically reach Loom's forked
// runClient JVM. Forward the optional MetalFX properties so a command such as
// `./gradlew runClient -Dmetallum.metalfx.mode=SPATIAL` configures Minecraft,
// rather than only the Gradle process.
tasks.withType(JavaExec).configureEach {
	if (name == "runClient") {
		[
			"metallum.metalfx.mode",
			"metallum.metalfx.scale",
			"metallum.metalfx.debug",
			"metallum.metalfx.reactiveMask",
			"metallum.metalfx.frameGeneration",
			"metallum.validation.enabled",
			"metallum.validation.output"
		].each { propertyName ->
			def value = System.getProperty(propertyName)
			if (value != null) {
				systemProperty(propertyName, value)
			}
		}
		def validationWorld = System.getProperty("metallum.validation.world")
		def dedicatedValidation = gradle.startParameter.taskNames.any {
			it == "minecraftMetalFxClientValidation" || it.endsWith(":minecraftMetalFxClientValidation")
		}
		if (!dedicatedValidation && validationWorld != null && !validationWorld.isBlank()) {
			args "--quickPlaySingleplayer", validationWorld
		}
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.register("buildMacNative", Exec) {
	onlyIf {
		org.gradle.internal.os.OperatingSystem.current().isMacOsX()
	}

	workingDir project.projectDir
	inputs.files(
		"src/main/native/MetalFrameGenerationLifecycle.swift",
		"src/main/native/MetallumNative.swift"
	)
	outputs.file("src/main/resources/natives/macos/libmetallum.dylib")
	doFirst {
		file("src/main/resources/natives/macos").mkdirs()
	}

	commandLine "swiftc",
		"-O",
		"-whole-module-optimization",
		"-emit-library",
		"-module-name", "metallum_native",
		"-target", "arm64-apple-macosx14.0",
		"-framework", "Foundation",
		"-framework", "Metal",
		"-framework", "MetalFX",
		"-framework", "QuartzCore",
		"-o", "src/main/resources/natives/macos/libmetallum.dylib",
		"src/main/native/MetalFrameGenerationLifecycle.swift",
		"src/main/native/MetallumNative.swift"
}

