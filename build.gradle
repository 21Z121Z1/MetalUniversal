// Backend-neutral render-contract verification. The unit task is deliberately
// narrow; the native tasks below exercise the same production Java -> FFM ->
// Swift path with a fresh JVM for each Metal 3/Metal 4 mode.
def renderContractSyntheticTaskRequested = gradle.startParameter.taskNames.any {
	it == "renderContractSyntheticValidation" || it.endsWith(":renderContractSyntheticValidation")
			|| it == "renderContractManifestValidation" || it.endsWith(":renderContractManifestValidation")
			|| it == "renderContractValidation" || it.endsWith(":renderContractValidation")
}
def renderContractSyntheticOutputDir = null
if (renderContractSyntheticTaskRequested) {
	renderContractSyntheticOutputDir = renderContractPersistRequested
			? file("${buildDir}/render-contract/synthetic-current")
			: java.nio.file.Files.createTempDirectory("metallum-render-contract-synthetic-").toFile()
}

	def renderContractCleanupAction = {
		long retentionHours = (project.providers.gradleProperty("renderContractTempRetentionHours").orNull ?: "12") as long
		long maxTempBytes = (project.providers.gradleProperty("renderContractTempMaxBytes").orNull ?: "805306368") as long
		int maxTempRuns = (project.providers.gradleProperty("renderContractTempMaxRuns").orNull ?: "2") as int
		if (retentionHours < 1L) {
			throw new GradleException("renderContractTempRetentionHours must be at least 1")
		}
		if (maxTempBytes <= 0L || maxTempRuns < 1) {
			throw new GradleException("renderContractTempMaxBytes must be positive and renderContractTempMaxRuns must be at least 1")
		}
		long cutoff = System.currentTimeMillis() - retentionHours * 60L * 60L * 1000L
		File tempRoot = new File(System.getProperty("java.io.tmpdir"))
		def prefixes = [
				"metallum-render-contract-",
				"metallum-validation-"
		]
		def directorySize = { File directory ->
			long size = 0L
			directory.eachFileRecurse { child ->
				if (child.isFile()) size += child.length()
			}
			size
		}
		def candidates = tempRoot.listFiles()?.findAll { candidate ->
			candidate.directory && prefixes.any { prefix -> candidate.name.startsWith(prefix) }
		} ?: []
		int removed = 0
		long totalBytes = candidates.collect { directorySize(it) }.sum(0L)
		candidates.findAll { candidate ->
			if (candidate.lastModified() > 0L && candidate.lastModified() < cutoff) {
				return true
			}
			false
		}.each { candidate ->
			long size = directorySize(candidate)
			project.delete(candidate)
			totalBytes -= size
			removed++
		}
		// Empty roots are failed-before-start or unit-test scratch directories;
		// remove them first so they cannot evict a non-empty failure report just
		// because their directory mtime is newer.
		candidates.findAll { candidate ->
			candidate.exists() && directorySize(candidate) == 0L
		}.each { candidate ->
			project.delete(candidate)
			removed++
		}
		candidates = candidates.findAll { it.exists() }.sort { left, right ->
			left.lastModified() <=> right.lastModified()
		}
		while ((totalBytes > maxTempBytes || candidates.size() > maxTempRuns) && !candidates.isEmpty()) {
			File candidate = candidates.remove(0)
			long size = directorySize(candidate)
			project.delete(candidate)
			totalBytes -= size
			removed++
		}
		project.logger.lifecycle(
				"Render-contract temporary cleanup removed ${removed} directories "
						+ "(retention=${retentionHours}h, maxRuns=${maxTempRuns}, "
						+ "maxBytes=${maxTempBytes}, remainingBytes=${Math.max(0L, totalBytes)})"
		)
	}

	tasks.register("renderContractCleanup") {
		group = "verification"
		description = "Removes stale and over-budget render-contract directories from the system temporary directory."
		doLast { renderContractCleanupAction() }
	}

	tasks.register("renderContractPostRunCleanup") {
		group = "verification"
		description = "Bounds managed render-contract temporary evidence after a Minecraft validation run."
		doLast { renderContractCleanupAction() }
	}

