// MetalFrameGenerationPresentationValidation.swift guards its whole body with
// @available(macOS 26.0, *) and signals "unsupported host" by exiting 77, the
// autotools skip convention. Exec has no notion of 77: it fails on any nonzero
// exit, so on macOS 15 the build failed with a message that said SKIPPED. The
// version has to be gated here instead, and gating it in onlyIf rather than
// mapping 77 to exit 0 is deliberate — a skipped task is reported as SKIPPED,
// whereas a zero exit would be reported as a task that ran and passed while
// validating nothing.
def macOsMajorVersion = -1
if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
	def versionMatch = (System.getProperty("os.version", "") =~ /^(\d+)/)
	if (versionMatch.find()) {
		macOsMajorVersion = versionMatch.group(1) as int
	}
}
def presentationValidationSkipReason = {
	if (!org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
		return "macOS is required"
	}
	// -1 means os.version did not parse; treat that as unknown rather than old,
	// so a host that can run the harness is never silently skipped.
	if (macOsMajorVersion >= 0 && macOsMajorVersion < 26) {
		return "macOS 26 is required (found ${System.getProperty('os.version')})"
	}
	return null
}

// WindowServer does not scan out CAMetalLayer drawables while the console is
// locked; presented handlers then report presentedTime == 0 even though the GPU
// command buffers completed. Detect that state before starting a multi-minute
// visible validation so a missing foreground session cannot masquerade as a
// renderer or frame-interpolator regression.
def lockedConsoleValidationReason = {
	if (!org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
		return null
	}
	def process = new ProcessBuilder("/usr/sbin/ioreg", "-n", "Root", "-d1")
			.redirectErrorStream(true)
			.start()
	def output = process.inputStream.getText("UTF-8")
	def exitCode = process.waitFor()
	if (exitCode != 0) {
		return "could not query the macOS console lock state (ioreg exit ${exitCode})".toString()
	}
	if (output.contains('"IOConsoleLocked" = Yes')
			|| output.contains('"CGSSessionScreenIsLocked"=Yes')) {
		return "the macOS console is locked; WindowServer cannot provide nonzero presentedTime callbacks".toString()
	}
	return null
}

def requireUnlockedConsoleForPresentation = {
	def reason = lockedConsoleValidationReason()
	if (reason != null) {
		throw new GradleException("Visible MetalFX presentation validation cannot run: ${reason}.")
	}
}

tasks.register("metalFrameGenerationPresentationValidation", Exec) {
	group = "verification"
	description = "Runs an automatic visible-window CAMetalDisplayLink pacing, resize and shutdown validation."
	onlyIf {
		if (hostedCi) {
			logger.lifecycle("metalFrameGenerationPresentationValidation SKIPPED: hosted CI has no attended WindowServer surface")
			return false
		}
		def reason = presentationValidationSkipReason()
		if (reason != null) {
			logger.lifecycle("metalFrameGenerationPresentationValidation SKIPPED: ${reason}")
		}
		reason == null
	}
	dependsOn "compileMetalFrameGenerationPresentationValidation"
	doFirst {
		requireUnlockedConsoleForPresentation()
		delete file("${buildDir}/metal-validation/presentation-current")
	}
	environment "MTL_DEBUG_LAYER", "1"
	environment "MTL_SHADER_VALIDATION", "0"
	commandLine metalFrameGenerationPresentationValidationBinary.absolutePath,
			file("${buildDir}/metal-validation/presentation-current").absolutePath
}

// Metal 4 migration M4 acceptance: the same visible-window pacing, resize and
// shutdown validation, with the frame-generation present thread on a Metal 4
// queue. Compare its report against the Metal 3 run of
// metalFrameGenerationPresentationValidation: presentedTime must stay non-zero
// (the CAMetalDisplayLink contract) and deadline misses must not increase.
tasks.register("metal4PresentValidation", Exec) {
	group = "verification"
	description = "Runs the frame-generation presentation validation with the Metal 4 present path enabled (migration spec M4)."
	// Same binary, so the same macOS 26 floor applies.
	onlyIf {
		def reason = presentationValidationSkipReason()
		if (reason != null) {
			logger.lifecycle("metal4PresentValidation SKIPPED: ${reason}")
		}
		reason == null
	}
	dependsOn "compileMetalFrameGenerationPresentationValidation"
	doFirst {
		requireUnlockedConsoleForPresentation()
		delete file("${buildDir}/metal-validation/presentation-metal4")
	}
	// macOS 26.5 MetalFX calls globalTraceObjectID on the Debug Layer's
	// MTL4DebugComputeCommandEncoder wrapper and aborts before the first frame.
	// Keep API Validation on the headless Metal 4 path test; the real MTL4FX
	// interpolator must run against the release encoder until Apple fixes it.
	environment "MTL_DEBUG_LAYER", "0"
	environment "MTL_SHADER_VALIDATION", "0"
	environment "METALLUM_VALIDATE_METAL4_PRESENT", "1"
	commandLine metalFrameGenerationPresentationValidationBinary.absolutePath,
			file("${buildDir}/metal-validation/presentation-metal4").absolutePath
}

tasks.register("compileMetalFxOffscreenValidation", Exec) {
	onlyIf {
		org.gradle.internal.os.OperatingSystem.current().isMacOsX()
	}
	workingDir project.projectDir
	inputs.files(
		"src/main/native/MetalFrameGenerationLifecycle.swift",
		"src/main/native/MetallumNative.swift",
		"src/test/native/MetalFXOffscreenValidation.swift"
	)
	outputs.file(metalFxOffscreenValidationBinary)
	doFirst {
		metalFxOffscreenValidationBinary.parentFile.mkdirs()
	}
	commandLine "swiftc",
		"-O",
		"-target", "arm64-apple-macosx14.0",
		"-framework", "Foundation",
		"-framework", "Metal",
		"-framework", "MetalFX",
		"-framework", "QuartzCore",
		"-framework", "CoreGraphics",
		"-framework", "ImageIO",
		"-framework", "UniformTypeIdentifiers",
		"-o", metalFxOffscreenValidationBinary.absolutePath,
		"src/main/native/MetalFrameGenerationLifecycle.swift",
		"src/main/native/MetallumNative.swift",
		"src/test/native/MetalFXOffscreenValidation.swift"
}

