tasks.register("renderContractSyntheticValidation", JavaExec) {
	group = "verification"
	description = "Runs bounded synthetic render-contract checks and the native GPU suites."
	dependsOn "renderContractUnitTest", "renderContractNativeTest", "renderContractCleanup"
	classpath = sourceSets.main.runtimeClasspath
	mainClass = "com.metallum.client.validation.fixture.RenderContractSyntheticValidation"
	systemProperty "metallum.validation.sourceCommit", renderContractSourceCommit
	if (renderContractSyntheticOutputDir != null) {
		args renderContractSyntheticOutputDir.absolutePath
		doFirst {
			delete renderContractSyntheticOutputDir
		}
	}
	if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
		jvmArgs "--enable-native-access=ALL-UNNAMED"
	}
	doLast {
		if (!renderContractPersistRequested && !renderContractManifestValidationRequested
				&& renderContractSyntheticOutputDir != null && renderContractSyntheticOutputDir.exists()) {
			delete renderContractSyntheticOutputDir
			logger.lifecycle("Render-contract synthetic temporary output removed after PASS: ${renderContractSyntheticOutputDir}")
		}
	}
}

tasks.register("renderContractCase", JavaExec) {
	group = "verification"
	description = "Runs one explicitly named render-contract fixture case."
	dependsOn "classes", "renderContractCleanup"
	classpath = sourceSets.main.runtimeClasspath
	mainClass = "com.metallum.client.validation.fixture.RenderContractSyntheticValidation"
		systemProperty "metallum.validation.sourceCommit", renderContractSourceCommit
		doFirst {
			def caseName = providers.gradleProperty("renderContractCase").orNull
			if (caseName == null || caseName.isBlank()) {
				throw new GradleException("renderContractCase requires -PrenderContractCase=<name>")
			}
			if (!(caseName ==~ /[A-Za-z0-9._-]+/)) {
				throw new GradleException("Invalid render-contract case name: ${caseName}")
			}
		def output = renderContractPersistRequested
				? file("${buildDir}/render-contract/case-${caseName}")
				: java.nio.file.Files.createTempDirectory(
						"metallum-render-contract-case-${caseName}-").toFile()
			delete output
			args output.absolutePath, caseName
			ext.renderContractOutput = output
	}
	doLast {
		if (!renderContractPersistRequested && ext.has("renderContractOutput")) {
			delete ext.renderContractOutput
			logger.lifecycle("Render-contract temporary case output removed after PASS")
		}
	}
}

tasks.register("renderContractManifestValidation") {
	group = "verification"
	description = "Validates versioned render-contract manifests and completion status."
	dependsOn "renderContractSyntheticValidation"
	doLast {
		def root = renderContractSyntheticOutputDir
		if (root == null) {
			throw new GradleException("No render-contract synthetic output was allocated")
		}
		def manifests = fileTree(root) { include "**/pass-manifest.json" }
		if (manifests.isEmpty()) {
			throw new GradleException("No render-contract pass manifests were generated under ${root}")
		}
		def parser = new groovy.json.JsonSlurper()
			manifests.files.each { manifest ->
				def json = parser.parse(manifest)
				def passes = json.passes instanceof List ? json.passes : []
				def openPasses = json.openPasses instanceof List ? json.openPasses : []
				def passKeys = [] as Set
				passes.each { pass ->
					def key = "${pass.frameId}:${pass.sequence}"
					if (!passKeys.add(key)) {
						throw new GradleException("Duplicate logical pass sequence ${key} in ${manifest}")
					}
				}
				def storageExceeded = json.storageBudget?.exceeded == true
				if (json.schemaVersion != 1 || !json.runId || !json.status || json.status != "passed"
						|| json.manifestComplete != true
						|| json.droppedEvents != 0 || !openPasses.isEmpty()
						|| json.passCount != passes.size() || storageExceeded) {
					throw new GradleException("Invalid render-contract manifest ${manifest}")
				}
		}
		logger.lifecycle("Render-contract manifests: PASS (${manifests.files.size()} files)")
			if (!renderContractPersistRequested) {
			delete root
			logger.lifecycle("Render-contract synthetic temporary output removed after manifest PASS: ${root}")
		}
	}
}

