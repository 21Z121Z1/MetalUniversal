tasks.register("verifyIsolatedClientProfiles") {
	group = "verification"
	description = "Verifies that supported Iris and MetalFX launch profiles cannot implicitly overlap."
	doLast {
		def failures = []
		if (irisClientDefaults["metallum.iris.semantic"] != "true"
				|| irisClientDefaults["metallum.metalfx.mode"] != "OFF"
				|| irisClientDefaults["metallum.metalfx.frameGeneration"] != "false"
				|| irisClientDefaults["metallum.metalfx.objectMotionProducer"] != "false"
				|| irisClientDefaults["metallum.metal.hud"] != "false") {
			failures << "runClientIris defaults do not isolate Iris correctness from MetalFX/FG/HUD"
		}
		if (metalFxClientDefaults["metallum.iris.semantic"] != "false"
				|| metalFxClientDefaults["metallum.metalfx.mode"] == "OFF"
				|| metalFxClientDefaults["metallum.metalfx.frameGeneration"] != "false"
				|| metalFxClientDefaults["metallum.metalfx.objectMotionProducer"] != "false") {
			failures << "runClientMetalFx defaults do not keep Iris and Frame Generation dormant"
		}
		if (tasks.findByName("runClientAll") != null) {
			failures << "the unsupported implicit Iris + MetalFX runClientAll profile still exists"
		}
		if (!failures.isEmpty()) {
			throw new GradleException(failures.join("; "))
		}
		logger.lifecycle("Isolated client profiles: PASS")
	}
}

