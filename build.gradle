// Supported manual profiles stay isolated until Iris final output, jitter,
// motion and reactive-mask ownership have an explicit shared contract.
//
//   ./gradlew runClientIris -Pworld="New World"
//   ./gradlew runClientMetalFx -Pworld="New World"
