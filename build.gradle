plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

loom {
	accessWidenerPath = file("src/main/resources/metallum.accesswidener")
}

repositories {
	maven { url "https://api.modrinth.com/maven" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "maven.modrinth:sodium:${project.sodium_version}"
	// Iris ships as an unobfuscated MC 26.2 mod (no refmap); a plain
	// implementation dependency puts it on the dev classpath where the
	// Fabric loader discovers and loads it as a mod. The metallum iris.*
	// compat mixins (gated on the mod being present) keep it dormant on
	// the Metal backend. The incomplete semantic layer is explicit opt-in via
	// -Dmetallum.iris.semantic=true until its runtime acceptance gates pass.
	implementation "maven.modrinth:iris:${project.iris_version}"
	testImplementation "org.junit.jupiter:junit-jupiter:5.12.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.12.2"
}

// The OpenGL uniform recorder is a validation-only mod. Keeping it in a
// separate source set means the production JAR cannot apply observer mixins or
// perform trace file I/O during ordinary Iris rendering.
sourceSets {
	validation {
		compileClasspath += sourceSets.main.output + configurations.compileClasspath
		runtimeClasspath += output + sourceSets.main.runtimeClasspath
	}
}

configurations {
	validationImplementation.extendsFrom(implementation)
	validationCompileOnly.extendsFrom(compileOnly)
	validationRuntimeOnly.extendsFrom(runtimeOnly)
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

// GitHub's hosted macOS 26 virtual GPU aborts when libMTLHud tries to enable
// encoder counter sampling, even with both Metal validation layers disabled.
// CI still compiles the native backend and GPU harnesses, but executes only
// headless tests which do not create an MTLDevice. Real GPU/readback/window
// validation remains part of every local Apple Silicon `build`.
def hostedCi = "true".equalsIgnoreCase(System.getenv("CI"))
def metalApiValidation = hostedCi ? "0" : "1"
def metalShaderValidation = hostedCi ? "0" : "1"
def hardwareMetalValidationAvailable = {
	org.gradle.internal.os.OperatingSystem.current().isMacOsX() && !hostedCi
}
def renderContractSourceCommit = System.getProperty("metallum.validation.sourceCommit")
if (renderContractSourceCommit == null || renderContractSourceCommit.isBlank()) {
	try {
		def process = new ProcessBuilder("git", "rev-parse", "HEAD")
				.directory(project.projectDir)
				.redirectErrorStream(true)
				.start()
		def candidate = process.inputStream.getText("UTF-8").trim()
		if (process.waitFor() == 0 && candidate ==~ /[0-9a-fA-F]{40}/) {
			renderContractSourceCommit = candidate
		}
	} catch (Exception ignored) {
		// Source archives and exported workspaces may not contain a .git directory.
	}
}
if (renderContractSourceCommit == null || renderContractSourceCommit.isBlank()) {
	renderContractSourceCommit = "unknown"
}

tasks.test {
	useJUnitPlatform()
	exclude "**/MetalMrtBackendIntegrationTest.class"
	exclude "**/MetalComputeBackendIntegrationTest.class"
	exclude "**/MetalIrisTargetsIntegrationTest.class"
	exclude "**/MetalIrisNoiseTextureIntegrationTest.class"
	exclude "**/IrisMetalCenterDepthSamplerTest.class"
	exclude "**/IrisMetalComputeConformanceTest.class"
	exclude "**/IrisMetalExternalLevelSamplerTest.class"
	exclude "**/MetalIrisShaderTranslationTest.class"
	exclude "**/MetalIrisSodiumTerrainTest.class"
	if (hostedCi) {
		exclude "**/IrisMetalPostChainCompilationTest.class"
		exclude "**/IrisMetalShadowPipelineTest.class"
		exclude "**/IrisMetalShadowComputeConformanceTest.class"
		exclude "**/MetalGenericVertexAttributeIntegrationTest.class"
		exclude "**/MetalIrisCustomTexturesIntegrationTest.class"
		exclude "**/MetalRenderContractGpuIntegrationTest.class"
	}
	if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
		jvmArgs "--enable-native-access=ALL-UNNAMED"
		environment "MTL_DEBUG_LAYER", metalApiValidation
		environment "MTL_SHADER_VALIDATION", metalShaderValidation
	}
}

def runClientIrisRequested = gradle.startParameter.taskNames.any {
	it == "runClientIris" || it.endsWith(":runClientIris")
}
def runClientMetalFxRequested = gradle.startParameter.taskNames.any {
	it == "runClientMetalFx" || it.endsWith(":runClientMetalFx")
}
if (runClientIrisRequested && runClientMetalFxRequested) {
	throw new GradleException(
			"runClientIris and runClientMetalFx are isolated profiles and cannot run together."
	)
}
def isolatedClientWorld = providers.gradleProperty("world").orNull
def irisClientDefaults = [
		"metallum.iris.semantic"                 : "true",
		"metallum.metalfx.mode"                  : "OFF",
		"metallum.metalfx.frameGeneration"       : "false",
		"metallum.metalfx.objectMotionProducer"  : "false",
		"metallum.metal.hud"                     : "false",
]
def metalFxClientDefaults = [
		"metallum.iris.semantic"                 : "false",
		"metallum.metalfx.mode"                  : "TEMPORAL",
		"metallum.metalfx.frameGeneration"       : "false",
		"metallum.metalfx.objectMotionProducer"  : "false",
]
def isolatedClientDefaults = runClientIrisRequested
		? irisClientDefaults
		: runClientMetalFxRequested
		? metalFxClientDefaults
		: [:]

// Gradle system properties do not automatically reach Loom's forked
// runClient JVM. Forward explicit metallum properties, then apply one isolated
// profile when runClientIris or runClientMetalFx was selected. There is
// deliberately no supported task that implicitly enables both subsystems.
tasks.withType(JavaExec).configureEach {
	if (name == "runClient") {
		// Forward every metallum.* property so launch-arg knobs (MetalFX mode,
		// reactive-policy tuning, validation switches) reach the client JVM
		// without needing to grow an allowlist per knob.
		System.properties.each { key, value ->
			def propertyName = key.toString()
			if (propertyName.startsWith("metallum.")) {
				systemProperty(propertyName, value.toString())
			}
		}
		isolatedClientDefaults.each { key, value ->
			if (System.getProperty(key) == null) {
				systemProperty(key, value)
			}
		}
		if (!isolatedClientDefaults.isEmpty()) {
			if (System.getProperty("metallum.validation.world") == null
					&& isolatedClientWorld != null && !isolatedClientWorld.isBlank()) {
				systemProperty("metallum.validation.world", isolatedClientWorld)
			}
		}
		def validationWorld = System.getProperty("metallum.validation.world")
		if (validationWorld == null && !isolatedClientDefaults.isEmpty()) {
			validationWorld = isolatedClientWorld
		}
		def dedicatedValidation = gradle.startParameter.taskNames.any {
			it == "minecraftMetalFxClientValidation" || it.endsWith(":minecraftMetalFxClientValidation")
					|| it == "renderContractMinecraftValidation" || it.endsWith(":renderContractMinecraftValidation")
					|| it == "renderContractMinecraftDiagnose" || it.endsWith(":renderContractMinecraftDiagnose")
						|| it == "minecraftNativeFullscreenBaseline"
						|| it.endsWith(":minecraftNativeFullscreenBaseline")
						|| it == "minecraftNativeRenderEfficiencyValidation"
						|| it.endsWith(":minecraftNativeRenderEfficiencyValidation")
					|| it == "minecraftNativeFrameGenerationValidation"
					|| it.endsWith(":minecraftNativeFrameGenerationValidation")
		}
		if (!dedicatedValidation && validationWorld != null && !validationWorld.isBlank()) {
			args "--quickPlaySingleplayer", validationWorld
		}
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.named("processValidationResources") {
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.register("validationJar", Jar) {
	group = "build"
	description = "Builds the opt-in OpenGL/Iris validation mod separately from production."
	archiveClassifier = "validation"
	from(sourceSets.validation.output)
	dependsOn("validationClasses", "processValidationResources")
}

tasks.register("verifyProductionJarIsolation") {
	group = "verification"
	description = "Ensures production output does not contain validation-only OpenGL trace classes or mixins."
	dependsOn("jar", "validationJar")
	doLast {
		def production = tasks.named("jar").get().archiveFile.get().asFile
		def forbidden = [
				"com/metallum/client/metal/render/IrisOpenGlUniformTrace.class",
				"com/metallum/mixin/iris/IrisOpenGlUniformBuilderTraceMixin.class",
				"com/metallum/mixin/iris/IrisOpenGlUniformUpdateTraceMixin.class",
				"com/metallum/mixin/iris/IrisOpenGlProgramUniformsTraceMixin.class",
				"com/metallum/mixin/iris/IrisFixedUniformSupplierTraceMixin.class",
				"com/metallum/mixin/iris/IrisCachedUniformUpdateTraceMixin.class",
				"com/metallum/mixin/iris/IrisOpenGlFogRendererTraceMixin.class",
				"metallum-validation.mixins.json"
		]
		def present = zipTree(production).files.collect { it.path }.findAll { path ->
			forbidden.any { path.endsWith(it) }
		}
		if (!present.isEmpty()) {
			throw new GradleException("Production JAR contains validation-only entries: ${present}")
		}
		logger.lifecycle("Production JAR validation isolation: PASS")
	}
}

tasks.register("buildMacNative", Exec) {
	onlyIf {
		org.gradle.internal.os.OperatingSystem.current().isMacOsX()
	}

	workingDir project.projectDir
	inputs.files(
		"src/main/native/MetalFrameGenerationLifecycle.swift",
		"src/main/native/MetallumInterface.swift",
		"src/main/native/MetallumNative.swift"
	)
	outputs.file("src/main/resources/natives/macos/libmetallum.dylib")
	doFirst {
		file("src/main/resources/natives/macos").mkdirs()
	}

	commandLine "swiftc",
		"-O",
		"-whole-module-optimization",
		"-emit-library",
		"-module-name", "metallum_native",
		"-target", "arm64-apple-macosx14.0",
		"-framework", "Foundation",
		"-framework", "Metal",
		"-framework", "MetalFX",
		"-framework", "QuartzCore",
		"-o", "src/main/resources/natives/macos/libmetallum.dylib",
		"src/main/native/MetalFrameGenerationLifecycle.swift",
		"src/main/native/MetallumInterface.swift",
		"src/main/native/MetallumNative.swift"
}

