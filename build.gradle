plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

loom {
	accessWidenerPath = file("src/main/resources/metallum.accesswidener")
}

repositories {
	maven { url "https://api.modrinth.com/maven" }
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "maven.modrinth:sodium:${project.sodium_version}"

	// Iris is needed on the compile classpath so that Metallum's Iris-targeting
	// mixins (in com.metallum.mixin.iris) can reference Iris's classes. It is
	// declared with the standard `compileOnly` configuration (NOT Loom's
	// modCompileOnly, which this Loom version does not support). Loom still
	// remaps it to named mappings for compilation. Iris is NOT on the runtime
	// classpath — it is provided by the user installing Iris alongside
	// MetalUniversal. The MetalIrisBridge itself stays runtime-decoupled and
	// detects Iris via FabricLoader.
	compileOnly "maven.modrinth:iris:${project.iris_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

// Helper: run a command, stream its combined output to the logger, and throw
// on failure. Defined at the top level so every native build task
// (buildIOSSpvc, buildGlslangMac, buildSpvcMac, buildGlslangIOS) can reuse it
// instead of re-declaring a local closure. The `tag` prefixes each log line so
// output from the various native builds stays attributable to its task.
def runCmd = { List<String> cmd, File workDir = null, String tag = "native" ->
	logger.lifecycle("[${tag}] Running: " + cmd.join(" "))
	// Groovy list literals are ArrayList<Object>; ProcessBuilder needs List<String>
	def strCmd = new ArrayList<String>(cmd.size())
	for (String s : cmd) strCmd.add(s)
	def pb = new ProcessBuilder(strCmd)
	if (workDir != null) pb.directory(workDir)
	pb.redirectErrorStream(true)
	def proc = pb.start()
	proc.inputStream.eachLine { line -> logger.lifecycle("[${tag}] " + line) }
	def exitCode = proc.waitFor()
	if (exitCode != 0) {
		throw new GradleException("Command failed (exit " + exitCode + "): " + cmd.join(" "))
	}
}

// JDK include paths for JNI headers (jni.h, jni_md.h). Used by buildMacNative
// and buildIOSNative when compiling MetallumShaderBridge.c. jni_md.h lives in
// include/darwin on macOS; iOS uses the same header (no include/ios exists).
// Defined before the tasks so the task configuration closures can capture it.
def jdkInclude = "${System.getProperty('java.home')}/include"
def jdkIncludeDarwin = "${jdkInclude}/darwin"

tasks.register("buildMacNative", Exec) {
	onlyIf {
		org.gradle.internal.os.OperatingSystem.current().isMacOsX()
	}

	workingDir project.projectDir
	doFirst {
		file("src/main/resources/natives/macos").mkdirs()
	}

	// swiftc drives the compilation of both the Swift bridge (MetallumNative.swift)
	// and the JNI C bridge (MetallumShaderBridge.c). The C file's glslang_* /
	// spvc_* references are left undefined at link time (-undefined dynamic_lookup)
	// and resolved at runtime from libglslang.dylib / libspvc.dylib, which
	// MetalNativeBridge.ensureShaderLibrariesLoaded() loads and promotes to
	// RTLD_GLOBAL before libmetallum.dylib is used.
	//
	// -Xcc flags are forwarded to clang (invoked by swiftc for .c input):
	//   -Ithird_party/glslang           → glslang/Include/glslang_c_interface.h,
	//                                     glslang/Public/resource_limits_c.h
	//   -Ithird_party/SPIRV-Cross       → spirv_cross_c.h
	//   -I${jdkInclude}                 → jni.h
	//   -I${jdkIncludeDarwin}           → jni_md.h (macOS/iOS share this header)
	commandLine "swiftc",
		"-O",
		"-whole-module-optimization",
		"-emit-library",
		"-module-name", "metallum_native",
		"-target", "arm64-apple-macosx14.0",
		"-framework", "Foundation",
		"-framework", "Metal",
		"-framework", "QuartzCore",
		"-Xcc", "-Ithird_party/glslang",
		"-Xcc", "-Ithird_party/SPIRV-Cross",
		"-Xcc", "-I${jdkInclude}",
		"-Xcc", "-I${jdkIncludeDarwin}",
		"-Xlinker", "-undefined", "-Xlinker", "dynamic_lookup",
		"-o", "src/main/resources/natives/macos/libmetallum.dylib",
		"src/main/native/MetallumNative.swift",
		"src/main/native/MetallumShaderBridge.c"
}

// Builds the Metallum native bridge as a dylib targeting iOS arm64. The
// resulting artifact must be embedded in the iOS app bundle's Frameworks
// directory and signed with the app's signing identity; iOS forbids loading
// unsigned dylibs from writable tmp directories at runtime, so the produced
// file is consumed by PojavLauncher's packaging step rather than extracted
// from the jar at runtime.
//
// Requires Xcode with an iOS toolchain. Skipped automatically if the host
// is not macOS or if the iOS SDK is unavailable.
//
// Note: swiftc's `-sdk` flag does NOT resolve SDK names through xcrun the
// way `-target` does; passing the literal "iphoneos" makes swiftc look for
// a *directory* named "iphoneos" and fail with "no such sysroot directory".
// We must resolve the full SDK path ourselves via xcrun and pass that.

def iosSdkPath = {
	if (!org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
		return null
	}
	def out = new ByteArrayOutputStream()
	def err = new ByteArrayOutputStream()
	def proc = ["xcrun", "--sdk", "iphoneos", "--show-sdk-path"].execute()
	proc.waitForProcessOutput(out, err)
	def path = out.toString().trim()
	def errStr = err.toString().trim()
	if (proc.exitValue() == 0 && errStr.empty && !path.empty
		&& path.contains("iPhoneOS") && new File(path).isDirectory()) {
		return path
	}
	return null
}()

tasks.register("buildIOSNative", Exec) {
	onlyIf { iosSdkPath != null }

	workingDir project.projectDir
	doFirst {
		file("src/main/resources/natives/ios").mkdirs()
	}

	// The dylib is built with `-static`-style linking of the Swift stdlib so it
	// can be loaded directly via dlopen on a jailbroken/signable device.
	// MetallumShaderBridge.c is compiled alongside MetallumNative.swift; its
	// glslang_* / spvc_* references use -undefined dynamic_lookup (resolved at
	// runtime from libglslang.dylib / libspvc.dylib loaded by MetalNativeBridge).
	if (iosSdkPath != null) {
		commandLine "swiftc",
			"-O",
			"-whole-module-optimization",
			"-emit-library",
			"-module-name", "metallum_native",
			"-target", "arm64-apple-ios14.0",
			"-sdk", iosSdkPath,
			"-framework", "Foundation",
			"-framework", "Metal",
			"-framework", "QuartzCore",
			"-framework", "UIKit",
			"-Xcc", "-Ithird_party/glslang",
			"-Xcc", "-Ithird_party/SPIRV-Cross",
			"-Xcc", "-I${jdkInclude}",
			"-Xcc", "-I${jdkIncludeDarwin}",
			"-Xlinker", "-undefined", "-Xlinker", "dynamic_lookup",
			"-o", "src/main/resources/natives/ios/libmetallum.dylib",
			"src/main/native/MetallumNative.swift",
			"src/main/native/MetallumShaderBridge.c"
	}
}

// Builds a full-featured libspvc.dylib (SPIRV-Cross C API with MSL backend)
// for iOS arm64. This is required because Amethyst's bundled libMoltenVK.dylib
// statically links SPIRV-Cross with only the Vulkan backend — LWJGL's spvc
// bindings pick up MoltenVK's stripped symbols via dlsym(RTLD_DEFAULT),
// causing spvc_context_create_compiler(SPVC_BACKEND_MSL) to fail with -4
// "Invalid backend".
//
// We build SPIRV-Cross from source with SPIRV_CROSS_C_API=ON and
// SPIRV_CROSS_ENABLE_MSL=ON, then bundle the resulting libspvc.dylib in the
// jar. At runtime, MetalCrossShaderCompiler extracts it and sets
// Configuration.SPVC_LIBRARY_NAME so LWJGL uses our full version instead of
// MoltenVK's stripped one.
tasks.register("buildIOSSpvc") {
	onlyIf { iosSdkPath != null }

	def spvcSourceDir = file("${rootDir}/third_party/SPIRV-Cross")
	def spvcBuildDir = file("${buildDir}/spirv-cross-build")
	def spvcOutput = file("src/main/resources/natives/ios/libspvc.dylib")

	outputs.file spvcOutput

	doLast {
		file("src/main/resources/natives/ios").mkdirs()
		if (spvcOutput.exists()) {
			logger.lifecycle("[buildIOSSpvc] libspvc.dylib already exists, skipping build")
			return
		}

		// 1. CMake configure + build (use built-in iOS support, no toolchain file).
		//    Source is the third_party/SPIRV-Cross git submodule (no clone needed).
		spvcBuildDir.mkdirs()
		// SPIRV-Cross option names (see third_party/SPIRV-Cross/CMakeLists.txt):
		//   SPIRV_CROSS_SHARED  - builds the C API as a single shared library (libspirv-cross-c-shared.dylib)
		//   SPIRV_CROSS_STATIC  - static libs (off, we only want shared)
		//   SPIRV_CROSS_CLI     - CLI binary, requires HLSL/GLSL/MSL/CPP/REFLECT/UTIL; turn off so we can trim backends
		//   SPIRV_CROSS_ENABLE_TESTS - tests (off)
		// The shared lib target is `spirv-cross-c-shared`; the dylib carries VERSION/SOVERSION symlinks.
		runCmd(["cmake",
			"-G", "Unix Makefiles",
			"-DCMAKE_SYSTEM_NAME=iOS",
			"-DCMAKE_OSX_DEPLOYMENT_TARGET=14.0",
			"-DCMAKE_OSX_ARCHITECTURES=arm64",
			"-DCMAKE_MAKE_PROGRAM=/usr/bin/make",
			"-DSPIRV_CROSS_SHARED=ON",
			"-DSPIRV_CROSS_STATIC=OFF",
			"-DSPIRV_CROSS_CLI=OFF",
			"-DSPIRV_CROSS_ENABLE_TESTS=OFF",
			"-DSPIRV_CROSS_ENABLE_C_API=ON",
			"-DSPIRV_CROSS_ENABLE_MSL=ON",
			"-DSPIRV_CROSS_ENABLE_GLSL=ON",
			"-DSPIRV_CROSS_ENABLE_HLSL=OFF",
			"-DSPIRV_CROSS_ENABLE_CPP=OFF",
			"-DSPIRV_CROSS_ENABLE_REFLECT=OFF",
			"-DSPIRV_CROSS_ENABLE_UTIL=OFF",
			"-DCMAKE_BUILD_TYPE=Release",
			spvcSourceDir.absolutePath], spvcBuildDir, "buildIOSSpvc")
		runCmd(["cmake", "--build", ".", "--config", "Release", "-j", "4"], spvcBuildDir, "buildIOSSpvc")

		// 2. Locate built dylib. The shared target is `spirv-cross-c-shared`, so the
		// file is `libspirv-cross-c-shared.dylib` (with versioned symlinks). Resolve
		// the real file via canonical path to avoid copying a symlink.
		def candidates = [
			"${spvcBuildDir}/libspirv-cross-c-shared.dylib",
			"${spvcBuildDir}/Release/libspirv-cross-c-shared.dylib",
			"${spvcBuildDir}/src/libspirv-cross-c-shared.dylib"
		]
		def builtLib = null
		for (String p : candidates) {
			def f = file(p)
			if (f.exists()) {
				builtLib = f
				break
			}
		}
		if (builtLib == null) {
			// Fall back to a directory scan for the real (non-symlink) dylib.
			def found = []
			spvcBuildDir.eachFileRecurse { f ->
				if (f.isFile() && f.name.startsWith("libspirv-cross-c-shared") && f.name.endsWith(".dylib")) {
					found << f
				}
			}
			if (found.size() > 0) {
				// Prefer the shortest name (the unversioned symlink target resolved to a file)
				builtLib = found.sort { it.name.length() }[0]
			}
		}
		if (builtLib == null) {
			throw new GradleException("libspirv-cross-c-shared.dylib not found in build output: ${spvcBuildDir}")
		}
		spvcOutput.parentFile.mkdirs()
		builtLib.withInputStream { ins ->
			spvcOutput.withOutputStream { outs -> outs << ins }
		}
		logger.lifecycle("[buildIOSSpvc] Built libspvc.dylib -> ${spvcOutput}")

		// 3. Verify MSL backend is actually compiled in. The C API's
		//    spvc_context_create_compiler switch has `case SPVC_BACKEND_MSL:`
		//    wrapped in `#if SPIRV_CROSS_C_API_MSL`. If the macro wasn't defined
		//    at build time (e.g. SPIRV_CROSS_ENABLE_MSL didn't propagate), the
		//    case is absent and runtime calls fail with -4 "Invalid backend".
		//    When MSL is enabled, the dylib contains CompilerMSL symbols and
		//    the "spvc_compiler_msl_*" C API entry points.
		try {
			def out = new ByteArrayOutputStream()
			def proc = ["nm", "-gU", builtLib.absolutePath].execute()
			proc.waitForProcessOutput(out, null)
			def nmOutput = out.toString()
			def hasMslSymbols = nmOutput.contains("CompilerMSL") || nmOutput.contains("spvc_compiler_msl")
			logger.lifecycle("[buildIOSSpvc] MSL backend symbols present: ${hasMslSymbols}")
			if (!hasMslSymbols) {
				throw new GradleException(
						"[buildIOSSpvc] FATAL: libspvc.dylib was built WITHOUT MSL backend support. " +
						"spvc_context_create_compiler(SPVC_BACKEND_MSL) will fail at runtime with -4. " +
						"Check that SPIRV_CROSS_ENABLE_MSL=ON propagated to the spirv-cross-c-shared target. " +
						"nm output excerpt: " + nmOutput.substring(0, Math.min(nmOutput.length(), 500))
				)
			}
		} catch (IOException ignored) {
			logger.lifecycle("[buildIOSSpvc] nm not available, skipping MSL symbol verification")
		}

		// 4. Verify the dylib targets iOS (not macOS). CMake with
		//    CMAKE_SYSTEM_NAME=iOS should produce a Mach-O with LC_BUILD_VERSION
		//    platform=ios. If CMake silently fell back to the host (macOS), the
		//    dylib would be a macOS arm64 binary that iOS refuses to load
		//    (dlopen fails with "no suitable image found") or, worse, loads via
		//    the simulator path on Apple Silicon Macs.
		//    `lipo -info` shows architecture; `otool -l` shows the LC_BUILD_VERSION
		//    load command whose `platform` field distinguishes iOS (2) from macOS (1).
		try {
			def lipoOut = new ByteArrayOutputStream()
			def lipoProc = ["lipo", "-info", builtLib.absolutePath].execute()
			lipoProc.waitForProcessOutput(lipoOut, null)
			logger.lifecycle("[buildIOSSpvc] Architecture: " + lipoOut.toString().trim())

			def otoolOut = new ByteArrayOutputStream()
			def otoolProc = ["otool", "-l", builtLib.absolutePath].execute()
			otoolProc.waitForProcessOutput(otoolOut, null)
			def otoolOutput = otoolOut.toString()
			// LC_BUILD_VERSION or LC_VERSION_MIN_IPHONEOS indicates iOS targeting
			def isIOS = otoolOutput.contains("LC_VERSION_MIN_IPHONEOS") ||
					(otoolOutput.contains("LC_BUILD_VERSION") && otoolOutput.contains("platform 2"))
			def isMacOS = otoolOutput.contains("LC_VERSION_MIN_MACOSX") ||
					(otoolOutput.contains("LC_BUILD_VERSION") && otoolOutput.contains("platform 1"))
			logger.lifecycle("[buildIOSSpvc] LC_BUILD_VERSION platform: " +
					(isIOS ? "iOS" : isMacOS ? "macOS" : "unknown"))
			if (!isIOS) {
				throw new GradleException(
						"[buildIOSSpvc] FATAL: libspvc.dylib was built for macOS, not iOS. " +
						"CMAKE_SYSTEM_NAME=iOS did not take effect — the dylib cannot be loaded on iOS devices. " +
						"Ensure the iOS SDK is installed (xcrun --sdk iphoneos --show-sdk-path) and " +
						"CMake picks it up. otool output excerpt: " +
						otoolOutput.substring(0, Math.min(otoolOutput.length(), 800))
				)
			}
		} catch (IOException ignored) {
			logger.lifecycle("[buildIOSSpvc] lipo/otool not available, skipping platform verification")
		}
	}
}

// Builds libglslang.dylib (glslang C API + SPIR-V codegen) for macOS arm64
// from the third_party/glslang git submodule. With BUILD_SHARED_LIBS=ON the
// `glslang` target bundles the C interface (glslang_c_interface.cpp), the
// SPIR-V backend (GlslangToSpv etc.) and the machine-independent frontend
// into a single libglslang.dylib, so it is self-contained for the C API in
// glslang/Public/ShaderLang.h and glslang/Include/glslang_c_interface.h.
//
// Skipped automatically if the host is not macOS (the macOS SDK is required
// for CMAKE_OSX_DEPLOYMENT_TARGET / CMAKE_OSX_ARCHITECTURES to take effect).
tasks.register("buildGlslangMac") {
	onlyIf {
		org.gradle.internal.os.OperatingSystem.current().isMacOsX()
	}

	def glslangSourceDir = file("${rootDir}/third_party/glslang")
	def glslangBuildDir = file("${buildDir}/glslang-mac-build")
	def glslangOutput = file("src/main/resources/natives/macos/libglslang.dylib")

	outputs.file glslangOutput

	doLast {
		file("src/main/resources/natives/macos").mkdirs()
		if (glslangOutput.exists()) {
			logger.lifecycle("[buildGlslangMac] libglslang.dylib already exists, skipping build")
			return
		}

		// glslang keeps local copies of the canonical SPIR-V headers in its
		// SPIRV/ directory, so it does not strictly require external
		// SPIRV-Headers. SPIRV_HEADERS_INCLUDE_DIR is still pointed at the
		// submodule in case any translation unit looks for spirv/unified1.
		glslangBuildDir.mkdirs()
		runCmd(["cmake",
			"-G", "Unix Makefiles",
			"-DCMAKE_OSX_DEPLOYMENT_TARGET=14.0",
			"-DCMAKE_OSX_ARCHITECTURES=arm64",
			"-DCMAKE_BUILD_TYPE=Release",
			"-DENABLE_HLSL=OFF",
			"-DENABLE_OPT=OFF",
			"-DBUILD_SHARED_LIBS=ON",
			"-DGLSLANG_TESTS=OFF",
			"-DENABLE_GLSLANG_BINARIES=OFF",
			"-DSPIRV_HEADERS_INCLUDE_DIR=${rootDir}/third_party/SPIRV-Headers/include",
			glslangSourceDir.absolutePath], glslangBuildDir, "buildGlslangMac")
		runCmd(["cmake", "--build", ".", "--config", "Release", "-j", "4"], glslangBuildDir, "buildGlslangMac")

		// BUILD_SHARED_LIBS=ON produces libglslang.dylib (with versioned
		// symlinks). withInputStream follows symlinks, so the destination is a
		// real Mach-O file named libglslang.dylib.
		def candidates = [
			"${glslangBuildDir}/libglslang.dylib",
			"${glslangBuildDir}/glslang/libglslang.dylib",
			"${glslangBuildDir}/Release/libglslang.dylib"
		]
		def builtLib = null
		for (String p : candidates) {
			def f = file(p)
			if (f.exists()) {
				builtLib = f
				break
			}
		}
		if (builtLib == null) {
			def found = []
			glslangBuildDir.eachFileRecurse { f ->
				if (f.isFile() && f.name.startsWith("libglslang") && f.name.endsWith(".dylib")) {
					found << f
				}
			}
			if (found.size() > 0) {
				builtLib = found.sort { it.name.length() }[0]
			}
		}
		if (builtLib == null) {
			throw new GradleException("libglslang.dylib not found in build output: ${glslangBuildDir}")
		}
		glslangOutput.parentFile.mkdirs()
		builtLib.withInputStream { ins ->
			glslangOutput.withOutputStream { outs -> outs << ins }
		}
		logger.lifecycle("[buildGlslangMac] Built libglslang.dylib -> ${glslangOutput}")
	}
}

// Builds libspvc.dylib (SPIRV-Cross C API with MSL backend) for macOS arm64
// from the third_party/SPIRV-Cross git submodule. The shared target
// spirv-cross-c-shared produces libspirv-cross-c-shared.dylib, which is copied
// to libspvc.dylib to match the name expected by MetalCrossShaderCompiler /
// LWJGL's spvc bindings.
//
// Skipped automatically if the host is not macOS.
tasks.register("buildSpvcMac") {
	onlyIf {
		org.gradle.internal.os.OperatingSystem.current().isMacOsX()
	}

	def spvcSourceDir = file("${rootDir}/third_party/SPIRV-Cross")
	def spvcBuildDir = file("${buildDir}/spirv-cross-mac-build")
