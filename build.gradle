tasks.register("metal4PipelineSmokeTest", Exec) {
	group = "verification"
	description = "Checks that MTL4Compiler pipeline states bind to a Metal 3 render encoder (migration spec M2 step 0)."
	onlyIf {
		org.gradle.internal.os.OperatingSystem.current().isMacOsX()
	}
	dependsOn "compileMetal4PipelineSmokeTest"
	// Metal 4 gives no driver-side hazard tracking and validates pipeline/pass
	// agreement only under the debug layer; without it an illegal combination
	// can appear to work.
	environment "MTL_DEBUG_LAYER", "1"
	commandLine metal4PipelineSmokeBinary.absolutePath
}

// Metal 4 migration M1 + M2b at the L2 level: links the shipping native module
// so the real exports (capability gate, shader function registration, pipeline
// creation) are what gets tested.
tasks.register("compileMetal4PipelinePathTest", Exec) {
	onlyIf {
		org.gradle.internal.os.OperatingSystem.current().isMacOsX()
	}
	workingDir project.projectDir
	// Source set mirrors buildMacNative, so this test links what ships.
	inputs.files(
		"src/main/native/MetalFrameGenerationLifecycle.swift",
		"src/main/native/MetallumInterface.swift",
		"src/main/native/MetallumNative.swift",
		"src/test/native/Metal4PipelinePathTest.swift"
	)
	outputs.file(metal4PipelinePathBinary)
	doFirst {
		metal4PipelinePathBinary.parentFile.mkdirs()
	}
	// -whole-module-optimization is required, not just a speed knob:
	// MetallumInterface.swift takes the address of MetallumNative.swift's @_cdecl
	// functions as @convention(c), which emits a thunk carrying the same C symbol
	// in each file's object. One object file per module (as buildMacNative does)
	// is what keeps those from colliding at link time.
	commandLine "swiftc",
		"-O",
		"-whole-module-optimization",
		"-module-name", "metallum_native",
		"-target", "arm64-apple-macosx14.0",
		"-framework", "AppKit",
		"-framework", "Foundation",
		"-framework", "Metal",
		"-framework", "MetalFX",
		"-framework", "QuartzCore",
		"-o", metal4PipelinePathBinary.absolutePath,
		"src/main/native/MetalFrameGenerationLifecycle.swift",
		"src/main/native/MetallumInterface.swift",
		"src/main/native/MetallumNative.swift",
		"src/test/native/Metal4PipelinePathTest.swift"
}

