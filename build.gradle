tasks.register("metalFxOffscreenValidation", Exec) {
	group = "verification"
	description = "Runs windowless MRT, motion, Temporal Scaler and Frame Interpolator GPU readback validation."
	onlyIf {
		org.gradle.internal.os.OperatingSystem.current().isMacOsX()
	}
	dependsOn "compileMetalFxOffscreenValidation"
	doFirst {
		delete metalFxOffscreenValidationOutput
	}
	environment "MTL_DEBUG_LAYER", "1"
	// MTL_SHADER_VALIDATION currently makes Apple's private MetalFX kernels
	// dispatch 32x32 (1024) threads on this 832-thread AGX device and aborts
	// inside the framework. Project-owned MRT pipelines remain covered by GPU
	// Validation in metalMrtBackendIntegrationTest.
	environment "MTL_SHADER_VALIDATION", "0"
	commandLine metalFxOffscreenValidationBinary.absolutePath, metalFxOffscreenValidationOutput.absolutePath
}

