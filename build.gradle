def configureRenderContractNativeTest = { Test task, boolean metal4 ->
	task.group = "verification"
	task.description = "Runs render-contract production GPU integration tests with Metal ${metal4 ? 4 : 3}."
	task.onlyIf { hardwareMetalValidationAvailable() }
	task.dependsOn tasks.named("buildMacNative")
	task.testClassesDirs = sourceSets.test.output.classesDirs
	task.classpath = sourceSets.test.runtimeClasspath
	task.useJUnitPlatform()
	task.filter {
		includeTestsMatching "com.metallum.client.metal.render.MetalMrtBackendIntegrationTest"
		includeTestsMatching "com.metallum.client.metal.render.MetalComputeBackendIntegrationTest"
		includeTestsMatching "com.metallum.client.metal.render.MetalRenderContractGpuIntegrationTest"
	}
	task.jvmArgs "--enable-native-access=ALL-UNNAMED"
	task.systemProperty "metallum.opt.metal4", metal4.toString()
	task.environment "MTL_DEBUG_LAYER", metalApiValidation
	task.environment "MTL_SHADER_VALIDATION", metalShaderValidation
	task.testLogging {
		showStandardStreams = true
	}
}

tasks.register("renderContractMetal3NativeTest", Test) { task ->
