	outputs.file spvcOutput

	doLast {
		file("src/main/resources/natives/macos").mkdirs()
		if (spvcOutput.exists()) {
			logger.lifecycle("[buildSpvcMac] libspvc.dylib already exists, skipping build")
			return
		}

		spvcBuildDir.mkdirs()
		runCmd(["cmake",
			"-G", "Unix Makefiles",
			"-DCMAKE_OSX_DEPLOYMENT_TARGET=14.0",
			"-DCMAKE_OSX_ARCHITECTURES=arm64",
			"-DCMAKE_BUILD_TYPE=Release",
			"-DSPIRV_CROSS_SHARED=ON",
			"-DSPIRV_CROSS_STATIC=OFF",
			"-DSPIRV_CROSS_CLI=OFF",
			"-DSPIRV_CROSS_ENABLE_TESTS=OFF",
			"-DSPIRV_CROSS_ENABLE_C_API=ON",
			"-DSPIRV_CROSS_ENABLE_MSL=ON",
			"-DSPIRV_CROSS_ENABLE_GLSL=ON",
			"-DSPIRV_CROSS_ENABLE_HLSL=OFF",
			"-DSPIRV_CROSS_ENABLE_CPP=OFF",
			"-DSPIRV_CROSS_ENABLE_REFLECT=OFF",
			"-DSPIRV_CROSS_ENABLE_UTIL=OFF",
			spvcSourceDir.absolutePath], spvcBuildDir, "buildSpvcMac")
		runCmd(["cmake", "--build", ".", "--config", "Release", "-j", "4"], spvcBuildDir, "buildSpvcMac")

		def candidates = [
			"${spvcBuildDir}/libspirv-cross-c-shared.dylib",
			"${spvcBuildDir}/Release/libspirv-cross-c-shared.dylib",
			"${spvcBuildDir}/src/libspirv-cross-c-shared.dylib"
		]
		def builtLib = null
		for (String p : candidates) {
			def f = file(p)
			if (f.exists()) {
				builtLib = f
				break
			}
		}
		if (builtLib == null) {
			def found = []
			spvcBuildDir.eachFileRecurse { f ->
				if (f.isFile() && f.name.startsWith("libspirv-cross-c-shared") && f.name.endsWith(".dylib")) {
					found << f
				}
			}
			if (found.size() > 0) {
				builtLib = found.sort { it.name.length() }[0]
			}
		}
		if (builtLib == null) {
			throw new GradleException("libspirv-cross-c-shared.dylib not found in build output: ${spvcBuildDir}")
		}
		spvcOutput.parentFile.mkdirs()
		builtLib.withInputStream { ins ->
			spvcOutput.withOutputStream { outs -> outs << ins }
		}
		logger.lifecycle("[buildSpvcMac] Built libspvc.dylib -> ${spvcOutput}")
	}
}

// Builds libglslang.dylib (glslang C API + SPIR-V codegen) for iOS arm64 by
// cross-compiling the third_party/glslang git submodule with
// CMAKE_SYSTEM_NAME=iOS. Mirrors buildIOSSpvc's iOS cross-compile setup; the
// resulting dylib is meant to be embedded in the iOS app bundle's Frameworks
// directory (like libmetallum.dylib / libspvc.dylib).
//
// Skipped automatically if the iOS SDK is unavailable.
tasks.register("buildGlslangIOS") {
	onlyIf { iosSdkPath != null }

	def glslangSourceDir = file("${rootDir}/third_party/glslang")
	def glslangBuildDir = file("${buildDir}/glslang-ios-build")
	def glslangOutput = file("src/main/resources/natives/ios/libglslang.dylib")

	outputs.file glslangOutput

	doLast {
		file("src/main/resources/natives/ios").mkdirs()
		if (glslangOutput.exists()) {
			logger.lifecycle("[buildGlslangIOS] libglslang.dylib already exists, skipping build")
			return
		}

		glslangBuildDir.mkdirs()
		runCmd(["cmake",
			"-G", "Unix Makefiles",
			"-DCMAKE_SYSTEM_NAME=iOS",
			"-DCMAKE_OSX_DEPLOYMENT_TARGET=14.0",
			"-DCMAKE_OSX_ARCHITECTURES=arm64",
			"-DCMAKE_MAKE_PROGRAM=/usr/bin/make",
			"-DCMAKE_BUILD_TYPE=Release",
			"-DENABLE_HLSL=OFF",
			"-DENABLE_OPT=OFF",
			"-DBUILD_SHARED_LIBS=ON",
			"-DGLSLANG_TESTS=OFF",
			"-DENABLE_GLSLANG_BINARIES=OFF",
			"-DSPIRV_HEADERS_INCLUDE_DIR=${rootDir}/third_party/SPIRV-Headers/include",
			glslangSourceDir.absolutePath], glslangBuildDir, "buildGlslangIOS")
		runCmd(["cmake", "--build", ".", "--config", "Release", "-j", "4"], glslangBuildDir, "buildGlslangIOS")

		def candidates = [
			"${glslangBuildDir}/libglslang.dylib",
			"${glslangBuildDir}/glslang/libglslang.dylib",
			"${glslangBuildDir}/Release/libglslang.dylib"
		]
		def builtLib = null
		for (String p : candidates) {
			def f = file(p)
			if (f.exists()) {
				builtLib = f
				break
			}
		}
		if (builtLib == null) {
			def found = []
			glslangBuildDir.eachFileRecurse { f ->
				if (f.isFile() && f.name.startsWith("libglslang") && f.name.endsWith(".dylib")) {
					found << f
				}
			}
			if (found.size() > 0) {
				builtLib = found.sort { it.name.length() }[0]
			}
		}
		if (builtLib == null) {
			throw new GradleException("libglslang.dylib not found in build output: ${glslangBuildDir}")
		}
		glslangOutput.parentFile.mkdirs()
		builtLib.withInputStream { ins ->
			glslangOutput.withOutputStream { outs -> outs << ins }
		}
		logger.lifecycle("[buildGlslangIOS] Built libglslang.dylib -> ${glslangOutput}")
	}
}

tasks.named("processResources") {
	dependsOn(tasks.named("buildMacNative"))
	// The iOS native is only built on a macOS host with the iOS SDK installed.
	// It is optional: if the toolchain is missing the task is skipped and the
	// iOS dylib is simply not packaged in the jar.
	dependsOn(tasks.named("buildIOSNative"))
	dependsOn(tasks.named("buildIOSSpvc"))
	dependsOn(tasks.named("buildGlslangMac"))
	dependsOn(tasks.named("buildSpvcMac"))
	dependsOn(tasks.named("buildGlslangIOS"))
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// sourcesJar (created above by `java { withSourcesJar() }`) also scans
// src/main/resources, so it must declare an explicit dependency on the native
// build tasks that write into that directory. Without this, Gradle 9 fails
// with "uses this output of task ':buildIOSSpvc' without declaring an explicit
// dependency". Must be placed AFTER `java { withSourcesJar() }` because the
// task is created by that block.
tasks.named("sourcesJar") {
	dependsOn(tasks.named("buildMacNative"))
	dependsOn(tasks.named("buildIOSNative"))
	dependsOn(tasks.named("buildIOSSpvc"))
	dependsOn(tasks.named("buildGlslangMac"))
	dependsOn(tasks.named("buildSpvcMac"))
	dependsOn(tasks.named("buildGlslangIOS"))
}

jar {
	inputs.property "projectName", project.name

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
