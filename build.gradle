	group = "application"
	description = "Runs Iris-on-Metal with MetalFX, frame generation and Metal HUD disabled."
	dependsOn "runClient"
	doFirst {
		logger.lifecycle("runClientIris: Iris semantic path enabled; MetalFX/FG/HUD disabled" +
			(isolatedClientWorld ? " world='${isolatedClientWorld}'" : ""))
