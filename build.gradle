	dependsOn "renderContractCleanup"
	if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
		dependsOn "minecraftMetalFxClientValidation"
	} else {
		doLast {
			logger.lifecycle("renderContractMinecraftValidation SKIPPED: macOS Metal is required")
		}
	}
}

tasks.register("renderContractMinecraftDiagnose") {
	group = "verification"
	description = "Runs Minecraft render-contract validation with persistent producer evidence for diagnosis."
	dependsOn "renderContractCleanup"
	if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
		dependsOn "minecraftMetalFxClientValidation"
	} else {
		doLast {
			logger.lifecycle("renderContractMinecraftDiagnose SKIPPED: macOS Metal is required")
		}
	}
	doLast {
		if (!org.gradle.internal.os.OperatingSystem.current().isMacOsX()) return
		def requestedOutput = System.getProperty("metallum.validation.output")
		def root = requestedOutput == null || requestedOutput.isBlank()
				? file("${buildDir}/render-contract/minecraft-diagnose-current")
				: file(requestedOutput)
		def contractRoot = new File(root, "render-contract")
		def required = [
				new File(root, "run-state.json"),
				new File(contractRoot, "pass-manifest.json"),
				new File(contractRoot, "results.json")
		]
		def missing = required.findAll { path -> !path.isFile() }
		if (!missing.isEmpty()) {
			throw new GradleException(
					"Minecraft render-contract diagnosis is incomplete at ${root}; missing ${missing.join(', ')}"
			)
		}
		def parser = new groovy.json.JsonSlurper()
		def manifest = parser.parse(new File(contractRoot, "pass-manifest.json"))
		def results = parser.parse(new File(contractRoot, "results.json"))
		def problems = []
		if (manifest.status != "passed") problems << "manifest status=${manifest.status}"
		if (manifest.manifestComplete != true) problems << "manifestComplete=${manifest.manifestComplete}"
		if (!(manifest.passCount instanceof Number) || manifest.passCount <= 0) problems << "no logical passes"
		if (manifest.droppedEvents != 0) problems << "droppedEvents=${manifest.droppedEvents}"
		if (results.status != "passed") problems << "results status=${results.status}"
		if (results.failedCaptures != 0) problems << "failedCaptures=${results.failedCaptures}"
		if (results.pendingCaptures != 0) problems << "pendingCaptures=${results.pendingCaptures}"
		if (results.droppedCaptures != 0) problems << "droppedCaptures=${results.droppedCaptures}"
		def producerDetailsRequested = System.getProperty(
				"metallum.renderContract.captureProducers", "true").toBoolean()
		if (producerDetailsRequested && manifest.producerDetailsCaptured != true) {
			problems << "producer details were requested but manifest producerDetailsCaptured=${manifest.producerDetailsCaptured}"
		}
		if (!problems.isEmpty()) {
			throw new GradleException(
					"Minecraft render-contract diagnosis did not produce complete evidence: "
							+ problems.join('; ')
			)
		}
		logger.lifecycle(
				"Minecraft render-contract diagnosis evidence: PASS; "
						+ "passes=${manifest.passCount}, captures=${results.completedCaptures}, root=${root}"
		)
	}
}

tasks.register("renderContractDiagnose", JavaExec) {
	group = "verification"
	description = "Compares two persisted render-contract runs and locates the first divergent pass."
	dependsOn "classes"
	classpath = sourceSets.main.runtimeClasspath
	mainClass = "com.metallum.client.validation.report.RenderContractDiagnosis"
	systemProperty "metallum.validation.sourceCommit", renderContractSourceCommit
	doFirst {
		def propertyValue = { String name ->
			providers.gradleProperty(name).orNull ?: System.getProperty(name)
		}
		def reference = propertyValue("renderContractReference")
		def actual = propertyValue("renderContractActual")
		def report = propertyValue("renderContractReport")
		if ([reference, actual, report].any { it == null || it.isBlank() }) {
			throw new GradleException(
					"renderContractDiagnose requires -PrenderContractReference=<root> "
							+ "-PrenderContractActual=<root> -PrenderContractReport=<file>"
			)
		}
		def paths = [reference, actual, report].collect { java.nio.file.Path.of(it).toAbsolutePath().normalize() }
		if (!paths[0].isAbsolute() || !paths[1].isAbsolute() || !paths[2].isAbsolute()) {
			throw new GradleException("renderContractDiagnose paths must be absolute")
		}
		if (!java.nio.file.Files.isDirectory(paths[0]) || !java.nio.file.Files.isDirectory(paths[1])) {
			throw new GradleException(
					"renderContractDiagnose roots must be directories: reference=${paths[0]}, actual=${paths[1]}"
			)
		}
		args paths[0].toString(), paths[1].toString(), paths[2].toString()
		logger.lifecycle("Render-contract diagnosis: ${paths[0]} vs ${paths[1]}")
	}
}

tasks.register("updateRenderContractGolden") {
	group = "verification"
	description = "Explicitly updates a render-contract expected artifact after confirmation."
	doLast {
		def caseName = providers.gradleProperty("renderContractCase").orNull
		def confirmed = providers.gradleProperty("confirmGoldenUpdate").orNull
		if (caseName == null || caseName.isBlank() || confirmed != "true") {
			throw new GradleException(
					"Golden update is fail-closed; provide -PrenderContractCase=<name> -PconfirmGoldenUpdate=true"
			)
		}
		if (!renderContractPersistRequested) {
			throw new GradleException(
					"Golden update requires persistent output; rerun with -PrenderContractPersist=true"
			)
			}
			if (!(caseName ==~ /[A-Za-z0-9._-]+/)) {
				throw new GradleException("Invalid render-contract case name: ${caseName}")
			}
				def current = file("${buildDir}/render-contract/case-${caseName}")
			if (!current.exists()) {
				throw new GradleException("No generated capture at ${current}; run renderContractCase first")
			}
			def expected = file("validation/render-contract/fixtures/${caseName}/expected")
			delete expected
			copy {
				from current
				into expected
				exclude "**/*.tmp", "**/.DS_Store"
			}
			logger.lifecycle("Golden update confirmed for ${caseName}: copied ${current} -> ${expected}")
		}
}

tasks.register("renderContractValidation") {
	group = "verification"
	description = "Runs unit, native Metal 3/4, synthetic and Minecraft render-contract validation."
	dependsOn "test", "buildMacNative", "renderContractNativeTest", "renderContractSyntheticValidation",
			"renderContractManifestValidation", "renderContractMinecraftValidation"
}

// The output directory is allocated during Gradle configuration. Keep the
// cleanup pass ahead of every producer so a parallel build cannot delete an
// active run between allocation and the first artifact write.
tasks.named("minecraftMetalFxClientValidation").configure {
	mustRunAfter("renderContractCleanup")
}
tasks.named("renderContractSyntheticValidation").configure {
	mustRunAfter("renderContractCleanup")
}
tasks.named("renderContractCase").configure {
	mustRunAfter("renderContractCleanup")
}

// A client validation task is a dependency wrapper around runClient. When the
// Minecraft process fails its wrapper is skipped, so a finalizer attached only
// to the wrapper is not reliable. Finalize the actual producer as well, keeping
// the newest bounded failure evidence while evicting stale/over-budget runs.
if (renderContractMinecraftValidationRequested) {
	tasks.named("runClient").configure {
		finalizedBy("renderContractPostRunCleanup")
	}
}

// Synthetic and single-case runs also allocate managed temporary roots. Their
// doLast cleanup only covers the passing path; the finalizer covers assertion,
// JVM and native-launch failures without touching persistent build output.
tasks.named("renderContractSyntheticValidation").configure {
	finalizedBy("renderContractPostRunCleanup")
}
tasks.named("renderContractCase").configure {
	finalizedBy("renderContractPostRunCleanup")
}
