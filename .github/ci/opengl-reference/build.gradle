plugins { id 'net.fabricmc.fabric-loom' }

def versions = new Properties()
file('../../../gradle.properties').withInputStream { versions.load(it) }
def e2eVersions = new Properties()
file('../minecraft-e2e/gradle.properties').withInputStream { e2eVersions.load(it) }
def renderer = providers.gradleProperty('referenceRenderer').orElse('iris').get()
if (!(renderer in ['vanilla', 'sodium', 'iris'])) throw new GradleException('Unknown referenceRenderer')
def evidence = file(providers.gradleProperty('referenceEvidence').orElse("${buildDir}/evidence").get())
def inputFile = new File(evidence, 'inputs.json')
def profile = inputFile.isFile() ? new groovy.json.JsonSlurper().parse(inputFile) : [:]
def width = providers.gradleProperty('referenceWidth').orElse((profile.width ?: 1280).toString()).get().toInteger()
def height = providers.gradleProperty('referenceHeight').orElse((profile.height ?: 720).toString()).get().toInteger()
def distance = providers.gradleProperty('referenceDistance').orElse((profile.renderDistance ?: 12).toString()).get().toInteger()
if (width < 64 || width > 8192 || height < 64 || height > 8192 || distance < 2 || distance > 32) throw new GradleException('Invalid reference dimensions/distance')
def instance = file(providers.gradleProperty('referenceRunDir').orElse("${buildDir}/run/${renderer}").get())
def sourceSha = providers.gradleProperty('referenceSourceSha').orElse(providers.environmentVariable('METALLUM_SOURCE_SHA')).orElse('unrecorded').get()

repositories { maven { url 'https://api.modrinth.com/maven' } }
dependencies {
    minecraft "com.mojang:minecraft:${versions.getProperty('minecraft_version')}"
    implementation "net.fabricmc:fabric-loader:${versions.getProperty('loader_version')}"
    implementation "net.fabricmc.fabric-api:fabric-api:${e2eVersions.getProperty('fabric_api_version')}"
    compileOnly "maven.modrinth:iris:${versions.getProperty('iris_version')}"
    productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${e2eVersions.getProperty('fabric_api_version')}"
    if (renderer != 'vanilla') productionRuntimeMods "maven.modrinth:sodium:${versions.getProperty('sodium_version')}"
    if (renderer == 'iris') productionRuntimeMods "maven.modrinth:iris:${versions.getProperty('iris_version')}"
}
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
sourceSets.main.java {
    srcDir('../minecraft-e2e/src/main/java')
    include('com/metallum/reference/**', 'com/metallum/e2e/WorldSnapshot.java', 'com/metallum/e2e/RenderQualitySnapshot.java')
}
tasks.named('processResources') {
    inputs.property('referenceSourceSha', sourceSha)
    inputs.file('src/main/java/com/metallum/reference/OpenGlReferenceGameTest.java')
    doLast {
        def driver = file('src/main/java/com/metallum/reference/OpenGlReferenceGameTest.java')
        def identity = [sourceSha: sourceSha,
            driverSha256: java.util.HexFormat.of().formatHex(java.security.MessageDigest.getInstance('SHA-256').digest(driver.bytes))]
        new File(destinationDir, 'reference-build.json').text = groovy.json.JsonOutput.toJson(identity) + '\n'
    }
}

tasks.register('runOpenGlReference', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    dependsOn tasks.named('jar')
    // Deliberately contains no MetalUniversal JAR, native module or Metal mixins.
    mods.from(tasks.named('jar'))
    mods.from(configurations.productionRuntimeMods)
    useXVFB = false
    runDir = instance
    jvmArgs.addAll('-Dfabric.client.gametest', '-Xmx3G',
        "-Dreference.renderer=${renderer}", "-Dreference.output=${evidence.absolutePath}",
        "-Dreference.sourceSha=${sourceSha}", "-Dreference.width=${width}",
        "-Dreference.height=${height}", "-Dreference.distance=${distance}")
    programArgs.addAll('--graphicsBackend', 'OPENGL', '--username', 'ReferencePlayer',
        '--uuid', '8f16930a-42ad-4f9b-9d59-02698f26b145', '--width', width.toString(), '--height', height.toString())
    doFirst {
        if (!(sourceSha ==~ /[0-9a-f]{40}/)) throw new GradleException('Exact referenceSourceSha is required')
        if (profile.renderer != renderer || profile.width != width || profile.height != height || profile.renderDistance != distance) {
            throw new GradleException('Staged reference inputs must match the requested renderer, dimensions and distance')
        }
        instance.mkdirs()
        def options = new File(instance, 'options.txt')
        options.text = 'preferredGraphicsBackend:"opengl"\nstartedCleanly:true\nonboardAccessibility:false\n' +
            "renderDistance:${distance}\nsimulationDistance:12\nmaxFps:120\nenableVsync:false\n" +
            'pauseOnLostFocus:false\nfullscreen:false\n'
    }
}
