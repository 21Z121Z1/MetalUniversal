# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
run-name: ${{ github.ref_name }}
on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Keep release artifacts tied to the current macOS 26 SDK and arm64 ABI.
    # Actual hosted offscreen GPU execution/readback lives in the dedicated
    # hosted-metal workflow; only capabilities requiring a physical/display
    # device remain outside GitHub-hosted runtime acceptance.
    runs-on: macos-26
    env:
      MTL_DEBUG_LAYER: '0'
      MTL_SHADER_VALIDATION: '0'
      MTL_HUD_ENABLED: '0'
      MTLFX_HUD_ENABLED: '0'
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: select latest xcode
        run: |
          set -euo pipefail
          echo "xcode-select current path: $(xcode-select -p)"
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "${LATEST_XCODE}" ]; then
            echo "Selecting latest Xcode: ${LATEST_XCODE}"
            sudo xcode-select -s "${LATEST_XCODE}"
          fi
          echo "xcode-select new path: $(xcode-select -p)"
          echo "swiftc version: $(xcrun -f swiftc)"
          echo "SDK path: $(xcrun --show-sdk-path)"
          echo "MetalFX framework check:"
          ls -la "$(xcrun --show-sdk-path)/System/Library/Frameworks/MetalFX.framework/Headers/" 2>/dev/null || echo "MetalFX headers not found at default SDK path"
          echo "=== MTLFXSpatialScaler.h ==="
          cat "$(xcrun --show-sdk-path)/System/Library/Frameworks/MetalFX.framework/Headers/MTLFXSpatialScaler.h" 2>/dev/null
          echo "=== MTLFXTemporalScaler.h ==="
          cat "$(xcrun --show-sdk-path)/System/Library/Frameworks/MetalFX.framework/Headers/MTLFXTemporalScaler.h" 2>/dev/null
          echo "=== MTLFXFrameInterpolator.h ==="
          cat "$(xcrun --show-sdk-path)/System/Library/Frameworks/MetalFX.framework/Headers/MTLFXFrameInterpolator.h" 2>/dev/null
      - name: build
        # Keep this lane build-focused to avoid duplicating the dedicated
        # hosted offscreen Metal suite. Physical-only MetalFX/presentation
        # harnesses are still compiled by the capability workflow. The HUD is
        # disabled here because encoder-stage counter sampling is unsupported
        # by GitHub's Apple Paravirtual device; HUD semantics are tested in the
        # dedicated metalHudRuntimeTest with an explicit opt-in.
        run: >-
          ./gradlew buildMacNative build
          -x metalFrameGenerationPresentationValidation
          -x metalFxOffscreenValidation
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: metallum
          path: build/libs/

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: metallum
          path: release-artifacts

      - name: resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          MINECRAFT_VERSION="$(sed -n 's/^minecraft_version=//p' gradle.properties | head -n1)"
          MAIN_JAR="$(find release-artifacts -maxdepth 1 -type f -name '*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' | head -n1)"
          if [ -z "${MAIN_JAR}" ]; then
            echo "Could not find main release jar in release-artifacts" >&2
            exit 1
          fi
          if [ -z "${MINECRAFT_VERSION}" ]; then
            echo "Could not resolve minecraft_version from gradle.properties" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=${MINECRAFT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "main_jar=${MAIN_JAR}" >> "$GITHUB_OUTPUT"

      - name: publish to Modrinth
        if: env.MODRINTH_TOKEN != ''
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ env.MODRINTH_TOKEN }}
          project: w79ASAJD
          version: ${{ steps.meta.outputs.version }}
          channel: alpha
          loaders: fabric
          game-versions: ${{ steps.meta.outputs.minecraft_version }}
          files: ${{ steps.meta.outputs.main_jar }}
          dependencies: |
            [{ "project_id": "AANobbMI", "dependency_type": "optional" }]

      - name: create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-artifacts/*
