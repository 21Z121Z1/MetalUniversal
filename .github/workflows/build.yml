# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
run-name: ${{ github.ref_name }}
on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    # Keep release artifacts tied to the current macOS 26 SDK and arm64 ABI.
    # On pull_request this job intentionally tests GitHub's synthetic merge
    # result; candidate-oriented workflows test the exact head separately.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Record CI proof subject
        shell: bash
        run: |
          set -euo pipefail
          subject='candidate-head'
          if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            subject='merge-result'
          fi
          python3 scripts/agent/record_ci_subject.py \
            --proof-subject "$subject" \
            --output build/agent-evidence/ci-subject-build.json
          git bundle create build/agent-evidence/source.bundle HEAD
          git bundle verify build/agent-evidence/source.bundle
      - name: Verify frame evidence contract
        run: |
          python3 scripts/agent/verify_frame_evidence.py --self-test
          python3 -m unittest discover -s scripts/agent -p 'test_frame_*.py'
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: setup jdk
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Cache Gradle state
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: select latest xcode
        run: |
          set -euo pipefail
          echo "xcode-select current path: $(xcode-select -p)"
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "${LATEST_XCODE}" ]; then
            echo "Selecting latest Xcode: ${LATEST_XCODE}"
            sudo xcode-select -s "${LATEST_XCODE}"
          fi
          echo "xcode-select new path: $(xcode-select -p)"
          echo "swiftc version: $(xcrun -f swiftc)"
          echo "SDK path: $(xcrun --show-sdk-path)"
          echo "MetalFX framework check:"
          ls -la "$(xcrun --show-sdk-path)/System/Library/Frameworks/MetalFX.framework/Headers/" 2>/dev/null || echo "MetalFX headers not found at default SDK path"
          echo "=== MTLFXSpatialScaler.h ==="
          cat "$(xcrun --show-sdk-path)/System/Library/Frameworks/MetalFX.framework/Headers/MTLFXSpatialScaler.h" 2>/dev/null
          echo "=== MTLFXTemporalScaler.h ==="
          cat "$(xcrun --show-sdk-path)/System/Library/Frameworks/MetalFX.framework/Headers/MTLFXTemporalScaler.h" 2>/dev/null
          echo "=== MTLFXFrameInterpolator.h ==="
          cat "$(xcrun --show-sdk-path)/System/Library/Frameworks/MetalFX.framework/Headers/MTLFXFrameInterpolator.h" 2>/dev/null
      - name: Preserve SDK declaration authority
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/agent/record_sdk_contract.py --output build/agent-evidence/sdk-api-contract.txt
      - name: Verify shipping pipeline compilation from native and JVM threads
        shell: bash
        env:
          # The dedicated native HUD tasks retain their startup/toggle tests.
          MTL_HUD_ENABLED: '0'
          MTL_HUD_ENCODER_TIMING_ENABLED: '0'
          MTLFX_HUD_ENABLED: '0'
          METALLUM_PSO_COMPILE_HOP: '0'
        run: |
          set -euo pipefail
          ./gradlew --no-daemon buildMacNative
          xcrun swiftc -O -target arm64-apple-macosx14.0 \
            -framework Foundation -framework Metal \
            src/test/native/MetalShippingPipelineAbiSmokeTest.swift \
            -o "$RUNNER_TEMP/metallum-shipping-abi-probe"
          # Both native phases and the fresh-process JVM background-thread
          # sequence are mandatory. A signal or nonzero exit fails the job;
          # a partial PASS marker can never authorize skipping another test.
          "$RUNNER_TEMP/metallum-shipping-abi-probe" \
            src/main/resources/natives/macos/libmetallum.dylib \
            2>&1 | tee build/agent-evidence/shipping-abi-threading-probe.log
          grep -Fq SHIPPING_PIPELINE_C_ABI_PASS build/agent-evidence/shipping-abi-threading-probe.log
          grep -Fq SHIPPING_PIPELINE_BACKGROUND_THREAD_C_ABI_PASS build/agent-evidence/shipping-abi-threading-probe.log
          java --enable-native-access=ALL-UNNAMED \
            "-XX:ErrorFile=$(pwd)/build/agent-evidence/hs_err_pid%p.log" \
            .github/ci/JvmPsoThreadingProbe.java \
            "$(pwd)/src/main/resources/natives/macos/libmetallum.dylib" \
            2>&1 | tee build/agent-evidence/jvm-pso-threading-probe.log
          grep -Fq JVM_PSO_BACKGROUND_THREAD_PASS build/agent-evidence/jvm-pso-threading-probe.log
      - name: build
        # Ordinary build tests include the mandatory JVM PSO smoke. Additional
        # hosted GPU readbacks run in metal-capabilities; physical presentation
        # and MetalFX visual acceptance remain separate release evidence.
        run: |
          set -euo pipefail
          xcrun --sdk iphoneos --show-sdk-path
          ./gradlew buildMacNative build \
            -Pmetallum.hsErrDir=agent-evidence \
            -x metalFrameGenerationPresentationValidation \
            -x metalFxOffscreenValidation
          test -s src/main/resources/natives/ios/libmetallum.dylib
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path('src/main/resources/natives/ios')
          image = root / 'libmetallum.dylib'
          receipt = json.loads((root / 'libmetallum-build-identity.json').read_text())
          if receipt.get('platform') != 'ios' or receipt.get('target') != 'arm64-apple-ios14.0':
              raise SystemExit('iOS native build identity has the wrong platform or target')
          if receipt.get('nativeSha256') != hashlib.sha256(image.read_bytes()).hexdigest():
              raise SystemExit('iOS native image hash does not match its build identity')
          PY
      - name: capture JVM crash evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jvm-crash-evidence-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            build/agent-evidence/
            hs_err_pid*.log
          if-no-files-found: ignore
      - name: Preserve CI proof identity
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-ci-identity-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            build/agent-evidence/ci-subject-build.json
            build/agent-evidence/source.bundle
            build/agent-evidence/sdk-api-contract.txt
            build/agent-evidence/*threading-probe.log
            build/agent-evidence/hs_err_pid*.log
            build/test-results/
            build/reports/tests/
          if-no-files-found: error
      - name: capture build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: metallum-${{ github.sha }}
          retention-days: 14
          path: build/libs/

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - name: checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: download build artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: metallum-${{ github.sha }}
          path: release-artifacts

      - name: resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          MINECRAFT_VERSION="$(sed -n 's/^minecraft_version=//p' gradle.properties | head -n1)"
          MAIN_JAR="$(find release-artifacts -maxdepth 1 -type f -name '*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' | head -n1)"
          if [ -z "${MAIN_JAR}" ]; then
            echo "Could not find main release jar in release-artifacts" >&2
            exit 1
          fi
          if [ -z "${MINECRAFT_VERSION}" ]; then
            echo "Could not resolve minecraft_version from gradle.properties" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=${MINECRAFT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "main_jar=${MAIN_JAR}" >> "$GITHUB_OUTPUT"

      - name: publish to Modrinth
        if: env.MODRINTH_TOKEN != ''
        uses: cloudnode-pro/modrinth-publish@3870f66007063f03fb70118ca9eddbc09a4ba666 # v2
        with:
          token: ${{ env.MODRINTH_TOKEN }}
          project: w79ASAJD
          version: ${{ steps.meta.outputs.version }}
          channel: alpha
          loaders: fabric
          game-versions: ${{ steps.meta.outputs.minecraft_version }}
          files: ${{ steps.meta.outputs.main_jar }}
          dependencies: |
            [{ "project_id": "AANobbMI", "dependency_type": "optional" }]

      - name: create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-artifacts/*
