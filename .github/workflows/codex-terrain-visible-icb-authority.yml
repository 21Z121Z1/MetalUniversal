name: Codex terrain visible ICB authority

on:
  push:
    branches:
      - codex/terrain-visible-icb-authority-fix-staging-20260829

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply visible ICB authority patch
        run: python3 .github/ci/patch_terrain_visible_icb_authority.py
      - name: Validate authority contracts
        run: |
          ./gradlew --no-daemon compileJava compileTestJava test \
            --tests com.metallum.client.metal.render.Metal4TerrainVisibleIcbAuthorityContractTest \
            --tests com.metallum.client.metal.render.Metal4TerrainVisibleIcbContractTest \
            --tests com.metallum.client.metal.render.TerrainVisibleDrawPlanTest \
            --console=plain
      - name: Build native bridge
        run: ./gradlew --no-daemon buildMacNative --console=plain
      - name: Commit validated product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/java/com/metallum/client/metal/render/MetalRenderPass.java \
                  src/test/java/com/metallum/client/metal/render/Metal4TerrainVisibleIcbAuthorityContractTest.java
          git commit -m 'fix(terrain): route visible GPU ICB through real draw authority'
          git push origin HEAD:${GITHUB_REF_NAME}
