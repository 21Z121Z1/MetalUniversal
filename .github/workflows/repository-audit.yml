              }

              private static <T> T foreignResource(Class<T> type) {
                  return type.cast(Proxy.newProxyInstance(type.getClassLoader(), new Class<?>[]{type},
                          (proxy, method, args) -> {
                              throw new AssertionError("Foreign resource must not be accessed: " + method.getName());
                          }));
