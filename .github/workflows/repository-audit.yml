name: Bounded repository audit

on:
  push:
    branches: [agent/metaluniversal-system-convergence-20260920]
    paths: ['.github/workflows/repository-audit.yml']

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Materialize exact reference for this investigation
        run: |
          set -euo pipefail
          SRC="$(bash scripts/minecraft-reference.sh --print-path)"
          mkdir -p "$RUNNER_TEMP/reference-audit"
          cp "$(dirname "$SRC")/REFERENCE_INFO.txt" "$RUNNER_TEMP/reference-audit/"
          tar -czf "$RUNNER_TEMP/reference-audit/sources.tar.gz" -C "$SRC" com/mojang net/minecraft/client
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-audit-inputs
          path: ${{ runner.temp }}/reference-audit/
          if-no-files-found: error
          retention-days: 2

  native-diagnosis:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      MTL_DEBUG_LAYER: '0'
      MTL_SHADER_VALIDATION: '0'
      MTL_HUD_ENABLED: '0'
      MTL_HUD_ENCODER_TIMING_ENABLED: '0'
      MTLFX_HUD_ENABLED: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Build shipping native module
        run: ./gradlew --no-daemon buildMacNative
      - name: Compare direct FFM with the shipping bridge
        run: |
          mkdir -p build/native-diagnosis
          git rev-parse HEAD > build/native-diagnosis/source-sha.txt
          set +e
          java --enable-native-access=ALL-UNNAMED -XX:ErrorFile="$PWD/build/native-diagnosis/direct-hs_err_pid%p.log" \
            .github/ci/JvmPsoThreadingProbe.java "$PWD/src/main/resources/natives/macos/libmetallum.dylib" \
            > build/native-diagnosis/direct.log 2>&1
          echo "direct_ffm_exit=$?" > build/native-diagnosis/exits.txt
          NSZombieEnabled=YES ./gradlew --no-daemon --stacktrace test \
            --tests com.metallum.client.metal.render.MetalNativeBridgeRenderPipelineSmokeTest \
            -Pmetallum.hsErrDir=native-diagnosis -x buildIOSNative -x buildIOSSpvc \
            > build/native-diagnosis/zombie.log 2>&1
          echo "shipping_bridge_zombie_exit=$?" >> build/native-diagnosis/exits.txt
          cat build/native-diagnosis/exits.txt
          echo 'Diagnostic outcomes only. These runs do not replace required CI gates.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-diagnosis
          path: |
            build/native-diagnosis/
            build/test-results/
            build/reports/tests/
          if-no-files-found: error
          retention-days: 2
