          src/test/java/com/metallum/client/metal/render/MetalTextureBindingContractTest.java 16f9b5157308a5e21ee937f4002279a94b81ee5b
          src/test/java/com/metallum/client/metal/render/TerrainGpuVisibilityProbeContractTest.java 196465fccaf14aa75fce090adc98b1dc73b9d10d'''
          for line in expected.splitlines():
