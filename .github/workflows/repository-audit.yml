          src/main/java/com/metallum/client/metal/render/MetalRenderPass.java f239396aa063b490a5604f33456fbf6c0cb3fb31
          src/test/java/com/metallum/client/metal/render/IrisMetalCenterDepthSamplerTest.java 1bf74118e83494b2614d6d734de02233ada0754e
          src/test/java/com/metallum/client/metal/render/IrisMetalExternalLevelSamplerTest.java 67d69e31d974da5b0234c8bb78723a2be720bb5a
