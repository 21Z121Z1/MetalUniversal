name: Bounded repository audit

on:
  push:
    branches: [agent/metaluniversal-system-convergence-20260920]
    paths: ['.github/workflows/repository-audit.yml']

permissions:
  contents: read

jobs:
  reviewed-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply the reviewed patch after its failing regression
        env:
          TARGET: agent/metaluniversal-system-convergence-20260920
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = b765b6a3622ec064172f10d07eddf4f5ac9b11cc
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/repository-audit.yml
          mkdir -p "$RUNNER_TEMP/contract-audit"
          python3 - "$RUNNER_TEMP/contract-audit/product.patch" <<'PY'
          import base64, hashlib, pathlib, sys, zlib
          data = zlib.decompress(base64.b64decode(''''''))
          assert hashlib.sha256(data).hexdigest() == '6d88cb6f0265c8e70814d7460d58a6c1d53e02ab6872a0b0359aeee1a371aae9'
          pathlib.Path(sys.argv[1]).write_bytes(data)
          PY
          patch="$RUNNER_TEMP/contract-audit/product.patch"
          testfile=src/test/java/com/metallum/client/metal/render/MetalGpuBufferFrontendContractTest.java
          git apply --check "$patch"
          git apply --include="$testfile" "$patch"
          set +e
          ./gradlew --no-daemon test --tests com.metallum.client.metal.render.MetalGpuBufferFrontendContractTest \
            -x buildMacNative -x buildIOSNative -x buildIOSSpvc > "$RUNNER_TEMP/contract-audit/before.log" 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          p = pathlib.Path('build/test-results/test/TEST-com.metallum.client.metal.render.MetalGpuBufferFrontendContractTest.xml')
          root = ET.parse(p).getroot()
          failures = root.findall('.//failure')
          assert len(failures) == 2, ET.tostring(root)
          assert all('ClassCastException' in str(f.attrib) + (f.text or '') for f in failures)
          PY
          cp build/test-results/test/TEST-com.metallum.client.metal.render.MetalGpuBufferFrontendContractTest.xml "$RUNNER_TEMP/contract-audit/before.xml"
          rm "$testfile"
          git apply --index "$patch"
          git diff --cached --check
          ./gradlew --no-daemon test -x buildMacNative -x buildIOSNative -x buildIOSSpvc \
            > "$RUNNER_TEMP/contract-audit/after.log" 2>&1
          cp -R build/test-results "$RUNNER_TEMP/contract-audit/after-results"
          git config user.name '21Z121Z1'
          git config user.email '89170834+21Z121Z1@users.noreply.github.com'
          git commit -m 'fix(render): use RenderPearl buffer and binding contracts'
          git push origin "HEAD:refs/heads/$TARGET"
          git rev-parse HEAD > "$RUNNER_TEMP/contract-audit/result-sha.txt"
          git bundle create "$RUNNER_TEMP/contract-audit/reviewed-result.bundle" HEAD ^0b90ce1a7d11a3a71a78c140487fc837f0c8e541
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-contract-result
          path: ${{ runner.temp }}/contract-audit/
          if-no-files-found: error
          retention-days: 2

  independent-native-control:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      MTL_DEBUG_LAYER: '0'
      MTL_SHADER_VALIDATION: '0'
      MTL_HUD_ENABLED: '0'
      MTL_HUD_ENCODER_TIMING_ENABLED: '0'
      MTLFX_HUD_ENABLED: '0'
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Compare an Apple-only pipeline outside and inside the JVM
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apple-control"
          cd "$RUNNER_TEMP/apple-control"
          cat > Control.m <<'OBJC'
          #import <Metal/Metal.h>
          #import <AppKit/AppKit.h>
          #include <stdio.h>
          int control(int appkit) {
              @autoreleasepool {
                  if (appkit) [NSApplication sharedApplication];
                  id<MTLDevice> device = MTLCreateSystemDefaultDevice();
                  if (!device) return 2;
                  NSError *error = nil;
                  NSString *source = @"#include <metal_stdlib>\nusing namespace metal;\nvertex float4 v(uint i [[vertex_id]]) { return float4(0,0,0,1); }\nfragment float4 f() { return float4(1,0,0,1); }\n";
                  id<MTLLibrary> library = [device newLibraryWithSource:source options:nil error:&error];
                  if (!library) { NSLog(@"library: %@", error); return 3; }
                  MTLRenderPipelineDescriptor *descriptor = [MTLRenderPipelineDescriptor new];
                  descriptor.vertexFunction = [library newFunctionWithName:@"v"];
                  descriptor.fragmentFunction = [library newFunctionWithName:@"f"];
                  descriptor.colorAttachments[0].pixelFormat = MTLPixelFormatRGBA8Unorm;
                  id<MTLRenderPipelineState> pipeline = [device newRenderPipelineStateWithDescriptor:descriptor error:&error];
                  NSLog(@"device=%@ pipeline=%@ error=%@", device.name, pipeline, error);
                  return pipeline ? 0 : 4;
              }
          }
          #ifdef EXECUTABLE
          int main(void) { return control(0); }
          #endif
          OBJC
          cat > Call.java <<'JAVA'
          import java.lang.foreign.*;
          public class Call {
              public static void main(String[] args) throws Throwable {
                  System.load(args[0]);
                  var handle = Linker.nativeLinker().downcallHandle(
                          SymbolLookup.loaderLookup().find("control").orElseThrow(),
                          FunctionDescriptor.of(ValueLayout.JAVA_INT, ValueLayout.JAVA_INT));
                  int result = (int) handle.invokeExact(Integer.parseInt(args[1]));
                  System.exit(result);
              }
          }
          JAVA
          xcrun clang -fobjc-arc -framework Metal -framework AppKit -dynamiclib Control.m -o libcontrol.dylib
          xcrun clang -fobjc-arc -framework Metal -framework AppKit -DEXECUTABLE Control.m -o control
          javac Call.java
          set +e
          ./control > native.log 2>&1
          echo "native=$?" > exits.txt
          java --enable-native-access=ALL-UNNAMED -XX:ErrorFile=jvm-hs_err_pid%p.log Call "$PWD/libcontrol.dylib" 0 > jvm.log 2>&1
          echo "jvm=$?" >> exits.txt
          java -XstartOnFirstThread --enable-native-access=ALL-UNNAMED -XX:ErrorFile=first-thread-hs_err_pid%p.log Call "$PWD/libcontrol.dylib" 0 > first-thread.log 2>&1
          echo "first_thread=$?" >> exits.txt
          java -XstartOnFirstThread --enable-native-access=ALL-UNNAMED -XX:ErrorFile=appkit-hs_err_pid%p.log Call "$PWD/libcontrol.dylib" 1 > appkit.log 2>&1
          echo "appkit=$?" >> exits.txt
          cat exits.txt
          echo 'This diagnostic does not replace any required product gate.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-apple-control
          path: ${{ runner.temp }}/apple-control/
          if-no-files-found: error
          retention-days: 2
