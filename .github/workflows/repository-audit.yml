name: Bounded repository audit

on:
  push:
    branches: [agent/metaluniversal-system-convergence-20260920]
    paths: ['.github/workflows/repository-audit.yml']

permissions:
  contents: read

jobs:
  reviewed-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Reproduce the frontend buffer failure
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/contract-audit"
          test "$(git rev-parse HEAD^)" = 8896dc0ac779975d8099a71175b07e4424967fd2
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/repository-audit.yml
          cat > src/test/java/com/metallum/client/metal/render/MetalGpuBufferFrontendContractTest.java <<'JAVA'
          package com.metallum.client.metal.render;

          import com.mojang.renderpearl.api.buffers.GpuBuffer;
          import com.mojang.renderpearl.backend.common.BaseGpuBuffer;
          import org.junit.jupiter.api.Test;

          import java.lang.foreign.MemorySegment;

          import static org.junit.jupiter.api.Assertions.*;

          class MetalGpuBufferFrontendContractTest {
              @Test
              void frontendCanValidateWrappedBufferWithoutNativeInitialization() {
                  // The wrapped-handle constructor does not allocate or dereference GPU memory.
                  // This opaque identity must not be submitted to Metal or released by this test.
                  GpuBuffer buffer = new MetalGpuBuffer(null, GpuBuffer.USAGE_VERTEX, 64L,
                          MemorySegment.ofAddress(1L));
                  BaseGpuBuffer frontendBuffer = (BaseGpuBuffer) buffer;
                  assertEquals(64L, frontendBuffer.size());
                  assertEquals(GpuBuffer.USAGE_VERTEX, frontendBuffer.usage());
                  assertDoesNotThrow(frontendBuffer::checkCanBeUsed);
              }

              @Test
              void frontendRejectsBufferWithoutLiveBacking() {
                  GpuBuffer buffer = new MetalGpuBuffer(null, GpuBuffer.USAGE_VERTEX, 64L,
                          MemorySegment.NULL);
                  BaseGpuBuffer frontendBuffer = (BaseGpuBuffer) buffer;
                  assertTrue(frontendBuffer.isClosed());
                  assertThrows(IllegalStateException.class, frontendBuffer::checkCanBeUsed);
              }
          }
          JAVA
          set +e
          ./gradlew --no-daemon test --tests com.metallum.client.metal.render.MetalGpuBufferFrontendContractTest \
            -x buildMacNative -x buildIOSNative -x buildIOSSpvc > "$RUNNER_TEMP/contract-audit/before.log" 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          p = pathlib.Path('build/test-results/test/TEST-com.metallum.client.metal.render.MetalGpuBufferFrontendContractTest.xml')
          root = ET.parse(p).getroot()
          failures = root.findall('.//failure')
          assert len(failures) == 2, ET.tostring(root)
          assert all('ClassCastException' in str(f.attrib) + (f.text or '') for f in failures)
          PY
          cp build/test-results/test/TEST-com.metallum.client.metal.render.MetalGpuBufferFrontendContractTest.xml "$RUNNER_TEMP/contract-audit/before.xml"
      - name: Apply and verify the reviewed source delta
        env:
          TARGET: agent/metaluniversal-system-convergence-20260920
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          p = Path('src/main/java/com/metallum/client/metal/render/MetalGpuBuffer.java')
          t = p.read_text().replace('import com.mojang.renderpearl.api.buffers.GpuBufferSlice;', 'import com.mojang.renderpearl.api.buffers.GpuBufferSlice;\nimport com.mojang.renderpearl.backend.common.BaseGpuBuffer;')
          t = t.replace('public class MetalGpuBuffer implements GpuBuffer,', 'public class MetalGpuBuffer extends BaseGpuBuffer implements')
          t = t.replace('    private final int usage;\n    private final long size;\n', '')
          assert t.count('        this.usage = usage;\n        this.size = size;\n') == 2
          t = t.replace('        this.device = device;\n        this.usage = usage;\n        this.size = size;', '        super(usage, size);\n        this.device = device;')
          a = t.index('    @Override\n    public long size()')
          b = t.index('    ByteBuffer sliceStorage', a)
          t = t[:a] + '''    @Override
              public void checkCanBeUsed() {
                  if (isClosed()) {
                      throw new IllegalStateException("Metal buffer is closed");
                  }
              }

          ''' + t[b:]
          p.write_text(t)
          for p in Path('src').rglob('*.java'):
              t = p.read_text()
              if 'MetalRenderPass.TextureViewAndSampler' not in t and 'MetalRenderPass.@Nullable TextureViewAndSampler' not in t and p.name != 'MetalRenderPass.java':
                  continue
              t = t.replace('MetalRenderPass.@Nullable TextureViewAndSampler', '@Nullable TextureViewAndSampler').replace('MetalRenderPass.TextureViewAndSampler', 'TextureViewAndSampler')
              if p.name == 'MetalRenderPass.java':
                  t = t.replace('    record TextureViewAndSampler(GpuTextureView textureView, GpuSampler sampler) {\n    }\n', '')
                  t = t.replace('instanceof com.mojang.renderpearl.util.TextureViewAndSampler pair', 'instanceof TextureViewAndSampler pair')
              t = re.sub(r'(?<!attachment)(?<!depthAttachment)\.textureView\(\)', '.view()', t)
              imp = 'import com.mojang.renderpearl.util.TextureViewAndSampler;\n'
              if imp not in t:
                  i = t.index('\nimport ') + 1
                  t = t[:i] + imp + t[i:]
              p.write_text(t)
          p = Path('src/main/java/com/metallum/client/metal/render/MetalRenderPass.java')
          t = p.read_text().replace('import com.mojang.renderpearl.api.textures.GpuSampler;', 'import com.mojang.renderpearl.api.textures.GpuSampler;\nimport com.mojang.renderpearl.api.textures.GpuTexture;')
          t = t.replace('''            TextureViewAndSampler next = new TextureViewAndSampler(textureView, sampler);
                      TextureViewAndSampler previous = samplers.put(name, next);
                      commandEncoder.flushPendingClear((MetalGpuTexture) textureView.texture());''', '''            validateTextureBinding(device, textureView, sampler, name);
                      commandEncoder.flushPendingClear((MetalGpuTexture) textureView.texture());
                      TextureViewAndSampler next = new TextureViewAndSampler(textureView, sampler);
                      TextureViewAndSampler previous = samplers.put(name, next);''')
          t = t.replace('''            if (samplers.remove(name) != null) {
                          terrainBindingChanged();''', '''            if (samplers.remove(name) != null) {
                          markDescriptorDirty(name);
                          terrainBindingChanged();''')
          pos = t.index('    @Override\n    public void setUniform(', t.index('    public void bindTexture'))
          t = t[:pos] + '''    static void validateTextureBinding(
                      final MetalDevice device,
                      final @Nullable GpuTextureView view,
                      final @Nullable GpuSampler sampler,
                      final String name
              ) {
                  if (!(view instanceof MetalGpuTextureView metalView)
                          || !(metalView.texture() instanceof MetalGpuTexture texture)
                          || !(sampler instanceof MetalGpuSampler metalSampler)
                          || !texture.isOwnedBy(device)
                          || !metalSampler.isOwnedBy(device)
                          || (texture.usage() & GpuTexture.USAGE_TEXTURE_BINDING) == 0
                          || metalView.isClosed() || texture.isClosed() || metalSampler.isClosed()) {
                      throw new IllegalStateException(
                              "Texture binding '" + name + "' is absent, stale, or owned by another backend/device");
                  }
              }

          ''' + t[pos:]
          t = t.replace('''            if (VALIDATION && textureBinding.view().isClosed()) {
                          throw new IllegalStateException("Sampler " + binding.name() + " texture view has been closed");
                      }
          ''', '''            validateTextureBinding(device, textureBinding.view(), textureBinding.sampler(), binding.name());
          ''')
          p.write_text(t)
          p = Path('src/main/java/com/metallum/client/metal/render/IrisMetalCustomTextures.java')
          t = p.read_text()
          a = t.index('        if (!(view instanceof MetalGpuTextureView metalView)', t.index('    static TextureViewAndSampler checkedExternalBinding('))
          b = t.index('\n    }', a)
          t = t[:a] + '''        MetalRenderPass.validateTextureBinding(device, view, sampler, "Iris external " + label);
                  return new TextureViewAndSampler(view, sampler);''' + t[b:]
          p.write_text(t)
          p = Path('src/test/java/com/metallum/client/metal/render/TerrainGpuVisibilityProbeContractTest.java')
          t = p.read_text()
          a = t.index('    @Test\n    void invalidOrUnavailableNativeProbeInputsFallbackBeforeDispatch()')
          b = t.index('    @Test', a + 10)
          method = t[a:b].replace('invalidOrUnavailableNativeProbeInputsFallbackBeforeDispatch', 'invalidNativeProbeInputsReturnBeforeDispatch')
          t = (t[:a] + t[b:]).replace('import com.metallum.client.metal.render.bridge.MetalNativeBridge;\n', '')
          p.write_text(t)
          p.with_name('MetalNativeBridgeTerrainVisibilityContractTest.java').write_text('''package com.metallum.client.metal.render;

          import com.metallum.client.metal.render.bridge.MetalNativeBridge;
          import org.junit.jupiter.api.Test;
          import org.junit.jupiter.api.condition.EnabledOnOs;
          import org.junit.jupiter.api.condition.OS;

          import java.lang.foreign.MemorySegment;

          import static org.junit.jupiter.api.Assertions.assertEquals;
          import static org.junit.jupiter.api.Assertions.assertTrue;

          @EnabledOnOs(OS.MAC)
          class MetalNativeBridgeTerrainVisibilityContractTest {
          ''' + method + '}\n')
          p.with_name('MetalTextureBindingContractTest.java').write_text('''package com.metallum.client.metal.render;

          import com.mojang.renderpearl.api.textures.GpuSampler;
          import com.mojang.renderpearl.api.textures.GpuTextureView;
          import org.junit.jupiter.api.Test;

          import java.lang.reflect.Proxy;

          import static org.junit.jupiter.api.Assertions.assertThrows;

          class MetalTextureBindingContractTest {
              @Test
              void foreignBackendIsRejectedBeforeResourceAccess() {
                  GpuTextureView view = foreignResource(GpuTextureView.class);
                  GpuSampler sampler = foreignResource(GpuSampler.class);
                  assertThrows(IllegalStateException.class, () ->
