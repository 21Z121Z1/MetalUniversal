name: Bounded repository audit
on:
  push:
    branches: [agent/metaluniversal-system-convergence-20260920]
    paths: ['.github/workflows/repository-audit.yml']
permissions:
  contents: read
jobs:
  strict-native:
    runs-on: macos-26
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      MTL_DEBUG_LAYER: '0'
      MTL_SHADER_VALIDATION: '0'
      MTL_HUD_ENABLED: '0'
      MTL_HUD_ENCODER_TIMING_ENABLED: '0'
      MTLFX_HUD_ENABLED: '0'
      METALLUM_HOSTED_METAL_OFFSCREEN: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare the reviewed regression and source delta
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = e6d9116dfabd12d919f338eb32b1d67afd780164
          mkdir -p build/contract-audit
          python3 - <<'PY'
          from pathlib import Path
          import os, subprocess, textwrap
          p=Path('src/test/java/com/metallum/client/metal/render/IrisStageInterfaceTest.java')
          t=p.read_text()
          for method in ['reorderedMatrixInterfaceCompilesWithoutAutomaticLocations', 'explicitRangesAndArraysRemainIntact', 'explicitLocationCanLinkDifferentNames']:
              old=f'void {method}() {{'
              assert old in t
              t=t.replace(old,f'void {method}() throws Exception {{')
          old='private static Map<String, Integer> locations(String source, ShaderType stage, boolean inputs) {'
          assert old in t
          t=t.replace(old,old.replace(') {',') throws Exception {'))
          p.write_text(t)
          subprocess.run(['git','add','--',str(p)],check=True)
          # Reuse only commands from the reviewed, fixed source commit, not live PR text.
          text=subprocess.check_output(['git','show','e6d9116dfabd12d919f338eb32b1d67afd780164:.github/workflows/repository-audit.yml'],text=True)
          for name,out in [('Apply the reviewed source delta','apply.sh'),('Run strict shipping contracts','verify.sh')]:
              start=text.index('        run: |\n',text.index('      - name: '+name))+len('        run: |\n')
              end=text.index('\n      - ',start)
              Path(os.environ['RUNNER_TEMP'],out).write_text(textwrap.dedent(text[start:end]))
          PY
          set +e
          ./gradlew --no-daemon test --tests com.metallum.client.metal.render.IrisStageInterfaceTest \
            -x buildMacNative -x buildIOSNative -x buildIOSSpvc > build/contract-audit/before.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          cp build/test-results/test/TEST-com.metallum.client.metal.render.IrisStageInterfaceTest.xml build/contract-audit/before.xml
          bash "$RUNNER_TEMP/apply.sh"
      - name: Run strict shipping contracts
        run: bash "$RUNNER_TEMP/verify.sh"
      - name: Commit the verified product delta
        env:
          TARGET: agent/metaluniversal-system-convergence-20260920
        run: |
          set -euo pipefail
          git config user.name '21Z121Z1'
          git config user.email '89170834+21Z121Z1@users.noreply.github.com'
          git commit -m 'fix(native): honor HUD settings and link Iris stage interfaces before RenderPearl'
          git rev-parse HEAD > build/contract-audit/result-sha.txt
          git bundle create build/contract-audit/result.bundle HEAD ^9b12f0e577c900b421217ef5c7b97dc5f4aaf4bf
          git push origin "HEAD:refs/heads/$TARGET"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strict-native-result
          path: |
            build/contract-audit/
            build/agent-evidence/
            build/test-results/
            build/reports/tests/
          retention-days: 2
          if-no-files-found: error
