name: Bounded repository audit
on:
  push:
    branches: [agent/metaluniversal-system-convergence-20260920]
    paths: ['.github/workflows/repository-audit.yml']
permissions:
  contents: read
jobs:
  strict-native:
    runs-on: macos-26
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      MTL_DEBUG_LAYER: '0'
      MTL_SHADER_VALIDATION: '0'
      MTL_HUD_ENABLED: '0'
      MTL_HUD_ENCODER_TIMING_ENABLED: '0'
      MTLFX_HUD_ENABLED: '0'
      METALLUM_HOSTED_METAL_OFFSCREEN: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply the reviewed source delta
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 9b12f0e577c900b421217ef5c7b97dc5f4aaf4bf
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/repository-audit.yml
          mkdir -p build/contract-audit
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('src/main/native/MetallumNative.swift')
          t=p.read_text()
          a=t.index('    // Pipeline compilation (MTLCompiler XPC scheduling)')
          b=t.index('    static func logMetal4PipelineFallback',a)
          t=t[:a]+t[b:]
          a=t.index('    /// Runs a blocking pipeline-compilation body')
          b=t.index('    static func register(function:',a)
          t=t[:a]+t[b:]
          assert t.count('NativeState.onCompilerThread {')==11
          t=t.replace('NativeState.onCompilerThread {','autoreleasepool {')
          for key in ('MTL_HUD_ENABLED','MTLFX_HUD_ENABLED'):
              old=f'setenv("{key}", "1", 1)'
              assert t.count(old)==1
              t=t.replace(old,f'setenv("{key}", "1", 0)')
          t=t.replace('        // Metal\'s HUD subsystem must be enabled before the device is created.', '        // Preserve explicit launcher settings, including HUD=0.\n        // Set the default before the device is created.')
          p.write_text(t)
          p=Path('build.gradle');t=p.read_text()
          a=t.index('\t\t// Capability gate mirrors HostedMetalGradle.init.gradle:')
          b=t.index('\n\t}\n}',a)
          t=t[:a]+t[b:]
          p.write_text(t)
          p=Path('.github/ci/HostedMetalGradle.init.gradle');t=p.read_text()
          t=t.replace('import org.gradle.api.tasks.Exec\n','')
          a=t.index('    // Execute the shipping dylib through dlopen/dlsym')
          b=t.index('    def configureHostedTest',a)
          t=t[:a]+t[b:]
          t=t.replace('            task.dependsOn(project.tasks.named("hostedMetalShippingPipelineAbiSmoke"))\n','')
          a=t.index('            // Until this hosted compiler failure is closed')
          b=t.index('            task.systemProperty "metallum.metal.hud"',a)
          t=t[:a]+t[b:]
          a=t.index('    // Capability-gated JVM GPU suites.')
          b=t.index('    def hostedBridgeFfmSmoke',a)
          t=t[:a]+t[b:]
          a=t.index('    if (jvmPsoSmokeMode == "environment-blocked")')
          t=t[:a]+'}\n'
          t=t.replace('"com.metallum.client.metal.render.MetalNativeBridgeRenderPipelineSmokeTest"','"com.metallum.client.metal.render.MetalNativeBridgeRenderPipelineSmokeTest",\n            "com.metallum.client.metal.render.MetalNativeBridgeTerrainVisibilityContractTest"')
          p.write_text(t)
          p=Path('.github/ci/minecraft-e2e/build.gradle');t=p.read_text()
          t=t.replace('def metallumJarProvider', '''def adapterProfile = providers.gradleProperty("adapterProfile").orElse("adapters").get()
          if (!(adapterProfile in ["vanilla", "adapters"])) {
              throw new GradleException("adapterProfile must be vanilla or adapters")
          }
          def optionalAdapters = adapterProfile == "adapters"

          def metallumJarProvider''',1)
          a='''    productionRuntimeMods "maven.modrinth:sodium:${project.sodium_version}"
              productionRuntimeMods "maven.modrinth:iris:${project.iris_version}"'''
          b='''    if (optionalAdapters) {
                  productionRuntimeMods "maven.modrinth:sodium:${project.sodium_version}"
                  productionRuntimeMods "maven.modrinth:iris:${project.iris_version}"
              }'''
          assert a in t;t=t.replace(a,b)
          t=t.replace('// Minecraft 26.2 uses', '// Minecraft 26.3 uses')
          t=t.replace('    jvmArgs.add("-Dmetallum.ci.e2e=true")', '    jvmArgs.add("-Dmetallum.ci.e2e=true")\n    jvmArgs.add("-Dmetallum.ci.optionalAdapters=${optionalAdapters}")')
          t+='''
          tasks.named("processResources") {
              inputs.property("minecraft_version", project.minecraft_version)
              filesMatching("fabric.mod.json") {
                  expand(minecraft_version: project.minecraft_version)
              }
          }
          '''
          p.write_text(t)
          p=Path('.github/ci/minecraft-e2e/src/main/resources/fabric.mod.json');t=p.read_text();assert '"minecraft": "26.3"' in t;p.write_text(t.replace('"minecraft": "26.3"','"minecraft": "${minecraft_version}"'))
          p=Path('.github/ci/minecraft-e2e/src/main/java/com/metallum/e2e/MetalReadbackControlGameTest.java');t=p.read_text()
          a='''        require(FabricLoader.getInstance().isModLoaded("sodium"), "Sodium was not loaded");
                  require(FabricLoader.getInstance().isModLoaded("iris"), "Iris was not loaded");'''
          b='''        boolean optionalAdapters = Boolean.parseBoolean(System.getProperty("metallum.ci.optionalAdapters", "true"));
                  require(FabricLoader.getInstance().isModLoaded("sodium") == optionalAdapters,
                          "Sodium presence does not match the requested profile");
                  require(FabricLoader.getInstance().isModLoaded("iris") == optionalAdapters,
                          "Iris presence does not match the requested profile");'''
          assert a in t;p.write_text(t.replace(a,b))
          p=Path('.github/ci/minecraft-e2e/src/main/java/com/metallum/e2e/MetalUniversalClientGameTest.java');t=p.read_text()
          a='''        require(sodiumLoaded, "Sodium was not loaded in the production client");
                  require(irisLoaded, "Iris was not loaded in the production client");'''
          b='''        boolean optionalAdapters = Boolean.parseBoolean(System.getProperty("metallum.ci.optionalAdapters", "true"));
                  require(sodiumLoaded == optionalAdapters, "Sodium presence does not match the requested profile");
                  require(irisLoaded == optionalAdapters, "Iris presence does not match the requested profile");'''
          assert a in t;p.write_text(t.replace(a,b))
          expected='''.github/ci/HostedMetalGradle.init.gradle 081c5e37e6fcf76a327121d94d0f8775fe591acf
          .github/ci/minecraft-e2e/build.gradle 3f76ae30d3908e1aa1f5a842e25d8474ef1221a8
          .github/ci/minecraft-e2e/src/main/java/com/metallum/e2e/MetalReadbackControlGameTest.java ec0c8970f8d08100dbbcb2636d386a9c86634fd5
          .github/ci/minecraft-e2e/src/main/java/com/metallum/e2e/MetalUniversalClientGameTest.java b766daa3b5aa0f0f022b78b5656d14c3e64ba2a6
          .github/ci/minecraft-e2e/src/main/resources/fabric.mod.json 2cbb902a4e0961f130c3183b6cae8fb78a14432f
          build.gradle ebe15e70d708392d66d34bcca9f60a46ddb72e13
          src/main/native/MetallumNative.swift cc29c7cf0590ae19e46245e55af01592a9752236'''
          for line in expected.splitlines():
              path,sha=line.split()
              actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert actual==sha,(path,actual,sha)
              subprocess.run(['git','add','--',path],check=True)
          PY
          git diff --cached --check
          git diff --cached > build/contract-audit/candidate.patch
      - name: Run strict shipping native and Iris contracts
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace -I .github/ci/HostedMetalGradle.init.gradle \
            buildMacNative hostedMetalCoreIntegrationTest hostedMetalIrisIntegrationTest \
            verifyProductionJarIsolation jar > build/contract-audit/contracts.log 2>&1
          jar="$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -1)"
          ./gradlew --no-daemon -p .github/ci/minecraft-e2e jar \
            -PadapterProfile=vanilla -PmetallumJar="$PWD/$jar" > build/contract-audit/harness.log 2>&1
      - name: Commit the verified product delta
        env:
          TARGET: agent/metaluniversal-system-convergence-20260920
        run: |
          set -euo pipefail
          git config user.name '21Z121Z1'
          git config user.email '89170834+21Z121Z1@users.noreply.github.com'
          git commit -m 'fix(native): honor HUD settings and restore strict JVM GPU gates'
          git rev-parse HEAD > build/contract-audit/result-sha.txt
          git bundle create build/contract-audit/result.bundle HEAD ^9b12f0e577c900b421217ef5c7b97dc5f4aaf4bf
          git push origin "HEAD:refs/heads/$TARGET"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strict-native-result
          path: |
            build/contract-audit/
            build/agent-evidence/
            build/test-results/
            build/reports/tests/
          retention-days: 2
          if-no-files-found: error
