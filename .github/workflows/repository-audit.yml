name: Bounded repository audit
on:
  push:
    branches: [agent/metaluniversal-system-convergence-20260920]
    paths: ['.github/workflows/repository-audit.yml']
permissions:
  contents: read
jobs:
  hud-control:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      MTL_DEBUG_LAYER: '0'
      MTL_SHADER_VALIDATION: '0'
      MTL_HUD_ENABLED: '0'
      MTL_HUD_ENCODER_TIMING_ENABLED: '0'
      MTLFX_HUD_ENABLED: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Compare explicit HUD configuration with the shipping override
        run: |
          set -euo pipefail
          mkdir -p build/hud-control
          git rev-parse HEAD > build/hud-control/source-sha.txt
          git bundle create build/hud-control/source.bundle HEAD ^0b90ce1a7d11a3a71a78c140487fc837f0c8e541
          ./gradlew --no-daemon buildMacNative > build/hud-control/baseline-build.log 2>&1
          set +e
          java --enable-native-access=ALL-UNNAMED -XX:ErrorFile="$PWD/build/hud-control/before-hs_err_pid%p.log" \
            .github/ci/JvmPsoThreadingProbe.java "$PWD/src/main/resources/natives/macos/libmetallum.dylib" > build/hud-control/before.log 2>&1
          echo "before=$?" > build/hud-control/exits.txt
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/native/MetallumNative.swift')
          t = p.read_text()
          for key in ('MTL_HUD_ENABLED', 'MTLFX_HUD_ENABLED'):
              old = f'setenv("{key}", "1", 1)'
              assert t.count(old) == 1
              t = t.replace(old, f'setenv("{key}", "1", 0)')
          p.write_text(t)
          PY
          git diff > build/hud-control/candidate.patch
          ./gradlew --no-daemon buildMacNative > build/hud-control/candidate-build.log 2>&1
          set +e
          java --enable-native-access=ALL-UNNAMED -XX:ErrorFile="$PWD/build/hud-control/after-hs_err_pid%p.log" \
            .github/ci/JvmPsoThreadingProbe.java "$PWD/src/main/resources/natives/macos/libmetallum.dylib" > build/hud-control/after.log 2>&1
          echo "after=$?" >> build/hud-control/exits.txt
          ./gradlew --no-daemon test --tests com.metallum.client.metal.render.MetalNativeBridgeRenderPipelineSmokeTest \
            --tests com.metallum.client.metal.render.MetalNativeBridgeTerrainVisibilityContractTest \
            -Pmetallum.hsErrDir=hud-control -x buildIOSNative -x buildIOSSpvc > build/hud-control/contracts.log 2>&1
          echo "contracts=$?" >> build/hud-control/exits.txt
          cat build/hud-control/exits.txt
          echo 'Diagnostic outcomes only. This job does not replace required product gates.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hud-control
          path: |
            build/hud-control/
            build/test-results/
          retention-days: 2
          if-no-files-found: error
