          p = Path('.github/workflows/minecraft-26.3-migration.yml')
          t = p.read_text()
          a = t.index('          cat > "$RUNNER_TEMP/non-metal-tests.gradle"')
          b = t.index('          ./gradlew', a)
          t = (t[:a] + t[b:]).replace('            -I "$RUNNER_TEMP/non-metal-tests.gradle" \\\n', '')
          p.write_text(t)
          p = Path('.github/workflows/unified-eval-static.yml')
          p.write_text(p.read_text().replace('com.metallum.client.metal.render.TerrainGpuVisibilityProbeContractTest.invalidOrUnavailableNativeProbeInputsFallbackBeforeDispatch', 'com.metallum.client.metal.render.MetalNativeBridgeTerrainVisibilityContractTest'))
          for p in Path('src').rglob('*.java'):
              t = p.read_text()
              imp = 'import com.mojang.renderpearl.util.TextureViewAndSampler;\n'
