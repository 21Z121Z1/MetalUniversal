name: Probe Minecraft 26.3 compiler migration surface

on:
  push:
    branches:
      - agent/minecraft-26.3-renderpearl-migration-20260916
    paths:
      - '.github/workflows/agent-26.3-compiler-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Resolve canonical agent route
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/agent/context.py --task "migrate MetalUniversal backend host ABI to Minecraft 26.3 RenderPearl canonical SPIR-V and push constants"
          python3 scripts/agent/checkpoint.py init \
            --task "Minecraft 26.3 RenderPearl backend migration" \
            --hypothesis "Consuming RenderPearl BackendRenderPipeline.CreateInfo directly and treating push constants as a dedicated Metal binding removes the obsolete Mojang Vulkan frontend dependency without changing native Metal execution semantics" \
            --next-command "./gradlew --no-daemon compileJava -x buildIOSNative"
      - name: Show compiler and pipeline usages
        shell: bash
        run: |
          set -euo pipefail
          echo '=== MetalCrossShaderCompiler usages ==='
          grep -RInE 'MetalCrossShaderCompiler\.' src/main src/test || true
          echo '=== IrisMetalPipelineOverrides usages ==='
          grep -RInE 'IrisMetalPipelineOverrides|compileWithIrisOverride|getOrCompilePipeline|precompilePipeline|clearPipelineCache' src/main src/test || true
          echo '=== RenderPass backend methods ==='
          grep -RInE 'setPipeline\(|setUniform\(|pushConstants\(|bindTexture\(' src/main/java/com/metallum/client/metal/render/MetalRenderPass.java src/main/java/com/metallum/client/metal/render || true
          echo '=== old shader compiler dependencies ==='
          grep -RInE 'IntermediaryShaderModule|VulkanBindGroupLayout|GlslCompiler|GlslPreprocessor|ShaderCompilationKey' src/main/java src/test || true
