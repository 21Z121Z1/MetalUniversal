name: metal-capabilities

on:
  workflow_dispatch:
  push:
    branches:
      - integration/iris-metal-next
      - 'agent/**'
  pull_request:
    branches:
      - integration/iris-metal-next

permissions:
  contents: read
  actions: read

env:
  METALLUM_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: metal-capabilities-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloud-contract:
    name: cloud program contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.METALLUM_SOURCE_SHA }}

      - name: Verify cloud-first program invariants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p agent-evidence
          python3 scripts/agent/verify_cloud_program.py \
            --verify-remote-branches \
            --expected-source-sha "$METALLUM_SOURCE_SHA" \
            --output agent-evidence/cloud-contract.json
          python3 -m json.tool docs/agent/cloud-first-metal-program.json >/dev/null
          python3 -m json.tool docs/agent/branch-migration-matrix.json >/dev/null
          python3 -m json.tool agent-evidence/cloud-contract.json >/dev/null

      - name: Preserve cloud contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-program-contract-${{ github.run_attempt }}
          path: agent-evidence/
          if-no-files-found: error

  hosted-metal:
    name: hosted macOS Metal execution
    needs: cloud-contract
    runs-on: macos-26
    env:
      MTL_DEBUG_LAYER: '0'
      MTL_SHADER_VALIDATION: '0'
      MTL_HUD_ENABLED: '0'
      MTL_HUD_ENCODER_TIMING_ENABLED: '0'
      MTLFX_HUD_ENABLED: '0'
      METALLUM_HOSTED_METAL_OFFSCREEN: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.METALLUM_SOURCE_SHA }}

      - name: Describe hosted Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p agent-evidence
          test "$(git rev-parse HEAD)" = "$METALLUM_SOURCE_SHA"
          test "$(uname -m)" = "arm64"
          uname -a | tee "$RUNNER_TEMP/uname.txt"
          sw_vers | tee "$RUNNER_TEMP/sw-vers.txt"
          system_profiler SPHardwareDataType SPDisplaysDataType > "$RUNNER_TEMP/system-profiler.txt" || true
          python3 - <<'PY'
          import json, os, platform, subprocess
          def capture(*cmd):
              try:
                  return subprocess.check_output(cmd, text=True, stderr=subprocess.STDOUT).strip()
              except Exception as exc:
                  return f"unavailable: {exc}"
          source_sha = os.environ.get("METALLUM_SOURCE_SHA", "unknown").lower()
          data = {
              "source_sha": source_sha,
              "runner_os": os.environ.get("RUNNER_OS", "unknown"),
              "runner_arch": os.environ.get("RUNNER_ARCH", "unknown"),
              "machine": platform.machine(),
              "macos": capture("sw_vers", "-productVersion"),
              "xcode": capture("xcodebuild", "-version"),
          }
          with open("agent-evidence/environment.json", "w", encoding="utf-8") as handle:
              json.dump(data, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

      - name: Compile and execute real Metal compute/readback probe
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -O -framework Metal \
            .github/ci/HostedMetalCapabilityProbe.swift \
            -o "$RUNNER_TEMP/metallum-hosted-metal-probe"
          "$RUNNER_TEMP/metallum-hosted-metal-probe" \
            | tee "$RUNNER_TEMP/hosted-metal-probe.log"
          grep -Fq HOSTED_METAL_GPU_PROBE_PASS "$RUNNER_TEMP/hosted-metal-probe.log"
          python3 - <<'PY'
          import json, os
          data = {
              "source_sha": os.environ.get("METALLUM_SOURCE_SHA", "unknown").lower(),
              "metal_runtime": True,
              "offscreen_compute_readback": True,
              "hosted_apple_silicon": True,
              "metal4": None,
              "residency_set": None,
              "presentation_windowserver": False,
              "metalfx_temporal": None,
              "gpu_counter_sampling": False,
              "final_physical_acceptance_required": True,
          }
          with open("agent-evidence/capabilities.json", "w", encoding="utf-8") as handle:
              json.dump(data, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Verify current canonical evaluation contracts
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew scripts/agent/verify_unified_eval.sh
          bash scripts/agent/verify_unified_eval.sh
          python3 scripts/agent/verify_metal4_main_hotpath.py \
            --output agent-evidence/p1-hotpath.json

      - name: Compile shipping native path and physical-only harnesses
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --stacktrace \
            -I .github/ci/HostedMetalGradle.init.gradle \
            buildMacNative \
            verifyProductionJarIsolation \
            metalFrameGenerationLifecycleTest \
            compileMetalMrtSmokeTest \
            compileMetal4PipelineSmokeTest \
            compileMetal4PipelinePathTest \
            compileMetalFxOffscreenValidation \
            compileMetalFxPerformanceValidation \
            compileMetalFrameGenerationPresentationValidation

      - name: Execute hosted Metal MRT and shipping Metal 4 fallback contracts
        shell: bash
        run: |
          set -euo pipefail
          test -x build/metal-tests/MetalMRTSmokeTest
          MTL_DEBUG_LAYER=0 MTL_SHADER_VALIDATION=0 \
            build/metal-tests/MetalMRTSmokeTest \
            | tee "$RUNNER_TEMP/metal-mrt.log"
          ./gradlew --stacktrace metal4PipelineSmokeTest metal4PipelinePathTest

      - name: Execute shipping Java to FFM to Swift GPU integration suites
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --stacktrace \
            -I .github/ci/HostedMetalGradle.init.gradle \
            hostedMetalCoreIntegrationTest \
            hostedMetalIrisIntegrationTest

      - name: Require hosted shipping integration suites to execute cleanly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import json
          import xml.etree.ElementTree as ET

          task_names = [
              "hostedMetalCoreIntegrationTest",
              "hostedMetalIrisIntegrationTest",
          ]
          summary = {}
          for task in task_names:
              files = glob.glob(f"build/test-results/{task}/TEST-*.xml")
              if not files:
                  raise SystemExit(f"{task} produced no JUnit XML")
              tests = skipped = failures = errors = 0
              for path in files:
                  root = ET.parse(path).getroot()
                  tests += int(root.attrib.get("tests", 0))
                  skipped += int(root.attrib.get("skipped", 0))
                  failures += int(root.attrib.get("failures", 0))
                  errors += int(root.attrib.get("errors", 0))
              executed = tests - skipped
              print(f"{task}: tests={tests} executed={executed} skipped={skipped} failures={failures} errors={errors}")
              if tests == 0 or executed == 0 or skipped != 0 or failures != 0 or errors != 0:
                  raise SystemExit(f"{task} did not fully execute cleanly")
              summary[task] = {
                  "tests": tests,
                  "executed": executed,
                  "skipped": skipped,
                  "failures": failures,
                  "errors": errors,
              }

          with open("agent-evidence/hosted-shipping-tests.json", "w", encoding="utf-8") as handle:
              json.dump(summary, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

      - name: Emit correctness, activation and fail-closed stage decision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, time, urllib.parse, urllib.request

          source_sha = os.environ.get("METALLUM_SOURCE_SHA", "").strip().lower()
          if re.fullmatch(r"[0-9a-f]{40}", source_sha) is None:
              raise SystemExit(f"invalid METALLUM_SOURCE_SHA: {source_sha!r}")

          correctness = {
              "source_sha": source_sha,
              "raw_metal_compute_readback": "pass",
              "native_mrt_smoke": "pass",
              "metal4_shipping_path_contract": "pass",
              "layerless_device_presentation_contract": "pass",
              "shipping_java_ffm_swift_core_gpu": "pass",
              "shipping_iris_gpu": "pass",
              "p1_hotpath_static_contract": "pass",
              "physical_only_harnesses_compile": "pass",
          }
          with open("agent-evidence/correctness.json", "w", encoding="utf-8") as handle:
              json.dump(correctness, handle, indent=2, sort_keys=True)
              handle.write("\n")

          activation = {
              "source_sha": source_sha,
              "raw_hosted_metal_gpu": "active-and-readback-verified",
              "offscreen_presentation_state": "absent-by-layer-contract",
              "shipping_java_ffm_swift_gpu": "active-and-tests-executed",
              "shipping_iris_gpu": "active-and-tests-executed",
              "required_hosted_tests_skipped": 0,
              "silent_fallback_detected": False,
          }
          with open("agent-evidence/activation.json", "w", encoding="utf-8") as handle:
              json.dump(activation, handle, indent=2, sort_keys=True)
              handle.write("\n")

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ.get("GH_TOKEN", "")
          required_external = [
              "Minecraft 26.2 production client E2E",
              "Unified eval verification",
              "29/merge",
          ]

          def load_latest_required():
              query = urllib.parse.urlencode({"head_sha": source_sha, "event": "pull_request", "per_page": 100})
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/actions/runs?{query}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              latest = {}
              for run in payload.get("workflow_runs", []):
                  name = run.get("name")
                  if name in required_external and name not in latest:
                      latest[name] = {
                          "run_id": run.get("id"),
                          "status": run.get("status"),
                          "conclusion": run.get("conclusion"),
                          "head_sha": run.get("head_sha"),
                      }
              return latest

          latest = {}
          external_complete = False
          failure_reason = None
          for attempt in range(81):
              latest = load_latest_required()
              malformed = [
                  name for name, run in latest.items()
                  if run.get("head_sha") != source_sha
              ]
              if malformed:
                  failure_reason = f"source SHA mismatch for required workflows: {malformed}"
                  break

              failed = [
                  name for name in required_external
                  if name in latest
                  and latest[name].get("status") == "completed"
                  and latest[name].get("conclusion") != "success"
              ]
              if failed:
                  failure_reason = f"required workflows failed: {failed}"
                  break

              external_complete = all(
                  name in latest
                  and latest[name].get("head_sha") == source_sha
                  and latest[name].get("status") == "completed"
                  and latest[name].get("conclusion") == "success"
                  for name in required_external
              )
              if external_complete:
                  break
              if attempt < 80:
                  time.sleep(15)

          if not external_complete and failure_reason is None:
              failure_reason = "required exact-head workflows did not all reach success before the bounded decision timeout"

          decision_value = (
              "CLOUD_COMPLETE_FINAL_PHYSICAL_PENDING"
              if external_complete
              else "CLOUD_INCOMPLETE"
          )
          decision = {
              "decision": decision_value,
              "stage": "C0-agent-metal-lab",
              "source_sha": source_sha,
              "cloud_correctness": "pass",
              "hosted_metal_activation": "pass",
              "shipping_abi_gpu_execution": "pass",
              "external_required_workflows": latest,
              "physical_acceptance": "pending",
              "default_enablement_allowed": False,
              "next_cloud_stage_allowed_after_merge": external_complete,
              "failure_reason": failure_reason,
          }
          with open("agent-evidence/decision.json", "w", encoding="utf-8") as handle:
              json.dump(decision, handle, indent=2, sort_keys=True)
              handle.write("\n")
          print(json.dumps(decision, sort_keys=True))
          if not external_complete:
              raise SystemExit(failure_reason)
          PY
          python3 -m json.tool agent-evidence/correctness.json >/dev/null
          python3 -m json.tool agent-evidence/activation.json >/dev/null
          python3 -m json.tool agent-evidence/decision.json >/dev/null

      - name: Preserve Agent Metal Lab evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-metal-lab-${{ github.run_attempt }}
          path: |
            agent-evidence/
            build/agent-evidence/
            build/reports/tests/**
            build/test-results/**
            ${{ runner.temp }}/hosted-metal-probe.log
            ${{ runner.temp }}/metal-mrt.log
          if-no-files-found: warn
