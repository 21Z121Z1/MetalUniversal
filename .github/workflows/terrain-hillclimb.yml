name: Apple Silicon terrain hill climb

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: Repeats per coarse hill-climb candidate
        required: false
        default: '2'
  push:
    branches:
      - experiment/apple-terrain-hillclimb
    paths:
      - 'src/main/java/com/metallum/mixin/sodium/**'
      - 'src/main/java/com/metallum/mixin/terrain/**'
      - 'src/main/java/com/metallum/client/terrain/**'
      - 'src/main/resources/metallum.mixins.json'
      - 'scripts/terrain-hillclimb.py'
      - 'scripts/terrain-scheduler-hillclimb.py'
      - 'scripts/terrain-pressure-hillclimb.py'
      - 'scripts/terrain-scheduler-fine-hillclimb.py'
      - '.github/ci/terrain-bench/**'
      - '.github/workflows/terrain-hillclimb.yml'

permissions:
  contents: read

concurrency:
  group: terrain-hillclimb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terrain-hillclimb:
    name: Sodium terrain / Apple Silicon hill climb
    runs-on: macos-26
    timeout-minutes: 60
    env:
      MTL_DEBUG_LAYER: '0'
      MTL_SHADER_VALIDATION: '0'
      MTL_HUD_ENABLED: '0'
      MTLFX_HUD_ENABLED: '0'
      METALLUM_HOSTED_METAL_OFFSCREEN: 'true'
      GRADLE_OPTS: '-Dorg.gradle.caching=true'

    steps:
      - name: Checkout terrain experiment
        uses: actions/checkout@v6

      - name: Describe Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          sw_vers
          system_profiler SPHardwareDataType SPDisplaysDataType || true
          test "$(uname -m)" = "arm64"
          echo "logical CPUs: $(sysctl -n hw.logicalcpu)"

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle caches
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Build production MetalUniversal JAR
        id: metallum
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew \
            scripts/terrain-hillclimb.py \
            scripts/terrain-scheduler-hillclimb.py \
            scripts/terrain-pressure-hillclimb.py \
            scripts/terrain-scheduler-fine-hillclimb.py
          ./gradlew \
            --build-cache \
            --stacktrace \
            -x buildIOSNative \
            -x buildIOSSpvc \
            jar
          jar="$(find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-validation.jar' \
            -print | head -n 1)"
          test -n "$jar"
          test -s "$jar"
          jar="$(cd "$(dirname "$jar")" && pwd)/$(basename "$jar")"
          unzip -l "$jar" | grep -F 'natives/macos/libmetallum.dylib'
          echo "jar=$jar" >> "$GITHUB_OUTPUT"

      - name: Hill-climb Sodium chunk workers
        shell: bash
        env:
          REPEATS: ${{ github.event.inputs.repeats || '2' }}
        run: |
          set -euo pipefail
          python3 scripts/terrain-hillclimb.py \
            --repo-root "$PWD" \
            --bench-project .github/ci/terrain-bench \
            --metallum-jar "${{ steps.metallum.outputs.jar }}" \
            --repeats "$REPEATS" \
            --min-improvement 0.02 \
            --tail-regression-limit 0.05 \
            --output build/terrain-hillclimb/report.json

      - name: Hill-climb MetalUniversal terrain scheduler
        shell: bash
        env:
          REPEATS: ${{ github.event.inputs.repeats || '2' }}
        run: |
          set -euo pipefail
          worker_report="build/terrain-hillclimb/report.json"
          test -s "$worker_report"
          threads="$(python3 - "$worker_report" <<'PY'
          import json, sys
          print(int(json.load(open(sys.argv[1], encoding='utf-8'))['winner']['threads']))
          PY
          )"
          echo "fixed Sodium worker winner: $threads"
          python3 scripts/terrain-scheduler-hillclimb.py \
            --repo-root "$PWD" \
            --bench-project .github/ci/terrain-bench \
            --metallum-jar "${{ steps.metallum.outputs.jar }}" \
            --threads "$threads" \
            --repeats "$REPEATS" \
            --step 0.02 \
            --max-moves 4 \
            --min-improvement 0.02 \
            --tail-regression-limit 0.05 \
            --output build/terrain-scheduler-hillclimb/report.json

      - name: Hill-climb terrain pressure policy
        shell: bash
        env:
          COARSE_REPEATS: ${{ github.event.inputs.repeats || '2' }}
        run: |
          set -euo pipefail
          worker_report="build/terrain-hillclimb/report.json"
          scheduler_report="build/terrain-scheduler-hillclimb/report.json"
          test -s "$worker_report"
          test -s "$scheduler_report"
          read -r threads build_ratio upload_ratio <<<"$(python3 - "$worker_report" "$scheduler_report" <<'PY'
          import json, sys
          worker = json.load(open(sys.argv[1], encoding='utf-8'))
          scheduler = json.load(open(sys.argv[2], encoding='utf-8'))
          print(int(worker['winner']['threads']),
                float(scheduler['winner']['buildBudgetRatio']),
                float(scheduler['winner']['uploadBudgetRatio']))
          PY
          )"
          repeats="$COARSE_REPEATS"
          if (( repeats < 3 )); then repeats=3; fi
          echo "pressure search: workers=$threads build=$build_ratio upload=$upload_ratio repeats=$repeats"
          python3 scripts/terrain-pressure-hillclimb.py \
            --repo-root "$PWD" \
            --bench-project .github/ci/terrain-bench \
            --metallum-jar "${{ steps.metallum.outputs.jar }}" \
            --threads "$threads" \
            --build-ratio "$build_ratio" \
            --upload-ratio "$upload_ratio" \
            --repeats "$repeats" \
            --step 0.10 \
            --max-moves 2 \
            --min-improvement 0.02 \
            --tail-regression-limit 0.05 \
            --output build/terrain-pressure-hillclimb/report.json

      - name: Fine hill-climb terrain scheduler ratios
        shell: bash
        env:
          COARSE_REPEATS: ${{ github.event.inputs.repeats || '2' }}
        run: |
          set -euo pipefail
          worker_report="build/terrain-hillclimb/report.json"
          scheduler_report="build/terrain-scheduler-hillclimb/report.json"
          pressure_report="build/terrain-pressure-hillclimb/report.json"
          test -s "$worker_report"
          test -s "$scheduler_report"
          test -s "$pressure_report"
          read -r threads build_ratio upload_ratio constrained severe <<<"$(python3 - "$worker_report" "$scheduler_report" "$pressure_report" <<'PY'
          import json, sys
          worker = json.load(open(sys.argv[1], encoding='utf-8'))
          scheduler = json.load(open(sys.argv[2], encoding='utf-8'))
          pressure = json.load(open(sys.argv[3], encoding='utf-8'))
          print(int(worker['winner']['threads']),
                float(scheduler['winner']['buildBudgetRatio']),
                float(scheduler['winner']['uploadBudgetRatio']),
                float(pressure['winner']['constrainedMultiplier']),
                float(pressure['winner']['severeMultiplier']))
          PY
          )"
          repeats="$COARSE_REPEATS"
          if (( repeats < 3 )); then repeats=3; fi
          echo "fine ratio search: workers=$threads start=$build_ratio/$upload_ratio pressure=$constrained/$severe repeats=$repeats"
          python3 scripts/terrain-scheduler-fine-hillclimb.py \
            --repo-root "$PWD" \
            --bench-project .github/ci/terrain-bench \
            --metallum-jar "${{ steps.metallum.outputs.jar }}" \
            --threads "$threads" \
            --start-build-ratio "$build_ratio" \
            --start-upload-ratio "$upload_ratio" \
            --constrained-multiplier "$constrained" \
            --severe-multiplier "$severe" \
            --repeats "$repeats" \
            --step 0.01 \
            --max-moves 2 \
            --min-improvement 0.015 \
            --tail-regression-limit 0.05 \
            --output build/terrain-scheduler-fine-hillclimb/report.json

      - name: Summarize recommendation
        if: always()
        shell: bash
        run: |
          set -u
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          def load(path):
              p = Path(path)
              return json.loads(p.read_text(encoding='utf-8')) if p.is_file() else None

          worker = load('build/terrain-hillclimb/report.json')
          coarse = load('build/terrain-scheduler-hillclimb/report.json')
          pressure = load('build/terrain-pressure-hillclimb/report.json')
          fine = load('build/terrain-scheduler-fine-hillclimb/report.json')

          print('## Apple Silicon terrain hill climb')
          print()
          if worker:
              w = worker['winner']
              print(f"- Worker winner: {w['threads']} (median {w['medianChunkRenderElapsedMillis']:.3f} ms)")
          else:
              print('- Worker phase: no report')
          if coarse:
              w = coarse['winner']
              print(f"- Coarse scheduler: build={w['buildBudgetRatio']:.4f}, upload={w['uploadBudgetRatio']:.4f}, median={w['medianChunkRenderElapsedMillis']:.3f} ms")
              print(f"- Coarse vs scheduler-disabled control: {w['relativeMedianImprovementVsSchedulerDisabledControl'] * 100:.2f}%")
          else:
              print('- Coarse scheduler phase: no report')
          if pressure:
              w = pressure['winner']
              probe = pressure['causalProbeNoPressureThrottle']
              print(f"- Pressure winner: constrained={w['constrainedMultiplier']:.4f}, severe={w['severeMultiplier']:.4f}, median={w['medianChunkRenderElapsedMillis']:.3f} ms")
              print(f"- Pressure winner vs current pressure: {w['relativeMedianImprovementVsCurrentPressure'] * 100:.2f}%")
              print(f"- No-throttle (1,1) causal probe vs current pressure: {probe['relativeMedianImprovementVsCurrentPressure'] * 100:.2f}%")
              print(f"- No-throttle (1,1) vs scheduler-disabled control: {probe['relativeMedianImprovementVsSchedulerDisabledControl'] * 100:.2f}%")
          else:
              print('- Pressure phase: no report')
          if fine:
              w = fine['winner']
              print(f"- Fine scheduler: build={w['buildBudgetRatio']:.4f}, upload={w['uploadBudgetRatio']:.4f}, median={w['medianChunkRenderElapsedMillis']:.3f} ms")
              print(f"- Fine improvement vs coarse start: {w['relativeMedianImprovementVsFineStart'] * 100:.2f}%")
              print(f"- Fine vs scheduler-disabled control: {w['relativeMedianImprovementVsSchedulerDisabledControl'] * 100:.2f}%")
              print(f"- Pressure-frame fraction at winner: {w['medianPressureFrameFraction'] * 100:.1f}%")
          else:
              print('- Fine scheduler phase: no report')
          PY
          for report in \
            build/terrain-hillclimb/report.json \
            build/terrain-scheduler-hillclimb/report.json \
            build/terrain-pressure-hillclimb/report.json \
            build/terrain-scheduler-fine-hillclimb/report.json; do
            if [[ -s "$report" ]]; then cat "$report"; fi
          done

      - name: Upload hill-climb evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: terrain-hillclimb-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            build/terrain-hillclimb/**
            build/terrain-scheduler-hillclimb/**
            build/terrain-pressure-hillclimb/**
            build/terrain-scheduler-fine-hillclimb/**
            .github/ci/terrain-bench/build/evidence/**
            .github/ci/terrain-bench/build/run/clientGameTest/logs/latest.log
