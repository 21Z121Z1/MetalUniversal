name: apply-hosted-metal-hud-optout

on:
  workflow_dispatch:
  push:
    branches:
      - ci/hosted-metal-gpu-probe-20260810

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-26
    env:
      MTL_HUD_ENABLED: '0'
      MTLFX_HUD_ENABLED: '0'
      MTL_DEBUG_LAYER: '0'
      MTL_SHADER_VALIDATION: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Respect explicit HUD environment opt-out before MTLDevice creation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main/native/MetallumNative.swift')
          text = path.read_text()
          hud = '        setenv("MTL_HUD_ENABLED", "1", 1)\n'
          fx = '        setenv("MTLFX_HUD_ENABLED", "1", 1)\n'
          if text.count(hud) != 1 or text.count(fx) != 1:
              raise SystemExit(f'expected one HUD and one MetalFX priming line, got {text.count(hud)} and {text.count(fx)}')
          text = text.replace(
              hud,
              '        if getenv("MTL_HUD_ENABLED") == nil {\n'
              '            setenv("MTL_HUD_ENABLED", "1", 1)\n'
              '        }\n',
              1,
          )
          text = text.replace(
              fx,
              '        if getenv("MTLFX_HUD_ENABLED") == nil {\n'
              '            setenv("MTLFX_HUD_ENABLED", "1", 1)\n'
              '        }\n',
              1,
          )
          path.write_text(text)
          PY
          git diff --check
          git diff -- src/main/native/MetallumNative.swift

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Verify shipping native module still builds
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --stacktrace buildMacNative

      - name: Commit HUD opt-out support to experiment branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/native/MetallumNative.swift
          git commit -m 'fix: respect explicit Metal HUD environment opt-out'
          git push origin HEAD:ci/hosted-metal-gpu-probe-20260810
