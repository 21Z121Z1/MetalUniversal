name: apply-hosted-metal-hud-optout

on:
  workflow_dispatch:
  push:
    branches:
      - ci/hosted-metal-gpu-probe-20260810

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-26
    env:
      MTL_HUD_ENABLED: '0'
      MTLFX_HUD_ENABLED: '0'
      MTL_DEBUG_LAYER: '0'
      MTL_SHADER_VALIDATION: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Respect explicit HUD environment opt-out before MTLDevice creation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main/native/MetallumNative.swift')
          text = path.read_text()
          old = '''        // Metal's HUD subsystem must be enabled before the device is created.
          // A mod cannot add MetalHUDEnabled to the host launcher's Info.plist,
          // so prime the equivalent documented environment switch here. The
          // persisted Sodium option supplies the layer request at next startup.
          setenv("MTL_HUD_ENABLED", "1", 1)
          // MetalFX registers its Temporal and Frame Interpolator sections only
          // when this separate switch is present before the effects are built.
          setenv("MTLFX_HUD_ENABLED", "1", 1)
          '''
          new = '''        // Metal's HUD subsystem must be enabled before the device is created.
          // A mod cannot add MetalHUDEnabled to the host launcher's Info.plist,
          // so prime the equivalent documented environment switch here. Respect
          // an explicit environment value: hosted/paravirtual GPUs can execute
          // normal Metal work but may not support the HUD's encoder counter
          // sampling, and forcing the HUD on there aborts device consumers.
          if getenv("MTL_HUD_ENABLED") == nil {
              setenv("MTL_HUD_ENABLED", "1", 1)
          }
          // MetalFX registers its Temporal and Frame Interpolator sections only
          // when this separate switch is present before the effects are built.
          if getenv("MTLFX_HUD_ENABLED") == nil {
              setenv("MTLFX_HUD_ENABLED", "1", 1)
          }
          '''
          if old not in text:
              raise SystemExit('expected HUD priming block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- src/main/native/MetallumNative.swift

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Verify shipping native module still builds
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --stacktrace buildMacNative

      - name: Commit HUD opt-out support to experiment branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/native/MetallumNative.swift
          git commit -m 'fix: respect explicit Metal HUD environment opt-out'
          git push origin HEAD:ci/hosted-metal-gpu-probe-20260810
