name: Apply Minecraft 26.3 import cleanup

on:
  push:
    branches:
      - agent/minecraft-26.3-renderpearl-migration-20260916
    paths:
      - scripts/agent/migrate_minecraft_263_import_cleanup.py
      - .github/workflows/agent-minecraft-26.3-import-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - run: python3 scripts/agent/migrate_minecraft_263_import_cleanup.py
      - run: git diff --check
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refactor: finish RenderPearl import and interface cleanup'
          git push origin HEAD:${GITHUB_REF_NAME}
