name: codex/explicit-attachment-actions

on:
  push:
    branches:
      - codex/placement-heap-integration-staging-20260830
    paths:
      - .github/workflows/codex-explicit-attachment-actions.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/placement-heap-integration-staging-20260830
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply explicit V3 attachment action seam
        run: |
          set -euo pipefail
          python3 scripts/agent/codex_explicit_attachment_actions.py
          git diff --check
          ./gradlew test \
            --tests com.metallum.client.metal.render.MetalExplicitAttachmentActionContractTest \
            --tests com.metallum.client.metal.render.IrisMetalPostChainCompilationTest
      - name: Commit result and remove one-shot tooling
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/metallum/client/metal/render/MetalCommandEncoder.java \
                  src/main/java/com/metallum/client/metal/render/MetalRenderPass.java \
                  src/test/java/com/metallum/client/metal/render/MetalExplicitAttachmentActionContractTest.java
          git commit -m "feat(metal): add private V3 attachment action seam"
          git rm .github/workflows/codex-explicit-attachment-actions.yml \
                 scripts/agent/codex_explicit_attachment_actions.py
          git commit -m "chore(ci): remove attachment action tooling"
          git push origin HEAD:codex/placement-heap-integration-staging-20260830
