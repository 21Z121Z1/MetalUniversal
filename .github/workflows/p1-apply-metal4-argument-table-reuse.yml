name: P1 apply Metal 4 argument-table reuse

on:
  push:
    branches:
      - feature/metal4-main-production

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: feature/metal4-main-production
          fetch-depth: 0

      - name: Apply audited one-shot patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('src/main/native/MetallumNative.swift')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
          '''    // Validation-only A/B for MTL4 argument-table lifetime. This is outside the
              // MetalFX conditional block because the MTL4 main queue is shared by the
              // platform native builds.
              static let freshComputeArgumentTables = ProcessInfo.processInfo.environment[
                  "METALLUM_METALFX_FRESH_COMPUTE_ARGUMENT_TABLE"
              ] == "1"
          ''',
          '',
          'remove obsolete fresh-compute validation switch'
          )

          replace_once(
          '''@available(macOS 26.0, iOS 26.0, *)
          private final class Metal4MainQueueContext {
              // Each compute dispatch needs an argument-table snapshot that will not be
              // mutated by a later dispatch before the command buffer executes. Eight
              // tables cover the current clear/transparency/CUTOUT/hand/fused chain plus
              // the legacy camera+merge probe, while remaining bounded per slot.
              private static let computeArgumentTableCount = 8
          ''',
          '''@available(macOS 26.0, iOS 26.0, *)
          private final class Metal4MainQueueContext {
              // Metal 4 collects argument-table bindings when a draw or dispatch is
              // encoded. A table can therefore be rebound between commands and shared
              // by multiple encoders. Keep one long-lived table per stage family and
              // in-flight slot; the three slots isolate concurrent GPU submissions.
          ''',
          'replace per-dispatch snapshot premise'
          )

          replace_once(
          '''    private final class Slot {
                  let commandBuffer: MTL4CommandBuffer
                  let allocator: MTL4CommandAllocator
                  let vertexArguments: MTL4ArgumentTable
                  let fragmentArguments: MTL4ArgumentTable
                  let computeArgumentTables: [MTL4ArgumentTable]
                  var renderArgumentTables: [(vertex: MTL4ArgumentTable, fragment: MTL4ArgumentTable)] = []
                  let uniformBuffer: MTLBuffer
                  var uniformOffset = 0
                  var nextComputeArgumentTable = 0
                  var nextRenderArgumentTable = 0
                  var state: SlotState = .free

                  init(
                      commandBuffer: MTL4CommandBuffer,
                      allocator: MTL4CommandAllocator,
                      vertexArguments: MTL4ArgumentTable,
                      fragmentArguments: MTL4ArgumentTable,
                      computeArgumentTables: [MTL4ArgumentTable],
                      uniformBuffer: MTLBuffer
                  ) {
                      self.commandBuffer = commandBuffer
                      self.allocator = allocator
                      self.vertexArguments = vertexArguments
                      self.fragmentArguments = fragmentArguments
                      self.computeArgumentTables = computeArgumentTables
                      self.uniformBuffer = uniformBuffer
                  }
              }
          ''',
          '''    private final class Slot {
                  let commandBuffer: MTL4CommandBuffer
                  let allocator: MTL4CommandAllocator
                  let vertexArguments: MTL4ArgumentTable
                  let fragmentArguments: MTL4ArgumentTable
                  let computeArguments: MTL4ArgumentTable
                  let uniformBuffer: MTLBuffer
                  var uniformOffset = 0
                  var state: SlotState = .free

                  init(
                      commandBuffer: MTL4CommandBuffer,
                      allocator: MTL4CommandAllocator,
                      vertexArguments: MTL4ArgumentTable,
                      fragmentArguments: MTL4ArgumentTable,
                      computeArguments: MTL4ArgumentTable,
                      uniformBuffer: MTLBuffer
                  ) {
                      self.commandBuffer = commandBuffer
                      self.allocator = allocator
                      self.vertexArguments = vertexArguments
                      self.fragmentArguments = fragmentArguments
                      self.computeArguments = computeArguments
                      self.uniformBuffer = uniformBuffer
                  }
              }
          ''',
          'collapse slot argument-table pools'
          )

          pattern = re.compile(
              r'''            var computeArgumentTables: \[MTL4ArgumentTable\] = \[\]\n'''
              r'''            for _ in 0\.\.<Self\.computeArgumentTableCount \{\n'''
              r'''                guard let table = try\? device\.makeArgumentTable\(descriptor: tableDescriptor\) else \{\n'''
              r'''                    return nil\n'''
              r'''                \}\n'''
              r'''                computeArgumentTables\.append\(table\)\n'''
              r'''            \}\n'''
              r'''            guard let allocator = try\? device\.makeCommandAllocator\(descriptor: allocatorDescriptor\),\n'''
              r'''                  let commandBuffer = device\.makeCommandBuffer\(\),\n'''
              r'''                  let vertexArguments = try\? device\.makeArgumentTable\(descriptor: tableDescriptor\),\n'''
              r'''                  let fragmentArguments = try\? device\.makeArgumentTable\(descriptor: tableDescriptor\),\n'''
              r'''                  let uniformBuffer = device\.makeBuffer\(length: 65_536, options: \.storageModeShared\) else \{\n'''
              r'''                return nil\n'''
              r'''            \}\n'''
          )
          replacement = '''            guard let allocator = try? device.makeCommandAllocator(descriptor: allocatorDescriptor),
                        let commandBuffer = device.makeCommandBuffer(),
                        let vertexArguments = try? device.makeArgumentTable(descriptor: tableDescriptor),
                        let fragmentArguments = try? device.makeArgumentTable(descriptor: tableDescriptor),
                        let computeArguments = try? device.makeArgumentTable(descriptor: tableDescriptor),
                        let uniformBuffer = device.makeBuffer(length: 65_536, options: .storageModeShared) else {
                      return nil
                  }
                  vertexArguments.label = "Metallum Vertex Arguments \\(index) (Metal 4)"
                  fragmentArguments.label = "Metallum Fragment Arguments \\(index) (Metal 4)"
                  computeArguments.label = "Metallum Compute Arguments \\(index) (Metal 4)"
          '''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'create one compute table per slot: expected one match, got {count}')

          replace_once(
          '''                computeArgumentTables: computeArgumentTables,
          ''',
          '''                computeArguments: computeArguments,
          ''',
          'wire compute table into slot'
          )

          method_pattern = re.compile(
              r'''    func argumentTables\(at index: Int\) -> \(MTL4ArgumentTable, MTL4ArgumentTable\) \{.*?'''
              r'''    func writeClearUniforms\(_ uniforms: MetallumClearUniforms, at slotIndex: Int\) -> \(MTLBuffer, Int\)\? \{''',
              re.S,
          )
          method_replacement = '''    func argumentTables(at index: Int) -> (MTL4ArgumentTable, MTL4ArgumentTable) {
                  let slot = slots[index]
                  return (slot.vertexArguments, slot.fragmentArguments)
              }

              func computeArgumentTable(at index: Int) -> MTL4ArgumentTable {
                  slots[index].computeArguments
              }

              func writeClearUniforms(_ uniforms: MetallumClearUniforms, at slotIndex: Int) -> (MTLBuffer, Int)? {'''
          text, count = method_pattern.subn(method_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'replace argument table accessors: expected one match, got {count}')

          replace_once(
          '''        slot.uniformOffset = 0
                  slot.nextComputeArgumentTable = 0
                  slot.nextRenderArgumentTable = 0
                  slot.allocator.reset()
          ''',
          '''        slot.uniformOffset = 0
                  slot.allocator.reset()
          ''',
          'remove per-frame table cursors'
          )

          forbidden = {
              'freshComputeArgumentTables': 'obsolete validation allocation switch',
              'computeArgumentTables': 'compute table pool',
              'renderArgumentTables': 'render table pool',
              'nextComputeArgumentTable': 'compute table cursor',
              'nextRenderArgumentTable': 'render table cursor',
              'computeArgumentTableCount': 'fixed compute table count',
          }
          for needle, label in forbidden.items():
              if needle in text:
                  raise SystemExit(f'{label} remains after patch: {needle}')

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- src/main/native/MetallumNative.swift

      - name: Commit production patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p1-apply-metal4-argument-table-reuse.yml
          git add src/main/native/MetallumNative.swift
          git diff --cached --check
          git commit -m 'perf(metal4): reuse per-slot argument tables'
          git push origin HEAD:feature/metal4-main-production
