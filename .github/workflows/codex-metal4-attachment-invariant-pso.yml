name: Codex Metal4 attachment-invariant PSO

on:
  push:
    branches:
      - codex/metal4-attachment-invariant-pso-staging-20260829
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/metal4-attachment-invariant-pso-staging-20260829
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply attachment-invariant PSO patch
        run: python3 .github/ci/patch_metal4_attachment_invariant_pso.py
      - name: Validate contract and native toolchain
        run: >-
          ./gradlew test
          --tests com.metallum.client.metal.render.Metal4AttachmentInvariantPipelineContractTest
          buildMacNative --no-daemon
      - name: Check patch hygiene
        run: |
          git diff --check
          git diff --stat
      - name: Commit validated product changes
        run: |
          git config user.name '21Z121Z1'
          git config user.email '89170834+21Z121Z1@users.noreply.github.com'
          git add src/main/java src/test/java
          if git diff --cached --quiet; then
            echo 'no product changes to commit'
            exit 1
          fi
          git commit -m 'perf(metal4): reuse attachment-invariant render pipelines'
          git push origin HEAD:codex/metal4-attachment-invariant-pso-staging-20260829
