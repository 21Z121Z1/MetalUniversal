name: replay-reviewed-codex

on:
  push:
    branches:
      - chatgpt/replay-iris-correctness-20260830
    paths:
      - .github/replay-reviewed-codex.trigger

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: verify pinned baseline
        shell: bash
        env:
          PINNED_BASE: cf4e66250c8fd3bcf6fdf58e00e0cd841052cd58
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$PINNED_BASE")" = "$PINNED_BASE"

      - name: reconstruct reviewed replay
        shell: bash
        run: |
          set -euo pipefail
          cat .github/replay-reviewed/chunk*.b64 | base64 --decode > scripts/agent/replay_reviewed_codex.py
          python3 .github/replay-reviewed/fix-parser.py
          python3 -m py_compile scripts/agent/replay_reviewed_codex.py

      - name: inspect product state after reviewed rollout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, importlib.util, json, zlib
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("reviewed_replay", "scripts/agent/replay_reviewed_codex.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          patches = json.loads(zlib.decompress(base64.b64decode(module.PAYLOAD)).decode("utf-8"))
          for index, patch in enumerate(patches[:-1], 1):
              module.apply_patch(patch)
              print(f"applied reviewed patch {index}/{len(patches)}")
          path = Path("scripts/agent/run_unified_eval_cycle.sh")
          lines = path.read_text(encoding="utf-8").splitlines()
          for needle in ("stage_eval_shader_pack() {", "run_profile_task() {"):
              at = next(i for i, line in enumerate(lines) if line.strip() == needle)
              lo = max(0, at - 5)
              hi = min(len(lines), at + 70)
              print(f"=== {needle} @ {at + 1} ===")
              for number in range(lo, hi):
                  print(f"{number + 1:04d}: {lines[number]}")
          PY
          git diff --check
          false

      - name: commit product diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            build.gradle \
            docs/agent/unified-evaluation-loop.md \
            docs/iris-audit/advanced-optimization-runtime-handoff.md \
            scripts/agent/run_unified_eval_cycle.sh \
            src/main \
            src/test
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(iris): close advanced optimization correctness gaps"
          git push origin "HEAD:${GITHUB_REF_NAME}"
