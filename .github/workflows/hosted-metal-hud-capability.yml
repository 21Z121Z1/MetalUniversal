name: hosted-metal-hud-capability

on:
  workflow_dispatch:
  push:
    branches:
      - ci/hosted-metal-gpu-probe-20260810

concurrency:
  group: hosted-metal-hud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hud-runtime-required:
    name: Metal HUD layer and selector contract required
    runs-on: macos-26
    env:
      MTL_HUD_ENABLED: '1'
      MTLFX_HUD_ENABLED: '1'
      MTL_DEBUG_LAYER: '0'
      MTL_SHADER_VALIDATION: '0'
    steps:
      - uses: actions/checkout@v6
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle
      - name: Execute HUD layer and selector contract
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --stacktrace metalHudRuntimeTest
