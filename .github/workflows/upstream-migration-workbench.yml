name: Upstream migration workbench
on:
  push:
    branches: [agent/upstream-26.3-workbench-20260923]
    paths: [.github/workflows/upstream-migration-workbench.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-workbench-capacity:
    if: github.repository == '21Z121Z1/MetalUniversal' && github.ref == 'refs/heads/agent/upstream-26.3-workbench-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancel redundant builds of this isolated workbench only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: 21Z121Z1/MetalUniversal
          WORKBENCH: agent/upstream-26.3-workbench-20260923
        shell: bash
        run: |
          set -euo pipefail
          # The source-only staging ref and PR branch are deliberately excluded.
          # The fork's general build.yml otherwise consumes macOS slots for every
          # transport-only commit. Never cancel main, upstream, or another agent.
          gh api --method GET "repos/$GH_REPO/actions/runs" -f branch="$WORKBENCH" -f per_page=100 \
            --jq '.workflow_runs[] | select(.head_branch == "agent/upstream-26.3-workbench-20260923") | select(.path == ".github/workflows/build.yml") | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending") | .id' \
            > "$RUNNER_TEMP/workbench-builds.txt"
          while read -r run; do
            [[ -n "$run" ]] || continue
            printf 'Cancel redundant workbench build %s\n' "$run"
            gh api --method POST "repos/$GH_REPO/actions/runs/$run/cancel" || true
          done < "$RUNNER_TEMP/workbench-builds.txt"
