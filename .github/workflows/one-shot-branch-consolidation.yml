name: One-shot branch consolidation

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/one-shot-branch-consolidation.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consolidate branches
        run: python3 scripts/agent/one_shot_branch_consolidation.py
