name: Metal 4 migration acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - feature/metal4-complete-migration
      - fix/metal4-device-session-lifetime
    paths:
      - .github/workflows/apply-metal4-device-session-fix.yml
      - .github/workflows/metal4-migration-ci.yml
      - build.gradle
      - docs/mtl4-api-probe.swift
      - docs/iris-audit/mobilegl-hotpath-current-status.md
      - src/main/**
      - src/test/**

permissions:
  contents: write

concurrency:
  group: metal4-migration-acceptance-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  compile-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply staged device-session patch
        if: github.ref_name == 'fix/metal4-device-session-lifetime'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-metal4-device-session-fix.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == "python3 - <<'PY'") + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          payload = []
          for line in workflow[start:end]:
              payload.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-metal4-device-session-fix.py').write_text('\n'.join(payload) + '\n')
          PY
          python3 /tmp/apply-metal4-device-session-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-metal4-device-session-fix.yml
          git checkout origin/feature/mobilegl-inspired-hotpath -- .github/workflows/metal4-migration-ci.yml
          git add src/main/native/MetallumNative.swift \
            src/main/java/com/metallum/client/metal/render/bridge/MetalNativeBridge.java \
            src/main/java/com/metallum/client/metal/render/MetalFxManager.java \
            src/main/java/com/metallum/client/metal/render/MetalDevice.java \
            .github/workflows/metal4-migration-ci.yml
          git commit -m "fix(metal4): scope native state to device lifetime"
          git push origin HEAD:${GITHUB_REF_NAME}

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Select latest Xcode
        run: |
          set -euo pipefail
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          test -n "${LATEST_XCODE}"
          sudo xcode-select -s "${LATEST_XCODE}"
          xcrun swiftc --version
          xcrun --show-sdk-path --sdk macosx

      - name: Compile native and Java paths
        id: build
        shell: bash
        run: |
          set +e
          chmod +x ./gradlew
          ./gradlew buildMacNative build \
            -x metalFrameGenerationPresentationValidation \
            -x metalFxOffscreenValidation \
            2>&1 | tee /tmp/metal4-migration-build.log
          STATUS=${PIPESTATUS[0]}
          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify build did not modify tracked sources
        id: clean
        if: always()
        shell: bash
        run: |
          set +e
          git diff --exit-code -- \
            build.gradle \
            docs/mtl4-api-probe.swift \
            src/main/java \
            src/main/native \
            src/test
          STATUS=$?
          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write validation receipt
        if: always()
        shell: bash
        env:
          BUILD_STATUS: ${{ steps.build.outputs.status }}
          CLEAN_STATUS: ${{ steps.clean.outputs.status }}
        run: |
          set -euo pipefail
          mkdir -p docs/validation
          BUILD=${BUILD_STATUS:-setup-failed}
          CLEAN=${CLEAN_STATUS:-setup-failed}
          if [ "${BUILD}" = "0" ] && [ "${CLEAN}" = "0" ]; then
            CONCLUSION=PASS
          else
            CONCLUSION=FAIL
          fi
          {
            echo "# Metal 4 migration macOS 26 CI receipt"
            echo
            echo "- Conclusion: **${CONCLUSION}**"
            echo "- Source commit: \`$(git rev-parse HEAD)\`"
            echo "- Workflow trigger: \`${GITHUB_SHA}\`"
            echo "- Runner: \`${RUNNER_OS} / ${RUNNER_ARCH}\`"
            echo "- Xcode path: \`$(xcode-select -p 2>/dev/null || echo unavailable)\`"
            echo "- Swift: \`$(xcrun swiftc --version 2>/dev/null | head -n1 || echo unavailable)\`"
            echo "- SDK: \`$(xcrun --show-sdk-path --sdk macosx 2>/dev/null || echo unavailable)\`"
            echo "- Build status: \`${BUILD}\`"
            echo "- Source-clean status: \`${CLEAN}\`"
            echo "- Command: \`./gradlew buildMacNative build -x metalFrameGenerationPresentationValidation -x metalFxOffscreenValidation\`"
            echo
            echo "## Log tail"
            echo
            echo '```text'
            if [ -f /tmp/metal4-migration-build.log ]; then
              tail -n 240 /tmp/metal4-migration-build.log
            else
              echo "Build log was not created; setup failed before Gradle execution."
            fi
            echo '```'
          } > docs/validation/metal4-migration-ci.md

      - name: Publish validation receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/validation/metal4-migration-ci.md
          if ! git diff --cached --quiet; then
            git commit -m "ci: record Metal 4 macOS 26 acceptance [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Enforce acceptance
        if: always()
        shell: bash
        env:
          BUILD_STATUS: ${{ steps.build.outputs.status }}
          CLEAN_STATUS: ${{ steps.clean.outputs.status }}
        run: |
          test "${BUILD_STATUS:-1}" = "0"
          test "${CLEAN_STATUS:-1}" = "0"
