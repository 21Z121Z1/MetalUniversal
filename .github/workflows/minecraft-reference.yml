name: Minecraft reference smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - integration/metaluniversal
    paths:
      - 'gradle.properties'
      - 'scripts/minecraft-reference.sh'
      - '.github/workflows/minecraft-reference.yml'
      - '.gitignore'

permissions:
  contents: read

env:
  METALLUM_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  minecraft-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.METALLUM_SOURCE_SHA }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Validate and materialize the current Minecraft reference
        run: |
          set -euo pipefail
          bash -n scripts/minecraft-reference.sh
          version="$(sed -n 's/^minecraft_version=//p' gradle.properties | head -n1)"
          test -n "$version"
          expected="$PWD/.minecraft-reference/$version/sources"
          actual="$(bash scripts/minecraft-reference.sh --print-path)"
          test "$actual" = "$expected"
          test -f "$actual/net/minecraft/client/Minecraft.java"
          count="$(find "$actual" -type f -name '*.java' | wc -l | tr -d '[:space:]')"
          test "$count" -ge 500
          grep -Fqx "minecraft_version=$version" ".minecraft-reference/$version/REFERENCE_INFO.txt"
          echo "Verified Minecraft $version reference with $count Java files"
      - name: Ensure generated sources stay untracked
        run: test -z "$(git status --short --untracked-files=all -- .minecraft-reference)"
