name: Minecraft reference smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - convergence/main-unification-20260923
      - codex/vision-cloud-convergence-*
      - codex/frame-evidence-contract-v1-20260920
    paths:
      - 'gradle.properties'
      - 'scripts/minecraft-reference.sh'
      - 'scripts/agent/record_minecraft_ownership.py'
      - '.github/workflows/minecraft-reference.yml'
  pull_request:
    branches:
      - main
      - codex/frame-evidence-contract-v1-20260920
    paths:
      - 'gradle.properties'
      - 'scripts/minecraft-reference.sh'
      - '.github/workflows/minecraft-reference.yml'
      - 'scripts/agent/record_minecraft_ownership.py'
      - '.gitignore'

permissions:
  contents: read

concurrency:
  group: minecraft-reference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  METALLUM_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  minecraft-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.METALLUM_SOURCE_SHA }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Validate and materialize the current Minecraft reference
        run: |
          set -euo pipefail
          bash -n scripts/minecraft-reference.sh
          version="$(sed -n 's/^minecraft_version=//p' gradle.properties | head -n1)"
          test -n "$version"
          expected="$PWD/.minecraft-reference/$version/sources"
          actual="$(bash scripts/minecraft-reference.sh --print-path)"
          test "$actual" = "$expected"
          test -f "$actual/net/minecraft/client/Minecraft.java"
          count="$(find "$actual" -type f -name '*.java' | wc -l | tr -d '[:space:]')"
          test "$count" -ge 500
          grep -Fqx "minecraft_version=$version" ".minecraft-reference/$version/REFERENCE_INFO.txt"
          echo "Verified Minecraft $version reference with $count Java files"
      - name: Ensure generated sources stay untracked
        run: test -z "$(git status --short --untracked-files=all -- .minecraft-reference)"
      - name: Preserve exact ownership reference
        run: |
          python3 scripts/agent/record_minecraft_ownership.py \
            --sources "$(bash scripts/minecraft-reference.sh --print-path)" \
            --output build/agent-evidence/minecraft-ownership
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: minecraft-reference-${{ env.METALLUM_SOURCE_SHA }}-${{ github.run_attempt }}
          path: build/agent-evidence/minecraft-ownership/
          if-no-files-found: error
          retention-days: 7
