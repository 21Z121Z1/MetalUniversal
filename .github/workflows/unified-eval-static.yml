name: Unified eval static

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'docs/agent/**'
      - 'docs/render-contract-validation.md'
      - 'scripts/agent/**'
      - 'src/main/java/com/metallum/client/terrain/**'
      - 'src/main/java/com/metallum/client/validation/**'
      - 'src/main/resources/metallum.mixins.json'
      - '.github/workflows/unified-eval-static.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unified-eval-static-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify unified evaluation harness
        shell: bash
        run: bash scripts/agent/verify_unified_eval.sh
