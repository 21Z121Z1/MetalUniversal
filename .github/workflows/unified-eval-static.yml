name: Unified evaluation contracts

on:
  workflow_dispatch:
  push:
    branches:
      - integration/metaluniversal
  pull_request:
    branches:
      - integration/metaluniversal
    paths:
      - 'AGENTS.md'
      - 'docs/agent/**'
      - 'scripts/agent/**'
      - 'validation/**'
      - 'src/main/java/com/metallum/client/metal/**'
      - 'src/main/java/com/metallum/client/terrain/**'
      - 'src/main/java/com/metallum/client/validation/**'
      - 'src/main/native/**'
      - 'src/test/**'
      - 'build.gradle'
      - '.github/workflows/unified-eval-static.yml'

permissions:
  contents: read

env:
  METALLUM_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: unified-eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  headless-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.METALLUM_SOURCE_SHA }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Record candidate-head identity
        run: |
          python3 scripts/agent/record_ci_subject.py \
            --proof-subject candidate-head \
            --output build/agent-evidence/ci-subject-unified-eval.json
      - name: Verify evidence and renderer contracts
        run: bash scripts/agent/verify_unified_eval.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-eval-${{ github.run_attempt }}
          path: |
            build/agent-evidence/
            build/reports/tests/
            build/test-results/
          if-no-files-found: warn
          retention-days: 14

  macos-native-compile:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.METALLUM_SOURCE_SHA }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile shipping native and Metal 4 validation binaries
        run: |
          ./gradlew --no-daemon \
            buildMacNative \
            compileJava \
            compileMetal4PipelineSmokeTest \
            compileMetal4PipelinePathTest
      - name: Execute JVM-to-FFM native bridge contracts
        run: |
          ./gradlew --no-daemon test \
            --tests com.metallum.client.metal.render.MetalNativeBridgeRenderPipelineSmokeTest \
            --tests com.metallum.client.metal.render.MetalNativeBridgeTerrainVisibilityContractTest
      - name: Verify native artifact and exported ABI
        run: |
          set -euo pipefail
          dylib='src/main/resources/natives/macos/libmetallum.dylib'
          test -s "$dylib"
          file "$dylib"
          otool -L "$dylib"
          nm -gU "$dylib" > build/metallum-native-symbols.txt
          grep -q '_metallum_system_thermal_state' build/metallum-native-symbols.txt
      - name: State evidence boundary
        run: |
          cat <<'BOUNDARY'
          Hosted macOS compilation proves toolchain compatibility, native build integration,
          exported-symbol presence, and the selected JVM-to-FFM contracts for the exact commit.
          Physical Apple Silicon still owns attended presentation, visual parity, stable performance,
          thermals, and MetalFX quality.
          BOUNDARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-eval-native-${{ github.run_attempt }}
          path: |
            src/main/resources/natives/macos/libmetallum.dylib
            build/metallum-native-symbols.txt
            build/reports/tests/
            build/test-results/
            build/reports/problems/
          if-no-files-found: warn
          retention-days: 14
