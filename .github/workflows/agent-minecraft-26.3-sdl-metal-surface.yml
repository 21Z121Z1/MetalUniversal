name: Apply Minecraft 26.3 SDL Metal surface

on:
  push:
    branches:
      - agent/minecraft-26.3-renderpearl-migration-20260916
    paths:
      - scripts/agent/migrate_minecraft_263_sdl_metal_surface.py
      - .github/workflows/agent-minecraft-26.3-sdl-metal-surface.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Apply SDL3 Metal surface migration
        run: python3 scripts/agent/migrate_minecraft_263_sdl_metal_surface.py

      - name: Guard patch hygiene
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- scripts/agent/migrate_minecraft_263_sdl_metal_surface.py .github/workflows/agent-minecraft-26.3-sdl-metal-surface.yml
          ! grep -R --line-number --fixed-strings 'org.lwjgl.glfw' src/main/java src/main/native

      - name: Commit migration patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/main/java src/main/native; then
            echo 'No source changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java src/main/native
          git commit -m 'refactor: migrate Metal presentation to SDL3 surface lifecycle'
          git push origin HEAD:${GITHUB_REF_NAME}
