name: Apply Metal 4 probe fix

on:
  push:
    branches:
      - feature/metal4-complete-migration
    paths:
      - .github/workflows/metal4-probe-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/metal4-complete-migration
          fetch-depth: 0

      - name: Scope indirect dispatch buffer explicitly
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/mtl4-api-probe.swift')
          text = path.read_text()
          old_signature = 'func probeCompute(cenc: MTL4ComputeCommandEncoder, compiler: MTL4Compiler, lib: MTLLibrary) throws {'
          new_signature = '''func probeCompute(
              cenc: MTL4ComputeCommandEncoder,
              compiler: MTL4Compiler,
              lib: MTLLibrary,
              indirectBuffer: MTLBuffer
          ) throws {'''
          if old_signature in text:
              text = text.replace(old_signature, new_signature, 1)
          elif new_signature not in text:
              raise SystemExit('probeCompute signature anchor not found')
          old_use = 'indirectBuffer: buffer.gpuAddress,'
          new_use = 'indirectBuffer: indirectBuffer.gpuAddress,'
          marker = 'func probeCompute('
          start = text.index(marker)
          tail = text[start:]
          if old_use in tail:
              tail = tail.replace(old_use, new_use, 1)
              text = text[:start] + tail
          elif new_use not in tail:
              raise SystemExit('indirect dispatch buffer anchor not found')
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/mtl4-api-probe.swift
          git commit -m "fix(metal4): scope indirect dispatch probe buffer [skip ci]"
          git push origin HEAD:feature/metal4-complete-migration
