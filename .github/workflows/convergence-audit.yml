name: Convergence audit
on:
  workflow_dispatch:
  push:
    branches: [convergence/main-unification-20260923]
    paths: [.github/workflows/convergence-audit.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Capture all branch histories without executing their code
        shell: bash
        env:
          BASE_SHA: 969bf537d4ffd2b99a75f71f17e40fa2b58fd42c
          START_SHA: 289ede73cef93da7ab468f6603c36c20d5e133ba
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags
          export AUDIT_DIR="$RUNNER_TEMP/convergence-audit"
          mkdir -p "$AUDIT_DIR"
          git ls-remote --heads origin > "$AUDIT_DIR/remote-heads.tsv"
          git bundle create "$AUDIT_DIR/source.bundle" --all
          git bundle verify "$AUDIT_DIR/source.bundle"
          gh api "repos/$GITHUB_REPOSITORY" > "$AUDIT_DIR/repository.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls?state=all&per_page=100" > "$AUDIT_DIR/pull-requests.pages.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" > "$AUDIT_DIR/recent-actions.json"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['AUDIT_DIR'])
          base = os.environ['BASE_SHA']
          def git(*args):
              return subprocess.check_output(['git', *args])
          branches = []
          for line in git('for-each-ref', '--format=%(refname)%09%(objectname)', 'refs/remotes/origin/').decode().splitlines():
              ref, tip = line.split('\t')
              if ref == 'refs/remotes/origin/HEAD':
                  continue
              name = ref.removeprefix('refs/remotes/origin/')
              key = hashlib.sha256(name.encode()).hexdigest()[:16]
              directory = root / key
              directory.mkdir()
              merge_bases = git('merge-base', '--all', base, tip).decode().splitlines()
              if len(merge_bases) != 1:
                  raise RuntimeError(f'ambiguous merge bases for {name}: {merge_bases}')
              merge_base = merge_bases[0]
              behind, ahead = map(int, git('rev-list', '--left-right', '--count', f'{base}...{tip}').split())
              paths = git('diff', '--name-only', '-z', merge_base, tip).decode().split('\0')
              paths = [path for path in paths if path]
              unique = git('rev-list', '--reverse', f'{base}..{tip}').decode().splitlines()
              patch = git('diff', '--binary', '--full-index', '--no-ext-diff', merge_base, tip)
              (directory / 'branch.diff').write_bytes(patch)
              (directory / 'candidate.diff').write_bytes(git('diff', '--binary', '--full-index', '--no-ext-diff', tip, base))
              (directory / 'commits.tsv').write_bytes(git('log', '--reverse', '--format=%H%x09%P%x09%aI%x09%s', f'{merge_base}..{tip}'))
              (directory / 'patch-equivalence.txt').write_bytes(git('log', '--left-right', '--cherry-mark', '--format=%m %H %s', f'{base}...{tip}'))
              (directory / 'paths.json').write_text(json.dumps(paths, indent=2) + '\n')
              entry = {'branch': name, 'tip_sha': tip, 'comparison_base': base, 'merge_base': merge_base,
                       'ahead': ahead, 'behind': behind, 'unique_commits': unique, 'changed_paths': paths,
                       'diff_sha256': hashlib.sha256(patch).hexdigest(), 'artifact_directory': key,
                       'design_intents': [], 'verification_evidence': [], 'disposition': 'UNCLASSIFIED',
                       'deletion_eligibility': False}
              branches.append(entry)
          (root / 'inventory.json').write_text(json.dumps({'schema_version': 1, 'base_sha': base,
              'task_start_sha': os.environ['START_SHA'],
              'workflow_commit': git('rev-parse', 'HEAD').decode().strip(), 'branches': branches}, indent=2) + '\n')
          (root / 'dag.txt').write_bytes(git('log', '--all', '--graph', '--decorate', '--format=%h %d %s'))
          print(f'Captured {len(branches)} branches. All remain UNCLASSIFIED; no deletion or semantic acceptance is inferred.')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77ae656e7c1c64a875d1fc6a0a # v7
        with:
          name: convergence-audit-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/convergence-audit/
          if-no-files-found: error
          retention-days: 7
