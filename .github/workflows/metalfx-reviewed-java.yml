name: MetalFX reviewed Java contract transport
on:
  push:
    branches: [agent/metalfx-contract-completion-20260924]
    paths: [.github/workflows/metalfx-reviewed-java.yml]
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == '21Z121Z1/MetalUniversal'
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Apply exact reviewed delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 5d033af4af66dc7d25a7b832fba871ec12c22544
          python3 - <<'PY'
          import base64, hashlib, pathlib, subprocess, zlib
          encoded = ''
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '4cf4241a9bc463154386fce856db5ad5d8c338cbc8b4ae3da828a32a98d3339c'
          path = pathlib.Path('/tmp/metalfx-reviewed.patch')
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', str(path)], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          expected = {'src/main/java/com/metallum/client/metal/render/FrameSynthesisContract.java', 'src/main/java/com/metallum/client/metal/render/MetalFxManager.java', 'src/main/java/com/metallum/client/metal/render/MetalFxMath.java', 'src/main/java/com/metallum/mixin/render/GameRendererMetalFxMixin.java', 'src/test/java/com/metallum/client/metal/render/FrameSynthesisContractTest.java', 'src/test/java/com/metallum/client/metal/render/MetalFxMathTest.java', 'src/test/java/com/metallum/client/metal/render/MetalFxSourceInputContractTest.java', 'src/test/java/com/metallum/client/metal/render/MinecraftMetalFxSourceContractTest.java'}
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()) | set(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          assert actual == expected, actual
          pathlib.Path('/tmp/metalfx-paths.json').write_text(__import__('json').dumps(sorted(expected)))
          PY
      - name: Publish reviewed Git objects without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/metalfx-reviewed-tree
          python3 - <<'PY'
          import json, pathlib, subprocess
          repo = 'repos/21Z121Z1/MetalUniversal'
          def api(endpoint, payload):
              result = subprocess.run(['gh', 'api', '--method', 'POST', repo + endpoint, '--input', '-'], input=json.dumps(payload), text=True, capture_output=True, check=True)
              return json.loads(result.stdout)
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          base_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          paths = json.loads(pathlib.Path('/tmp/metalfx-paths.json').read_text())
          entries = []
          for path in paths:
              blob = api('/git/blobs', {'content': pathlib.Path(path).read_text(), 'encoding': 'utf-8'})['sha']
              assert blob == subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob})
          remove = '.github/workflows/metalfx-reviewed-java.yml'
          entries.append({'path': remove, 'mode': '100644', 'type': 'blob', 'sha': None})
          tree = api('/git/trees', {'base_tree': base_tree, 'tree': entries})['sha']
          subprocess.run(['git', 'add', '--', *paths], check=True)
          subprocess.run(['git', 'rm', '--', remove], check=True)
          assert tree == subprocess.check_output(['git', 'write-tree'], text=True).strip()
          receipt = {'parentSha': parent, 'treeSha': tree, 'entries': entries, 'patchSha256': '4cf4241a9bc463154386fce856db5ad5d8c338cbc8b4ae3da828a32a98d3339c'}
          pathlib.Path('/tmp/metalfx-reviewed-tree/tree.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: metalfx-reviewed-tree-${{ github.sha }}
          path: /tmp/metalfx-reviewed-tree/
          retention-days: 3
          if-no-files-found: error
