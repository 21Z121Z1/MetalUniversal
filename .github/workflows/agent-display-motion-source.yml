name: Agent display motion source evidence

on:
  push:
    branches:
      - agent/metalfx-motion-coverage-26.2

permissions:
  contents: read

jobs:
  extract-display-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/metalfx-motion-coverage-26.2

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Materialize Minecraft 26.2 reference
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          root="$(bash scripts/minecraft-reference.sh --print-path)"
          echo "root=$root" >> "$GITHUB_OUTPUT"

      - name: Extract exact display feature paths
        shell: bash
        env:
          SRC: ${{ steps.ref.outputs.root }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['SRC'])
          wanted = [
              'BlockModelRenderState.java',
              'ItemStackRenderState.java',
              'SubmitNodeCollector.java',
              'SubmitNodeStorage.java',
              'SubmitNodeCollection.java',
              'ModelFeatureRenderer.java',
              'ItemFeatureRenderer.java',
              'BlockModelFeatureRenderer.java',
              'BlockFeatureRenderer.java',
              'SpecialModelRenderer.java',
          ]
          needles = (
              'void submit(', ' submit(', 'new ModelFeatureRenderer.Submit',
              'new ItemFeatureRenderer.Submit', 'new Block', 'submitModel(',
              'submitBlockModel(', 'submitItem(', 'submitText(',
              'submitCustomGeometry(', 'submitSprite(', 'featureType()',
              'FeatureRendererType', 'ModelFeatureRenderer.Submit',
              'ItemFeatureRenderer.Submit', 'RenderType', 'PoseStack',
              'SpecialModelRenderer', 'customGeometry',
          )
          out = {'files': []}
          seen = set()
          for name in wanted:
              matches = sorted(root.rglob(name))
              for path in matches:
                  if path in seen:
                      continue
                  seen.add(path)
                  lines = path.read_text(encoding='utf-8', errors='replace').splitlines()
                  hits = [i for i, line in enumerate(lines) if any(n in line for n in needles)]
                  windows = []
                  for hit in hits:
                      start=max(0,hit-22); end=min(len(lines),hit+23)
                      if windows and start <= windows[-1][1]+1:
                          windows[-1]=(windows[-1][0],max(windows[-1][1],end))
                      else:
                          windows.append((start,end))
                      if len(windows)>=20: break
                  snippets=[]
                  for start,end in windows:
                      snippets.append({
                          'start_line': start+1,
                          'end_line': end,
                          'text': '\n'.join(f'{n:05d}: {lines[n-1]}' for n in range(start+1,end+1)),
                      })
                  out['files'].append({
                      'path': path.relative_to(root).as_posix(),
                      'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                      'snippets': snippets,
                  })
          target=Path('build/agent-evidence/display-motion-source.json')
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps(out, indent=2), encoding='utf-8')
          print('extracted', len(out['files']), 'source files')
          PY

      - name: Upload source evidence
        uses: actions/upload-artifact@v4
        with:
          name: display-motion-source
          path: build/agent-evidence/display-motion-source.json
          if-no-files-found: error
          retention-days: 7
