name: Codex terrain scene frame-slot ring

on:
  push:
    branches:
      - codex/terrain-scene-frame-slot-ring-20260829

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply frame-slot ring patch
        run: python3 .github/ci/patch_terrain_scene_frame_slot_ring.py
      - name: Validate Java/native contracts
        run: |
          ./gradlew --no-daemon compileJava compileTestJava test \
            --tests com.metallum.client.metal.render.TerrainPersistentGpuSceneContractTest \
            --tests com.metallum.client.metal.render.TerrainPersistentGpuSceneNativeContractTest \
            --tests com.metallum.client.metal.render.TerrainPersistentGpuSceneFrameSlotContractTest \
            buildMacNative buildIOSNative --rerun-tasks --console=plain
      - name: Commit validated product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/native/MetallumNative.swift \
                  src/test/java/com/metallum/client/metal/render/TerrainPersistentGpuSceneFrameSlotContractTest.java
          git commit -m 'perf(metal4): reuse terrain visibility scratch by frame slot'
          git push origin HEAD:${GITHUB_REF_NAME}
