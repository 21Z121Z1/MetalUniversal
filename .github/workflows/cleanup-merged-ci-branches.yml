name: Cleanup merged CI branches

on:
  push:
    branches:
      - feature/mobilegl-inspired-hotpath

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and delete superseded CI branches
        shell: bash
        run: |
          set -euo pipefail
          experiment='ci/hosted-metal-gpu-probe-20260810'
          experiment_expected='fcfbdf284511d25c6f67b881503ceba079508588'
          integration='integration/hosted-metal-ci-20260811'
          integration_expected='8a4130a960675547d7ed336dcab58a275fca568e'

          git fetch origin "+refs/heads/${experiment}:refs/remotes/origin/${experiment}"
          git fetch origin "+refs/heads/${integration}:refs/remotes/origin/${integration}"

          test "$(git rev-parse "refs/remotes/origin/${experiment}")" = "$experiment_expected"
          test "$(git rev-parse "refs/remotes/origin/${integration}")" = "$integration_expected"

          git push origin --delete "$experiment"
          git push origin --delete "$integration"

      - name: Remove one-shot cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/cleanup-merged-ci-branches.yml
          git commit -m 'ci: remove one-shot branch cleanup'
          git push origin HEAD:feature/mobilegl-inspired-hotpath
