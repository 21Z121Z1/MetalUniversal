name: trigger reviewed P2 MRT fix

on:
  pull_request:
    branches:
      - integration/iris-metal-next
    paths:
      - '.github/workflows/trigger-p2-mrt-review-fix.yml'
      - '.github/workflows/one-shot-p2-mrt-review-fix.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.ref == 'fix/p2-mrt-store-liveness-review'
    runs-on: macos-26
    env:
      MTL_DEBUG_LAYER: '0'
      MTL_SHADER_VALIDATION: '0'
      MTL_HUD_ENABLED: '0'
      MTL_HUD_ENCODER_TIMING_ENABLED: '0'
      MTLFX_HUD_ENABLED: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/p2-mrt-store-liveness-review
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Apply reviewed renderer and GPU regression patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/one-shot-p2-mrt-review-fix.yml').read_text(encoding='utf-8')
          start = src.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          end = src.index("          # 3) Keep the branch inventory SSOT honest", start)
          lines = src[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          compile(code, '<embedded-renderer-review-fix>', 'exec')
          exec(code, {'__name__': '__main__'})
          PY

      - name: Add executable store-liveness policy contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          encoder = Path('src/main/java/com/metallum/client/metal/render/MetalCommandEncoder.java')
          text = encoder.read_text(encoding='utf-8')
          old = '''                colorStoreKilled[index] = clearColorEnabled[index] != 0\n                        && index < renderColorAttachments.length\n                        && index < renderColorTextures.length\n                        && renderColorAttachments[index] != null\n                        && !MetalPipelineSupport.sameHandle(\n                                renderColorAttachments[index], MemorySegment.NULL)\n                        && renderColorTextures[index] == incomingTexture\n                        && index < deferredColorStorePixelBytes.length\n                        && deferredColorStorePixelBytes[index] > 0;\n'''
          new = '''                boolean samePhysicalAttachment = index < renderColorAttachments.length\n                        && index < renderColorTextures.length\n                        && renderColorAttachments[index] != null\n                        && !MetalPipelineSupport.sameHandle(\n                                renderColorAttachments[index], MemorySegment.NULL)\n                        && renderColorTextures[index] == incomingTexture;\n                colorStoreKilled[index] = canKillPriorColorStore(\n                                clearColorEnabled[index] != 0,\n                                samePhysicalAttachment\n                        )\n                        && index < deferredColorStorePixelBytes.length\n                        && deferredColorStorePixelBytes[index] > 0;\n'''
          if old not in text:
              raise SystemExit('per-slot kill expression not found after reviewed patch')
          text = text.replace(old, new, 1)
          anchor = '''    private static int countKilled(final boolean[] flags) {\n'''
          helper = '''    /**\n     * Returns whether the immediate successor proves one specific MRT slot's\n     * predecessor contents dead. Metal load/store actions are attachment-local:\n     * a clear on a sibling slot is never evidence for this slot.\n     */\n    static boolean canKillPriorColorStore(\n            final boolean successorClearsThisSlot,\n            final boolean samePhysicalAttachment\n    ) {\n        return successorClearsThisSlot && samePhysicalAttachment;\n    }\n\n'''
          if anchor not in text:
              raise SystemExit('store-liveness helper anchor not found')
          text = text.replace(anchor, helper + anchor, 1)
          encoder.write_text(text, encoding='utf-8')

          test = Path('src/test/java/com/metallum/client/metal/render/MetalCommandEncoderStoreLivenessPolicyTest.java')
          test.write_text('''package com.metallum.client.metal.render;\n\nimport org.junit.jupiter.api.Test;\n\nimport static org.junit.jupiter.api.Assertions.assertFalse;\nimport static org.junit.jupiter.api.Assertions.assertTrue;\n\nfinal class MetalCommandEncoderStoreLivenessPolicyTest {\n    @Test\n    void requiresClearOnThisExactAttachment() {\n        assertTrue(MetalCommandEncoder.canKillPriorColorStore(true, true),\n                "same-slot CLEAR of the same attachment proves the predecessor store dead");\n        assertFalse(MetalCommandEncoder.canKillPriorColorStore(false, true),\n                "a sibling MRT CLEAR must not kill this slot when this slot LOADs");\n        assertFalse(MetalCommandEncoder.canKillPriorColorStore(true, false),\n                "CLEAR of another physical attachment cannot kill this predecessor store");\n        assertFalse(MetalCommandEncoder.canKillPriorColorStore(false, false));\n    }\n}\n''', encoding='utf-8')
          PY

      - name: Repair machine-readable branch state and fail-closed evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          matrix_path = Path('docs/agent/branch-migration-matrix.json')
          matrix = json.loads(matrix_path.read_text(encoding='utf-8'))
          branches = matrix['branches']
          by_name = {entry['branch']: entry for entry in branches}

          p3b = by_name.get('feature/p3b-token-paired-performance')
          if p3b is None:
              raise SystemExit('P3b migration entry is missing')
          p3b['role'] = 'subsumed-by-canonical'
          p3b['disposition'] = (
              'subsumed-by-canonical (PR #37); paired harness and activation evidence '
              'now live on integration/iris-metal-next'
          )

          if 'fix/bsl-shadow-attachment-format' not in by_name:
              branches.append({
                  'branch': 'fix/bsl-shadow-attachment-format',
                  'role': 'active-regression-fix',
                  'stages': ['P1', 'P3'],
                  'components': [
                      'exact-SHA BSL shadow attachment-format reproduction lane',
                      'planned authoritative shadow attachment/pipeline format mapping',
                  ],
                  'disposition': (
                      'active PR #38; diagnostic first, renderer fix and exact shader-pack '
                      'gates required before merge'
                  ),
              })
          if 'fix/p2-mrt-store-liveness-review' not in by_name:
              branches.append({
                  'branch': 'fix/p2-mrt-store-liveness-review',
                  'role': 'active-correctness-hotfix',
                  'stages': ['P2', 'C0'],
                  'components': [
                      'per-attachment deferred color-store kill proof for mixed MRT clear/load successors',
                      'IrisGraphBench mixed MRT regression oracle',
                      'fail-closed cloud-program evidence emission and branch-state bookkeeping',
                  ],
                  'disposition': (
                      'review-discovered correctness hotfix; merge only after exact-head '
                      'hosted/physical Metal and production E2E gates pass'
                  ),
              })
          matrix_path.write_text(json.dumps(matrix, indent=1) + '\n', encoding='utf-8')

          verifier = Path('scripts/agent/verify_cloud_program.py')
          text = verifier.read_text(encoding='utf-8')
          constants = 'PRESENTATION_TEST = ROOT / "src/test/java/com/metallum/client/metal/render/MetalDevicePresentationContractTest.java"\n\n\n'
          if constants not in text:
              raise SystemExit('verify_cloud_program constants anchor not found')
          text = text.replace(
              constants,
              'PRESENTATION_TEST = ROOT / "src/test/java/com/metallum/client/metal/render/MetalDevicePresentationContractTest.java"\n\nFAILURE_OUTPUT = None\nFAILURE_SOURCE_SHA = None\n\n\n',
              1,
          )
          old_fail = 'def fail(message: str) -> None:\n    raise SystemExit(f"Cloud Metal program invariant failed: {message}")\n'
          new_fail = '''def fail(message: str) -> None:\n    if FAILURE_OUTPUT is not None:\n        FAILURE_OUTPUT.parent.mkdir(parents=True, exist_ok=True)\n        evidence = {\n            "decision": "cloud-program-contract-fail",\n            "source_sha": FAILURE_SOURCE_SHA,\n            "failure_reason": message,\n        }\n        FAILURE_OUTPUT.write_text(\n            json.dumps(evidence, indent=2, sort_keys=True) + "\\n",\n            encoding="utf-8",\n        )\n    raise SystemExit(f"Cloud Metal program invariant failed: {message}")\n'''
          if old_fail not in text:
              raise SystemExit('verify_cloud_program fail anchor not found')
          text = text.replace(old_fail, new_fail, 1)
          parser = '    args = parser.parse_args()\n\n    program = load(PROGRAM)\n'
          if parser not in text:
              raise SystemExit('verify_cloud_program parser anchor not found')
          text = text.replace(
              parser,
              '    args = parser.parse_args()\n\n    global FAILURE_OUTPUT, FAILURE_SOURCE_SHA\n    FAILURE_OUTPUT = args.output\n\n    program = load(PROGRAM)\n',
              1,
          )
          sha_anchor = '    checked_out_sha = run_git("rev-parse", "HEAD").lower()\n    require(re.fullmatch(r"[0-9a-f]{40}", checked_out_sha) is not None,\n'
          if sha_anchor not in text:
              raise SystemExit('verify_cloud_program SHA anchor not found')
          text = text.replace(
              sha_anchor,
              '    checked_out_sha = run_git("rev-parse", "HEAD").lower()\n    FAILURE_SOURCE_SHA = checked_out_sha\n    require(re.fullmatch(r"[0-9a-f]{40}", checked_out_sha) is not None,\n',
              1,
          )
          verifier.write_text(text, encoding='utf-8')
          PY

      - name: Prove fail-closed evidence survives an intentional inventory error
        shell: bash
        run: |
          set -euo pipefail
          cp docs/agent/branch-migration-matrix.json "$RUNNER_TEMP/matrix.good.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('docs/agent/branch-migration-matrix.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['branches'] = [e for e in data['branches'] if e['branch'] != 'fix/p2-mrt-store-liveness-review']
          path.write_text(json.dumps(data, indent=1) + '\n', encoding='utf-8')
          PY
          set +e
          python3 scripts/agent/verify_cloud_program.py --verify-remote-branches --output "$RUNNER_TEMP/cloud-contract-failure.json"
          status=$?
          set -e
          mv "$RUNNER_TEMP/matrix.good.json" docs/agent/branch-migration-matrix.json
          test "$status" -ne 0
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'cloud-contract-failure.json').read_text())
          assert result['decision'] == 'cloud-program-contract-fail', result
          assert 'fix/p2-mrt-store-liveness-review' in result['failure_reason'], result
          print('fail-closed evidence emission: PASS')
          PY

      - name: Validate logic, compilation and static repository contracts
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew scripts/agent/verify.sh
          ./gradlew --no-daemon \
            buildMacNative \
            test --tests 'com.metallum.client.metal.render.MetalCommandEncoderStoreLivenessPolicyTest' \
            compileTestJava
          bash scripts/agent/verify.sh static
          python3 scripts/agent/verify_cloud_program.py \
            --verify-remote-branches \
            --expected-source-sha "$(git rev-parse HEAD)" \
            --output "$RUNNER_TEMP/cloud-contract.json"
          python3 -m json.tool "$RUNNER_TEMP/cloud-contract.json" >/dev/null

      - name: Commit only the validated production changes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-p2-mrt-review-fix.yml
          rm .github/workflows/trigger-p2-mrt-review-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(rendergraph): make MRT store suppression attachment-local'
          git push origin HEAD:fix/p2-mrt-store-liveness-review
