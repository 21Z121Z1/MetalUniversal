# Temporary transfer for this explicitly authorized branch. The generated tree removes this file.
name: Campaign source transfer
on:
  push:
    branches: [codex/vision-cloud-convergence-followthrough-20260921]
    paths: [.github/workflows/campaign-transfer.yml]
permissions:
  contents: read
concurrency:
  group: campaign-source-transfer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  transfer:
    if: github.repository == '21Z121Z1/MetalUniversal' && github.ref == 'refs/heads/codex/vision-cloud-convergence-followthrough-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize and verify the exact candidate tree without updating a ref
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: 5c034a16662cb237fd896cf632f35fb887661c51
          EXPECTED_TREE: 33cb03694b6d36f4c5542a81efc264c83b0eaeba
          PATCH_BLOBS: 93e7e65cf8819a7641e6e05b94e625178c935b51,84b9616804b5f2194026af24fc1ec74b6ee6d27b,dc95a9e874546e451f97cb6ad9abde65aeba87cc,170f1efe06394e0dd980f380ea215eddabd1467c
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, re, subprocess, urllib.request
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          if repo != '21Z121Z1/MetalUniversal' or os.environ['GITHUB_REF'] != 'refs/heads/codex/vision-cloud-convergence-followthrough-20260921':
              raise SystemExit('unauthorized transfer target')
          def git(*args, data=None):
              return subprocess.check_output(['git', *args], input=data)
          def api(path, payload=None):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + path,
                  data=json.dumps(payload).encode() if payload is not None else None,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28',
                           'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          base, expected = os.environ['BASE_SHA'], os.environ['EXPECTED_TREE']
          parent = git('rev-parse', 'HEAD').decode().strip()
          if git('rev-parse', 'HEAD^').decode().strip() != base:
              raise SystemExit('base changed; refuse to infer or rewrite history')
          git('rm', '--', '.github/workflows/campaign-transfer.yml')
          for blob in os.environ['PATCH_BLOBS'].split(','):
              if re.fullmatch('[0-9a-f]{40}', blob) is None:
                  raise SystemExit('invalid patch object')
              response = api('/git/blobs/' + blob)
              patch = base64.b64decode(response['content'])
              if hashlib.sha1(b'blob ' + str(len(patch)).encode() + b'\0' + patch).hexdigest() != blob:
                  raise SystemExit('patch object digest mismatch')
              git('apply', '--index', '--unidiff-zero', '--binary', '-', data=patch)
          tree = git('write-tree').decode().strip()
          if tree != expected:
              raise SystemExit('candidate tree differs from the locally tested tree')
          git('diff', '--cached', '--check')
          subprocess.run(['python3', 'scripts/agent/verify_frame_evidence.py', '--self-test'], check=True)
          subprocess.run(['python3', '-m', 'unittest', 'discover', '-s', 'scripts/agent', '-p', 'test_frame_*.py'], check=True)
          def entries(ref):
              result = {}
              for row in git('ls-tree', '-rz', ref).split(b'\0'):
                  if row:
                      info, path = row.split(b'\t', 1)
                      mode, kind, sha = info.decode().split()
                      result[path.decode()] = (mode, kind, sha)
              return result
          old, new = entries(base), entries(tree)
          changes = []
          for path in sorted(old.keys() | new.keys()):
              if old.get(path) == new.get(path):
                  continue
              mode, kind, sha = new.get(path, old.get(path))
              if kind != 'blob' or mode not in ('100644', '100755'):
                  raise SystemExit('unsupported transfer object')
              if path in new:
                  content = base64.b64encode(git('cat-file', 'blob', sha)).decode()
                  uploaded = api('/git/blobs', {'content': content, 'encoding': 'base64'})
                  if uploaded['sha'] != sha:
                      raise SystemExit('uploaded source digest mismatch')
              changes.append({'path': path, 'mode': mode, 'type': kind, 'sha': sha if path in new else None})
          created = api('/git/trees', {'base_tree': git('rev-parse', base + '^{tree}').decode().strip(), 'tree': changes})
          if created['sha'] != expected:
              raise SystemExit('remote tree differs from local tree')
          commit = api('/git/commits', {'message': 'evidence: distinguish zero receipts and add chronological tail contracts',
                                       'tree': expected, 'parents': [parent]})
          output = Path('build/agent-evidence/transfer')
          output.mkdir(parents=True, exist_ok=True)
          result = {'baseSha': base, 'transferSha': parent, 'headSha': commit['sha'], 'tree': expected,
                    'refUpdated': False, 'files': [row['path'] for row in changes]}
          (output / 'candidate.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result))
          git('fetch', 'origin', commit['sha'])
          git('update-ref', 'refs/heads/transfer-output', commit['sha'])
          git('bundle', 'create', str(output / 'source.bundle'), 'refs/heads/transfer-output')
          PY
      - name: Preserve exact source and transfer diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: campaign-source-${{ github.sha }}-${{ github.run_attempt }}
          path: build/agent-evidence/transfer/
          retention-days: 7
          if-no-files-found: warn
