# Temporary transfer of a reviewed source patch. The candidate tree removes this file.
name: Campaign source transfer
on:
  push:
    branches: [codex/vision-cloud-convergence-20260922]
    paths: [.github/workflows/campaign-transfer.yml]
permissions:
  contents: read
concurrency:
  group: campaign-source-transfer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  transfer:
    if: github.repository == '21Z121Z1/MetalUniversal' && github.ref == 'refs/heads/codex/vision-cloud-convergence-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source objects without updating a ref
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: 6462d27c8fe8e81875ed630f991eb30daf1344f1
          EXPECTED_TREE: 461fdae8197fa216dcdcf4d9d7e9c30a7e3a55e4
          PATCH_BLOBS: 365ab296e93f02a74a668da3b64ebf98f7e10ef6 846ee53e81cfc0b8f92761215bf730b7e33daf41 b772ca13544896dae606a6bb71b8feee4fc41a97 878c02a5ced47ad755931d4ea2f45022992ba6b9 719c4bd457d4aa3e0f5b31d5ffd6b661e4a43ee2 7cd4dd9ab3084b1370ddfccc6c08346959561c9b 098169434d4d63f0d3ae7ec83898ef6317e6056b
          PATCH_SHA256: 4dd5bb9960c0d4e225561fb26aeddf889283b807cdb3fdb08d12483e75d567b0
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, re, subprocess, urllib.request
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          if repo != '21Z121Z1/MetalUniversal' or os.environ['GITHUB_REF'] != 'refs/heads/codex/vision-cloud-convergence-20260922':
              raise SystemExit('unauthorized transfer target')
          def git(*args, data=None):
              return subprocess.check_output(['git', *args], input=data)
          def api(path, payload=None):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + path,
                  data=json.dumps(payload).encode() if payload is not None else None,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28',
                           'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          base, expected = os.environ['BASE_SHA'], os.environ['EXPECTED_TREE']
          parent = git('rev-parse', 'HEAD').decode().strip()
          if git('rev-parse', 'HEAD^').decode().strip() != base:
              raise SystemExit('base changed; refuse to rewrite history')
          pieces = []
          for blob in os.environ['PATCH_BLOBS'].split():
              if re.fullmatch('[0-9a-f]{40}', blob) is None:
                  raise SystemExit('invalid patch object')
              part = base64.b64decode(api('/git/blobs/' + blob)['content'])
              if hashlib.sha1(b'blob ' + str(len(part)).encode() + b'\0' + part).hexdigest() != blob:
                  raise SystemExit('patch object digest mismatch')
              pieces.append(part)
          patch = gzip.decompress(b''.join(pieces))
          if hashlib.sha256(patch).hexdigest() != os.environ['PATCH_SHA256']:
              raise SystemExit('expanded patch digest mismatch')
          git('rm', '--', '.github/workflows/campaign-transfer.yml')
          git('apply', '--index', '--unidiff-zero', '--binary', '-', data=patch)
          if git('write-tree').decode().strip() != expected:
              raise SystemExit('candidate differs from the reviewed tree')
          git('diff', '--cached', '--check')
          subprocess.run(['python3', 'scripts/agent/verify_frame_evidence.py', '--self-test'], check=True)
          subprocess.run(['python3', '-m', 'unittest', 'discover', '-s', 'scripts/agent', '-p', 'test_frame_*.py'], check=True)
          def entries(ref):
              result = {}
              for row in git('ls-tree', '-rz', ref).split(b'\0'):
                  if row:
                      info, path = row.split(b'\t', 1)
                      mode, kind, sha = info.decode().split()
                      result[path.decode()] = (mode, kind, sha)
              return result
          old, new = entries(base), entries(expected)
          changes = []
          for path in sorted(old.keys() | new.keys()):
              if old.get(path) == new.get(path):
                  continue
              mode, kind, sha = new.get(path, old.get(path))
              if kind != 'blob' or mode not in ('100644', '100755'):
                  raise SystemExit('unsupported source object')
              if path in new:
                  content = base64.b64encode(git('cat-file', 'blob', sha)).decode()
                  if api('/git/blobs', {'content': content, 'encoding': 'base64'})['sha'] != sha:
                      raise SystemExit('uploaded source digest mismatch')
              changes.append({'path': path, 'mode': mode, 'type': kind, 'sha': sha if path in new else None})
          created = api('/git/trees', {'base_tree': git('rev-parse', base + '^{tree}').decode().strip(), 'tree': changes})
          if created['sha'] != expected:
              raise SystemExit('remote tree differs from local tree')
          commit = api('/git/commits', {'message': 'workloads: add immutable seven-scenario trials and balanced fail-closed physical runner',
                                       'tree': expected, 'parents': [parent]})
          output = Path('build/agent-evidence/transfer')
          output.mkdir(parents=True, exist_ok=True)
          result = {'baseSha': base, 'transferSha': parent, 'headSha': commit['sha'], 'tree': expected,
                    'refUpdated': False, 'files': [row['path'] for row in changes]}
          (output / 'candidate.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result))
          git('fetch', 'origin', commit['sha'])
          git('update-ref', 'refs/heads/transfer-output', commit['sha'])
          git('bundle', 'create', str(output / 'source.bundle'), 'refs/heads/transfer-output')
          PY
      - name: Preserve exact source and transfer diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: campaign-source-${{ github.sha }}-${{ github.run_attempt }}
          path: build/agent-evidence/transfer/
          retention-days: 7
          if-no-files-found: warn
