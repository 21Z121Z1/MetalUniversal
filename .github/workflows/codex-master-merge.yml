name: Resolve integration merge into master

on:
  push:
    branches:
      - codex/master-merge-staging-20260830
    paths:
      - .github/workflows/codex-master-merge.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/master-merge-resolved-20260830
      - name: Update Metal 4 hot-path verifier for current bridge visibility
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/agent/verify_metal4_main_hotpath.py")
          data = path.read_text()
          old = 'CLASS_END = "private final class Metal4MainRenderEncoderBridge {"'
          new = 'CLASS_END = "final class Metal4MainRenderEncoderBridge {"'
          if data.count(old) != 1:
              raise SystemExit(f"expected one old bridge marker, found {data.count(old)}")
          path.write_text(data.replace(old, new, 1))
          PY
          git diff --check
          python3 scripts/agent/verify_metal4_main_hotpath.py >/tmp/metal4-hotpath.json
          cat /tmp/metal4-hotpath.json
          git add scripts/agent/verify_metal4_main_hotpath.py
          git commit -m "ci: accept current Metal 4 bridge visibility"
          git push origin HEAD:codex/master-merge-resolved-20260830
