name: Agent MetalFX color transfer foundation v2 20260913

on:
  push:
    branches:
      - agent/metalfx-motion-coverage-26.2

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: "${{ github.event.head_commit.message == 'chore(agent): execute MetalFX color transfer foundation v2' }}"
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Select newest Xcode 26
        run: |
          set -euxo pipefail
          XCODE="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1)"
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun swiftc --version

      - name: Apply asserted patch
        run: |
          set -euxo pipefail
          python3 scripts/agent/run-metalfx-color-transfer-foundation-v2-20260913.py
          git diff --check
          git status --short

      - name: Build macOS native bridge
        run: ./gradlew --no-daemon buildMacOSNative -x buildIOSNative

      - name: Compile Java and tests
        run: ./gradlew --no-daemon compileJava compileTestJava -x buildIOSNative

      - name: Run focused source contract
        run: ./gradlew --no-daemon test --tests com.metallum.client.metal.render.MetalFxTemporalColorTransferSourceTest -x buildIOSNative

      - name: Final source assertions
        run: |
          set -euxo pipefail
          grep -n -C 3 'metallum_metalfx_color_transfer' src/main/native/MetallumNative.swift | head -100
          grep -n -C 4 'private var uiFormat' src/main/native/MetallumNative.swift
          grep -n -C 4 'pixelFormat: uiFormat' src/main/native/MetallumNative.swift
          grep -n -C 4 'metalfxColorTransfer' src/main/java/com/metallum/client/metal/render/bridge/MetalNativeBridge.java | head -100
          git diff --check

      - name: Commit validated functional batch
        run: |
          set -euxo pipefail
          rm -f scripts/agent/apply-metalfx-color-transfer-foundation-20260913.py
          rm -f scripts/agent/run-metalfx-color-transfer-foundation-v2-20260913.py
          rm -f .github/workflows/agent-metalfx-color-transfer-foundation-20260913.yml
          rm -f .github/workflows/agent-metalfx-color-transfer-foundation-v2-20260913.yml
          rm -f .github/workflows/agent-metalfx-temporal-linear-bridge-probe-20260913.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(metalfx): add explicit temporal color transfer seam'
          git push origin HEAD:agent/metalfx-motion-coverage-26.2
