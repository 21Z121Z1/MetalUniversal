name: integrate-hosted-metal-ci-v3

on:
  workflow_dispatch:
  push:
    branches:
      - integration/hosted-metal-ci-20260811

permissions:
  contents: write

concurrency:
  group: integrate-hosted-metal-ci-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle

      - name: Replay validated migration logic and commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ci/hosted-metal-gpu-probe-20260810
          python3 - <<'PY'
          from pathlib import Path

          lines = Path('.github/workflows/integrate-hosted-metal-ci-v2.yml').read_text().splitlines()
          start = lines.index("          python3 - <<'PY'") + 1
          end = lines.index('          PY', start)
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end])
          exec(compile(script, '<hosted-metal-migration>', 'exec'), {})
          PY

          chmod +x ./gradlew
          ./gradlew verifyMetalCapabilityPolicy --stacktrace
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build.gradle src/main/native/MetallumNative.swift src/test/native/MetalMRTSmokeTest.swift .github/ci/HostedMetalCapabilityProbe.swift src/test/java/com/metallum/client/metal/render/IrisMetalBundledPostChainCompilationTest.java src/test/java/com/metallum/client/metal/render/IrisMetalBundledTerrainPipelineTest.java
          git commit -m 'ci: integrate hosted Metal capability policy on mobilegl mainline'
          git push origin HEAD:integration/hosted-metal-ci-20260811
