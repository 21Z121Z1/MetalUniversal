name: Pinned shader source reference

on:
  push:
    tags:
      - 'diagnostics/metalfx-shader-source-*'

permissions:
  contents: read

concurrency:
  group: metalfx-shader-reference-${{ github.ref }}
  cancel-in-progress: false

env:
  METALLUM_SOURCE_SHA: ${{ github.sha }}
  METALLUM_SHADER_REFERENCE_DEPENDENCIES: ${{ github.workspace }}/build/agent-evidence/pinned-source-dependencies.json

jobs:
  include-provider-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.METALLUM_SOURCE_SHA }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Resolve the existing client harness dependency artifacts
        run: |
          set -euo pipefail
          ./gradlew --no-daemon jar -x buildMacNative -x buildIOSNative -x buildIOSSpvc
          python3 - <<'PY'
          from pathlib import Path
          import os, subprocess
          jars=[p for p in Path('build/libs').glob('*.jar') if not p.name.endswith(('-sources.jar','-dev.jar'))]
          if len(jars)!=1: raise SystemExit('ambiguous production Java JAR for reference dependency configuration')
          subprocess.run(['./gradlew','--no-daemon','-p','.github/ci/minecraft-e2e',
              '-I',str(Path('.github/ci/ResolveShaderReference.init.gradle').resolve()),
              '-PmetallumJar='+str(jars[0].resolve()),'-Pmetallum.sodiumOnly=true',
              '-PshaderReferenceManifest='+os.environ['METALLUM_SHADER_REFERENCE_DEPENDENCIES'],
              'resolveShaderReferenceArtifacts'],check=True)
          PY
      - name: Inspect exact pinned provider and already cached original client
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$METALLUM_SOURCE_SHA"
          ./gradlew --no-daemon --stacktrace test \
            --tests com.metallum.client.metal.render.MetalPrivateBindingHookDescriptorTest.inspectPinnedShaderIncludeApi \
            --tests com.metallum.client.metal.render.MetalShaderIncludeLifetimeTest \
            -x buildMacNative -x buildIOSNative -x buildIOSSpvc
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import base64, gzip, json, os
          suite=ET.parse('build/test-results/test/TEST-com.metallum.client.metal.render.MetalPrivateBindingHookDescriptorTest.xml').getroot()
          rows=[line for block in suite.iter('system-out') for line in (block.text or '').splitlines()
                if line.startswith('METAL_SHADER_SOURCE_API_GZIP_BASE64 ')]
          if len(rows)!=1: raise SystemExit('missing or ambiguous shader source API evidence')
          data=json.loads(gzip.decompress(base64.b64decode(rows[0].split(' ',1)[1])))
          if data['sourceCommit']!=os.environ['METALLUM_SOURCE_SHA'] or data['sourceAdmissionGranted'] is not False:
              raise SystemExit('incorrect source or admission boundary')
          target=Path('build/agent-evidence/shader-source-reference.json');target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps(data,indent=2)+'\n')
          print(rows[0])
          callback=ET.parse('build/test-results/test/TEST-com.metallum.client.metal.render.MetalShaderIncludeLifetimeTest.xml').getroot()
          if int(callback.get('tests','0'))!=2 or any(int(callback.get(key,'0')) for key in ('failures','errors','skipped')):
              raise SystemExit('native include callback control did not execute successfully')
          controls=[line for block in callback.iter('system-out') for line in (block.text or '').splitlines()
                    if line.startswith('METAL_NATIVE_INCLUDE_CALLBACK_CONTROL ')]
          if len(controls)!=1: raise SystemExit('missing native include control receipt')
          proof=json.loads(controls[0].split(' ',1)[1])
          if proof['sourceCommit']!=os.environ['METALLUM_SOURCE_SHA'] or proof['sourceAdmissionGranted'] is not False:
              raise SystemExit('incorrect native callback control source or admission boundary')
          print(controls[0])
          PY
      - name: Retain native include control failure causes
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path('build/test-results/test').glob('TEST-com.metallum.client.metal.render.MetalShaderIncludeLifetimeTest.xml'):
              suite=ET.parse(path).getroot()
              print('native include control test counts:',suite.attrib)
              for case in suite.findall('testcase'):
                  for failure in list(case.findall('failure'))+list(case.findall('error')):
                      print(case.attrib)
                      print((failure.text or '')[:32768])
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: shader-source-reference-${{ env.METALLUM_SOURCE_SHA }}
          path: |
            build/agent-evidence/shader-source-reference.json
            build/agent-evidence/pinned-source-dependencies.json
            build/test-results/
          retention-days: 14
