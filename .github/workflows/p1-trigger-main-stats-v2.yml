name: P1 trigger audited Metal4 telemetry patch

on:
  pull_request:
    branches:
      - integration/iris-metal-next
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: p1-trigger-metal4-main-telemetry
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/metal4-main-production
          fetch-depth: 0

      - name: Apply audited patch embedded in one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/p1-apply-main-stats-v2.yml').read_text(encoding='utf-8')
          start_marker = "          python3 <<'PY'\n"
          end_marker = "          PY\n"
          start = source.find(start_marker)
          if start < 0:
              raise SystemExit('embedded patch start marker not found')
          start += len(start_marker)
          end = source.find(end_marker, start)
          if end < 0:
              raise SystemExit('embedded patch end marker not found')
          lines = source[start:end].splitlines()
          patch = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          compile(patch, '<p1-embedded-patch>', 'exec')
          exec(patch, {'__name__': '__main__'})
          PY

          python3 scripts/agent/verify_metal4_main_hotpath.py \
            --output build/agent-evidence/metal4-main-hotpath.json
          python3 -m json.tool docs/agent/metal4-main-production-acceptance.json >/dev/null
          git diff --check

      - name: Commit implementation and remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm \
            .github/workflows/p1-apply-main-stats-v2.yml \
            .github/workflows/p1-trigger-main-stats-v2.yml
          git add \
            src/main/native/MetallumNative.swift \
            src/main/java/com/metallum/client/metal/render/bridge/MetalNativeBridge.java \
            src/main/java/com/metallum/client/metal/render/mtl/Metal4MainRendererTelemetry.java \
            scripts/agent/verify_metal4_main_hotpath.py \
            docs/agent/metal4-main-production-acceptance.json \
            .github/ci/minecraft-e2e/build.gradle \
            .github/ci/minecraft-e2e/src/main/resources/fabric.mod.json \
            .github/ci/minecraft-e2e/src/main/java/com/metallum/client/metal/render/Metal4MainRendererEvidenceGameTest.java
          git diff --cached --check
          git commit -m 'feat(metal4): complete P1 runtime telemetry contract'
          git push origin HEAD:feature/metal4-main-production
