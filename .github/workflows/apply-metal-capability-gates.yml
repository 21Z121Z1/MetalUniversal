name: apply-metal-capability-gates

on:
  workflow_dispatch:
  push:
    branches:
      - ci/hosted-metal-gpu-probe-20260810

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-26
    env:
      METALLUM_HOSTED_METAL_OFFSCREEN: 'true'
      MTL_DEBUG_LAYER: '0'
      MTL_SHADER_VALIDATION: '0'
      MTL_HUD_ENABLED: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply capability-based build gates
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/ci/apply-metal-capability-gates.py
          git diff --check
          git diff -- build.gradle

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Verify hosted-offscreen MRT gate without CI spoofing
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --stacktrace metalMrtSmokeTest

      - name: Commit capability gate split to experiment branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- build.gradle; then
            echo 'build.gradle already contains capability gates'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add build.gradle
          git commit -m 'ci: split Metal validation by runtime capability'
          git push origin HEAD:ci/hosted-metal-gpu-probe-20260810
