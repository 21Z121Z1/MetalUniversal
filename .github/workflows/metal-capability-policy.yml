name: metal-capability-policy

on:
  workflow_dispatch:
  push:
    paths:
      - build.gradle
      - '.github/workflows/**'
  pull_request:
    paths:
      - build.gradle
      - '.github/workflows/**'

jobs:
  capability-policy:
    name: reject blanket CI/physical Metal gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Mechanically audit build.gradle capability predicates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('build.gradle')
          raw_lines = path.read_text().splitlines()

          # Remove comments and quoted string contents before inspecting code.
          # This prevents the policy checker from matching the diagnostic strings
          # used by verifyMetalCapabilityPolicy itself.
          def code_only(line: str) -> str:
              out = []
              quote = None
              escaped = False
              i = 0
              while i < len(line):
                  ch = line[i]
                  if quote is not None:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == quote:
                          quote = None
                      i += 1
                      continue
                  if ch in ('"', "'"):
                      quote = ch
                      i += 1
                      continue
                  if ch == '/' and i + 1 < len(line) and line[i + 1] == '/':
                      break
                  out.append(ch)
                  i += 1
              return ''.join(out)

          code = [(n, code_only(line)) for n, line in enumerate(raw_lines, 1)]
          violations = []

          legacy = re.compile(r'\bphysicalMetalValidationAvailable\b')
          negated = re.compile(r'!\s*hostedCi\b')
          direct_if = re.compile(r'\bif\s*\(\s*hostedCi\s*\)')
          direct_only_if = re.compile(r'\bonlyIf\s*\{[^}]*\bhostedCi\b')
          for lineno, line in code:
              if legacy.search(line):
                  violations.append((lineno, 'legacy physicalMetalValidationAvailable gate'))
              if negated.search(line):
                  violations.append((lineno, 'negated hostedCi blanket gate'))
              if direct_if.search(line):
                  violations.append((lineno, 'direct if(hostedCi) blanket gate'))
              if direct_only_if.search(line):
                  violations.append((lineno, 'direct onlyIf {... hostedCi ...} blanket gate'))

          hosted_refs = [(n, line.strip()) for n, line in code if re.search(r'\bhostedCi\b', line)]
          allowed_exact_prefixes = (
              'def hostedCi =',
              'def metalApiValidation = hostedCi ?',
              'def metalShaderValidation = hostedCi ?',
          )
          central = []
          unexpected_refs = []
          for lineno, line in hosted_refs:
              if line.startswith(allowed_exact_prefixes):
                  continue
              if re.fullmatch(r'isMacOSHost\s*&&\s*\(hostedCi\s*==\s*false\s*\|\|\s*\.equalsIgnoreCase\(System\.getenv\(\)\)\)', line):
                  # Quoted literals were removed by code_only().
                  central.append((lineno, 'hosted-offscreen'))
                  continue
              if re.fullmatch(r'isMacOSHost\s*&&\s*hostedCi\s*==\s*false', line):
                  central.append((lineno, 'physical-capability'))
                  continue
              unexpected_refs.append((lineno, line))

          if sorted(kind for _, kind in central) != ['hosted-offscreen', 'physical-capability']:
              violations.append((0, f'central hostedCi predicates changed: {central}'))
          for lineno, line in unexpected_refs:
              violations.append((lineno, f'unclassified hostedCi reference: {line}'))

          # CI environment lookup is centralized in the hostedCi definition.
          ci_env_refs = [
              n for n, line in enumerate(raw_lines, 1)
              if re.search(r'System\.getenv\(\s*["\']CI["\']\s*\)', line)
          ]
          if len(ci_env_refs) != 1:
              violations.append((0, f'CI environment lookup must be centralized once, found lines {ci_env_refs}'))

          if violations:
              for lineno, message in violations:
                  location = f'{path}:{lineno}' if lineno else str(path)
                  print(f'::error file={path},line={max(lineno,1)}::{location}: {message}')
              raise SystemExit('Blanket CI/physical Metal gating is forbidden. Add a named capability with a concrete reason instead.')

          print('Static Metal capability policy: PASS')
          print('Allowed raw hostedCi predicates: hosted-offscreen opt-in + named physical capability resolver only')
          PY
