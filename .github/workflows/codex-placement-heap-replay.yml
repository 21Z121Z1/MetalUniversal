name: codex/placement-heap-replay

on:
  push:
    branches:
      - codex/placement-heap-integration-staging-20260830
    paths:
      - .github/workflows/codex-placement-heap-replay.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/placement-heap-integration-staging-20260830
      - name: Replay bounded placement-heap commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for sha in \
            dd15608713c713f2c7198d540164c04aeb9ac4fd \
            b8a7038fdd9c0fa24dc80da77e90fef84ff7c65e \
            4790ddad449d636e4bc6d8e437fd0308fb9f1794 \
            f9e5f597395bcc12d0907991826a750c623c822d \
            b225f4475d24aaaf2b767dd4dfc58028550e9678 \
            854ea820a602f5fd77a67c661761a2b125689dc0
          do
            echo "REPLAY $sha"
            git cherry-pick -x "$sha"
          done
          git log --oneline -10
          git status --short
      - name: Remove one-shot replay workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/codex-placement-heap-replay.yml
          git commit -m "chore(ci): remove placement heap replay helper"
      - name: Push replayed branch
        shell: bash
        run: git push origin HEAD:codex/placement-heap-integration-staging-20260830
