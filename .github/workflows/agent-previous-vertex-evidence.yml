name: Agent exact text display motion patch

on:
  push:
    branches:
      - agent/metalfx-motion-coverage-26.2

permissions:
  contents: write

jobs:
  apply:
    if: "github.event.head_commit.message == 'chore(agent): apply exact text display motion'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/metalfx-motion-coverage-26.2
          fetch-depth: 3
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Guard exact text display transaction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^^)" = "06f3de49b1cfc9602f3eb99d6e7f4160193617a1"
          test "$(git log -1 --format=%s HEAD^)" = "chore(agent): configure text display exact verification"
      - name: Apply exact text display ownership and continuity
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_text_display_exact_motion.py
          git diff --check
      - name: Compile and test text display motion contracts
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew compileJava test \
            --tests 'com.metallum.client.metal.render.MetalTextDisplayMotionSafetyTest' \
            --tests 'com.metallum.client.metal.render.MetalTextDisplayExactCoverageTest' \
            --tests 'com.metallum.client.metal.render.MetalDisplayMotionSafetyTest' \
            --tests 'com.metallum.client.metal.render.MetalFxMotionEligibilityTest' \
            --tests 'com.metallum.client.metal.render.MetalEntityAuxiliaryMotionPipelineTest' \
            --tests 'com.metallum.client.metal.render.MetalExactMotionCoverageTest' \
            --tests 'com.metallum.client.metal.render.MetalPreviousVertexHistoryTest' \
            --tests 'com.metallum.client.metal.render.FrameSynthesisContractTest'
          git diff --check
      - name: Commit verified text display implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java src/main/resources/metallum.mixins.json src/test/java
          git diff --cached --check
          git commit -m 'feat(metalfx): add exact text display motion coverage'
          git push origin HEAD:agent/metalfx-motion-coverage-26.2
