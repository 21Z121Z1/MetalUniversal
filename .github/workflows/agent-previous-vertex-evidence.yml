name: Agent previous-vertex API evidence

on:
  push:
    branches:
      - agent/metalfx-motion-coverage-26.2

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/metalfx-motion-coverage-26.2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Extract source-grounded staged-vertex, entity auxiliary, and Blaze3D APIs
        shell: bash
        run: |
          set -euo pipefail
          SRC="$(bash scripts/minecraft-reference.sh --print-path)"
          python3 - "$SRC" <<'PY'
          from pathlib import Path
          import hashlib, json, sys
          root=Path(sys.argv[1])
          specs={
            'StagedVertexBuffer.java': ('vertexBufferSlices','uploadDrawsToBuffers','freeVertexData','getExecuteInfo','vertexBufferSize','vertexCount','record ExecuteInfo','class Draw'),
            'VertexFormat.java': ('class VertexFormat','builder(','addAttribute','padding','getVertexSize','binding','Builder'),
            'DefaultVertexFormat.java': ('POSITION','POSITION_COLOR_TEX_LIGHTMAP','ENTITY','BLOCK','addAttribute'),
            'GpuBuffer.java': ('USAGE_VERTEX','USAGE_UNIFORM','class GpuBuffer','interface Usage'),
            'GpuBufferSlice.java': ('record GpuBufferSlice','class MappedView','MappedView','data()','slice()','buffer()','offset()','length()'),
            'TransientMemory.java': ('allocateGpuMapped','allocateGpu','uploadGpu','uploadStaging','interface TransientMemory'),
            'RenderPipeline.java': ('withVertexBinding','vertexFormat','VertexFormat','Builder'),
            'RenderPass.java': ('setVertexBuffer','drawIndexed','setPipeline'),
            'EntityRenderDispatcher.java': ('submitFlame(','submitShadow(','submitNameTag(','submitLeash(','renderer.submit('),
            'SubmitNodeCollection.java': ('submitShadow(','submitNameTag(','submitFlame(','submitLeash(','submitModel('),
            'ShadowFeatureRenderer.java': ('class ShadowFeatureRenderer','prepare','render','VertexConsumer','RenderType','ShadowPiece'),
            'LeashFeatureRenderer.java': ('class LeashFeatureRenderer','prepare','render','VertexConsumer','RenderType','LeashState'),
            'FlameFeatureRenderer.java': ('class FlameFeatureRenderer','prepare','render','VertexConsumer','RenderType','EntityRenderState'),
            'NameTagFeatureRenderer.java': ('class NameTagFeatureRenderer','prepare','render','VertexConsumer','RenderType','Submit'),
            'TextFeatureRenderer.java': ('class TextFeatureRenderer','prepare','render','VertexConsumer','RenderType','Submit'),
          }
          out=[]
          for name, needles in specs.items():
            matches=list(root.rglob(name))
            if not matches:
              out.append({'name':name,'missing':True})
              continue
            path=sorted(matches, key=lambda p:(0 if ('com/mojang/' in p.as_posix() or 'net/minecraft/' in p.as_posix()) else 1, len(p.as_posix())))[0]
            lines=path.read_text(errors='replace').splitlines()
            hits=[i for i,l in enumerate(lines) if any(n in l for n in needles)]
            windows=[]
            for i in hits:
              a=max(0,i-24); b=min(len(lines),i+38)
              if windows and a <= windows[-1][1]+1: windows[-1]=(windows[-1][0],max(windows[-1][1],b))
              else: windows.append((a,b))
            out.append({'path':path.relative_to(root).as_posix(),'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'snippets':[{'start_line':a+1,'end_line':b,'text':'\n'.join(f'{j+1:05d}: {lines[j]}' for j in range(a,b))} for a,b in windows]})
          target=Path('build/agent-evidence/previous-vertex-api.json')
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps({'files':out},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: previous-vertex-api-source
          path: build/agent-evidence/previous-vertex-api.json
          retention-days: 7
          if-no-files-found: error
