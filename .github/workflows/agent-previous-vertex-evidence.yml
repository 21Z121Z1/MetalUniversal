name: Agent shared auxiliary motion admission

on:
  push:
    branches:
      - agent/metalfx-motion-coverage-26.2

permissions:
  contents: write

jobs:
  apply:
    if: "github.event.head_commit.message == 'chore(agent): apply shared auxiliary admission guard'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/metalfx-motion-coverage-26.2
          fetch-depth: 4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Guard shared auxiliary transaction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^^)" = "d0f200aebc09d8b635f2895ca43e5c762eaa417a"
          test "$(git rev-parse HEAD^^^)" = "54f1d8c5a6b9ebc842d51b1e88fc77ea2f680bed"
          test "$(git log -1 --format=%s HEAD^)" = "chore(agent): configure shared auxiliary admission verification"
      - name: Apply shared auxiliary fail-closed admission
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_shared_auxiliary_admission.py
          git diff --check
      - name: Compile and test admission contracts
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew compileJava test \
            --tests 'com.metallum.client.metal.render.MetalFxMotionEligibilityTest' \
            --tests 'com.metallum.client.metal.render.MetalExactMotionCoverageTest' \
            --tests 'com.metallum.client.metal.render.MetalTextDisplayExactCoverageTest' \
            --tests 'com.metallum.client.metal.render.FrameSynthesisContractTest'
          git diff --check
      - name: Commit verified shared auxiliary admission
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java src/test/java
          git diff --cached --check
          git commit -m 'fix(metalfx): fail closed on unresolved shared motion batches'
          git push origin HEAD:agent/metalfx-motion-coverage-26.2
