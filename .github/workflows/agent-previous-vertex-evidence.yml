name: Agent previous-vertex replay patch

on:
  push:
    branches:
      - agent/metalfx-motion-coverage-26.2

permissions:
  contents: write

jobs:
  apply:
    if: "github.event.head_commit.message == 'chore(agent): run previous-position replay patch'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/metalfx-motion-coverage-26.2
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Guard exact patch parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "90492ca2f4a061cbf29d9026668e695906f4112f"
      - name: Apply exact previous-position replay
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_previous_position_replay.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main/java/com/metallum/client/metal/render/MetalFxManager.java')
          text = path.read_text()
          old = '@Nullable MetalPreviousVertexHistory.DrawToken previousVertexToken'
          if text.count(old) != 1:
              raise SystemExit(f'expected one generated nullable nested type, found {text.count(old)}')
          path.write_text(text.replace(old, 'MetalPreviousVertexHistory.DrawToken previousVertexToken', 1))
          PY
          git diff --check
      - name: Compile and test motion contracts
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew compileJava test \
            --tests 'com.metallum.client.metal.render.MetalPreviousVertexHistoryTest' \
            --tests 'com.metallum.client.metal.render.FrameSynthesisContractTest'
          git diff --check
      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/metallum/client/metal/render/MetalEntityMotionCapture.java \
                  src/main/java/com/metallum/client/metal/render/MetalFxManager.java \
                  src/test/java/com/metallum/client/metal/render/MetalPreviousVertexHistoryTest.java
          git diff --cached --check
          git commit -m 'feat(metalfx): replay exact previous staged vertices'
          git push origin HEAD:agent/metalfx-motion-coverage-26.2
