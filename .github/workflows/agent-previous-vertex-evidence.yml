name: Agent Flame shared exact motion v2

on:
  push:
    branches:
      - agent/metalfx-motion-coverage-26.2

permissions:
  contents: write

jobs:
  apply:
    if: "github.event.head_commit.message == 'chore(agent): apply Flame shared exact motion v2c'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/metalfx-motion-coverage-26.2
          fetch-depth: 6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Guard Flame exact v2c transaction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^^)" = "d8270d1253376e7d06d5c72e4566a586086b8f90"
          test "$(git log -1 --format=%s HEAD^)" = "chore(agent): fix Flame v2 nested nullable compile guard"
          test "$(git hash-object .github/scripts/apply_flame_shared_exact_motion.py)" = "9b08e77d788b9c84fbf2dcfd89c51178dd1759f1"
      - name: Verify pinned Minecraft 26.2 Flame source contract
        shell: bash
        run: |
          set -euo pipefail
          URL='https://raw.githubusercontent.com/366862732/DirectXmod/a599796f89eddfe0387c95b119b16aaa452d1166/docs/official-262/net/minecraft/client/renderer/feature/FlameFeatureRenderer.java'
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error "$URL" -o /tmp/FlameFeatureRenderer.java
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('/tmp/FlameFeatureRenderer.java').read_text()
          required = [
              r'protected\s+void\s+buildGroup\s*\(FeatureFrameContext\s+context,\s*List<Submit>\s+submits\)',
              r'VertexConsumer\s+builder\s*=\s*this\.getVertexBuilder\(RenderTypes\.entityCutoutCull\(TextureAtlas\.LOCATION_BLOCKS\)\)',
              r'for\s*\(Submit\s+submit\s*:\s*submits\)',
              r'float\s+s\s*=\s*state\.boundingBoxWidth\s*\*\s*1\.4f',
              r'float\s+h\s*=\s*state\.boundingBoxHeight\s*/\s*s',
              r'while\s*\(h\s*>\s*0\.0f\)',
              r'h\s*-=\s*0\.45f',
          ]
          for pattern in required:
              if not re.search(pattern, s):
                  raise SystemExit(f'Minecraft 26.2 Flame source contract missing: {pattern}')
          if s.count('FlameFeatureRenderer.fireVertex(') != 4:
              raise SystemExit('Minecraft 26.2 Flame loop no longer emits exactly four vertices per layer')
          print('Pinned Minecraft 26.2 Flame source contract: PASS')
          PY
      - name: Apply Flame shared exact motion v2
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_flame_shared_exact_motion.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/com/metallum/client/metal/render/MetalSharedBatchMotion.java')
          s = p.read_text()
          old = 'static @Nullable MetalEntityMotionCapture.Sample beginFlameBatch'
          new = 'static MetalEntityMotionCapture.Sample beginFlameBatch'
          if s.count(old) != 1:
              raise SystemExit(f'expected one nested nullable signature, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
      - name: Compile and test Flame exact contracts
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew compileJava test \
            --tests 'com.metallum.client.metal.render.MetalSharedBatchMotionTest' \
            --tests 'com.metallum.client.metal.render.MetalPreviousVertexHistoryTest' \
            --tests 'com.metallum.client.metal.render.MetalExactMotionCoverageTest' \
            --tests 'com.metallum.client.metal.render.MetalEntityAuxiliaryMotionPipelineTest' \
            --tests 'com.metallum.client.metal.render.MetalFxMotionEligibilityTest' \
            --tests 'com.metallum.client.metal.render.FrameSynthesisContractTest'
          ./gradlew jar
          git diff --check
      - name: Verify Flame fail-closed wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'MetalEntityMotionCapture.captureModelSubmit(this);' src/main/java/com/metallum/mixin/render/FlameFeatureSubmitMetalFxMixin.java
          grep -F 'MetalExactMotionCoverage.require(batch);' src/main/java/com/metallum/client/metal/render/MetalEntityMotionCapture.java
          grep -F 'render.FlameFeatureRendererMetalFxMixin' src/main/resources/metallum.mixins.json
          ! grep -F 'observeUnresolvedSharedAuxiliaryMotion();' src/main/java/com/metallum/mixin/render/FlameFeatureSubmitMetalFxMixin.java
          grep -F 'observeUnresolvedSharedAuxiliaryMotion();' src/main/java/com/metallum/mixin/render/ShadowFeatureSubmitMetalFxMixin.java
      - name: Commit verified Flame exact implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java src/main/resources/metallum.mixins.json src/test/java
          git diff --cached --check
          git commit -m 'feat(metalfx): add exact shared Flame motion coverage'
          git push origin HEAD:agent/metalfx-motion-coverage-26.2
