name: Agent exact motion coverage patch

on:
  push:
    branches:
      - agent/metalfx-motion-coverage-26.2

permissions:
  contents: write

jobs:
  apply:
    if: "github.event.head_commit.message == 'chore(agent): run exact motion coverage patch'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/metalfx-motion-coverage-26.2
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Guard exact patch parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "891a1f0c4035c75c61d166362035197d267546eb"
      - name: Apply exact coverage transaction
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_exact_motion_coverage.py
          git diff --check
      - name: Compile and test exact motion contracts
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew compileJava test \
            --tests 'com.metallum.client.metal.render.MetalExactMotionCoverageTest' \
            --tests 'com.metallum.client.metal.render.MetalPreviousVertexHistoryTest' \
            --tests 'com.metallum.client.metal.render.FrameSynthesisContractTest'
          git diff --check
      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java src/main/resources/metallum.mixins.json src/test/java
          git diff --cached --check
          git commit -m 'feat(metalfx): gate deforming entities on exact draw coverage'
          git push origin HEAD:agent/metalfx-motion-coverage-26.2
