name: Codex terrain visible self-contained gate

on:
  push:
    branches:
      - codex/terrain-visible-self-contained-gate-staging-20260829
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/terrain-visible-self-contained-gate-staging-20260829
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply visible submission gate patch
        run: python3 .github/ci/patch_terrain_visible_self_contained_gate.py
      - name: Validate authority contract
        run: ./gradlew test --tests com.metallum.client.metal.render.Metal4TerrainVisibleIcbAuthorityContractTest --no-daemon
      - name: Commit validated product changes
        run: |
          git config user.name '21Z121Z1'
          git config user.email '89170834+21Z121Z1@users.noreply.github.com'
          git add src/main/java src/test/java
          git diff --check --cached
          git commit -m 'fix(terrain): make visible ICB gate self-contained'
          git push origin HEAD:codex/terrain-visible-self-contained-gate-staging-20260829
