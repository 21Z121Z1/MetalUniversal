name: Agent exact item-frame motion v3

on:
  push:
    branches: [agent/metalfx-motion-coverage-26.2]

permissions:
  contents: write

jobs:
  apply:
    if: "github.event.head_commit.message == 'chore(agent): run exact item-frame motion v3'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/metalfx-motion-coverage-26.2
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Establish canonical context
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin integration/iris-metal-next:refs/remotes/origin/integration/iris-metal-next
          python3 scripts/agent/context.py --task 'Exact item-frame motion vectors including maps' --claim correctness

      - name: Reprove Minecraft 26.2 submit topology and exact carriers
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://raw.githubusercontent.com/366862732/DirectXmod/a599796f89eddfe0387c95b119b16aaa452d1166/docs/official-262'
          curl --fail --location --retry 5 --silent --show-error "$BASE/net/minecraft/client/renderer/entity/ItemFrameRenderer.java" -o /tmp/ItemFrameRenderer.java
          curl --fail --location --retry 5 --silent --show-error "$BASE/net/minecraft/client/renderer/MapRenderer.java" -o /tmp/MapRenderer.java
          curl --fail --location --retry 5 --silent --show-error "$BASE/net/minecraft/client/renderer/RenderPipelines.java" -o /tmp/RenderPipelines.java
          python3 - <<'PY'
          from pathlib import Path
          frame=Path('/tmp/ItemFrameRenderer.java').read_text()
          maps=Path('/tmp/MapRenderer.java').read_text()
          pipes=Path('/tmp/RenderPipelines.java').read_text()
          for text, needle in [
            (frame,'state.frameModel.submitWithZOffset(poseStack, submitNodeCollector'),
            (frame,'this.mapRenderer.render(state.mapRenderState, poseStack, submitNodeCollector, true, lightCoords);'),
            (frame,'state.item.submit(poseStack, submitNodeCollector, lightVal'),
            (maps,'submitNodeCollector.submitCustomGeometry(poseStack, RenderTypes.text(mapRenderState.texture)'),
            (maps,'submitNodeCollector.order(1).submitText('),
            (pipes,'public static final RenderPipeline ENTITY_SOLID_Z_OFFSET_FORWARD ='),
            (pipes,'withVertexShader("core/item").withFragmentShader("core/item")'),
            (pipes,'private static final RenderPipeline.Snippet WORLD_TEXT_SNIPPET'),
          ]:
              if needle not in text: raise SystemExit(f'26.2 item-frame contract changed: {needle}')
          print('Pinned Minecraft 26.2 item-frame contracts: PASS')
          PY
          grep -F 'MetalEntityMotionCapture.captureModelSubmit' src/main/java/com/metallum/mixin/render/BlockModelFeatureSubmitMetalFxMixin.java
          grep -F 'MetalEntityMotionCapture.activateBuildSampleOnAccess(submits)' src/main/java/com/metallum/mixin/render/BlockModelFeatureRendererMetalFxMixin.java
          grep -F 'MetalEntityMotionCapture.beginItemBuild(submit);' src/main/java/com/metallum/mixin/render/ItemFeatureRendererMetalFxMixin.java
          grep -F 'MetalEntityMotionCapture.beginModelBuild(pose);' src/main/java/com/metallum/mixin/render/CustomFeatureRendererMetalFxMixin.java
          grep -F 'MetalEntityMotionCapture.activateBuildSampleOnAccess(submits)' src/main/java/com/metallum/mixin/render/TextFeatureRendererMetalFxMixin.java
          grep -F 'matchingDraws <= 0' src/main/java/com/metallum/client/metal/render/MetalExactMotionCoverage.java
          grep -F 'unsupported-exact-pipeline:' src/main/java/com/metallum/client/metal/render/MetalEntityMotionCapture.java

      - name: Apply unambiguous whole-object exact admission
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          def once(path, old, new):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n != 1: raise SystemExit(f'{path}: expected exactly one anchor, got {n}: {old[:120]!r}')
              p.write_text(s.replace(old,new,1))
          p='src/main/java/com/metallum/client/metal/render/MetalFxMotionEligibility.java'
          once(p,
            'import net.minecraft.client.renderer.entity.state.ItemClusterRenderState;\nimport net.minecraft.client.renderer.entity.state.ItemEntityRenderState;\nimport net.minecraft.client.renderer.entity.state.LivingEntityRenderState;\n',
            'import net.minecraft.client.renderer.entity.state.ItemClusterRenderState;\nimport net.minecraft.client.renderer.entity.state.ItemEntityRenderState;\nimport net.minecraft.client.renderer.entity.state.ItemFrameRenderState;\nimport net.minecraft.client.renderer.entity.state.LivingEntityRenderState;\n')
          once(p,
            '''                || state instanceof EvokerFangsRenderState\n                || state instanceof TntRenderState\n                || state instanceof MinecartTntRenderState\n                || state instanceof PaintingRenderState\n''',
            '''                || state instanceof EvokerFangsRenderState\n                || state instanceof ItemFrameRenderState\n                || state instanceof TntRenderState\n                || state instanceof MinecartTntRenderState\n                || state instanceof PaintingRenderState\n''')
          once(p,
            '''        if (state instanceof TntRenderState || state instanceof MinecartTntRenderState) {\n''',
            '''        if (state instanceof ItemFrameRenderState) {\n            // Frame BlockModel, ordinary item, map custom quads and map labels all carry the\n            // submitting frame owner into staged history. Keep the whole object exact-required:\n            // foil/special/unknown item passes or changed map/text manifests reject interpolation\n            // instead of falling back to the frame root transform.\n            return 0;\n        }\n        if (state instanceof TntRenderState || state instanceof MinecartTntRenderState) {\n''')
          t='src/test/java/com/metallum/client/metal/render/MetalFxMotionEligibilityTest.java'
          once(t,
            'import net.minecraft.client.renderer.entity.state.ItemClusterRenderState;\nimport net.minecraft.client.renderer.entity.state.ItemEntityRenderState;\nimport net.minecraft.client.renderer.entity.state.LivingEntityRenderState;\n',
            'import net.minecraft.client.renderer.entity.state.ItemClusterRenderState;\nimport net.minecraft.client.renderer.entity.state.ItemEntityRenderState;\nimport net.minecraft.client.renderer.entity.state.ItemFrameRenderState;\nimport net.minecraft.client.renderer.entity.state.LivingEntityRenderState;\n')
          once(t,
            '''    @Test\n    void tntAndTntMinecartAreExactInsteadOfRigidCandidates() {\n''',
            '''    @Test\n    void itemFrameIsWholeObjectExactCandidate() {\n        ItemFrameRenderState frame = new ItemFrameRenderState();\n        assertEquals(0, MetalFxMotionEligibility.incompleteEntityReason(frame));\n        assertTrue(MetalFxMotionEligibility.requiresExactPreviousPositions(frame));\n    }\n\n    @Test\n    void tntAndTntMinecartAreExactInsteadOfRigidCandidates() {\n''')
          PY
          git diff --check

      - name: Compile targeted motion contracts and jar
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew compileJava test \
            --tests 'com.metallum.client.metal.render.MetalFxMotionEligibilityTest' \
            --tests 'com.metallum.client.metal.render.MetalPreviousVertexHistoryTest' \
            --tests 'com.metallum.client.metal.render.MetalExactMotionCoverageTest' \
            --tests 'com.metallum.client.metal.render.MetalEntityAuxiliaryMotionPipelineTest' \
            --tests 'com.metallum.client.metal.render.MetalFxMotionTelemetryTest' \
            --tests 'com.metallum.client.metal.render.FrameSynthesisContractTest'
          ./gradlew jar
          git diff --check

      - name: Verify fail-closed wiring and commit runtime
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'state instanceof ItemFrameRenderState' src/main/java/com/metallum/client/metal/render/MetalFxMotionEligibility.java
          grep -F 'MetalFxMotionEligibility.requiresExactPreviousPositions(state)' src/main/java/com/metallum/client/metal/render/MetalFxManager.java
          grep -F 'matchingDraws <= 0' src/main/java/com/metallum/client/metal/render/MetalExactMotionCoverage.java
          grep -F 'unsupported-exact-pipeline:' src/main/java/com/metallum/client/metal/render/MetalEntityMotionCapture.java
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java src/test/java
          git diff --cached --check
          git commit -m 'feat(metalfx): add exact item-frame motion vectors'
          git push origin HEAD:agent/metalfx-motion-coverage-26.2
