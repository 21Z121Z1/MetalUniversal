# Temporary transport for a reviewed patch to large native sources.
# This job creates Git objects only; the agent reviews and commits the tree.
name: MetalFX reviewed patch transport
on:
  push:
    branches: [agent/metalfx-contract-completion-20260924]
    paths: [.github/workflows/metalfx-patch-transport.yml]
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == '21Z121Z1/MetalUniversal'
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Apply exact reviewed delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 12f17a568ba41d02525ad0a1b12175ff88029886
          python3 - <<'PY'
          import base64, hashlib, pathlib, subprocess, zlib
          encoded = ''
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'e84c4e63b9cafb036fb3d31a91a6334aa1b7c2d40d9b07c8156b0d064396df34'
          path = pathlib.Path('/tmp/metalfx-reviewed.patch')
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', str(path)], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          expected = {'src/main/native/MetalFrameGenerationLifecycle.swift', 'src/main/native/MetallumNative.swift', 'src/test/native/MetalFrameGenerationLifecycleTest.swift'}
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert actual == expected, actual
          PY
      - name: Run deterministic native lifecycle regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/metalfx-reviewed-tree
          swiftc -O -target arm64-apple-macosx14.0 \
            src/main/native/MetalFrameGenerationLifecycle.swift \
            src/test/native/MetalFrameGenerationLifecycleTest.swift \
            -o /tmp/metalfx-lifecycle
          /tmp/metalfx-lifecycle | tee /tmp/metalfx-reviewed-tree/lifecycle.log
      - name: Publish reviewed Git objects without updating any ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, subprocess
          repo = 'repos/21Z121Z1/MetalUniversal'
          def api(endpoint, payload):
              result = subprocess.run(['gh', 'api', '--method', 'POST', repo + endpoint, '--input', '-'], input=json.dumps(payload), text=True, capture_output=True, check=True)
              return json.loads(result.stdout)
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          base_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          paths = ['src/main/native/MetalFrameGenerationLifecycle.swift', 'src/main/native/MetallumNative.swift', 'src/test/native/MetalFrameGenerationLifecycleTest.swift']
          entries = []
          for path in paths:
              blob = api('/git/blobs', {'content': pathlib.Path(path).read_text(), 'encoding': 'utf-8'})['sha']
              assert blob == subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob})
          remove = ['.github/workflows/metalfx-patch-transport.yml', '.github/workflows/metalfx-contract-probe.yml']
          entries += [{'path': path, 'mode': '100644', 'type': 'blob', 'sha': None} for path in remove]
          tree = api('/git/trees', {'base_tree': base_tree, 'tree': entries})['sha']
          subprocess.run(['git', 'add', '--', *paths], check=True)
          subprocess.run(['git', 'rm', '--', *remove], check=True)
          assert tree == subprocess.check_output(['git', 'write-tree'], text=True).strip()
          receipt = {'parentSha': parent, 'treeSha': tree, 'entries': entries, 'patchSha256': 'e84c4e63b9cafb036fb3d31a91a6334aa1b7c2d40d9b07c8156b0d064396df34'}
          pathlib.Path('/tmp/metalfx-reviewed-tree/tree.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: metalfx-reviewed-tree-${{ github.sha }}
          path: /tmp/metalfx-reviewed-tree/
          retention-days: 3
          if-no-files-found: error
