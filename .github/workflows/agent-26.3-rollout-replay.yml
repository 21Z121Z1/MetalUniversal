name: Agent Minecraft 26.3 rollout replay

on:
  push:
    branches:
      - agent/minecraft-26.3-renderpearl-migration-20260916
    paths:
      - '.github/workflows/agent-26.3-rollout-replay.yml'
      - '.github/ci/mc263-rollout-replay.tar.xz'

permissions:
  contents: write

jobs:
  replay:
    if: "github.event.head_commit.message == 'chore(agent): bootstrap Minecraft 26.3 rollout replay'"
    runs-on: macos-26-arm64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6

      - name: Verify replay base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "86017786bb7e00d5dc7b8496b95233f9ac020ba7"
          test "$(git rev-parse --abbrev-ref HEAD)" = "agent/minecraft-26.3-renderpearl-migration-20260916"

      - name: Replay successful Codex apply_patch operations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mc263-replay"
          tar -xJf .github/ci/mc263-rollout-replay.tar.xz -C "$RUNNER_TEMP/mc263-replay"
          python3 "$RUNNER_TEMP/mc263-replay/replay_codex_patchset.py" \
            "$RUNNER_TEMP/mc263-replay/mc263-rollout-successful.patchset" --root .
          git diff --check
          echo "=== replay diff stat ==="
          git diff --stat
          echo "=== replay changed files ==="
          git status --short

      - name: Compile and run Java tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon compileJava compileTestJava test -x buildIOSNative --console=plain

      - name: Commit replayed candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows/agent-26.3-rollout-replay.yml' ':!.github/ci/mc263-rollout-replay.tar.xz'
          git diff --cached --check
          git commit -m 'compat: replay Minecraft 26.3 runtime migration'
          git push origin HEAD:agent/minecraft-26.3-renderpearl-migration-20260916
