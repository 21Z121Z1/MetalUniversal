name: Codex persistent terrain GPU scene

on:
  push:
    branches:
      - codex/terrain-persistent-gpu-scene-20260829

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply native persistent scene ownership patch
        run: python3 .github/ci/patch_terrain_persistent_gpu_scene_native.py
      - name: Validate Java/native contracts
        run: |
          ./gradlew --no-daemon compileJava compileTestJava test \
            --tests com.metallum.client.metal.render.TerrainPersistentGpuSceneContractTest \
            --tests com.metallum.client.metal.render.TerrainPersistentGpuSceneNativeContractTest \
            --tests com.metallum.client.metal.render.TerrainGpuVisibilityProbeTest \
            buildMacNative buildIOSNative --rerun-tasks --console=plain
      - name: Commit validated native product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/java/com/metallum/client/metal/render/TerrainGpuVisibilityProbe.java \
                  src/main/java/com/metallum/client/metal/render/bridge/MetalNativeBridge.java \
                  src/main/native/MetallumNative.swift \
                  src/test/java/com/metallum/client/metal/render/TerrainPersistentGpuSceneNativeContractTest.java
          git commit -m 'feat(metal4): retain persistent terrain visibility scene on GPU'
          git push origin HEAD:${GITHUB_REF_NAME}
