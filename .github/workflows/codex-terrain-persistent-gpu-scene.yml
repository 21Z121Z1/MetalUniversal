name: Codex persistent terrain GPU scene

on:
  push:
    branches:
      - codex/terrain-persistent-gpu-scene-20260829

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply persistent scene identity patch
        run: python3 .github/ci/patch_terrain_persistent_gpu_scene_java.py
      - name: Validate Java scene contracts
        run: |
          ./gradlew --no-daemon compileJava compileTestJava test \
            --tests com.metallum.client.metal.render.TerrainPersistentGpuSceneContractTest \
            --tests com.metallum.client.metal.render.TerrainGpuVisibilityProbeTest \
            --tests com.metallum.client.metal.render.TerrainCandidateRegistryTest \
            --console=plain
      - name: Commit validated product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/java/com/metallum/client/metal/render/TerrainCandidateSnapshot.java \
                  src/main/java/com/metallum/client/metal/render/TerrainCandidateRegistry.java \
                  src/test/java/com/metallum/client/metal/render/TerrainPersistentGpuSceneContractTest.java
          git commit -m 'feat(terrain): separate persistent scene identity from camera epochs'
          git push origin HEAD:${GITHUB_REF_NAME}
