name: Codex parallel MSL artifact prewarm

on:
  push:
    branches:
      - codex/pso-cache-hit-parallel-prewarm-staging-20260829
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/pso-cache-hit-parallel-prewarm-staging-20260829
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply artifact-prewarm patch
        run: |
          python3 .github/ci/patch_pso_cache_hit_parallel_prewarm.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/com/metallum/client/metal/render/MetalCrossShaderCompiler.java')
          s = p.read_text().replace('@Nullable MetalMslDiskCache.Entry cached', 'MetalMslDiskCache.@Nullable Entry cached')
          p.write_text(s)
          p = Path('src/main/java/com/metallum/client/metal/render/MetalDevice.java')
          s = p.read_text().replace('@Nullable final MetalCrossShaderCompiler.CacheLookup preloadedLookup', 'final MetalCrossShaderCompiler.@Nullable CacheLookup preloadedLookup')
          p.write_text(s)
          PY
      - name: Validate prewarm contracts
        run: ./gradlew test --tests com.metallum.client.metal.render.MetalPsoArtifactPrewarmContractTest buildMacNative --no-daemon
      - name: Check patch hygiene
        run: |
          git diff --check
          git diff --stat
      - name: Commit validated product changes
        run: |
          git config user.name '21Z121Z1'
          git config user.email '89170834+21Z121Z1@users.noreply.github.com'
          git add src/main/java src/test/java
          if git diff --cached --quiet; then
            echo 'no product changes to commit'
            exit 1
          fi
          git commit -m 'perf(pipeline): parallelize stable MSL artifact prewarm'
          git push origin HEAD:codex/pso-cache-hit-parallel-prewarm-staging-20260829
