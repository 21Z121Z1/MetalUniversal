name: Codex Iris attachment last-use fact

on:
  push:
    branches:
      - codex/iris-attachment-last-use-20260829

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply authoritative last-use patch
        run: python3 .github/ci/patch_iris_attachment_last_use.py
      - name: Validate lifetime contracts
        run: |
          ./gradlew --no-daemon compileJava compileTestJava test \
            --tests com.metallum.client.metal.render.IrisMetalAttachmentLastUseContractTest \
            --tests com.metallum.client.metal.render.IrisMetalTransientAttachmentClassifierTest \
            --tests com.metallum.client.metal.render.IrisMetalAttachmentLifetimeCompilerTest \
            --console=plain
      - name: Commit validated product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/java/com/metallum/client/metal/render/IrisMetalOptimizationPlan.java \
                  src/main/java/com/metallum/client/metal/render/IrisMetalAttachmentLifetimeCompiler.java \
                  src/main/java/com/metallum/client/metal/render/IrisMetalTransientAttachmentClassifier.java \
                  src/test/java/com/metallum/client/metal/render/IrisMetalAttachmentLastUseContractTest.java
          git commit -m 'feat(iris): record authoritative attachment last use'
          git push origin HEAD:${GITHUB_REF_NAME}
