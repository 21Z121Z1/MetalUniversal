name: Agent MetalFX drawable sRGB 20260913

on:
  push:
    branches:
      - agent/metalfx-motion-coverage-26.2
    paths:
      - .github/agent-triggers/metalfx-drawable-srgb-20260913

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply narrow drawable color-space patch
        run: python3 .github/scripts/apply_metalfx_drawable_srgb.py
      - name: Focused Java contracts
        run: |
          ./gradlew --no-daemon test \
            --tests com.metallum.client.metal.render.FrameGenerationColorContractTest \
            --tests com.metallum.client.metal.render.MetalFrameGenerationNativeSourceContractTest
      - name: Compile native backend
        run: ./gradlew --no-daemon buildMacNative
      - name: Diff sanity
        run: git diff --check
      - name: Remove one-shot agent scaffolding
        run: |
          rm -f .github/scripts/apply_metalfx_drawable_srgb.py
          rm -f .github/workflows/agent-metalfx-drawable-srgb-20260913.yml
          rm -f .github/agent-triggers/metalfx-drawable-srgb-20260913
      - name: Commit verified product change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix(metalfx): tag drawable content as sRGB'
          git push origin HEAD:agent/metalfx-motion-coverage-26.2
