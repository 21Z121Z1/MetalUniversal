name: Codex Iris transient attachment classification

on:
  push:
    branches:
      - codex/iris-transient-attachment-classification-20260829

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply transient receipt classification
        run: python3 .github/ci/patch_iris_transient_classification.py
      - name: Validate classifier and attachment compiler
        run: |
          ./gradlew --no-daemon compileJava compileTestJava test \
            --tests com.metallum.client.metal.render.IrisMetalTransientAttachmentClassifierTest \
            --tests com.metallum.client.metal.render.IrisMetalAttachmentLifetimeCompilerTest \
            --rerun-tasks --console=plain
      - name: Commit validated production changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/java/com/metallum/client/metal/render/IrisMetalOptimizationPlan.java \
                  src/main/java/com/metallum/client/metal/render/IrisMetalAttachmentLifetimeCompiler.java
          git diff --cached --check
          git commit -m "feat(iris): publish pass-local transient attachment eligibility"
          git push origin HEAD:codex/iris-transient-attachment-classification-20260829
