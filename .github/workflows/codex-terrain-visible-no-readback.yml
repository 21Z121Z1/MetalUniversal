name: Codex terrain visible no-readback

on:
  push:
    branches:
      - codex/terrain-visible-no-readback-staging-20260829

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply no-readback optimization
        run: python3 .github/ci/patch_terrain_visible_no_readback.py
      - name: Focused contracts and native compile
        run: >-
          ./gradlew --no-daemon
          test --tests com.metallum.client.metal.render.Metal4TerrainVisibleIcbContractTest
          buildMacNative
          --rerun-tasks --console=plain
      - name: Commit validated source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main src/test
          git diff --cached --check
          git commit -m "perf(metal4): avoid visible-only CPU readback"
          git push origin HEAD:codex/terrain-visible-no-readback-staging-20260829
