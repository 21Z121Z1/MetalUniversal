name: Upstream 26.3 baseline
on:
  push:
    branches: [agent/upstream-26.3-workbench-20260923]
    paths: [.github/workflows/upstream-baseline.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: EternityQwQ/MetalUniversal
          ref: f8294b2fb6ce2edc56d418510294111c9276091e
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Build exact unmodified upstream
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f8294b2fb6ce2edc56d418510294111c9276091e
          ./gradlew --no-daemon --stacktrace build -x buildIOSNative -x buildIOSSpvc
      - name: Preserve baseline source identity
        if: always()
        run: |
          mkdir -p build/baseline
          git rev-parse HEAD > build/baseline/source-sha.txt
          git status --porcelain > build/baseline/worktree.txt
          cp gradle.properties gradle/wrapper/gradle-wrapper.properties build/baseline/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: upstream-baseline-${{ matrix.os }}
          path: |
            build/baseline/
            build/reports/
            build/libs/
          retention-days: 7
