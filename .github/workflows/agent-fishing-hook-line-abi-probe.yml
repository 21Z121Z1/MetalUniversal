name: Agent Fishing Hook line ABI probe

on:
  push:
    branches: [agent/metalfx-motion-coverage-26.2]

permissions:
  contents: read

jobs:
  semantic_contracts:
    if: "github.event.head_commit.message == 'chore(agent): run registered MetalFX semantic patch'"
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 32
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Reprove Minecraft 26.2 ItemStack lifetime identity
        shell: bash
        run: |
          set -euo pipefail
          URL='https://raw.githubusercontent.com/366862732/DirectXmod/a599796f89eddfe0387c95b119b16aaa452d1166/docs/official-262/net/minecraft/world/item/ItemStack.java'
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error "$URL" -o /tmp/ItemStack.java
          grep -F 'public static boolean matches(ItemStack a, ItemStack b)' /tmp/ItemStack.java
          grep -F 'if (a.getCount() != b.getCount())' /tmp/ItemStack.java
          grep -F 'return ItemStack.isSameItemSameComponents(a, b);' /tmp/ItemStack.java

      - name: Apply bounded semantic patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_metalfx_semantic_contracts_20260911_v2.py
          git diff --check

      - name: Verify fail-closed production gates remain closed
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'private static final boolean OBJECT_MOTION_PRODUCER_CONNECTED = false;' src/main/java/com/metallum/client/metal/render/MetalFxManager.java
          grep -F 'UNPROVEN_RGBA8_UNORM_SRGB_VIEW' src/main/java/com/metallum/client/metal/render/FrameSynthesisContract.java
          grep -F 'MetalSyntheticExactMotion.beginFirstPerson(hand, itemStack);' src/main/java/com/metallum/mixin/render/ItemInHandRendererMetalFxMixin.java
          ! grep -F 'MetalSyntheticExactMotion.beginFirstPerson(hand);' src/main/java/com/metallum/mixin/render/ItemInHandRendererMetalFxMixin.java
          test "$(grep -c 'descriptor.isAutoExposureEnabled = true' src/main/native/MetallumNative.swift)" -eq 2
          ! grep -F 'descriptor.isAutoExposureEnabled = false' src/main/native/MetallumNative.swift

      - name: Compile and test semantic-contract increment
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew compileJava test \
            --tests 'com.metallum.client.metal.render.MetalSyntheticExactMotionTest' \
            --tests 'com.metallum.client.metal.render.MetalFxTemporalExposureContractTest' \
            --tests 'com.metallum.client.metal.render.MetalPreviousVertexHistoryTest' \
            --tests 'com.metallum.client.metal.render.MetalExactMotionCoverageTest' \
            --tests 'com.metallum.client.metal.render.FrameSynthesisContractTest'
          ./gradlew jar
          git diff --check

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/native/MetallumNative.swift \
                  src/main/java/com/metallum/client/metal/render/MetalSyntheticExactMotion.java \
                  src/main/java/com/metallum/client/metal/render/MetalFxManager.java \
                  src/main/java/com/metallum/mixin/render/ItemInHandRendererMetalFxMixin.java \
                  src/test/java/com/metallum/client/metal/render/MetalSyntheticExactMotionTest.java \
                  src/test/java/com/metallum/client/metal/render/MetalFxTemporalExposureContractTest.java
          git diff --cached --check
          git commit -m 'feat(metalfx): close exposure and first-person lifetime contracts'
          git push origin HEAD:agent/metalfx-motion-coverage-26.2
