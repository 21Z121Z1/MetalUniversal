name: hosted-metal-performance-experiment

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/hosted-metal-performance-ci

permissions:
  contents: read

concurrency:
  group: hosted-metal-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-state-in-jvm-paired:
    name: render state in-JVM paired
    runs-on: macos-26
    timeout-minutes: 45
    env:
      MTL_DEBUG_LAYER: '0'
      MTL_SHADER_VALIDATION: '0'
      MTL_HUD_ENABLED: '0'
      MTLFX_HUD_ENABLED: '0'
      METALLUM_HOSTED_METAL_OFFSCREEN: 'true'
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v6

      - name: Describe hosted Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          sw_vers
          system_profiler SPHardwareDataType SPDisplaysDataType || true
          test "$(uname -m)" = "arm64"

      - name: Prove real hosted Metal compute and readback
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -O -framework Metal \
            .github/ci/HostedMetalCapabilityProbe.swift \
            -o "$RUNNER_TEMP/hosted-metal-gpu-probe"
          "$RUNNER_TEMP/hosted-metal-gpu-probe" | tee "$RUNNER_TEMP/hosted-metal-capability.txt"
          grep -Fq 'HOSTED_METAL_GPU_PROBE_PASS' "$RUNNER_TEMP/hosted-metal-capability.txt"

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Build production native bridge and benchmark classes
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace buildMacNative testClasses

      - name: Re-run hosted Metal integration correctness gate
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace hostedMetalExtendedIntegrationTest

      - name: Run direct-vs-packet pairs inside one JVM
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/hosted-metal-perf
          mkdir -p "$RUNNER_TEMP/hosted-metal-perf"
          JAVA_TOOL_OPTIONS="-Dmetallum.perf.hosted=true -Dmetallum.opt.renderCommandPacket=false -Dmetallum.opt.renderStatePacket=false -Dmetallum.hotpath.telemetry=false" \
            ./gradlew --no-daemon --stacktrace cleanTest test \
              --tests com.metallum.client.metal.render.mtl.HostedMetalStatePathPairedBenchmark
          test -s build/hosted-metal-perf/in-jvm-paired.json
          cp build/hosted-metal-perf/in-jvm-paired.json \
            "$RUNNER_TEMP/hosted-metal-perf/in-jvm-paired.json"

      - name: Summarize paired result
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'hosted-metal-perf' / 'in-jvm-paired.json'
          data = json.loads(path.read_text())
          delta = data['paired_median_delta_percent']
          improvement = data['paired_median_improvement_percent']
          print(json.dumps(data, indent=2))
          print(f"HOSTED_METAL_IN_JVM_RESULT paired_delta={delta:+.3f}% paired_improvement={improvement:+.3f}%")
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as out:
                  out.write('## Hosted Metal in-JVM paired experiment\n\n')
                  out.write('Direct critical FFM setters vs render-state packet serialization/native decode. ') 
                  out.write('Negative delta means packet mode is faster.\n\n')
                  out.write('| Metric | Legacy | Packet |\n|---|---:|---:|\n')
                  out.write(f"| Median | {data['legacy_median_ns']/1e6:.3f} ms | {data['packet_median_ns']/1e6:.3f} ms |\n")
                  out.write(f"| p95 | {data['legacy_p95_ns']/1e6:.3f} ms | {data['packet_p95_ns']/1e6:.3f} ms |\n")
                  out.write(f"| ns/state op | {data['legacy_median_ns_per_state_op']:.2f} | {data['packet_median_ns_per_state_op']:.2f} |\n\n")
                  out.write(f"Paired median delta: **{delta:+.2f}%**; improvement: **{improvement:+.2f}%**.\n\n")
                  out.write(f"Order check — legacy-first: {data['legacy_first_median_delta_percent']:+.2f}%; packet-first: {data['packet_first_median_delta_percent']:+.2f}%.\n")
          PY

      - name: Preserve experiment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hosted-metal-performance-${{ github.run_number }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/hosted-metal-capability.txt
            ${{ runner.temp }}/hosted-metal-perf/*.json
            build/reports/tests/**
            build/test-results/**
