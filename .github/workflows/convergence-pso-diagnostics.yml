# Temporary controlled experiment; remove before final main acceptance.
name: Convergence PSO diagnostics
on:
  push:
    branches: [convergence/main-unification-20260923]
    paths: [.github/workflows/convergence-pso-diagnostics.yml]
permissions:
  contents: read
jobs:
  cold-start-controls:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      MTL_DEBUG_LAYER: '0'
      MTL_SHADER_VALIDATION: '0'
      METALLUM_PSO_COMPILE_HOP: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Build unchanged shipping library
        run: ./gradlew --no-daemon --stacktrace buildMacNative
      - name: Compare fresh-process thread and HUD controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, signal, subprocess
          root = pathlib.Path.cwd()
          output = root / 'build/agent-evidence/pso-controls'
          output.mkdir(parents=True)
          native = root / 'src/main/resources/natives/macos/libmetallum.dylib'
          def replace_once(source, before, after):
              if source.count(before) != 1:
                  raise RuntimeError('Diagnostic adaptation no longer matches the reviewed probe: ' + before)
              return source.replace(before, after, 1)
          swift_path = root / 'src/test/native/MetalShippingPipelineAbiSmokeTest.swift'
          swift = swift_path.read_text()
          swift = replace_once(swift, 'guard CommandLine.arguments.count == 2 else {',
              'guard CommandLine.arguments.count == 3, ["main-only", "background-only", "warm-background"].contains(CommandLine.arguments[2]) else {')
          swift = replace_once(swift, '    try runSequence(symbols)\n    print("SHIPPING_PIPELINE_C_ABI_PASS device=shipping-dylib format=rgba8Unorm")',
              '    if CommandLine.arguments[2] != "background-only" {\n        try runSequence(symbols)\n        print("SHIPPING_PIPELINE_C_ABI_PASS device=shipping-dylib format=rgba8Unorm")\n    }\n    if CommandLine.arguments[2] == "main-only" { return }')
          swift = replace_once(swift, 'private func runSequence(_ symbols: Symbols) throws {',
              'private func runSequence(_ symbols: Symbols) throws {\n    fputs("PROBE_PHASE sequence-start nativeMain=\\(Thread.isMainThread)\\n", stderr)')
          for token, phase in [('    guard let device = symbols.createDevice()', 'device'),
                               ('    let vertexFunction: UnsafeMutableRawPointer? =', 'vertex-function'),
                               ('    let fragmentFunction: UnsafeMutableRawPointer? =', 'fragment-function'),
                               ('    guard let descriptor = symbols.createDescriptor()', 'descriptor'),
                               ('    guard let pipeline = symbols.makePipeline(device, descriptor)', 'pipeline')]:
              swift = replace_once(swift, token, '    fputs("PROBE_PHASE ' + phase + '\\n", stderr)\n' + token)
          (output / swift_path.name).write_text(swift)
          swift_executable = output / 'shipping-probe'
          subprocess.run(['xcrun', 'swiftc', '-O', '-target', 'arm64-apple-macosx14.0', '-framework', 'Foundation',
                          '-framework', 'Metal', str(output / swift_path.name), '-o', str(swift_executable)], check=True)
          java_path = root / '.github/ci/JvmPsoThreadingProbe.java'
          java = java_path.read_text()
          java = replace_once(java, 'if (args.length != 1) {',
              'if (args.length != 2 || !java.util.Set.of("java-main", "background", "warm-background").contains(args[1])) {')
          java = replace_once(java, '        final SymbolLookup lookup =',
              '        final String mode = args[1];\n        final SymbolLookup lookup =')
          java = replace_once(java, '            try (Arena arena = Arena.ofConfined()) {',
              '            try (Arena arena = Arena.ofConfined()) {\n                MethodHandle isMain = LINKER.downcallHandle(LINKER.defaultLookup().findOrThrow("pthread_main_np"), FunctionDescriptor.of(ValueLayout.JAVA_INT));\n                System.err.println("PROBE_PHASE sequence-start nativeMain=" + (int) isMain.invokeExact() + " javaThread=" + Thread.currentThread().getName());')
          for token, phase in [('                final MemorySegment device =', 'device'),
                               ('                final MemorySegment vertex =', 'vertex-function'),
                               ('                final MemorySegment fragment =', 'fragment-function'),
                               ('                final MemorySegment descriptor =', 'descriptor'),
                               ('                final MemorySegment pipeline =', 'pipeline')]:
              java = replace_once(java, token, '                System.err.println("PROBE_PHASE ' + phase + '");\n' + token)
          java = replace_once(java, '        worker.start();\n        worker.join();',
              '        if (mode.equals("java-main")) {\n            worker.run();\n        } else {\n            if (mode.equals("warm-background")) {\n                worker.run();\n                if (!passed[0]) throw new IllegalStateException("warmup failed: " + failure[0]);\n                passed[0] = false;\n            }\n            worker.start();\n            worker.join();\n        }')
          java = replace_once(java, 'System.out.println("JVM_PSO_BACKGROUND_THREAD_PASS");',
              'System.out.println("JVM_PSO_SEQUENCE_PASS mode=" + mode);')
          (output / java_path.name).write_text(java)
          identity = {'sourceSha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                      'nativeSha256': hashlib.file_digest(native.open('rb'), 'sha256').hexdigest(),
                      'originalProbeSha256': {str(path.relative_to(root)): hashlib.sha256(path.read_bytes()).hexdigest()
                          for path in (swift_path, java_path)},
                      'scope': 'controlled diagnostics only; never changes required test selection',
                      'cases': []}
          for hud in ('0', '1'):
              cases = [('swift-' + mode, [str(swift_executable), str(native), mode])
                       for mode in ('main-only', 'background-only', 'warm-background')]
              cases += [('java-' + mode, ['java', '--enable-native-access=ALL-UNNAMED',
                         '-XX:ErrorFile=' + str(output / 'hs_err_pid%p.log'), str(output / java_path.name), str(native), mode])
                        for mode in ('java-main', 'background', 'warm-background')]
              for label, command in cases:
                  name = label + '-hud-' + hud
                  record = {'name': name, 'hud': hud, 'command': command, 'returnCode': None, 'timedOut': False}
                  with (output / (name + '.log')).open('w') as log:
                      process = subprocess.Popen(command, stdout=log, stderr=subprocess.STDOUT, start_new_session=True,
                          env={**os.environ, 'MTL_HUD_ENABLED': hud, 'MTLFX_HUD_ENABLED': hud})
                      try:
                          record['returnCode'] = process.wait(timeout=120)
                      except subprocess.TimeoutExpired:
                          record['timedOut'] = True
                          os.killpg(process.pid, signal.SIGKILL)
                          record['returnCode'] = process.wait(timeout=30)
                  identity['cases'].append(record)
                  (output / 'results.json').write_text(json.dumps(identity, indent=2) + '\n')
                  print(name, record['returnCode'], 'timeout=' + str(record['timedOut']))
          failed = [row['name'] for row in identity['cases'] if row['returnCode'] != 0 or row['timedOut']]
          if failed:
              raise SystemExit('Observed failing controls (full logs and JVM crash files retained): ' + ', '.join(failed))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: convergence-pso-controls-${{ github.sha }}-${{ github.run_attempt }}
          path: build/agent-evidence/pso-controls/
          if-no-files-found: error
          retention-days: 14
