name: Codex Iris heap alias runtime

on:
  push:
    branches:
      - codex/iris-placement-heap-alias-staging-20260829

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply runtime publication patch
        run: python3 .github/ci/patch_iris_heap_alias_runtime.py
      - name: Validate heap recipe/runtime contracts
        run: |
          ./gradlew --no-daemon compileJava compileTestJava test \
            --tests com.metallum.client.metal.render.IrisMetalHeapAliasRecipeTest \
            --console=plain
      - name: Commit validated runtime product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/java/com/metallum/client/metal/render/IrisMetalHeapAliasRuntime.java \
                  src/main/java/com/metallum/client/metal/render/IrisMetalOptimizationBootstrap.java
          git commit -m 'feat(iris): publish heap alias recipe for reallocations'
          git push origin HEAD:${GITHUB_REF_NAME}
