name: Minecraft 26.3 migration

on:
  workflow_dispatch:
  push:
    branches:
      - integration/metaluniversal
  pull_request:
    branches:
      - integration/metaluniversal
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/minecraft-26.3-migration.yml'

permissions:
  contents: read

env:
  METALLUM_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: minecraft-26.3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  java-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.METALLUM_SOURCE_SHA }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Verify active version identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$METALLUM_SOURCE_SHA"
          test "$(sed -n 's/^minecraft_version=//p' gradle.properties | head -n1)" = '26.3'
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('src/main/resources/fabric.mod.json').read_text(encoding='utf-8'))
          supported = str(data.get('depends', {}).get('minecraft', ''))
          if '1.26.3' not in supported and '26.3' not in supported:
              raise SystemExit(f'fabric.mod.json does not target Minecraft 26.3: {supported!r}')
          PY
      - name: Compile and run Java contracts
        run: |
          cat > "$RUNNER_TEMP/non-metal-tests.gradle" <<'GRADLE'
          allprojects {
              tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
                  filter {
                      excludeTestsMatching('com.metallum.client.metal.render.TerrainGpuVisibilityProbeContractTest.invalidOrUnavailableNativeProbeInputsFallbackBeforeDispatch')
                  }
              }
          }
          GRADLE
          ./gradlew --no-daemon --stacktrace \
            -I "$RUNNER_TEMP/non-metal-tests.gradle" \
            compileJava test verifyProductionJarIsolation \
            -x buildMacNative -x buildIOSNative -x buildIOSSpvc
      - name: Preserve test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minecraft-26.3-contracts-${{ github.run_attempt }}
          path: |
            build/reports/tests/
            build/test-results/
            build/reports/problems/
          if-no-files-found: warn
          retention-days: 7
