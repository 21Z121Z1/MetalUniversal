name: hosted-metal-gpu-probe

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mobilegl-inspired-hotpath
  pull_request:
    branches:
      - feature/mobilegl-inspired-hotpath

concurrency:
  group: hosted-metal-gpu-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-offscreen-required:
    name: hosted offscreen Metal required
    runs-on: macos-26
    env:
      MTL_DEBUG_LAYER: '0'
      MTL_SHADER_VALIDATION: '0'
      MTL_HUD_ENABLED: '0'
      MTLFX_HUD_ENABLED: '0'
      METALLUM_HOSTED_METAL_OFFSCREEN: 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Describe hosted Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          echo "CI=${CI:-<unset>}"
          uname -a
          sw_vers
          system_profiler SPHardwareDataType SPDisplaysDataType || true
          test "$(uname -m)" = "arm64"

      - name: Compile and execute real Metal compute/readback capability probe
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -O -framework Metal \
            .github/ci/HostedMetalCapabilityProbe.swift \
            -o "$RUNNER_TEMP/hosted-metal-gpu-probe"
          "$RUNNER_TEMP/hosted-metal-gpu-probe"

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Run proven production, render-contract and Iris GPU gates
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --stacktrace \
            metalMrtSmokeTest \
            metalFrameGenerationLifecycleTest \
            verifyIsolatedClientProfiles \
            metalMrtBackendIntegrationTest \
            metalComputeBackendIntegrationTest \
            metalIrisTargetsIntegrationTest \
            hostedMetalExtendedIntegrationTest \
            renderContractMetal3NativeTest \
            renderContractMetal4NativeTest

      - name: Require extended suite to execute rather than skip
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = glob.glob('build/test-results/hostedMetalExtendedIntegrationTest/TEST-*.xml')
          if not files:
              raise SystemExit('hostedMetalExtendedIntegrationTest produced no JUnit XML')
          tests = skipped = failures = errors = 0
          for path in files:
              root = ET.parse(path).getroot()
              tests += int(root.attrib.get('tests', 0))
              skipped += int(root.attrib.get('skipped', 0))
              failures += int(root.attrib.get('failures', 0))
              errors += int(root.attrib.get('errors', 0))
          print(f'extended tests={tests} executed={tests-skipped} skipped={skipped} failures={failures} errors={errors}')
          if tests == 0 or skipped != 0 or failures != 0 or errors != 0:
              raise SystemExit('extended hosted Metal suite did not fully execute cleanly')
          PY

      - name: Preserve required test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-metal-required-${{ github.run_attempt }}
          path: |
            hs_err_pid*.log
            build/reports/tests/**
            build/test-results/**
          if-no-files-found: ignore

  hosted-capability-and-physical-harness-compile-required:
    name: capability policy and physical-only harness compile
    runs-on: macos-26
    env:
      MTL_HUD_ENABLED: '0'
      MTLFX_HUD_ENABLED: '0'
      MTL_DEBUG_LAYER: '0'
      MTL_SHADER_VALIDATION: '0'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Validate policy, Metal 4 fallback and compile physical-only harnesses
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --stacktrace \
            verifyMetalCapabilityPolicy \
            metal4PipelineSmokeTest \
            metal4PipelinePathTest \
            compileMetalFxOffscreenValidation \
            compileMetalFxPerformanceValidation \
            compileMetalFrameGenerationPresentationValidation

      - name: Execute hosted HUD layer and selector contract
        shell: bash
        env:
          MTL_HUD_ENABLED: '1'
          MTLFX_HUD_ENABLED: '1'
        run: |
          set -euo pipefail
          ./gradlew --stacktrace metalHudRuntimeTest

      - name: Classify hosted MetalFX runtime capability
        shell: bash
        run: |
          set -uo pipefail
          binary="build/metal-tests/MetalFXOffscreenValidation"
          test -x "$binary"
          out="$RUNNER_TEMP/metalfx-hosted"
          rm -rf "$out"
          set +e
          "$binary" "$out" 2>&1 | tee "$RUNNER_TEMP/metalfx-hosted.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 0 ]; then
            echo 'HOSTED_METALFX_TEMPORAL_SUPPORTED=true' | tee -a "$GITHUB_STEP_SUMMARY"
          elif grep -Fq 'MTLFXTemporalScaler is unsupported on this device' "$RUNNER_TEMP/metalfx-hosted.log"; then
            echo 'HOSTED_METALFX_TEMPORAL_SUPPORTED=false' | tee -a "$GITHUB_STEP_SUMMARY"
            echo 'MetalFX runtime remains physical-capability gated; core Metal execution is covered separately.' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Unexpected MetalFX runtime failure: $rc" >&2
            exit "$rc"
          fi

  ios-native-cross-build-required:
    name: iPhoneOS arm64 native and SPIRV-Cross required
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Run project iOS native and SPIRV-Cross builds
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --stacktrace buildIOSNative buildIOSSpvc
          file src/main/resources/natives/ios/libmetallum.dylib
          file src/main/resources/natives/ios/libspvc.dylib
          xcrun vtool -show-build src/main/resources/natives/ios/libmetallum.dylib | grep -Eiq 'platform[[:space:]]+(IOS|2)'
          xcrun vtool -show-build src/main/resources/natives/ios/libspvc.dylib | grep -Eiq 'platform[[:space:]]+(IOS|2)'
          lipo -info src/main/resources/natives/ios/libmetallum.dylib | grep -q arm64
          lipo -info src/main/resources/natives/ios/libspvc.dylib | grep -q arm64

      - name: Independently cross-compile shipping Swift ABI for iPhoneOS
        id: build
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          artifact="$RUNNER_TEMP/libmetallum-ios.dylib"
          xcrun --sdk iphoneos swiftc \
            -O -whole-module-optimization -emit-library \
            -module-name metallum_native \
            -target arm64-apple-ios16.0 -sdk "$sdk" \
            -framework Foundation -framework Metal -framework MetalFX -framework QuartzCore \
            -o "$artifact" \
            src/main/native/MetalFrameGenerationLifecycle.swift \
            src/main/native/MetallumInterface.swift \
            src/main/native/MetallumNative.swift
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Verify iPhoneOS Mach-O and exported ABI
        shell: bash
        run: |
          set -euo pipefail
          artifact="${{ steps.build.outputs.artifact }}"
          file "$artifact"
          lipo -info "$artifact" | grep -q arm64
          xcrun vtool -show-build "$artifact" | tee "$RUNNER_TEMP/vtool-ios.txt"
          grep -Eiq 'platform[[:space:]]+(IOS|2)' "$RUNNER_TEMP/vtool-ios.txt"
          otool -L "$artifact" | grep -q '/System/Library/Frameworks/Metal.framework/'
          nm -gU "$artifact" | grep -q 'metallum_create_system_default_device'

  ios-simulator-metal-runtime-required:
    name: iOS Simulator host-GPU Metal runtime required
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Select and boot an iOS Simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime, devices in d["devices"].items() if "iOS" in runtime for x in devices if x.get("isAvailable") and x.get("name", "").startswith("iPhone")))')"
          test -n "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b

      - name: Compile simulator Metal compute and MRT executables
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun --sdk iphonesimulator swiftc -O \
            -target arm64-apple-ios16.0-simulator -sdk "$sdk" -framework Metal \
            .github/ci/HostedMetalCapabilityProbe.swift \
            -o "$RUNNER_TEMP/HostedMetalProbe"
          xcrun --sdk iphonesimulator swiftc -O \
            -target arm64-apple-ios16.0-simulator -sdk "$sdk" \
            -framework Foundation -framework Metal \
            src/test/native/MetalMRTSmokeTest.swift \
            -o "$RUNNER_TEMP/MetalMRTProbe"

      - name: Package, install and launch probes as Simulator apps
        shell: bash
        run: |
          set -euo pipefail
          udid="${{ steps.simulator.outputs.udid }}"
          make_app() {
            local exe="$1" name="$2" bundle="$3" expected="$4"
            local app="$RUNNER_TEMP/${name}.app"
            mkdir -p "$app"
            cp "$exe" "$app/$name"
            cat > "$app/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>${name}</string>
          <key>CFBundleIdentifier</key><string>${bundle}</string>
          <key>CFBundleName</key><string>${name}</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>1.0</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>LSRequiresIPhoneOS</key><true/>
          <key>MinimumOSVersion</key><string>16.0</string>
          <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
          </dict></plist>
          PLIST
            codesign --force --sign - --timestamp=none "$app"
            xcrun simctl install "$udid" "$app"

            local container result output rc
            container="$(xcrun simctl get_app_container "$udid" "$bundle" data)"
            test -n "$container"
            result="$container/tmp/metallum-ci-result.txt"
            rm -f "$result"

            set +e
            output="$(xcrun simctl launch --console "$udid" "$bundle" 2>&1)"
            rc=$?
            set -e
            printf '%s\n' "$output"
            echo "simctl launch rc=$rc; awaiting app success sentinel at $result"

            for attempt in $(seq 1 30); do
              if [ -f "$result" ]; then
                break
              fi
              sleep 1
            done
            if [ ! -f "$result" ]; then
              echo "Simulator app did not persist its success sentinel." >&2
              xcrun simctl spawn "$udid" log show --last 2m --style compact \
                --predicate "process == '$name'" || true
              exit 1
            fi
            cat "$result"
            grep -Fq "$expected" "$result"
          }
          make_app "$RUNNER_TEMP/HostedMetalProbe" HostedMetalProbe com.metallum.ci.metalprobe HOSTED_METAL_GPU_PROBE_PASS
          make_app "$RUNNER_TEMP/MetalMRTProbe" MetalMRTProbe com.metallum.ci.mrtprobe 'MRT smoke passed'

      - name: Shutdown Simulator
        if: always()
        shell: bash
        run: xcrun simctl shutdown "${{ steps.simulator.outputs.udid }}" || true
