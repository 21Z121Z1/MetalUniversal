name: hosted-metal-gpu-probe

on:
  workflow_dispatch:
  push:
    branches:
      - ci/hosted-metal-gpu-probe-20260810

concurrency:
  group: hosted-metal-gpu-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-offscreen-required:
    name: hosted offscreen Metal required
    runs-on: macos-26
    env:
      MTL_DEBUG_LAYER: '0'
      MTL_SHADER_VALIDATION: '0'
      MTL_HUD_ENABLED: '0'
      MTLFX_HUD_ENABLED: '0'
      METALLUM_HOSTED_METAL_OFFSCREEN: 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Describe hosted Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          echo "CI=${CI:-<unset>}"
          uname -a
          sw_vers
          system_profiler SPHardwareDataType SPDisplaysDataType || true
          test "$(uname -m)" = "arm64"

      - name: Compile and execute real Metal compute/readback capability probe
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -O -framework Metal \
            .github/ci/HostedMetalCapabilityProbe.swift \
            -o "$RUNNER_TEMP/hosted-metal-gpu-probe"
          "$RUNNER_TEMP/hosted-metal-gpu-probe"

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Run proven hosted-offscreen production gates
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --stacktrace \
            metalMrtSmokeTest \
            metalFrameGenerationLifecycleTest \
            verifyIsolatedClientProfiles \
            metalMrtBackendIntegrationTest \
            metalComputeBackendIntegrationTest \
            metalIrisTargetsIntegrationTest

      - name: Preserve required test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-metal-required-${{ github.run_attempt }}
          path: |
            hs_err_pid*.log
            build/reports/tests/**
            build/test-results/**
          if-no-files-found: ignore

  hosted-capability-required:
    name: hosted Metal capability and fallback contract
    runs-on: macos-26
    env:
      MTL_HUD_ENABLED: '0'
      MTLFX_HUD_ENABLED: '0'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Compile shipping native module and validate Metal 4 capability fallback
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --stacktrace \
            metal4PipelineSmokeTest \
            metal4PipelinePathTest

  hosted-render-contract-candidate:
    name: render-contract / ${{ matrix.task }}
    runs-on: macos-26
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        task:
          - renderContractMetal3NativeTest
          - renderContractMetal4NativeTest
    env:
      MTL_DEBUG_LAYER: '0'
      MTL_SHADER_VALIDATION: '0'
      MTL_HUD_ENABLED: '0'
      MTLFX_HUD_ENABLED: '0'
      METALLUM_HOSTED_METAL_OFFSCREEN: 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Run render-contract candidate in isolation
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --stacktrace \
            -I .github/ci/hosted-metal-offscreen.gradle \
            "${{ matrix.task }}"

      - name: Preserve render-contract reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-render-contract-${{ matrix.task }}-${{ github.run_attempt }}
          path: |
            hs_err_pid*.log
            build/reports/tests/**
            build/test-results/**
          if-no-files-found: ignore

  hosted-junit-candidate:
    name: junit / ${{ matrix.test_class }}
    runs-on: macos-26
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        test_class:
          - com.metallum.client.metal.render.IrisMetalBundledTerrainPipelineTest
          - com.metallum.client.metal.render.IrisMetalPostChainCompilationTest
          - com.metallum.client.metal.render.IrisMetalShadowPipelineTest
          - com.metallum.client.metal.render.IrisMetalShadowComputeConformanceTest
          - com.metallum.client.metal.render.MetalGenericVertexAttributeIntegrationTest
          - com.metallum.client.metal.render.MetalIrisCustomTexturesIntegrationTest
          - com.metallum.client.metal.render.MetalRenderContractGpuIntegrationTest
    env:
      MTL_DEBUG_LAYER: '0'
      MTL_SHADER_VALIDATION: '0'
      MTL_HUD_ENABLED: '0'
      MTLFX_HUD_ENABLED: '0'
      METALLUM_HOSTED_METAL_OFFSCREEN: 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Run normally CI-excluded class in isolation
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --stacktrace \
            -I .github/ci/hosted-metal-offscreen.gradle \
            -PhostedMetalJUnitClass="${{ matrix.test_class }}" \
            hostedMetalGpuJUnit

      - name: Report executed versus skipped tests
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET
          files = glob.glob('build/test-results/hostedMetalGpuJUnit/TEST-*.xml')
          tests = skipped = failures = errors = 0
          for path in files:
              root = ET.parse(path).getroot()
              tests += int(root.attrib.get('tests', 0))
              skipped += int(root.attrib.get('skipped', 0))
              failures += int(root.attrib.get('failures', 0))
              errors += int(root.attrib.get('errors', 0))
          executed = tests - skipped
          line = f"tests={tests} executed={executed} skipped={skipped} failures={failures} errors={errors}"
          print(line)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(line + '\n')
              if tests and executed == 0:
                  f.write('Result is fixture/capability skipped; do not promote as an executed GPU gate.\n')
          if not files:
              raise SystemExit('No JUnit XML produced; candidate task did not execute as expected')
          PY

      - name: Preserve candidate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-junit-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: |
            hs_err_pid*.log
            build/reports/tests/hostedMetalGpuJUnit/**
            build/test-results/hostedMetalGpuJUnit/**
          if-no-files-found: ignore

  ios-native-cross-build-candidate:
    name: iOS production native arm64 cross-build candidate
    runs-on: macos-26
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Compile shipping Swift native module for iPhoneOS
        id: build
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          artifact="$RUNNER_TEMP/libmetallum-ios.dylib"
          xcrun --sdk iphoneos swiftc \
            -O \
            -whole-module-optimization \
            -emit-library \
            -module-name metallum_native \
            -target arm64-apple-ios16.0 \
            -sdk "$sdk" \
            -framework Foundation \
            -framework Metal \
            -framework MetalFX \
            -framework QuartzCore \
            -o "$artifact" \
            src/main/native/MetalFrameGenerationLifecycle.swift \
            src/main/native/MetallumInterface.swift \
            src/main/native/MetallumNative.swift
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Verify iPhoneOS Mach-O platform contract and exported ABI
        shell: bash
        run: |
          set -euo pipefail
          artifact="${{ steps.build.outputs.artifact }}"
          file "$artifact"
          lipo -info "$artifact" | grep -q arm64
          xcrun vtool -show-build "$artifact" | tee "$RUNNER_TEMP/vtool-ios.txt"
          grep -Eiq 'platform[[:space:]]+(IOS|2)' "$RUNNER_TEMP/vtool-ios.txt"
          otool -L "$artifact" | grep -q '/System/Library/Frameworks/Metal.framework/'
          nm -gU "$artifact" | grep -q 'metallum_create_system_default_device'

  ios-simulator-metal-runtime-candidate:
    name: iOS Simulator Metal runtime candidate
    runs-on: macos-26
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Select and boot an iOS Simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime, devices in d["devices"].items() if "iOS" in runtime for x in devices if x.get("isAvailable") and x.get("name", "").startswith("iPhone")))')"
          test -n "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b

      - name: Compile Metal compute and MRT probes for iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun --sdk iphonesimulator swiftc \
            -O \
            -target arm64-apple-ios16.0-simulator \
            -sdk "$sdk" \
            -framework Metal \
            .github/ci/HostedMetalCapabilityProbe.swift \
            -o "$RUNNER_TEMP/hosted-metal-sim-probe"
          xcrun --sdk iphonesimulator swiftc \
            -O \
            -target arm64-apple-ios16.0-simulator \
            -sdk "$sdk" \
            -framework Foundation \
            -framework Metal \
            src/test/native/MetalMRTSmokeTest.swift \
            -o "$RUNNER_TEMP/metal-mrt-sim-probe"

      - name: Execute compute and MRT readback inside iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          udid="${{ steps.simulator.outputs.udid }}"
          sim_tmp="$HOME/Library/Developer/CoreSimulator/Devices/$udid/data/tmp"
          mkdir -p "$sim_tmp"
          cp "$RUNNER_TEMP/hosted-metal-sim-probe" "$sim_tmp/hosted-metal-sim-probe"
          cp "$RUNNER_TEMP/metal-mrt-sim-probe" "$sim_tmp/metal-mrt-sim-probe"
          chmod +x "$sim_tmp/hosted-metal-sim-probe" "$sim_tmp/metal-mrt-sim-probe"
          xcrun simctl spawn "$udid" /tmp/hosted-metal-sim-probe
          xcrun simctl spawn "$udid" /tmp/metal-mrt-sim-probe

      - name: Shutdown Simulator
        if: always()
        shell: bash
        run: xcrun simctl shutdown "${{ steps.simulator.outputs.udid }}" || true
