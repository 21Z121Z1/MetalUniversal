name: hosted-metal-gpu-probe

on:
  workflow_dispatch:
  push:
    branches:
      - ci/hosted-metal-gpu-probe-20260810

jobs:
  hosted-offscreen-required:
    name: hosted offscreen Metal required
    runs-on: macos-26
    env:
      MTL_DEBUG_LAYER: '0'
      MTL_SHADER_VALIDATION: '0'
      MTL_HUD_ENABLED: '0'
      MTLFX_HUD_ENABLED: '0'
      METALLUM_HOSTED_METAL_OFFSCREEN: 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Describe hosted Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          echo "CI=${CI:-<unset>}"
          uname -a
          sw_vers
          system_profiler SPHardwareDataType SPDisplaysDataType || true
          test "$(uname -m)" = "arm64"

      - name: Compile and execute real Metal compute/readback capability probe
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -O -framework Metal \
            .github/ci/HostedMetalCapabilityProbe.swift \
            -o "$RUNNER_TEMP/hosted-metal-gpu-probe"
          "$RUNNER_TEMP/hosted-metal-gpu-probe"

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Run proven hosted-offscreen Gradle gates
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --stacktrace \
            metalMrtSmokeTest \
            metalFrameGenerationLifecycleTest \
            verifyIsolatedClientProfiles

  hosted-offscreen-candidate:
    name: candidate / ${{ matrix.task }}
    runs-on: macos-26
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        task:
          - metal4PipelineSmokeTest
          - metal4PipelinePathTest
          - metalComputeBackendIntegrationTest
          - metalMrtBackendIntegrationTest
          - metalIrisTargetsIntegrationTest
    env:
      MTL_DEBUG_LAYER: '0'
      MTL_SHADER_VALIDATION: '0'
      MTL_HUD_ENABLED: '0'
      MTLFX_HUD_ENABLED: '0'
      METALLUM_HOSTED_METAL_OFFSCREEN: 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Run candidate in isolation
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --stacktrace \
            -I .github/ci/hosted-metal-offscreen.gradle \
            "${{ matrix.task }}"

      - name: Preserve native crash evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-metal-${{ matrix.task }}-${{ github.run_attempt }}
          path: |
            hs_err_pid*.log
            build/reports/tests/**
            build/test-results/**
          if-no-files-found: ignore

  hosted-junit-candidate:
    name: junit / ${{ matrix.test_class }}
    runs-on: macos-26
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        test_class:
          - com.metallum.client.metal.render.IrisMetalPostChainCompilationTest
          - com.metallum.client.metal.render.IrisMetalShadowPipelineTest
          - com.metallum.client.metal.render.IrisMetalShadowComputeConformanceTest
          - com.metallum.client.metal.render.MetalGenericVertexAttributeIntegrationTest
          - com.metallum.client.metal.render.MetalIrisCustomTexturesIntegrationTest
          - com.metallum.client.metal.render.MetalRenderContractGpuIntegrationTest
    env:
      MTL_DEBUG_LAYER: '0'
      MTL_SHADER_VALIDATION: '0'
      MTL_HUD_ENABLED: '0'
      MTLFX_HUD_ENABLED: '0'
      METALLUM_HOSTED_METAL_OFFSCREEN: 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Run normally CI-excluded class in isolation
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --stacktrace \
            -I .github/ci/hosted-metal-offscreen.gradle \
            -PhostedMetalJUnitClass="${{ matrix.test_class }}" \
            hostedMetalGpuJUnit

      - name: Report executed versus skipped tests
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET
          files = glob.glob('build/test-results/hostedMetalGpuJUnit/TEST-*.xml')
          tests = skipped = failures = errors = 0
          for path in files:
              root = ET.parse(path).getroot()
              tests += int(root.attrib.get('tests', 0))
              skipped += int(root.attrib.get('skipped', 0))
              failures += int(root.attrib.get('failures', 0))
              errors += int(root.attrib.get('errors', 0))
          executed = tests - skipped
          line = f"tests={tests} executed={executed} skipped={skipped} failures={failures} errors={errors}"
          print(line)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(line + '\n')
              if tests and executed == 0:
                  f.write('Result is fixture/capability skipped; do not promote as an executed GPU gate.\n')
          if not files:
              raise SystemExit('No JUnit XML produced; candidate task did not execute as expected')
          PY

      - name: Preserve candidate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-junit-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: |
            hs_err_pid*.log
            build/reports/tests/hostedMetalGpuJUnit/**
            build/test-results/hostedMetalGpuJUnit/**
          if-no-files-found: ignore
