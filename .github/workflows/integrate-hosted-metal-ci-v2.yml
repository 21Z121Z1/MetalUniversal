name: integrate-hosted-metal-ci-v2

on:
  workflow_dispatch:
  push:
    branches:
      - integration/hosted-metal-ci-20260811

permissions:
  contents: write

concurrency:
  group: integrate-hosted-metal-ci-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Port validated hosted Metal policy onto current mobilegl tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ci/hosted-metal-gpu-probe-20260810
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          EXP = 'origin/ci/hosted-metal-gpu-probe-20260810'

          def exp_text(path: str) -> str:
              return subprocess.check_output(['git', 'show', f'{EXP}:{path}'], text=True)

          # build.gradle: preserve every mobilegl/Metal4 change and only replace the
          # obsolete blanket-CI policy with the already validated capability policy.
          p = Path('build.gradle')
          text = p.read_text()
          new_header = '''// GitHub's standard Apple Silicon macOS 26 runner exposes a paravirtual Metal
          // device and can execute proven offscreen command-buffer/readback workloads.
          // Keep capability classes separate: hosted-offscreen is opt-in after a probe,
          // while counter-sampling/MetalFX and presentation remain physical-only until
          // independently proven safe on the hosted device.
          def hostedCi = "true".equalsIgnoreCase(System.getenv("CI"))
          def metalApiValidation = hostedCi ? "0" : "1"
          def metalShaderValidation = hostedCi ? "0" : "1"
          def isMacOSHost = org.gradle.internal.os.OperatingSystem.current().isMacOsX()
          def hostedOffscreenMetalValidationAvailable = {
          \tisMacOSHost && (hostedCi == false || "true".equalsIgnoreCase(System.getenv("METALLUM_HOSTED_METAL_OFFSCREEN")))
          }
          // Physical-only validation is capability-driven, never a blanket CI exclusion.
          // Every physical capability must document the concrete hardware/display reason.
          def physicalMetalCapabilities = [
          \t\t"metalfx-runtime": "MTLFXTemporalScaler/FrameInterpolator execution requires MetalFX device support; GitHub's Apple Paravirtual device currently reports the Temporal Scaler unsupported.",
          \t\t"presentation-windowserver": "CAMetalLayer/CAMetalDisplayLink pacing, resize, fullscreen and drawable acceptance require an attended WindowServer/display session.",
          \t\t"gpu-counter-sampling": "Encoder-stage GPU counter sampling is not supported by GitHub's Apple Paravirtual Metal device."
          ]
          def physicalMetalCapabilityAvailable = { String capability ->
          \tdef reason = physicalMetalCapabilities[capability]
          \tif (reason == null || reason.isBlank()) {
          \t\tthrow new GradleException("Physical Metal capability '${capability}' is missing a concrete reason")
          \t}
          \tisMacOSHost && hostedCi == false
          }
          def metalFxValidationAvailable = {
          \tphysicalMetalCapabilityAvailable("metalfx-runtime")
          }
          def presentationMetalValidationAvailable = {
          \tphysicalMetalCapabilityAvailable("presentation-windowserver")
          }
          '''
          pattern = re.compile(
              r'// GitHub\'s hosted macOS 26 virtual GPU aborts.*?'
              r'def hardwareMetalValidationAvailable = \{\n\torg\.gradle\.internal\.os\.OperatingSystem\.current\(\)\.isMacOsX\(\) && !hostedCi\n\}\n',
              re.S,
          )
          text, n = pattern.subn(new_header, text, count=1)
          if n != 1:
              raise SystemExit(f'capability header replacement count={n}')

          hosted_test = re.compile(
              r'\n\tif \(hostedCi\) \{\n'
              r'\t\texclude "\*\*/IrisMetalPostChainCompilationTest\.class"\n'
              r'\t\texclude "\*\*/IrisMetalShadowPipelineTest\.class"\n'
              r'\t\texclude "\*\*/IrisMetalShadowComputeConformanceTest\.class"\n'
              r'\t\texclude "\*\*/MetalGenericVertexAttributeIntegrationTest\.class"\n'
              r'\t\texclude "\*\*/MetalIrisCustomTexturesIntegrationTest\.class"\n'
              r'\t\texclude "\*\*/MetalRenderContractGpuIntegrationTest\.class"\n'
              r'\t\}',
          )
          hosted_repl = '''
          \t// GPU integrations are routed through explicit capability tasks instead of
          \t// changing the generic unit-test suite according to CI=true/false.
          \texclude "**/IrisMetalPostChainCompilationTest.class"
          \texclude "**/IrisMetalShadowPipelineTest.class"
          \texclude "**/IrisMetalShadowComputeConformanceTest.class"
          \texclude "**/MetalGenericVertexAttributeIntegrationTest.class"
          \texclude "**/MetalIrisCustomTexturesIntegrationTest.class"
          \texclude "**/MetalRenderContractGpuIntegrationTest.class"'''
          text, n = hosted_test.subn(hosted_repl, text, count=1)
          if n != 1:
              raise SystemExit(f'generic hosted exclusion replacement count={n}')

          # MetalFX is a real device-capability gate, not generic offscreen Metal.
          fx_pattern = re.compile(
              r'(tasks\.register\("metalFxOffscreenValidation", Exec\) \{.*?\tonlyIf \{\n\t\t)'
              r'hardwareMetalValidationAvailable\(\)(\n\t\})',
              re.S,
          )
          text, n = fx_pattern.subn(r'\1metalFxValidationAvailable()\2', text, count=1)
          if n != 1:
              raise SystemExit(f'MetalFX offscreen gate replacement count={n}')

          remaining = text.count('hardwareMetalValidationAvailable()')
          if remaining != 5:
              raise SystemExit(f'expected 5 generic offscreen gates after MetalFX split, got {remaining}')
          text = text.replace('hardwareMetalValidationAvailable()', 'hostedOffscreenMetalValidationAvailable()')

          old_pres = '''\tonlyIf {
          \t\tif (hostedCi) {
          \t\t\tlogger.lifecycle("metalFrameGenerationPresentationValidation SKIPPED: hosted CI has no attended WindowServer surface")
          \t\t\treturn false
          \t\t}
          \t\tdef reason = presentationValidationSkipReason()
          '''
          new_pres = '''\tonlyIf {
          \t\tif (!presentationMetalValidationAvailable()) {
          \t\t\tlogger.lifecycle("metalFrameGenerationPresentationValidation SKIPPED: requires physical capability presentation-windowserver")
          \t\t\treturn false
          \t\t}
          \t\tdef reason = presentationValidationSkipReason()
          '''
          if text.count(old_pres) != 1:
              raise SystemExit(f'presentation gate count={text.count(old_pres)}')
          text = text.replace(old_pres, new_pres, 1)

          old_perf = '\tonlyIf { !hostedCi && presentationValidationSkipReason() == null }'
          new_perf = '\tonlyIf { metalFxValidationAvailable() && presentationValidationSkipReason() == null }'
          if text.count(old_perf) != 1:
              raise SystemExit(f'MetalFX performance gate count={text.count(old_perf)}')
          text = text.replace(old_perf, new_perf, 1)

          marker = '// ---- Hosted Metal capability-governed integration suite ----'
          if marker in text:
              raise SystemExit('hosted capability suite already exists')
          exp_build = exp_text('build.gradle')
          if marker not in exp_build:
              raise SystemExit('validated experiment is missing hosted capability suite')
          text += '\n\n' + exp_build[exp_build.index(marker):]
          p.write_text(text)

          # Preserve the latest native backend; only stop overriding explicit CI/HUD opt-outs.
          p = Path('src/main/native/MetallumNative.swift')
          swift = p.read_text()
          for env in ('MTL_HUD_ENABLED', 'MTLFX_HUD_ENABLED'):
              old = f'        setenv("{env}", "1", 1)'
              new = f'        if getenv("{env}") == nil {{\n            setenv("{env}", "1", 1)\n        }}'
              if swift.count(old) != 1:
                  raise SystemExit(f'{env} setenv count={swift.count(old)}')
              swift = swift.replace(old, new, 1)
          p.write_text(swift)

          # This test file has not diverged on mobilegl; use the exact validated
          # Simulator-sentinel implementation from the experiment.
          Path('src/test/native/MetalMRTSmokeTest.swift').write_text(exp_text('src/test/native/MetalMRTSmokeTest.swift'))

          for path in (
              '.github/ci/HostedMetalCapabilityProbe.swift',
              'src/test/java/com/metallum/client/metal/render/IrisMetalBundledPostChainCompilationTest.java',
              'src/test/java/com/metallum/client/metal/render/IrisMetalBundledTerrainPipelineTest.java',
          ):
              out = Path(path)
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_text(exp_text(path))
          PY

          chmod +x ./gradlew
          ./gradlew verifyMetalCapabilityPolicy --stacktrace
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build.gradle src/main/native/MetallumNative.swift src/test/native/MetalMRTSmokeTest.swift .github/ci/HostedMetalCapabilityProbe.swift src/test/java/com/metallum/client/metal/render/IrisMetalBundledPostChainCompilationTest.java src/test/java/com/metallum/client/metal/render/IrisMetalBundledTerrainPipelineTest.java
          git commit -m 'ci: integrate hosted Metal capability policy on mobilegl mainline'
          git push origin HEAD:integration/hosted-metal-ci-20260811
