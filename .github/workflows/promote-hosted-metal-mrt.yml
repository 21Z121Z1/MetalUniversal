name: promote-hosted-metal-mrt

on:
  workflow_dispatch:
  push:
    branches:
      - ci/hosted-metal-gpu-probe-20260810

permissions:
  contents: write

jobs:
  patch-verify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-26
    env:
      METALLUM_HOSTED_METAL_OFFSCREEN: 'true'
      MTL_DEBUG_LAYER: '0'
      MTL_SHADER_VALIDATION: '0'
      MTL_HUD_ENABLED: '0'
      MTLFX_HUD_ENABLED: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Promote MRT production integration to hosted-offscreen capability
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build.gradle')
          s = p.read_text()
          old = '''tasks.register("metalMrtBackendIntegrationTest", Test) {
\tgroup = "verification"
\tdescription = "Runs the macOS Java RenderPass -> FFM -> Swift indexed MRT GPU readback integration suite."
\tonlyIf {
\t\tphysicalMetalValidationAvailable()
\t}
'''
          new = '''tasks.register("metalMrtBackendIntegrationTest", Test) {
\tgroup = "verification"
\tdescription = "Runs the macOS Java RenderPass -> FFM -> Swift indexed MRT GPU readback integration suite."
\tonlyIf {
\t\thostedOffscreenMetalValidationAvailable()
\t}
'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one MRT task gate block, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- build.gradle

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Verify promoted gate without CI-only task override
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --stacktrace metalMrtBackendIntegrationTest

      - name: Commit verified capability gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add build.gradle
          git commit -m 'ci: run MRT backend integration on hosted Metal'
          git push origin HEAD:ci/hosted-metal-gpu-probe-20260810
