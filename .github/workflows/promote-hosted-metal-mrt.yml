name: promote-hosted-metal-production

on:
  workflow_dispatch:
  push:
    branches:
      - ci/hosted-metal-gpu-probe-20260810

concurrency:
  group: promote-hosted-metal-production
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch-verify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-26
    env:
      METALLUM_HOSTED_METAL_OFFSCREEN: 'true'
      MTL_DEBUG_LAYER: '0'
      MTL_SHADER_VALIDATION: '0'
      MTL_HUD_ENABLED: '0'
      MTLFX_HUD_ENABLED: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Promote verified production integrations to hosted-offscreen capability
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build.gradle')
          lines = p.read_text().splitlines(keepends=True)
          targets = {
              'tasks.register("metalMrtBackendIntegrationTest", Test) {': False,
              'tasks.register("metalComputeBackendIntegrationTest", Test) {': False,
              'tasks.register("metalIrisTargetsIntegrationTest", Test) {': False,
          }
          active = None
          for i, line in enumerate(lines):
              stripped = line.strip()
              if stripped in targets:
                  active = stripped
                  continue
              if active and 'hostedOffscreenMetalValidationAvailable()' in line:
                  targets[active] = True
                  active = None
                  continue
              if active and 'physicalMetalValidationAvailable()' in line:
                  lines[i] = line.replace('physicalMetalValidationAvailable()', 'hostedOffscreenMetalValidationAvailable()')
                  targets[active] = True
                  active = None
          missing = [name for name, changed in targets.items() if not changed]
          if missing:
              raise SystemExit('failed to identify task gates: ' + ', '.join(missing))
          p.write_text(''.join(lines))
          PY
          git diff --check
          git diff -- build.gradle

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Verify promoted gates without CI-only task override
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --stacktrace \
            metalMrtBackendIntegrationTest \
            metalComputeBackendIntegrationTest \
            metalIrisTargetsIntegrationTest

      - name: Commit verified capability gates
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- build.gradle; then
            echo 'Capability gates already promoted; nothing to commit.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add build.gradle
          git commit -m 'ci: run production Metal integrations on hosted GPU'
          git push origin HEAD:ci/hosted-metal-gpu-probe-20260810
