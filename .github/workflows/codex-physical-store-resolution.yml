name: codex/physical-store-resolution

on:
  push:
    branches:
      - codex/placement-heap-integration-staging-20260830
    paths:
      - .github/workflows/codex-physical-store-resolution.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/placement-heap-integration-staging-20260830
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Wire resolved physical store into attachment receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/main/java/com/metallum/client/metal/render/IrisMetalAttachmentLifetimeCompiler.java')
          s = p.read_text()
          start_marker = '            String allocationKey = candidate.binding().allocationKey();\n'
          end_marker = '                    Objects.requireNonNull(lifetimeByKey.get(allocationKey), allocationKey)\n            ));'
          start = s.index(start_marker)
          end = s.index(end_marker, start) + len(end_marker)
          new = '''            String allocationKey = candidate.binding().allocationKey();
            IrisMetalOptimizationPlan.AttachmentLifetime lifetime =
                    Objects.requireNonNull(lifetimeByKey.get(allocationKey), allocationKey);
            IrisMetalOptimizationPlan.StoreAction physicalStore =
                    IrisMetalTransientAttachmentClassifier.resolvePhysicalStore(
                            candidate.store(),
                            candidate.logicalResource(),
                            candidate.passIndex(),
                            lifetime,
                            plan.resourceLiveness().persistentResources(),
                            unresolvedConsumers.isEmpty()
                    );
            attachments.add(new IrisMetalOptimizationPlan.ResolvedAttachment(
                    candidate.planPassKey(),
                    candidate.semanticPassId(),
                    candidate.slot(),
                    candidate.logicalResource(),
                    candidate.binding().identity().allocationId(),
                    candidate.binding().identity().generation(),
                    0,
                    candidate.physicalSide(),
                    candidate.load(),
                    physicalStore,
                    candidate.passIndex(),
                    IrisMetalOptimizationPlan.AttachmentResolution.RESOLVED_RASTER,
                    IrisMetalTransientAttachmentClassifier.classify(
                            candidate.load(),
                            physicalStore,
                            candidate.passIndex(),
                            lifetime,
                            unresolvedConsumers.isEmpty()
                    ),
                    allocationKey,
                    lifetime
            ));'''
          p.write_text(s[:start] + new + s[end:])
          PY
          git diff --check
          git diff -- src/main/java/com/metallum/client/metal/render/IrisMetalAttachmentLifetimeCompiler.java
          ./gradlew test --tests com.metallum.client.metal.render.IrisMetalPhysicalStoreResolutionTest --tests com.metallum.client.metal.render.IrisMetalMemorylessAttachmentAllocatorTest --tests com.metallum.client.metal.render.IrisMetalAttachmentLifetimeCompilerTest
      - name: Commit result and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/metallum/client/metal/render/IrisMetalAttachmentLifetimeCompiler.java
          git commit -m "perf(iris): publish physical dead-store decisions"
          git rm .github/workflows/codex-physical-store-resolution.yml
          git commit -m "chore(ci): remove physical store helper"
          git push origin HEAD:codex/placement-heap-integration-staging-20260830
