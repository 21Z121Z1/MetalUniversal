name: Agent MetalFX block-entity Iris motion 20260912

on:
  push:
    branches:
      - agent/metalfx-motion-coverage-26.2

permissions:
  contents: write

jobs:
  verify:
    if: "github.event.head_commit.message == 'chore(agent): execute block-entity Iris motion 20260912'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 64

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Apply bounded semantic patch
        shell: bash
        run: |
          set -euo pipefail
          # The staged script predates this stricter review. Keep the one-shot transform bounded,
          # but correct two scaffold-only issues before executing it: the 26.2 CrumblingOverlay
          # owner package and a deliberately duplicated begin/close frame-state needle.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_metalfx_blockentity_iris_20260912.py')
          text = path.read_text()
          text = text.replace(
              'import net.minecraft.client.renderer.blockentity.ModelFeatureRenderer;',
              'import net.minecraft.client.renderer.feature.ModelFeatureRenderer;'
          )
          old = '''    if count != 1:\n        raise SystemExit(f"{label}: expected exactly one match, found {count}")\n    return text.replace(old, new, 1)\n'''
          new = '''    if count != 1:\n        if label == "Iris sticky initialization" and count >= 1:\n            return text.replace(old, new, 1)\n        raise SystemExit(f"{label}: expected exactly one match, found {count}")\n    return text.replace(old, new, 1)\n'''
          if old not in text:
              raise SystemExit('replace_once helper shape changed')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 .github/scripts/apply_metalfx_blockentity_iris_20260912.py

      - name: Preserve production fail-closed boundaries
        shell: bash
        run: |
          set -euo pipefail
          manager=src/main/java/com/metallum/client/metal/render/MetalFxManager.java
          capture=src/main/java/com/metallum/client/metal/render/MetalEntityMotionCapture.java
          mixin=src/main/java/com/metallum/mixin/render/BlockEntityRenderDispatcherMetalFxMixin.java
          block=src/main/java/com/metallum/client/metal/render/MetalBlockEntityExactMotion.java
          iris=src/main/java/com/metallum/client/metal/render/IrisMetalPipelineOverrides.java

          grep -Fq 'private static final boolean OBJECT_MOTION_PRODUCER_CONNECTED = false;' "$manager"
          grep -Fq 'iris-active-pipeline-motion-semantics-unproven' "$manager"
          grep -Fq 'irisMotionSemanticsUnprovenThisFrame' "$manager"
          grep -Fq 'blockEntityGenerations' "$manager"
          grep -Fq 'audited-block-entity-lifetime-owner-unavailable' "$manager"
          grep -Fq 'block-entity-renderer-has-no-previous-transform-contract' "$manager"
          grep -Fq 'ENTITY_SUBMISSION_STACK' "$capture"
          grep -Fq '@Redirect(' "$mixin"
          grep -Fq 'BlockEntityRenderer;submit' "$mixin"
          grep -Fq 'finally {' "$mixin"
          ! grep -Fq '@Inject(method = "submit", at = @At("HEAD"))' "$mixin"
          grep -Fq 'stateClass == ChestRenderState.class' "$block"
          grep -Fq 'stateClass == BannerRenderState.class' "$block"
          grep -Fq 'stateClass == ShulkerBoxRenderState.class' "$block"
          grep -Fq 'stateClass == BellRenderState.class' "$block"
          ! grep -Fq 'isAssignableFrom' "$block"
          grep -Fq 'MetalFxManager.observeIrisMotionSemanticsUnproven();' "$iris"

      - name: Compile product and tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon compileJava compileTestJava jar

      - name: Run focused semantic contracts
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon test \
            --tests 'com.metallum.client.metal.render.MetalBlockEntityExactMotionTest' \
            --tests 'com.metallum.client.metal.render.MetalEntityMotionCaptureSubmissionScopeTest' \
            --tests 'com.metallum.client.metal.render.MetalFrameGenerationSemanticGateSourceContractTest' \
            --tests 'com.metallum.client.metal.render.MetalExactMotionCoverageTest' \
            --tests 'com.metallum.client.metal.render.FrameSynthesisContractTest' \
            --tests 'com.metallum.client.metal.render.MetalPreviousVertexHistoryTest' \
            --tests 'com.metallum.client.metal.render.MetalEntityMotionPipelineTest'

      - name: Check audited Minecraft 26.2 source evidence
        shell: bash
        run: |
          set -euo pipefail
          REF_ROOT="$(bash scripts/minecraft-reference.sh --print-path)"
          dispatcher="$REF_ROOT/net/minecraft/client/renderer/blockentity/BlockEntityRenderDispatcher.java"
          test -f "$dispatcher"
          grep -Fq 'renderer.extractRenderState(blockEntity, state' "$dispatcher"
          grep -Fq 'renderer.submit(state, poseStack, submitNodeCollector, camera)' "$dispatcher"

          for renderer in ChestRenderer BannerRenderer ShulkerBoxRenderer BellRenderer; do
            file="$REF_ROOT/net/minecraft/client/renderer/blockentity/${renderer}.java"
            test -f "$file"
            grep -Fq 'submitModel' "$file"
            if grep -Eq 'submitCustomGeometry|submitBlockModel|submitItem|submitText|submitMovingBlock|submitShapeOutline|submitGizmoPrimitives' "$file"; then
              echo "audited renderer grew an unmodelled collector output: $renderer" >&2
              exit 1
            fi
          done
          beacon="$REF_ROOT/net/minecraft/client/renderer/blockentity/BeaconRenderer.java"
          grep -Fq 'submitCustomGeometry' "$beacon"

      - name: Check patch integrity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

      - name: Remove one-shot scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/agent-metalfx-blockentity-iris-20260912.yml \
            .github/scripts/apply_metalfx_blockentity_iris_20260912.py \
            .github/agent-triggers/metalfx-blockentity-iris-20260912

      - name: Commit verified semantic changes only
        shell: bash
        env:
          BRANCH: agent/metalfx-motion-coverage-26.2
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(metalfx): add audited block-entity exact motion gates'
          git push origin "HEAD:${BRANCH}"
