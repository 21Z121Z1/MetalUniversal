name: Codex ready validated terrain PR stack

on:
  push:
    branches:
      - codex/terrain-visible-gpu-icb-20260829

permissions:
  contents: read
  pull-requests: write

jobs:
  ready-prs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Mark validated stacked PRs ready
        run: |
          gh pr ready 40 --repo "$GITHUB_REPOSITORY"
          gh pr ready 41 --repo "$GITHUB_REPOSITORY"
