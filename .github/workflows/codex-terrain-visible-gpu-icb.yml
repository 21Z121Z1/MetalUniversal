name: Codex terrain visible GPU ICB modernization

on:
  push:
    branches:
      - codex/terrain-visible-gpu-icb-20260829

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Disambiguate duplicate owner reset anchors
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/main/java/com/metallum/client/metal/render/TerrainIcbOwner.java")
          text = path.read_text()
          old = """            content = null;\n            gpuAuthored = false;\n        }\n        device = currentDevice;\n"""
          new = """            content = null;\n            gpuAuthored = false;\n            visibilityEpoch = -1L;\n        }\n        device = currentDevice;\n"""
          if text.count(old) != 2:
              raise SystemExit(f"expected two device-reset anchors, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
      - name: Apply visible GPU ICB modernization
        run: python3 .github/ci/apply_terrain_visible_gpu_icb.py
      - name: Normalize optional bridge declarations
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/main/java/com/metallum/client/metal/render/bridge/MetalNativeBridge.java")
          text = path.read_text()
          old = """    @Nullable\n    @Nullable\n    private static final MethodHandle MTLDeviceCreateTerrainVisibleGpuIndexedIcb;\n    private static final MethodHandle MTLDeviceCreateTerrainGpuVisibilityProbe;\n"""
          new = """    @Nullable\n    private static final MethodHandle MTLDeviceCreateTerrainVisibleGpuIndexedIcb;\n    @Nullable\n    private static final MethodHandle MTLDeviceCreateTerrainGpuVisibilityProbe;\n"""
          if text.count(old) != 1:
              raise SystemExit(f"expected one duplicated nullable declaration pair, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
      - name: Focused Java contracts
        run: >-
          ./gradlew --no-daemon test
          --tests com.metallum.client.metal.render.TerrainVisibleDrawPlanTest
          --tests com.metallum.client.metal.render.TerrainCandidateDrawIndexTest
          --tests com.metallum.client.metal.render.Metal4TerrainVisibilityBarrierContractTest
          --tests com.metallum.client.metal.render.Metal4TerrainVisibleIcbContractTest
          --console=plain
      - name: Compile native Metal ABI
        run: ./gradlew --no-daemon buildMacNative --console=plain
      - name: Commit modernization
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main src/test
          git diff --cached --check
          git commit -m "feat(metal4): author terrain ICBs from GPU visibility"
          git push origin HEAD:codex/terrain-visible-gpu-icb-20260829
