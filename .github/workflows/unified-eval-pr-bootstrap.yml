name: Unified eval PR bootstrap

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: unified-eval-bootstrap
  cancel-in-progress: false

jobs:
  merge-and-integrate:
    if: ${{ github.event.pull_request.head.ref == 'agent/unified-render-eval-performance' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-render-eval-performance
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Merge histories, reconcile hooks, validate and push
        shell: bash
        run: bash scripts/agent/bootstrap_unified_eval.sh
