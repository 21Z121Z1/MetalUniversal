name: Agent MetalFX temporal linear bridge probe 20260913

on:
  push:
    branches:
      - agent/metalfx-motion-coverage-26.2

permissions:
  contents: read

jobs:
  probe:
    if: github.event.head_commit.message == 'chore(agent): probe temporal linear bridge'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Print branch identity
        run: |
          set -euxo pipefail
          git rev-parse HEAD
          git status --short

      - name: Confirm RGBA16F backend support
        run: |
          set -euxo pipefail
          grep -n -C 4 'case RGBA16_FLOAT' src/main/java/com/metallum/client/metal/render/mtl/MTLPixelFormat.java
          grep -n -C 8 'GpuTexture createTexture' src/main/java/com/metallum/client/metal/render/MetalDevice.java | head -80

      - name: Print MetalFX scene target and encode seams
        run: |
          set -euxo pipefail
          FILE=src/main/java/com/metallum/client/metal/render/MetalFxManager.java
          grep -n -C 18 'sceneOutputTarget = new TextureTarget' "$FILE"
          grep -n -C 18 'nativeSceneTarget = new TextureTarget' "$FILE"
          grep -n -C 24 -E 'metallum_metalfx_.*temporal|encode.*Temporal|temporal.*encode' "$FILE" || true
          grep -n -C 20 -E 'sceneOutputTarget|getColorTexture\(\)|frameNativeSceneTexture' "$FILE" | tail -240

      - name: Print native MetalFX bridge seams
        run: |
          set -euxo pipefail
          grep -RIn -C 18 -E 'metallum_metalfx_.*temporal|temporal.*encode|MTLFXTemporal' \
            src/main/java/com/metallum/client/metal/render/bridge \
            src/main/native/MetallumNative.swift | head -600

      - name: Print current color contract
        run: |
          set -euxo pipefail
          cat src/main/java/com/metallum/client/metal/render/FrameGenerationColorContract.java

      - name: Probe Minecraft 26.2 TextureTarget / GpuFormat reference
        run: |
          set -euxo pipefail
          SRC="$(bash scripts/minecraft-reference.sh --print-path)"
          echo "MINECRAFT_REFERENCE=$SRC"
          grep -RIn -C 8 'enum GpuFormat\|RGBA16_FLOAT' "$SRC" | head -160 || true
          grep -RIn -C 20 'class TextureTarget' "$SRC" | head -200 || true

      - name: Compile Java test sources
        run: ./gradlew --no-daemon compileJava compileTestJava
