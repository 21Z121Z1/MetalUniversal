name: Minecraft 26.2 production client E2E

on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/minecraft-client-e2e-*'
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: minecraft-client-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minecraft-client-e2e:
    name: Real Minecraft / MetalUniversal / framebuffer evidence
    runs-on: macos-26
    timeout-minutes: 20
    env:
      MTL_DEBUG_LAYER: '0'
      MTL_SHADER_VALIDATION: '0'
      MTL_HUD_ENABLED: '0'
      MTLFX_HUD_ENABLED: '0'
      METALLUM_HOSTED_METAL_OFFSCREEN: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Describe free hosted Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          sw_vers
          test "$(uname -m)" = "arm64"
          system_profiler SPHardwareDataType SPDisplaysDataType || true

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle dependency cache
        uses: gradle/actions/setup-gradle@v6

      - name: Build production MetalUniversal JAR and native backend
        id: metallum
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --stacktrace buildMacNative
          ./gradlew --stacktrace jar
          jar="$(find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-validation.jar' \
            -print | head -n 1)"
          test -n "$jar"
          test -s "$jar"
          jar="$(cd "$(dirname "$jar")" && pwd)/$(basename "$jar")"
          echo "jar=$jar" >> "$GITHUB_OUTPUT"
          echo "MetalUniversal production JAR: $jar"
          unzip -l "$jar" | grep -F 'natives/macos/libmetallum.dylib'

      - name: Prove hosted Metal command execution before Minecraft
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --stacktrace metalMrtSmokeTest verifyIsolatedClientProfiles

      - name: Run real Minecraft 26.2 production Client GameTest
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            -p .github/ci/minecraft-e2e \
            --stacktrace \
            -PmetallumJar="${{ steps.metallum.outputs.jar }}" \
            runProductionClientGameTest

      - name: Verify authoritative Metal framebuffer evidence
        shell: bash
        run: |
          set -euo pipefail
          e2e=".github/ci/minecraft-e2e"
          evidence="$e2e/build/evidence/runtime-evidence.json"
          window_screenshot_dir="$e2e/build/run/clientGameTest/screenshots"
          metal_screenshot="$e2e/build/evidence/metal-framebuffer.png"

          test -s "$evidence"
          test -s "$metal_screenshot"
          window_screenshot="$(find "$window_screenshot_dir" -maxdepth 1 -type f -name '*.png' -print | head -n 1)"
          test -n "$window_screenshot"
          test -s "$window_screenshot"

          python3 - "$evidence" <<'PY'
          import json, sys
          path = sys.argv[1]
          with open(path, encoding="utf-8") as f:
              data = json.load(f)
          required_true = (
              "productionRuntime",
              "clientGameTest",
              "metallumLoaded",
              "sodiumLoaded",
              "irisLoaded",
              "worldLoaded",
              "chunksRendered",
          )
          for key in required_true:
              if data.get(key) is not True:
                  raise SystemExit(f"{key} was not true in {path}: {data.get(key)!r}")
          if str(data.get("backend", "")).lower() != "metal":
              raise SystemExit(f"expected Metal backend, got {data.get('backend')!r}")
          if data.get("minecraft") != "26.2":
              raise SystemExit(f"expected Minecraft 26.2, got {data.get('minecraft')!r}")
          if data.get("renderContractCompletedCaptures", 0) < 1:
              raise SystemExit("no completed Metal framebuffer captures")
          if data.get("renderContractFailedCaptures") != 0:
              raise SystemExit(f"Metal framebuffer capture failures: {data.get('renderContractFailedCaptures')!r}")
          if data.get("renderContractDroppedCaptures") != 0:
              raise SystemExit(f"Metal framebuffer captures dropped: {data.get('renderContractDroppedCaptures')!r}")
          if data.get("selectedMetalFrameNonZeroBytes", 0) <= 0:
              raise SystemExit("selected Metal framebuffer contained no non-zero bytes")
          print(json.dumps(data, indent=2, sort_keys=True))
          PY

          xcrun swiftc -O \
            -framework Foundation \
            -framework CoreGraphics \
            -framework ImageIO \
            .github/ci/VerifyMinecraftScreenshot.swift \
            -o "$RUNNER_TEMP/verify-minecraft-screenshot"

          "$RUNNER_TEMP/verify-minecraft-screenshot" \
            "$metal_screenshot" \
            "$e2e/build/evidence/metal-framebuffer-stats.json"

          shasum -a 256 "$metal_screenshot" \
            | tee "$e2e/build/evidence/metal-framebuffer.sha256"
          shasum -a 256 "$window_screenshot" \
            | tee "$e2e/build/evidence/window-screenshot.sha256"
          file "$metal_screenshot" "$window_screenshot"
          ls -lh \
            "$metal_screenshot" \
            "$evidence" \
            "$e2e/build/evidence/metal-framebuffer-stats.json"

      - name: Stage Minecraft E2E artifact outside hidden directories
        if: always()
        shell: bash
        run: |
          set -u
          e2e=".github/ci/minecraft-e2e"
          stage="build/minecraft-e2e-artifact"
          rm -rf "$stage"
          mkdir -p "$stage"
          if [ -d "$e2e/build/evidence" ]; then
            cp -R "$e2e/build/evidence" "$stage/evidence"
          fi
          if [ -d "$e2e/build/run/clientGameTest/screenshots" ]; then
            mkdir -p "$stage/window-screenshots"
            cp -R "$e2e/build/run/clientGameTest/screenshots/." "$stage/window-screenshots/"
          fi
          if [ -d "$e2e/build/run/clientGameTest/logs" ]; then
            mkdir -p "$stage/logs"
            cp -R "$e2e/build/run/clientGameTest/logs/." "$stage/logs/"
          fi
          if [ -d "$e2e/build/run/clientGameTest/crash-reports" ]; then
            mkdir -p "$stage/crash-reports"
            cp -R "$e2e/build/run/clientGameTest/crash-reports/." "$stage/crash-reports/"
          fi
          if [ -d "$e2e/build/reports" ]; then
            cp -R "$e2e/build/reports" "$stage/reports"
          fi
          if [ -d "$e2e/build/test-results" ]; then
            cp -R "$e2e/build/test-results" "$stage/test-results"
          fi
          find . -maxdepth 2 -type f -name 'hs_err_pid*.log' -exec cp {} "$stage/" \; || true
          find "$stage" -type f -maxdepth 12 -print | sort || true

      - name: Upload Minecraft E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: minecraft-26.2-metaluniversal-e2e-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: build/minecraft-e2e-artifact/**
