name: Minecraft 26.2 production client E2E

on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/minecraft-client-e2e-*'
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: minecraft-client-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minecraft-client-e2e:
    name: Real Minecraft / MetalUniversal / framebuffer evidence
    runs-on: macos-26
    timeout-minutes: 20
    env:
      MTL_DEBUG_LAYER: '1'
      MTL_SHADER_VALIDATION: '0'
      MTL_HUD_ENABLED: '0'
      MTLFX_HUD_ENABLED: '0'
      METALLUM_HOSTED_METAL_OFFSCREEN: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Describe free hosted Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          sw_vers
          test "$(uname -m)" = "arm64"
          system_profiler SPHardwareDataType SPDisplaysDataType || true

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle dependency cache
        uses: gradle/actions/setup-gradle@v6

      - name: Build production MetalUniversal JAR and native backend
        id: metallum
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --stacktrace buildMacNative
          ./gradlew --stacktrace jar
          jar="$(find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-validation.jar' \
            -print | head -n 1)"
          test -n "$jar"
          test -s "$jar"
          jar="$(cd "$(dirname "$jar")" && pwd)/$(basename "$jar")"
          echo "jar=$jar" >> "$GITHUB_OUTPUT"
          unzip -l "$jar" | grep -F 'natives/macos/libmetallum.dylib'

      - name: Prove hosted Metal command execution before Minecraft
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --stacktrace metalMrtSmokeTest verifyIsolatedClientProfiles

      - name: Run real Minecraft 26.2 production Client GameTest
        shell: bash
        env:
          # Keep Metal API Validation enabled, but bypass the optional render-state
          # packet batching in this evidence lane. The hosted Apple paravirtual
          # driver exposed a packet-decoder ordering defect where Java had queued
          # a valid PSO yet Metal reached the draw without renderPipelineState.
          # The legacy setters are the same production Metal bindings, only without
          # the batching optimization, and make the validation result auditable.
          JAVA_TOOL_OPTIONS: '-Dmetallum.opt.renderStatePacket=false'
        run: |
          set -euo pipefail
          ./gradlew \
            -p .github/ci/minecraft-e2e \
            --stacktrace \
            -PmetallumJar="${{ steps.metallum.outputs.jar }}" \
            runProductionClientGameTest

      - name: Verify staged Metal transfer controls
        shell: bash
        run: |
          set -euo pipefail
          suite=".github/ci/minecraft-e2e/build/evidence/readback-control/suite.json"
          test -s "$suite"
          cat "$suite"
          python3 - "$suite" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              data = json.load(f)
          for key in ('bufferCopy', 'textureRoundTrip', 'renderClear'):
              result = data[key]
              print(key, result)
              if not result.get('exact'):
                  raise SystemExit(f"{key} failed: {result}")
          if data.get('allExact') is not True:
              raise SystemExit(f"control suite did not pass: {data}")
          PY

      - name: Stage Minecraft E2E artifact outside hidden directories
        if: always()
        shell: bash
        run: |
          set -u
          e2e=".github/ci/minecraft-e2e"
          stage="build/minecraft-e2e-artifact"
          rm -rf "$stage"
          mkdir -p "$stage"
          if [ -d "$e2e/build/evidence" ]; then cp -R "$e2e/build/evidence" "$stage/evidence"; fi
          if [ -d "$e2e/build/run/clientGameTest/screenshots" ]; then
            mkdir -p "$stage/window-screenshots"
            cp -R "$e2e/build/run/clientGameTest/screenshots/." "$stage/window-screenshots/"
          fi
          if [ -d "$e2e/build/run/clientGameTest/logs" ]; then
            mkdir -p "$stage/logs"
            cp -R "$e2e/build/run/clientGameTest/logs/." "$stage/logs/"
          fi
          if [ -d "$e2e/build/run/clientGameTest/crash-reports" ]; then
            mkdir -p "$stage/crash-reports"
            cp -R "$e2e/build/run/clientGameTest/crash-reports/." "$stage/crash-reports/"
          fi
          if [ -d "$e2e/build/reports" ]; then cp -R "$e2e/build/reports" "$stage/reports"; fi
          if [ -d "$e2e/build/test-results" ]; then cp -R "$e2e/build/test-results" "$stage/test-results"; fi
          find "$stage" -type f -maxdepth 12 -print | sort || true

      - name: Upload Minecraft E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: minecraft-26.2-metaluniversal-e2e-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: build/minecraft-e2e-artifact/**
