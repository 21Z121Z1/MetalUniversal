name: Codex fused terrain visibility ICB

on:
  push:
    branches:
      - codex/terrain-fused-visible-icb-staging-20260829
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/terrain-fused-visible-icb-staging-20260829
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply fused visibility ICB patch
        run: python3 .github/ci/patch_terrain_fused_visible_icb.py
      - name: Validate fused contracts and native builds
        run: >-
          ./gradlew test
          --tests com.metallum.client.metal.render.Metal4TerrainFusedVisibleIcbContractTest
          buildMacNative buildIOSNative --no-daemon
      - name: Check patch hygiene
        run: |
          git diff --check
          git diff --stat
      - name: Commit validated product changes
        run: |
          git config user.name '21Z121Z1'
          git config user.email '89170834+21Z121Z1@users.noreply.github.com'
          git add src/main/java src/main/native
          if git diff --cached --quiet; then
            echo 'no product changes to commit'
            exit 1
          fi
          git commit -m 'perf(metal4): fuse terrain visibility with ICB authoring'
          git push origin HEAD:codex/terrain-fused-visible-icb-staging-20260829
