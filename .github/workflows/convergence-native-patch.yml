name: bounded native convergence patch

on:
  push:
    branches:
      - agent/metaluniversal-system-convergence-20260920
    paths:
      - '.github/workflows/convergence-native-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/metaluniversal-system-convergence-20260920
          fetch-depth: 0
      - name: Restore caller-thread pipeline compilation by default
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/native/MetallumNative.swift')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '    // METALLUM_PSO_COMPILE_HOP=0.\n':
                  '    // Set METALLUM_PSO_COMPILE_HOP=1 only for a bounded diagnostic.\n',
              '        if ProcessInfo.processInfo.environment["METALLUM_PSO_COMPILE_HOP"] == "0" {\n':
                  '        if ProcessInfo.processInfo.environment["METALLUM_PSO_COMPILE_HOP"] != "1" {\n',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one occurrence, found {count}: {old!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- src/main/native/MetallumNative.swift
      - name: Commit exact patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/native/MetallumNative.swift
          git commit -m 'fix(native): compile pipelines on the caller thread by default'
          git push origin HEAD:agent/metaluniversal-system-convergence-20260920
