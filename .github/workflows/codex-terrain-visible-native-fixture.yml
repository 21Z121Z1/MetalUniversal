name: Codex terrain visible native fixture

on:
  push:
    branches:
      - codex/terrain-visible-native-fixture-staging-20260829

permissions:
  contents: write

jobs:
  fixture:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Patch lease identity and rollout fixture
        run: python3 .github/ci/patch_terrain_visible_native_fixture.py
      - name: Validate rollout visible ICB fixture
        env:
          MTL_DEBUG_LAYER: '1'
        run: ./gradlew --no-daemon buildMacNative compileMetal4PipelinePathTest metal4PipelinePathTest --rerun-tasks --console=plain
      - name: Commit validated source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/native/MetallumNative.swift src/test/native/Metal4PipelinePathTest.swift
          git diff --cached --check
          git commit -m "test(metal4): prove visible ICB lease and sparse slots"
          git push origin HEAD:codex/terrain-visible-native-fixture-staging-20260829
