name: Codex terrain visible ICB modernization

on:
  push:
    branches:
      - codex/terrain-visible-icb-modernize-20260829

permissions:
  contents: write

jobs:
  apply-barrier-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Publish terrain visibility to future compute consumers
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/main/native/MetallumNative.swift")
          text = path.read_text()
          old = """    computeEncoder.barrier(\n        afterStages: .dispatch,\n        beforeQueueStages: [.vertex, .fragment],\n        visibilityOptions: .device\n    )\n    computeEncoder.endEncoding()\n\n    let owner = TerrainGpuVisibilityProbeOwner(\n"""
          new = """    // The visibility/compaction results can feed either raster stages or a\n    // later GPU-authored ICB compute encoder. This is a queue dependency: the\n    // producer encoder has ended before those consumers begin, so publish the\n    // dispatch writes to every legal downstream stage instead of relying on a\n    // pass-local encoder barrier.\n    computeEncoder.barrier(\n        afterStages: .dispatch,\n        beforeQueueStages: [.vertex, .fragment, .dispatch],\n        visibilityOptions: .device\n    )\n    computeEncoder.endEncoding()\n\n    let owner = TerrainGpuVisibilityProbeOwner(\n"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one terrain visibility terminal barrier, found {count}")
          path.write_text(text.replace(old, new, 1))
      - name: Verify focused contract
        run: ./gradlew --no-daemon test --tests com.metallum.client.metal.render.Metal4TerrainVisibilityBarrierContractTest --console=plain
      - name: Commit modernization
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/native/MetallumNative.swift
          git diff --cached --check
          git commit -m "fix(metal4): publish terrain visibility to compute consumers"
          git push origin HEAD:codex/terrain-visible-icb-modernize-20260829
