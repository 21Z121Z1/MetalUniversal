name: codex/memoryless-execution

on:
  push:
    branches:
      - codex/placement-heap-integration-staging-20260830
    paths:
      - .github/workflows/codex-memoryless-execution.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/placement-heap-integration-staging-20260830
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply memoryless execution wiring
        run: |
          set -euo pipefail
          python3 scripts/agent/codex_memoryless_execution.py
          git diff --check
          ./gradlew test \
            --tests com.metallum.client.metal.render.IrisMetalMemorylessExecutionContractTest \
            --tests com.metallum.client.metal.render.IrisMetalMemorylessAttachmentAllocatorTest \
            --tests com.metallum.client.metal.render.IrisMetalPhysicalStoreResolutionTest \
            --tests com.metallum.client.metal.render.MetalExplicitAttachmentActionContractTest \
            --tests com.metallum.client.metal.render.IrisMetalPostChainCompilationTest
      - name: Commit result and remove one-shot tooling
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/metallum/client/metal/render/IrisMetalRenderTargets.java \
                  src/main/java/com/metallum/client/metal/render/IrisMetalPostChain.java
          git commit -m "feat(iris): execute proven pass-local memoryless targets"
          git rm .github/workflows/codex-memoryless-execution.yml \
                 scripts/agent/codex_memoryless_execution.py
          git commit -m "chore(ci): remove memoryless execution tooling"
          git push origin HEAD:codex/placement-heap-integration-staging-20260830
