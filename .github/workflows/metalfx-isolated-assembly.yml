name: MetalFX isolated tree assembly
on:
  push:
    branches: [agent/metalfx-assembly-20260924-01]
permissions:
  contents: write
jobs:
  assemble:
    if: github.repository == '21Z121Z1/MetalUniversal' && github.ref == 'refs/heads/agent/metalfx-assembly-20260924-01'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Verify source objects and assemble clean tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - "$RUNNER_TEMP" <<'PY'
          import base64, gzip, hashlib, json, pathlib, subprocess, sys
          root = pathlib.Path(sys.argv[1])
          parts = ['5ca2109236a3033d738b07c3d21508dcb29128ae', '8d9d410a8952a6c2f8f44ce72948f0581a1cda03', '2232a35db6948b8dd26186b1590db31cf3aefbd4', 'b994abc5b8477cc13955d7d0c73ad49dd390e77d', '34eff87addc9477ce5027fe9da5f12ef482dca49']
          chunks = []
          for sha in parts:
              blob = json.loads(subprocess.check_output(['gh', 'api', 'repos/21Z121Z1/MetalUniversal/git/blobs/' + sha]))
              assert blob['encoding'] == 'base64'
              data = base64.b64decode(blob['content'])
              assert hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest() == sha
              chunks.append(data)
          patch = gzip.decompress(b''.join(chunks))
          assert len(patch) == 40484
          assert hashlib.sha256(patch).hexdigest() == 'f0130bf6bbf31f7004e6010a29568b7e93b31903592812a64e4758843d6b8119'
          (root / 'reviewed.patch').write_bytes(patch)
          PY
          git checkout --detach 53153cdee8b878496c7af18b74b323d1d6d83e2a
          git apply --check --index "$RUNNER_TEMP/reviewed.patch"
          git apply --index "$RUNNER_TEMP/reviewed.patch"
          git diff --cached --check
          tree=$(git write-tree)
          test "$tree" = d65b94b5965b692fd92b6efbf32a3cadde5ac2d9
          test ! -e .github/workflows/metalfx-isolated-assembly.yml
          test ! -e .github/workflows/metalfx-candidate-apply.yml
          test ! -e .github/ci/metalfx-reviewed.patch.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit=$(printf '%s\n' 'fix(metalfx): assemble SDR transfer and CUTOUT fail-closed contracts' | git commit-tree "$tree" -p "$GITHUB_SHA")
          git checkout --detach "$commit"
          git push origin "$commit:refs/heads/agent/metalfx-assembly-20260924-01"
          mkdir -p build/agent-evidence
          printf '{"tree_sha":"%s","assembly_commit_sha":"%s","base_sha":"53153cdee8b878496c7af18b74b323d1d6d83e2a"}\n' "$tree" "$commit" > build/agent-evidence/assembly.json
          cat build/agent-evidence/assembly.json
          git bundle create build/agent-evidence/source.bundle HEAD
          git bundle verify build/agent-evidence/source.bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: metalfx-converged-source-tree
          path: build/agent-evidence/
          if-no-files-found: error
          retention-days: 7
