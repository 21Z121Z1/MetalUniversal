name: finalize-hosted-metal-ci-v2

on:
  push:
    branches:
      - ci/hosted-metal-gpu-probe-20260810

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ci/hosted-metal-gpu-probe-20260810
          fetch-depth: 0
      - name: Apply final capability policy migration
        run: python3 .github/ci/finalize_hosted_metal_ci.py
      - name: Commit production Gradle capability policy only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build.gradle
          git diff --check --cached
          git diff --cached --stat
          git commit -m 'build: formalize Metal capability policy'
          git push origin HEAD:ci/hosted-metal-gpu-probe-20260810
