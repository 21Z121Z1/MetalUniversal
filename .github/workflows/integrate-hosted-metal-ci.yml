name: integrate-hosted-metal-ci

on:
  workflow_dispatch:
  push:
    branches:
      - integration/hosted-metal-ci-20260811

permissions:
  contents: write

concurrency:
  group: integrate-hosted-metal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply validated capability policy to latest mobilegl mainline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ci/hosted-metal-gpu-probe-20260810
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          build = Path('build.gradle')
          text = build.read_text()
          old = '''// GitHub's hosted macOS 26 virtual GPU aborts when libMTLHud tries to enable
          // encoder counter sampling, even with both Metal validation layers disabled.
          // CI still compiles the native backend and GPU harnesses, but executes only
          // headless tests which do not create an MTLDevice. Real GPU/readback/window
          // validation remains part of every local Apple Silicon `build`.
          def hostedCi = "true".equalsIgnoreCase(System.getenv("CI"))
          def metalApiValidation = hostedCi ? "0" : "1"
          def metalShaderValidation = hostedCi ? "0" : "1"
          def hardwareMetalValidationAvailable = {
          \torg.gradle.internal.os.OperatingSystem.current().isMacOsX() && !hostedCi
          }
          '''
          new = '''// GitHub's standard Apple Silicon macOS 26 runner exposes a paravirtual Metal
          // device and can execute proven offscreen command-buffer/readback workloads.
          // Keep capability classes separate: hosted-offscreen is opt-in after a probe,
          // while counter-sampling/MetalFX and presentation remain physical-only until
          // independently proven safe on the hosted device.
          def hostedCi = "true".equalsIgnoreCase(System.getenv("CI"))
          def metalApiValidation = hostedCi ? "0" : "1"
          def metalShaderValidation = hostedCi ? "0" : "1"
          def isMacOSHost = org.gradle.internal.os.OperatingSystem.current().isMacOsX()
          def hostedOffscreenMetalValidationAvailable = {
          \tisMacOSHost && (hostedCi == false || "true".equalsIgnoreCase(System.getenv("METALLUM_HOSTED_METAL_OFFSCREEN")))
          }
          // Physical-only validation is capability-driven, never a blanket CI exclusion.
          // Every physical capability must document the concrete hardware/display reason.
          def physicalMetalCapabilities = [
          \t\t"metalfx-runtime": "MTLFXTemporalScaler/FrameInterpolator execution requires MetalFX device support; GitHub's Apple Paravirtual device currently reports the Temporal Scaler unsupported.",
          \t\t"presentation-windowserver": "CAMetalLayer/CAMetalDisplayLink pacing, resize, fullscreen and drawable acceptance require an attended WindowServer/display session.",
          \t\t"gpu-counter-sampling": "Encoder-stage GPU counter sampling is not supported by GitHub's Apple Paravirtual Metal device."
          ]
          def physicalMetalCapabilityAvailable = { String capability ->
          \tdef reason = physicalMetalCapabilities[capability]
          \tif (reason == null || reason.isBlank()) {
          \t\tthrow new GradleException("Physical Metal capability '${capability}' is missing a concrete reason")
          \t}
          \tisMacOSHost && hostedCi == false
          }
          def metalFxValidationAvailable = {
          \tphysicalMetalCapabilityAvailable("metalfx-runtime")
          }
          def presentationMetalValidationAvailable = {
          \tphysicalMetalCapabilityAvailable("presentation-windowserver")
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f'capability header: expected 1 match, got {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''\tif (hostedCi) {
          \t\texclude "**/IrisMetalPostChainCompilationTest.class"
          \t\texclude "**/IrisMetalShadowPipelineTest.class"
          \t\texclude "**/IrisMetalShadowComputeConformanceTest.class"
          \t\texclude "**/MetalGenericVertexAttributeIntegrationTest.class"
          \t\texclude "**/MetalIrisCustomTexturesIntegrationTest.class"
          \t\texclude "**/MetalRenderContractGpuIntegrationTest.class"
          \t}
          '''
          new = '''\t// GPU integrations are routed through explicit capability tasks instead of
          \t// changing the generic unit-test suite according to CI=true/false.
          \texclude "**/IrisMetalPostChainCompilationTest.class"
          \texclude "**/IrisMetalShadowPipelineTest.class"
          \texclude "**/IrisMetalShadowComputeConformanceTest.class"
          \texclude "**/MetalGenericVertexAttributeIntegrationTest.class"
          \texclude "**/MetalIrisCustomTexturesIntegrationTest.class"
          \texclude "**/MetalRenderContractGpuIntegrationTest.class"
          '''
          if text.count(old) != 1:
              raise SystemExit(f'tasks.test hosted exclusion: expected 1 match, got {text.count(old)}')
          text = text.replace(old, new, 1)

          expected_hw = text.count('hardwareMetalValidationAvailable()')
          if expected_hw != 6:
              raise SystemExit(f'hardwareMetalValidationAvailable occurrences: expected 6, got {expected_hw}')
          text = text.replace('hardwareMetalValidationAvailable()', 'hostedOffscreenMetalValidationAvailable()')
          fx_old = '''tasks.register("metalFxOffscreenValidation", Exec) {
          \tgroup = "verification"
          \tdescription = "Runs windowless MRT, motion, Temporal Scaler and Frame Interpolator GPU readback validation."
          \tonlyIf {
          \t\thostedOffscreenMetalValidationAvailable()
          }
          '''
          fx_new = '''tasks.register("metalFxOffscreenValidation", Exec) {
          \tgroup = "verification"
          \tdescription = "Runs windowless MRT, motion, Temporal Scaler and Frame Interpolator GPU readback validation."
          \tonlyIf {
          \t\tmetalFxValidationAvailable()
          }
          '''
          if text.count(fx_old) != 1:
              raise SystemExit(f'MetalFX offscreen gate: expected 1 match, got {text.count(fx_old)}')
          text = text.replace(fx_old, fx_new, 1)

          pres_old = '''\tonlyIf {
          \t\tif (hostedCi) {
          \t\t\tlogger.lifecycle("metalFrameGenerationPresentationValidation SKIPPED: hosted CI has no attended WindowServer surface")
          \t\t\treturn false
          \t\t}
          \t\tdef reason = presentationValidationSkipReason()
          '''
          pres_new = '''\tonlyIf {
          \t\tif (!presentationMetalValidationAvailable()) {
          \t\t\tlogger.lifecycle("metalFrameGenerationPresentationValidation SKIPPED: requires physical capability presentation-windowserver")
          \t\t\treturn false
          \t\t}
          \t\tdef reason = presentationValidationSkipReason()
          '''
          if text.count(pres_old) != 1:
              raise SystemExit(f'presentation gate: expected 1 match, got {text.count(pres_old)}')
          text = text.replace(pres_old, pres_new, 1)

          perf_old = '\tonlyIf { !hostedCi && presentationValidationSkipReason() == null }'
          perf_new = '\tonlyIf { metalFxValidationAvailable() && presentationValidationSkipReason() == null }'
          if text.count(perf_old) != 1:
              raise SystemExit(f'MetalFX perf gate: expected 1 match, got {text.count(perf_old)}')
          text = text.replace(perf_old, perf_new, 1)

          marker = '// ---- Hosted Metal capability-governed integration suite ----'
          if marker in text:
              raise SystemExit('hosted Metal suite already present unexpectedly')
          text += r'''

          // ---- Hosted Metal capability-governed integration suite ----
          // Repository-owned, redistributable tests proven to execute offscreen Metal
          // command submission/readback on GitHub's Apple Silicon macOS runner.
          tasks.register("hostedMetalExtendedIntegrationTest", Test) {
          	group = "verification"
          	description = "Runs redistributable offscreen Metal/Iris integrations on a proven hosted Metal device."
          	onlyIf { hostedOffscreenMetalValidationAvailable() }
          	dependsOn tasks.named("buildMacNative")
          	testClassesDirs = sourceSets.test.output.classesDirs
          	classpath = sourceSets.test.runtimeClasspath
          	useJUnitPlatform()
          	filter {
          		includeTestsMatching "com.metallum.client.metal.render.IrisMetalBundledPostChainCompilationTest"
          		includeTestsMatching "com.metallum.client.metal.render.IrisMetalBundledTerrainPipelineTest"
          		includeTestsMatching "com.metallum.client.metal.render.IrisMetalShadowPipelineTest"
          		includeTestsMatching "com.metallum.client.metal.render.IrisMetalShadowComputeConformanceTest"
          		includeTestsMatching "com.metallum.client.metal.render.IrisMetalCenterDepthSamplerTest"
          		includeTestsMatching "com.metallum.client.metal.render.IrisMetalComputeConformanceTest"
          		includeTestsMatching "com.metallum.client.metal.render.IrisMetalExternalLevelSamplerTest"
          		includeTestsMatching "com.metallum.client.metal.render.MetalGenericVertexAttributeIntegrationTest"
          		includeTestsMatching "com.metallum.client.metal.render.MetalIrisCustomTexturesIntegrationTest"
          		includeTestsMatching "com.metallum.client.metal.render.MetalIrisNoiseTextureIntegrationTest"
          		includeTestsMatching "com.metallum.client.metal.render.MetalRenderContractGpuIntegrationTest"
          		failOnNoMatchingTests = true
          	}
          	jvmArgs "--enable-native-access=ALL-UNNAMED"
          	environment "MTL_DEBUG_LAYER", "0"
          	environment "MTL_SHADER_VALIDATION", "0"
          	environment "MTL_HUD_ENABLED", "0"
          	environment "MTLFX_HUD_ENABLED", "0"
          	systemProperty "metallum.metal.hud", "false"
          	systemProperty "metallum.validation.gpuPassTiming", "false"
          }

          // Mechanical guardrail: new blanket CI exclusions or unnamed physical-only
          // gates fail verification. New physical requirements must be centralized in
          // physicalMetalCapabilities with a concrete capability reason.
          tasks.register("verifyMetalCapabilityPolicy") {
          	group = "verification"
          	description = "Rejects blanket CI GPU exclusions and undocumented physical-only Metal gates."
          	inputs.file("build.gradle")
          	doLast {
          		def policyText = file("build.gradle").getText("UTF-8")
          		def forbidden = [
          			"physicalMetal" + "ValidationAvailable",
          			"if (" + "hostedCi)",
          			"onlyIf { " + "!hostedCi",
          			"onlyIf {" + "!hostedCi"
          		]
          		def violations = forbidden.findAll { policyText.contains(it) }
          		if (!violations.isEmpty()) {
          			throw new GradleException("Blanket CI/physical Metal gating is forbidden: ${violations}")
          		}
          		def rawPredicateNeedle = "hostedCi" + " == false"
          		def rawPhysicalLines = policyText.readLines().findAll { it.contains(rawPredicateNeedle) }
          		def allowedRawPhysicalLines = [
          			'\tisMacOSHost && (' + rawPredicateNeedle + ' || "true".equalsIgnoreCase(System.getenv("METALLUM_HOSTED_METAL_OFFSCREEN")))',
          			'\tisMacOSHost && ' + rawPredicateNeedle
          		]
          		def unexpectedRaw = rawPhysicalLines.findAll { !allowedRawPhysicalLines.contains(it) }
          		if (!unexpectedRaw.isEmpty() || rawPhysicalLines.size() != allowedRawPhysicalLines.size()) {
          			throw new GradleException("Raw hostedCi physical predicates must stay centralized in capability policy: ${rawPhysicalLines}")
          		}
          		def undocumented = physicalMetalCapabilities.findAll { key, value -> value == null || value.trim().isEmpty() }
          		if (!undocumented.isEmpty()) {
          			throw new GradleException("Physical Metal capabilities require concrete reasons: ${undocumented.keySet()}")
          		}
          		logger.lifecycle("Metal capability policy: PASS (${physicalMetalCapabilities.size()} documented physical capabilities)")
          	}
          }
          '''
          build.write_text(text)

          swift = Path('src/main/native/MetallumNative.swift')
          s = swift.read_text()
          for env in ('MTL_HUD_ENABLED', 'MTLFX_HUD_ENABLED'):
              old = f'        setenv("{env}", "1", 1)'
              new = f'        if getenv("{env}") == nil {{\n            setenv("{env}", "1", 1)\n        }}'
              if s.count(old) != 1:
                  raise SystemExit(f'{env}: expected 1 setenv match, got {s.count(old)}')
              s = s.replace(old, new, 1)
          swift.write_text(s)

          mrt = Path('src/test/native/MetalMRTSmokeTest.swift')
          m = mrt.read_text()
          helper_anchor = '''private func makeTexture(
          '''
          helper = '''private func persistSimulatorResult(_ message: String) throws {
          #if targetEnvironment(simulator)
              let resultURL = URL(fileURLWithPath: NSTemporaryDirectory(), isDirectory: true)
                  .appendingPathComponent("metallum-ci-result.txt", isDirectory: false)
              try message.write(to: resultURL, atomically: true, encoding: .utf8)
          #endif
          }

          private func makeTexture(
          '''
          if m.count(helper_anchor) != 1:
              raise SystemExit(f'MRT helper anchor expected 1, got {m.count(helper_anchor)}')
          m = m.replace(helper_anchor, helper, 1)
          old_print = '    print("MRT smoke passed: full slots [RGBA8, RG16_FLOAT, R8_UNORM], preserved null slot [RGBA8, unused, R8_UNORM]")'
          new_print = '''    let success = "MRT smoke passed: full slots [RGBA8, RG16_FLOAT, R8_UNORM], preserved null slot [RGBA8, unused, R8_UNORM]"
              print(success)
              try persistSimulatorResult(success)'''
          if m.count(old_print) != 1:
              raise SystemExit(f'MRT success anchor expected 1, got {m.count(old_print)}')
          m = m.replace(old_print, new_print, 1)
          mrt.write_text(m)

          for path in [
              '.github/ci/HostedMetalCapabilityProbe.swift',
              'src/test/java/com/metallum/client/metal/render/IrisMetalBundledPostChainCompilationTest.java',
              'src/test/java/com/metallum/client/metal/render/IrisMetalBundledTerrainPipelineTest.java',
          ]:
              data = subprocess.check_output(['git', 'show', f'origin/ci/hosted-metal-gpu-probe-20260810:{path}'])
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(data)
          PY

          ./gradlew verifyMetalCapabilityPolicy --stacktrace
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build.gradle src/main/native/MetallumNative.swift src/test/native/MetalMRTSmokeTest.swift .github/ci/HostedMetalCapabilityProbe.swift src/test/java/com/metallum/client/metal/render/IrisMetalBundledPostChainCompilationTest.java src/test/java/com/metallum/client/metal/render/IrisMetalBundledTerrainPipelineTest.java
          git commit -m 'ci: integrate hosted Metal capability policy on mobilegl mainline'
          git push origin HEAD:integration/hosted-metal-ci-20260811
