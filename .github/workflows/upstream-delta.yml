name: Verify audited migration delta
on:
  push:
    branches: [agent/upstream-26.3-workbench-20260923]
    paths: ['.github/ci/upstream-delta/**', '.github/workflows/upstream-delta.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-delta:
    if: github.repository == '21Z121Z1/MetalUniversal' && github.ref == 'refs/heads/agent/upstream-26.3-workbench-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CANDIDATE_BASE: 300f21c41214350ec8a7c1ff7aaa891f457ff1b6
      CANDIDATE_TREE: 7aa5aa70a50504d1d3ce68e104f3b0116f2c0d6e
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: workbench
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.CANDIDATE_BASE }}
          path: candidate
          persist-credentials: false
      - name: Verify exact delta and upload content-addressed blobs
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          DELTA_FILE: ${{ runner.temp }}/delta.patch
          DELTA_RECEIPT: ${{ runner.temp }}/delta-receipt
        run: |
          set -euo pipefail
          base64 --decode < ../workbench/.github/ci/upstream-delta/delta.patch.xz.b64 | xz -d > "$DELTA_FILE"
          python3 ../workbench/.github/ci/upstream-delta/apply.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-upstream-delta
          path: ${{ runner.temp }}/delta-receipt/
          retention-days: 7
