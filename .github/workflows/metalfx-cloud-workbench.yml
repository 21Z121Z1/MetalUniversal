name: MetalFX isolated cloud workbench
on:
  push:
    branches: [agent/metalfx-cloud-workbench-20260924]
    paths: [.github/workflows/metalfx-cloud-workbench.yml]
permissions:
  contents: write
concurrency:
  group: metalfx-isolated-assembly
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: d7a5e4588c22bbfce4cf4d7a34e58e11d7cac132
      EXPECTED_TREE: e419cb39b06ba54ff5e5f7e65b706292382780ff
      PATCH_BLOBS: 793d3d97b164c1ce105be09c1028b2f364748a26 f85a8bd635da57f19e496f9dbf5932244e703f1d 29bb0e36221abe6ef97fb4554dd62ba68be91c82
      PATCH_DIGEST: 096c54ae72721c2a4fb73aabe329803c4f7fc93ab78bf177696f5ae5413cd298
      CANDIDATE: agent/metalfx-data-contracts-20260924
      ASSEMBLY: agent/metalfx-cloud-assembly-20260924
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and commit only reviewed product changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$CANDIDATE" | cut -f1)" = "$BASE"
          : > "$RUNNER_TEMP/reviewed.patch.gz"
          for blob in $PATCH_BLOBS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq .content | base64 --decode >> "$RUNNER_TEMP/reviewed.patch.gz"
          done
          gzip --decompress --stdout "$RUNNER_TEMP/reviewed.patch.gz" > "$RUNNER_TEMP/reviewed.patch"
          echo "$PATCH_DIGEST  $RUNNER_TEMP/reviewed.patch" | sha256sum --check
          git switch --detach "$BASE"
          git apply --check --index "$RUNNER_TEMP/reviewed.patch"
          git apply --index "$RUNNER_TEMP/reviewed.patch"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(metalfx): wire source-owned CUTOUT reactive MRT through RenderPearl' -m 'Preserve the original SPIR-V sampling and discard semantics while extending surviving fragment coverage to an R8 attachment. Match frontend pass and pipeline declarations, retain same-source receipts after real draws, and fail closed for unsupported fragment output lowering. Add real hosted raster/depth/coverage readback and negative source-ownership contracts.'
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git ls-remote origin "refs/heads/$CANDIDATE" | cut -f1)" = "$BASE"
          git push origin "HEAD:refs/heads/$ASSEMBLY"
          git bundle create "$RUNNER_TEMP/product.bundle" HEAD
          git diff "$BASE" HEAD --binary > "$RUNNER_TEMP/product.patch"
          python3 - <<'PY'
          import json,os,subprocess,pathlib
          g=lambda *a:subprocess.check_output(['git',*a],text=True).strip()
          pathlib.Path(os.environ['RUNNER_TEMP'],'product.json').write_text(json.dumps({
            'base':os.environ['BASE'],'head':g('rev-parse','HEAD'),
            'tree':g('rev-parse','HEAD^{tree}'),'patch_sha256':os.environ['PATCH_DIGEST'],
            'assembly_branch':os.environ['ASSEMBLY'],'canonical_branch_unchanged':True,
          },indent=2)+'\n')
          PY
          cat "$RUNNER_TEMP/product.json"
      - uses: actions/upload-artifact@v4
        with:
          name: metalfx-reviewed-product
          path: |
            ${{ runner.temp }}/product.bundle
            ${{ runner.temp }}/product.patch
            ${{ runner.temp }}/product.json
          retention-days: 2
          if-no-files-found: error
