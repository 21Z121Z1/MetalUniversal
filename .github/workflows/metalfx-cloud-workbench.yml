name: MetalFX isolated cloud workbench
on:
  push:
    branches: [agent/metalfx-cloud-workbench-20260924]
    paths: [.github/workflows/metalfx-cloud-workbench.yml]
permissions:
  contents: write
concurrency:
  group: metalfx-isolated-assembly
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: a3bf1810e74668cfbe8b3335dee8673fdfe11891
      PATCH_BLOB: 715e5c423be59828a567d20a22517625f36b7971
      PATCH_DIGEST: 1aa8957c358ca31805e6fd24587e7dec38c52191b9894978b69e06c3ba60968d
      CANDIDATE: agent/metalfx-data-contracts-20260924
      ASSEMBLY: agent/metalfx-cloud-assembly-20260924
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and commit only reviewed product changes
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git ls-remote origin "refs/heads/$CANDIDATE" | cut -f1)
          test "$actual" = "$BASE"
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/$PATCH_BLOB" --jq .content | base64 --decode | gzip --decompress > "$RUNNER_TEMP/reviewed.patch"
          echo "$PATCH_DIGEST  $RUNNER_TEMP/reviewed.patch" | sha256sum --check
          git switch --detach "$BASE"
          git apply --check --index "$RUNNER_TEMP/reviewed.patch"
          git apply --index "$RUNNER_TEMP/reviewed.patch"
          python3 - <<'PY'
          import subprocess
          expected = {
            'src/main/native/MetalFrameGenerationLifecycle.swift',
            'src/main/native/MetallumNative.swift',
            'src/test/native/MetalFrameGenerationLifecycleTest.swift',
          }
          changed = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          assert changed == expected, changed
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(metalfx): publish queue-owned depth history at real GPU submission' -m 'Separate CPU publication from GPU completion so continuous in-flight sources initialize history. Retain queue identity, invalidate stale epochs and canceled publications, and drive both Metal 3 and Metal 4 scaler reset from the same production state machine. Cover lagged completions, duplicate callbacks, failed publication, unsubmitted command destruction, and queue transitions.'
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git ls-remote origin "refs/heads/$CANDIDATE" | cut -f1)" = "$BASE"
          git push origin "HEAD:refs/heads/$ASSEMBLY"
          git bundle create "$RUNNER_TEMP/product.bundle" HEAD
          git diff "$BASE" HEAD --binary > "$RUNNER_TEMP/product.patch"
          python3 - <<'PY'
          import json,os,subprocess,pathlib
          g=lambda *a:subprocess.check_output(['git',*a],text=True).strip()
          pathlib.Path(os.environ['RUNNER_TEMP'],'product.json').write_text(json.dumps({
            'base':os.environ['BASE'],'head':g('rev-parse','HEAD'),
            'tree':g('rev-parse','HEAD^{tree}'),'patch_sha256':os.environ['PATCH_DIGEST'],
            'assembly_branch':os.environ['ASSEMBLY'],'canonical_branch_unchanged':True,
          },indent=2)+'\n')
          PY
          cat "$RUNNER_TEMP/product.json"
      - uses: actions/upload-artifact@v4
        with:
          name: metalfx-reviewed-product
          path: |
            ${{ runner.temp }}/product.bundle
            ${{ runner.temp }}/product.patch
            ${{ runner.temp }}/product.json
          retention-days: 2
          if-no-files-found: error
