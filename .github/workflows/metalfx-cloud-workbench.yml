name: MetalFX isolated cloud workbench
on:
  push:
    branches: [agent/metalfx-cloud-workbench-20260924]
    paths: [.github/workflows/metalfx-cloud-workbench.yml]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    env:
      BASE: ac40965259ddcc8250782efea1795343d39aa744
      TREE: 8a00020050f01cfbca92274c62a17838b884fae5
      CANDIDATE: agent/metalfx-data-contracts-20260924
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commit reviewed annotation correction on exact product base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$CANDIDATE" | cut -f1)" = "$BASE"
          git switch --detach "$BASE"
          python3 - <<'PY'
          from pathlib import Path
          root = Path('src/main/java/com/metallum/client/metal/render')
          edits = {
            'MetalCompiledRenderPipeline.java': [
              ('@Nullable\n    private final MetalCrossShaderCompiler.CutoutFragment', 'private final MetalCrossShaderCompiler.@Nullable CutoutFragment'),
              ('@Nullable final MetalCrossShaderCompiler.CutoutFragment', 'final MetalCrossShaderCompiler.@Nullable CutoutFragment')],
            'MetalRenderPass.java': [
              ('@Nullable\n    private MetalFxReactivePass.Pass', 'private MetalFxReactivePass.@Nullable Pass'),
              ('@Nullable MetalFxReactivePass.Pass', 'MetalFxReactivePass.@Nullable Pass')],
            'MetalFxManager.java': [
              ('@Nullable\n    private MetalFxReactivePass.Source', 'private MetalFxReactivePass.@Nullable Source')],
          }
          for name, replacements in edits.items():
            path = root / name
            text = path.read_text()
            for old, new in replacements:
              assert text.count(old) == 1, (name, old)
              text = text.replace(old, new)
            path.write_text(text)
          PY
          git add src/main/java
          test "$(git write-tree)" = "$TREE"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(metalfx): qualify nullable nested producer types for JSpecify'
          git push origin HEAD:refs/heads/agent/metalfx-cloud-assembly-20260924
          git bundle create "$RUNNER_TEMP/product.bundle" HEAD
          git log -1 --format='%H %T' > "$RUNNER_TEMP/identity.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: metalfx-reviewed-product
          path: |
            ${{ runner.temp }}/product.bundle
            ${{ runner.temp }}/identity.txt
          retention-days: 2
          if-no-files-found: error
