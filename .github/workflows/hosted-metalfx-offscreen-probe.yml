name: hosted-metalfx-offscreen-probe

on:
  workflow_dispatch:
  push:
    branches:
      - ci/hosted-metal-gpu-probe-20260810

concurrency:
  group: hosted-metalfx-offscreen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metalfx-capability:
    name: hosted MetalFX capability
    runs-on: macos-26
    env:
      METALLUM_HOSTED_METAL_OFFSCREEN: 'true'
      MTL_DEBUG_LAYER: '0'
      MTL_SHADER_VALIDATION: '0'
      MTL_HUD_ENABLED: '0'
      MTLFX_HUD_ENABLED: '0'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Classify hosted MetalFX Temporal Scaler capability
        shell: bash
        run: |
          set -uo pipefail
          chmod +x ./gradlew
          set +e
          ./gradlew --stacktrace \
            -I .github/ci/hosted-metal-offscreen.gradle \
            metalFxOffscreenValidation 2>&1 | tee "$RUNNER_TEMP/metalfx-hosted.log"
          rc=${PIPESTATUS[0]}
          set -e

          if [ "$rc" -eq 0 ]; then
            echo "HOSTED_METALFX_TEMPORAL_SUPPORTED=true" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if grep -Fq 'MTLFXTemporalScaler is unsupported on this device' "$RUNNER_TEMP/metalfx-hosted.log"; then
            echo "HOSTED_METALFX_TEMPORAL_SUPPORTED=false" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "Apple Paravirtual device exposes core Metal but not MTLFXTemporalScaler; keep MetalFX on the physical-device lane." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Unexpected MetalFX validation failure (exit $rc)." | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$rc"
