name: Amethyst iOS Java compatibility

on:
  push:
    branches:
      - feature/ios-amethyst-runtime
      - task/ios-glfw-input-mode-proof-20260903
  workflow_dispatch:

jobs:
  lwjgl-abi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MetalUniversal
        uses: actions/checkout@v4

      - name: Checkout Amethyst integration branch
        uses: actions/checkout@v4
        with:
          repository: 21Z121Z1/Amethyst-iOS
          ref: task/mc26-glfw-input-mode-defaults-20260903
          path: amethyst

      - name: Set up build JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Prepare coherent LWJGL 3.4.1 Java modules
        run: |
          set -euo pipefail
          MODULES="$GITHUB_WORKSPACE/lwjgl-modules"
          for module in lwjgl lwjgl-glfw lwjgl-opengl lwjgl-spvc lwjgl-vulkan; do
            mkdir -p "$MODULES/$module"
            curl --fail --location --retry 3 \
              -o "$MODULES/$module/$module.jar" \
              "https://repo1.maven.org/maven2/org/lwjgl/$module/3.4.1/$module-3.4.1.jar"
          done

      - name: Compile Amethyst GLFW facade against LWJGL 3.4.1
        run: |
          set -euo pipefail
          make -C amethyst/JavaApp \
            build/lwjgl/org/lwjgl/glfw/GLFW.class \
            build/lwjgl/org/lwjgl/glfw/GLFWVulkan.class \
            BOOTJDK="$JAVA_HOME/bin" \
            LWJGL_MODULES_DIR="$GITHUB_WORKSPACE/lwjgl-modules"

      - name: Verify deterministic GLFW input mode defaults
        run: |
          set -euo pipefail
          MODULE_CP="$(find "$GITHUB_WORKSPACE/lwjgl-modules" -type f -name '*.jar' -print | sort | paste -sd: -)"
          CLASSPATH="amethyst/JavaApp/build/lwjgl:$MODULE_CP"
          cat > /tmp/GLFWInputModeDefaultsCheck.java <<'JAVA'
          import org.lwjgl.glfw.GLFW;
          import org.lwjgl.glfw.GLFWWindowProperties;

          public final class GLFWInputModeDefaultsCheck {
              private static void require(GLFWWindowProperties properties, int mode, int expected, String label) {
                  Integer actual = properties.inputModes.get(mode);
                  if (actual == null || actual.intValue() != expected) {
                      throw new AssertionError(label + " default was " + actual + ", expected " + expected);
                  }
              }

              public static void main(String[] args) {
                  GLFWWindowProperties properties = new GLFWWindowProperties();
                  require(properties, GLFW.GLFW_CURSOR, GLFW.GLFW_CURSOR_NORMAL, "cursor");
                  require(properties, GLFW.GLFW_STICKY_KEYS, GLFW.GLFW_FALSE, "sticky keys");
                  require(properties, GLFW.GLFW_STICKY_MOUSE_BUTTONS, GLFW.GLFW_FALSE, "sticky mouse buttons");
                  require(properties, GLFW.GLFW_LOCK_KEY_MODS, GLFW.GLFW_FALSE, "lock key modifiers");
                  require(properties, GLFW.GLFW_RAW_MOUSE_MOTION, GLFW.GLFW_FALSE, "raw mouse motion");
                  require(properties, GLFW.GLFW_UNLIMITED_MOUSE_BUTTONS, GLFW.GLFW_FALSE, "unlimited mouse buttons");
                  require(properties, GLFW.GLFW_IME, GLFW.GLFW_FALSE, "IME");
              }
          }
          JAVA
          "$JAVA_HOME/bin/javac" -cp "$CLASSPATH" /tmp/GLFWInputModeDefaultsCheck.java
          "$JAVA_HOME/bin/java" -cp "$CLASSPATH:/tmp" GLFWInputModeDefaultsCheck

      - name: Verify Minecraft 26.x Java ABI surface
        run: |
          set -euo pipefail
          MODULE_CP="$(find "$GITHUB_WORKSPACE/lwjgl-modules" -type f -name '*.jar' -print | sort | paste -sd: -)"
          CLASSPATH="amethyst/JavaApp/build/lwjgl:$MODULE_CP"
          SPVC_JAR="$GITHUB_WORKSPACE/lwjgl-modules/lwjgl-spvc/lwjgl-spvc.jar"
          jar tf "$SPVC_JAR" | grep -q '^org/lwjgl/util/spvc/Spvc.class$'
          jar tf "$GITHUB_WORKSPACE/lwjgl-modules/lwjgl-glfw/lwjgl-glfw.jar" | grep -q '^org/lwjgl/glfw/GLFWPreeditCallback.class$'
          javap -classpath "$CLASSPATH" org.lwjgl.system.Configuration | grep -q 'SPVC_LIBRARY_NAME'
          javap -classpath "$CLASSPATH" org.lwjgl.glfw.GLFW | grep -q 'glfwPlatformSupported'
          javap -classpath "$CLASSPATH" org.lwjgl.glfw.GLFW | grep -q 'GLFW_CURSOR_CAPTURED'
          javap -classpath "$CLASSPATH" org.lwjgl.glfw.GLFW | grep -q 'glfwSetPreeditCallback'
          javap -classpath "$CLASSPATH" org.lwjgl.glfw.GLFW | grep -q 'glfwSetPreeditCandidateCallback'
          javap -classpath "$CLASSPATH" org.lwjgl.glfw.GLFW | grep -q 'glfwSetIMEStatusCallback'

      - name: Verify pinned iOS runtime integration
        run: |
          set -euo pipefail
          grep -q '702c2102a2876cdf67d1d57f6819fa2d458217d9' amethyst/scripts/build_metallum_runtime.sh
          grep -q 'LWJGL_MODULES_DIR' amethyst/JavaApp/Makefile
          grep -q 'LWJGL_IOS_NATIVES_DIR' amethyst/JavaApp/Makefile
          grep -q 'METALLUM_NATIVE_DIR' amethyst/JavaApp/Makefile
          grep -q 'buildIOSNative' build.gradle
          grep -q 'buildIOSSpvc' build.gradle
          grep -q 'libspvc_metallum.dylib' src/main/java/com/metallum/client/metal/render/bridge/IOSRuntimePreflight.java
