name: Amethyst iOS Java compatibility

on:
  push:
    branches:
      - feature/ios-amethyst-runtime
  workflow_dispatch:

jobs:
  lwjgl-abi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MetalUniversal
        uses: actions/checkout@v4

      - name: Checkout Amethyst integration branch
        uses: actions/checkout@v4
        with:
          repository: 21Z121Z1/Amethyst-iOS
          ref: feature/metallum-mc26-lwjgl-compat
          path: amethyst

      - name: Set up build JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Prepare coherent LWJGL 3.4.1 Java modules
        run: |
          set -euo pipefail
          MODULES="$GITHUB_WORKSPACE/lwjgl-modules"
          for module in lwjgl lwjgl-glfw lwjgl-opengl lwjgl-spvc lwjgl-vulkan; do
            mkdir -p "$MODULES/$module"
            curl --fail --location --retry 3 \
              -o "$MODULES/$module/$module.jar" \
              "https://repo1.maven.org/maven2/org/lwjgl/$module/3.4.1/$module-3.4.1.jar"
          done

      - name: Compile Amethyst GLFW facade against LWJGL 3.4.1
        run: |
          set -euo pipefail
          MODULE_CP="$(find "$GITHUB_WORKSPACE/lwjgl-modules" -type f -name '*.jar' -print | sort | paste -sd: -)"
          cd amethyst/JavaApp
          rm -rf build/abi-classes
          mkdir -p build/abi-classes
          "$JAVA_HOME/bin/javac" \
            -XDignore.symbol.file \
            -cp "$MODULE_CP:src/launcher:src/lwjgl" \
            -d build/abi-classes \
            $(find src/lwjgl/org/lwjgl/glfw -type f -name '*.java' -print | sort)
          printf '%s' "$MODULE_CP" > build/abi-classpath.txt

      - name: Verify Minecraft 26.x Java ABI surface
        run: |
          set -euo pipefail
          MODULE_CP="$(cat amethyst/JavaApp/build/abi-classpath.txt)"
          CLASSPATH="amethyst/JavaApp/build/abi-classes:$MODULE_CP"
          SPVC_JAR="$GITHUB_WORKSPACE/lwjgl-modules/lwjgl-spvc/lwjgl-spvc.jar"
          jar tf "$SPVC_JAR" | grep -q '^org/lwjgl/util/spvc/Spvc.class$'
          jar tf "$GITHUB_WORKSPACE/lwjgl-modules/lwjgl-glfw/lwjgl-glfw.jar" | grep -q '^org/lwjgl/glfw/GLFWPreeditCallback.class$'
          javap -classpath "$CLASSPATH" org.lwjgl.system.Configuration | grep -q 'SPVC_LIBRARY_NAME'
          javap -classpath "$CLASSPATH" org.lwjgl.glfw.GLFW | grep -q 'glfwPlatformSupported'
          javap -classpath "$CLASSPATH" org.lwjgl.glfw.GLFW | grep -q 'GLFW_CURSOR_CAPTURED'
          javap -classpath "$CLASSPATH" org.lwjgl.glfw.GLFW | grep -q 'glfwSetPreeditCallback'
          javap -classpath "$CLASSPATH" org.lwjgl.glfw.GLFW | grep -q 'glfwSetPreeditCandidateCallback'
          javap -classpath "$CLASSPATH" org.lwjgl.glfw.GLFW | grep -q 'glfwSetIMEStatusCallback'

      - name: Verify pinned iOS runtime integration
        run: |
          set -euo pipefail
          grep -q '702c2102a2876cdf67d1d57f6819fa2d458217d9' amethyst/scripts/build_metallum_runtime.sh
          grep -q 'LWJGL_MODULES_DIR' amethyst/JavaApp/Makefile
          grep -q 'LWJGL_IOS_NATIVES_DIR' amethyst/JavaApp/Makefile
          grep -q 'METALLUM_NATIVE_DIR' amethyst/JavaApp/Makefile
          grep -q 'buildIOSNative' build.gradle
          grep -q 'buildIOSSpvc' build.gradle
          grep -q 'libspvc_metallum.dylib' src/main/java/com/metallum/client/metal/render/bridge/IOSRuntimePreflight.java
