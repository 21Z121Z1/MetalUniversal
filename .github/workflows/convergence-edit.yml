# Temporary exact-source verification and immutable transport; remove before main acceptance.
name: Convergence prepared-worktree validation
on:
  push:
    branches: [convergence/main-unification-20260923]
    paths: [.github/workflows/convergence-edit.yml]
permissions:
  contents: read
jobs:
  compute-grouping:
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      MTL_DEBUG_LAYER: '0'
      MTL_SHADER_VALIDATION: '0'
      MTL_HUD_ENABLED: '0'
      MTL_HUD_ENCODER_TIMING_ENABLED: '0'
      MTLFX_HUD_ENABLED: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 5da34721ae25a3acf6add24c7a1c0f071eb14921
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
      - name: Materialize the reviewed source and tests with complete identity checks
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: MetalUniversal validation
          GIT_AUTHOR_EMAIL: validation@localhost
          GIT_COMMITTER_NAME: MetalUniversal validation
          GIT_COMMITTER_EMAIL: validation@localhost
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess
          base = '5da34721ae25a3acf6add24c7a1c0f071eb14921'
          expected_tree = '5a3d3724bee63ccc4a5c0759ec7da61c98b71348'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          if git('rev-parse', 'HEAD') != base or git('status', '--porcelain'):
              raise RuntimeError('Unexpected source base or dirty checkout')
          changes = {}
          for blob_sha, checksum in [
              ('e7fe69874020897eccbdf2c6f8a6a9d22a10681c', '3294a29fa7e8fffc16783bdd2de3fe3fe1abdbe03fcf5b821075e44e73f53a32'),
              ('902ec21e7ffaea4948aebafab5ffb7eb25929c89', 'db85594eda60ca24becbc62605c44213324acddc6e51ebf61d9ff21d7e801777')]:
              blob = json.loads(subprocess.check_output(['gh', 'api', 'repos/21Z121Z1/MetalUniversal/git/blobs/' + blob_sha]))
              payload = gzip.decompress(base64.b64decode(blob['content']))
              if hashlib.sha256(payload).hexdigest() != checksum:
                  raise RuntimeError('Reviewed payload checksum mismatch')
              incoming = json.loads(payload)
              if changes.keys() & incoming.keys():
                  raise RuntimeError('Duplicate prepared path')
              changes.update(incoming)
          if len(changes) != 16:
              raise RuntimeError('Unexpected path count')
          for name, change in changes.items():
              path = pathlib.Path(name)
              if change['base_blob'] is None:
                  if path.exists():
                      raise RuntimeError('New source path already exists: ' + name)
                  text = change['content']
              else:
                  if git('hash-object', name) != change['base_blob']:
                      raise RuntimeError('Base blob changed: ' + name)
                  if change['expected_blob'] is None:
                      path.unlink()
                      continue
                  lines = path.read_text().splitlines(keepends=True)
                  for edit in reversed(change['edits']):
                      lines[edit['start']:edit['end']] = edit['lines']
                  text = ''.join(lines)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text)
              if git('hash-object', name) != change['expected_blob']:
                  raise RuntimeError('Reviewed output blob mismatch: ' + name)
          subprocess.run(['git', 'add', '--', *sorted(changes)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          tree = git('write-tree')
          if tree != expected_tree:
              raise RuntimeError('Reviewed tree mismatch: ' + tree)
          patch = subprocess.check_output(['git', 'diff', '--cached', '--binary', '--full-index'])
          commit = subprocess.check_output(['git', 'commit-tree', tree, '-p', base],
              input='Prepared typed compute grouping and allocation-scope tests; unpublished validation only\n', text=True).strip()
          subprocess.run(['git', 'reset', '--hard', commit], check=True)
          output = pathlib.Path('build/agent-evidence'); output.mkdir(parents=True, exist_ok=True)
          proof = {'proof_subject': 'unpublished-prepared-worktree', 'source_base': base,
              'tested_commit_sha': commit, 'tested_tree_sha': tree, 'workflow_sha': os.environ['GITHUB_SHA'],
              'expected_blobs': {p: c['expected_blob'] for p, c in changes.items()},
              'main_acceptance': False, 'physical_display_acceptance': False, 'refs_updated': False}
          (output / 'prepared-subject.json').write_text(json.dumps(proof, indent=2) + '\n')
          (output / 'change.patch').write_bytes(patch)
          subprocess.run(['git', 'bundle', 'create', str(output / 'prepared-source.bundle'), 'HEAD'], check=True)
          print(json.dumps(proof, indent=2))
          PY
      - name: Verify pure access, generation and frozen-binding contracts
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace test \
            --tests '*IrisMetalComputeGroupingRuntimeTest' --tests '*IrisMetalPreparedComputeBindingsTest' \
            --tests '*MetalGpuBufferFrontendContractTest' \
            -x buildMacNative -x buildIOSNative -x buildIOSSpvc \
            2>&1 | tee build/agent-evidence/compute-grouping-unit.log
      - name: Probe hosted Metal before running shipping GPU tests
        run: |
          set -euo pipefail
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$latest"
          xcrun swiftc -O -framework Metal .github/ci/HostedMetalCapabilityProbe.swift -o "$RUNNER_TEMP/metal-probe"
          "$RUNNER_TEMP/metal-probe" | tee build/agent-evidence/hosted-metal-probe.log
          grep -Fq HOSTED_METAL_GPU_PROBE_PASS build/agent-evidence/hosted-metal-probe.log
      - name: Prove historical transient facades hide a real allocation alias
        run: |
          set -euo pipefail
          source=src/main/java/com/metallum/client/metal/render/MetalTransientMemory.java
          cp "$source" "$RUNNER_TEMP/fixed-transient.java"
          git show 5da34721ae25a3acf6add24c7a1c0f071eb14921:"$source" > "$source"
          set +e
          ./gradlew --no-daemon --stacktrace -I .github/ci/HostedMetalGradle.init.gradle \
            hostedMetalCoreIntegrationTest \
            --tests '*MetalComputeBackendIntegrationTest.transientUsageWrappersCannotHideOnePhysicalAllocationFromAdmission' \
            2>&1 | tee build/agent-evidence/transient-identity-before.log
          result=${PIPESTATUS[0]}
          set -e
          cp "$RUNNER_TEMP/fixed-transient.java" "$source"
          test "$result" -ne 0
          mkdir -p build/agent-evidence/transient-identity-red
          cp -R build/test-results/hostedMetalCoreIntegrationTest/. build/agent-evidence/transient-identity-red/
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          failed = {case.attrib['name'] for path in pathlib.Path('build/agent-evidence/transient-identity-red').glob('TEST*.xml')
              for case in ET.parse(path).getroot().iter('testcase') if case.find('failure') is not None}
          expected = {'transientUsageWrappersCannotHideOnePhysicalAllocationFromAdmission()'}
          if failed != expected:
              raise RuntimeError(f'Expected only the allocation-alias assertion failure, got {failed}')
          print('TRANSIENT_ALLOCATION_ALIAS_REGRESSION_CONFIRMED')
          PY
      - name: Verify native dispatch reuse, fences, indirect reads and exceptional cleanup
        run: |
          set -euo pipefail
          git diff --exit-code
          ./gradlew --no-daemon --stacktrace -I .github/ci/HostedMetalGradle.init.gradle \
            hostedMetalCoreIntegrationTest --tests '*MetalComputeBackendIntegrationTest' \
            2>&1 | tee build/agent-evidence/compute-grouping-gpu.log
      - name: Check the same real Iris execution graph with grouping disabled and enabled
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace -I .github/ci/HostedMetalGradle.init.gradle \
            hostedMetalIrisIntegrationTest --tests '*IrisMetalComputeConformanceTest' \
            2>&1 | tee build/agent-evidence/iris-compute-baseline.log
          ./gradlew --no-daemon --stacktrace -I .github/ci/HostedMetalGradle.init.gradle \
            hostedMetalIrisComputeGroupingTest \
            2>&1 | tee build/agent-evidence/iris-compute-grouped.log
      - name: Publish verified immutable source blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, pathlib, subprocess
          output = pathlib.Path('build/agent-evidence')
          proof = json.loads((output / 'prepared-subject.json').read_text()); entries = []
          if subprocess.check_output(['git', 'status', '--porcelain'], text=True).strip():
              raise RuntimeError('Test execution changed tracked source')
          for name, expected in proof['expected_blobs'].items():
              if expected is not None:
                  request = json.dumps({'encoding': 'base64', 'content': base64.b64encode(pathlib.Path(name).read_bytes()).decode()})
                  response = json.loads(subprocess.check_output(['gh', 'api', '--method', 'POST',
                      'repos/21Z121Z1/MetalUniversal/git/blobs', '--input', '-'], input=request, text=True))
                  if response['sha'] != expected:
                      raise RuntimeError('Published blob mismatch: ' + name)
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': expected})
          (output / 'source-blobs.json').write_text(json.dumps(entries, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: compute-grouping-prepared-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/agent-evidence/
            build/test-results/
            build/reports/tests/
          if-no-files-found: error
          retention-days: 30
