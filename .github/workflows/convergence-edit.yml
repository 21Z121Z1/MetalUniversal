# Temporary convergence machinery. Remove before final main acceptance.
# This job prepares content blobs only; publication uses the connected GitHub app.
name: Convergence edit
on:
  push:
    branches: [convergence/main-unification-20260923]
    paths: [.github/workflows/convergence-edit.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare exact reviewed blobs without updating refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request, urllib.error
          root = pathlib.Path.cwd()
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'convergence-edit'
          output.mkdir()
          def git(*args):
              return subprocess.check_output(['git', *args])
          def api(path, data=None):
              request = urllib.request.Request('https://api.github.com/repos/21Z121Z1/MetalUniversal' + path,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2026-03-10'},
                  method='GET' if data is None else 'POST')
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  print('GitHub API failure:', request.method, path, error.code, error.read().decode())
                  raise
          parent = git('rev-parse', 'HEAD').decode().strip()
          base = 'c81adfba4a6ef0e1a06f9f2230c8112f902b07b4'
          changed = git('diff', '--name-only', base, parent).decode().splitlines()
          if changed != ['.github/workflows/convergence-edit.yml']:
              raise RuntimeError('Unexpected intervening source changes: ' + repr(changed))
          blob_shas = ['26a4a6154344bed6e5202cf14625b6d9ab1a826b',
                       'f06bd6efdc0ce3cddc3e0b0ab59425af1ca6ce91',
                       '8a2fc75f9f9e2f02dfe7d87184db33af30f8ed10',
                       'd5539cf0251415b15e2f6faff796007a3e979039']
          parts = []
          for blob_sha in blob_shas:
              blob = api('/git/blobs/' + blob_sha)
              part = base64.b64decode(blob['content'])
              if hashlib.sha1(b'blob ' + str(len(part)).encode() + b'\0' + part).hexdigest() != blob_sha:
                  raise RuntimeError('Reviewed transport blob identity mismatch')
              parts.append(part)
          patch = gzip.decompress(b''.join(parts))
          digest = '5cc7cdfe7c880d5ccf36ae08aaf732ac947cf9d0361aa28b8ed5744f321916d6'
          if hashlib.sha256(patch).hexdigest() != digest:
              raise RuntimeError('Reviewed patch digest mismatch')
          patch_path = output / 'change.patch'
          patch_path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--index', str(patch_path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(patch_path)], check=True)
          subprocess.run(['git', 'diff', '--check', 'HEAD'], check=True)
          if git('diff', '--binary', '--full-index', 'HEAD') != patch:
              raise RuntimeError('Applied patch differs from reviewed patch')
          allowed = {'.github/ci/HostedMetalGradle.init.gradle', '.github/ci/JvmPsoThreadingProbe.java',
                     '.github/workflows/build.yml', 'build.gradle'}
          paths = git('diff', '--cached', '--no-renames', '--name-only', '-z').decode().rstrip('\0').split('\0')
          if set(paths) != allowed:
              raise RuntimeError('Unexpected patch paths: ' + repr(paths))
          entries = []
          for path in paths:
              mode, expected_sha = git('ls-files', '--stage', '--', path).decode().split()[:2]
              if mode != '100644':
                  raise RuntimeError('Unexpected file mode')
              blob = api('/git/blobs', {'content': (root / path).read_text(), 'encoding': 'utf-8'})
              if blob['sha'] != expected_sha:
                  raise RuntimeError('Prepared blob differs from reviewed content')
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': blob['sha']})
          result = {'parent_sha': parent, 'base_tree': git('rev-parse', 'HEAD^{tree}').decode().strip(),
              'expected_tree': git('write-tree').decode().strip(), 'patch_sha256': digest,
              'entries': entries, 'refs_updated': False, 'tests_claimed': False}
          (output / 'candidate.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: convergence-edit-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/convergence-edit/
          if-no-files-found: error
          retention-days: 7
