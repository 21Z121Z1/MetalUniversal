# Temporary convergence machinery. Remove before final main acceptance.
# This job prepares reviewed content blobs only; the connected app publishes refs.
name: Convergence edit
on:
  push:
    branches: [convergence/main-unification-20260923]
    paths: [.github/workflows/convergence-edit.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare exact reviewed blobs without updating refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request, urllib.error
          root = pathlib.Path.cwd()
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'convergence-edit'
          output.mkdir()
          if os.environ['GITHUB_REPOSITORY'] != '21Z121Z1/MetalUniversal':
              raise RuntimeError('Unexpected repository')
          def git(*args):
              return subprocess.check_output(['git', *args])
          def api(path, data=None):
              request = urllib.request.Request('https://api.github.com/repos/21Z121Z1/MetalUniversal' + path,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'},
                  method='GET' if data is None else 'POST')
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  print('GitHub API failure:', request.method, path, error.code, error.read().decode())
                  raise
          def blob_hash(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          def read_blob(sha):
              if sha == blob_hash(b''):
                  return b''
              result = api('/git/blobs/' + sha)
              data = base64.b64decode(result['content'])
              if blob_hash(data) != sha:
                  raise RuntimeError('Blob identity mismatch: ' + sha)
              return data
          parent = git('rev-parse', 'HEAD').decode().strip()
          base = 'c1e5c88e95af17c93ed9c9d525888258e6b4471a'
          changed = git('diff', '--name-only', base, parent).decode().splitlines()
          if changed != ['.github/workflows/convergence-edit.yml']:
              raise RuntimeError('Unexpected intervening source changes: ' + repr(changed))
          parts = ['87985b6fd418176f85a9b4f63a7f7a37fda5f8f3',
                   '0fafed0e5dfa17c673918ddebee8d002ec19beb3']
          raw = lzma.decompress(b''.join(read_blob(sha) for sha in parts))
          if hashlib.sha256(raw).hexdigest() != 'eff5af59c14b3e4727fc8c3467ace0a4b243af04474f1bea4eca6b4a30ce1c3b':
              raise RuntimeError('Reviewed capsule digest mismatch')
          capsule = json.loads(raw)
          if capsule['base_commit'] != base or len(capsule['files']) != 17:
              raise RuntimeError('Unexpected reviewed capsule base or file count')
          paths = []
          for entry in capsule['files']:
              path = pathlib.PurePosixPath(entry['path'])
              if path.is_absolute() or '..' in path.parts or str(path) in paths or entry['mode'] != '100644':
                  raise RuntimeError('Invalid reviewed path or mode')
              if not str(path).startswith(('.github/ci/minecraft-e2e/', 'scripts/agent/',
                      'src/main/java/com/metallum/client/metal/render/bridge/')) and str(path) not in {
                      '.gitignore', 'docs/agent/frame-evidence-contract.md'}:
                  raise RuntimeError('Path outside reviewed subsystem')
              original = read_blob(entry['base_sha']).decode('utf-8')
              chunks = []
              for operation in entry['ops']:
                  if isinstance(operation, str):
                      chunks.append(operation)
                  elif (isinstance(operation, list) and len(operation) == 2
                        and all(type(value) is int for value in operation)
                        and 0 <= operation[0] <= operation[1] <= len(original)):
                      chunks.append(original[operation[0]:operation[1]])
                  else:
                      raise RuntimeError('Invalid reviewed delta operation')
              content = ''.join(chunks).encode('utf-8')
              if blob_hash(content) != entry['sha']:
                  raise RuntimeError('Reviewed output identity mismatch: ' + str(path))
              destination = root / path
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(content)
              paths.append(str(path))
          subprocess.run(['git', 'add', '--', *paths], check=True)
          subprocess.run(['git', 'diff', '--check', 'HEAD'], check=True)
          patch = git('diff', '--binary', '--full-index', 'HEAD')
          digest = '20e832504bf0c750dbd3fb98ffcaad36c9792723c7fe1b719e90a7093dd5f3c2'
          if capsule['final_diff_sha256'] != digest or hashlib.sha256(patch).hexdigest() != digest:
              raise RuntimeError('Reconstructed changes differ from the locally reviewed patch')
          (output / 'change.patch').write_bytes(patch)
          tests = [
              ['python3', '-m', 'unittest', 'discover', '-s', 'scripts/agent', '-p', 'test_frame_*.py'],
              ['python3', 'scripts/agent/verify_frame_evidence.py', '--self-test']]
          with (output / 'python-tests.log').open('w') as log:
              for command in tests:
                  log.write('$ ' + ' '.join(command) + '\n')
                  log.flush()
                  subprocess.run(command, check=True, stdout=log, stderr=subprocess.STDOUT)
          entries = []
          for path in paths:
              mode, expected_sha = git('ls-files', '--stage', '--', path).decode().split()[:2]
              if mode != '100644':
                  raise RuntimeError('Unexpected file mode')
              blob = api('/git/blobs', {'content': (root / path).read_text(), 'encoding': 'utf-8'})
              if blob['sha'] != expected_sha:
                  raise RuntimeError('Prepared blob differs from reviewed content')
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': blob['sha']})
          result = {'parent_sha': parent, 'base_tree': git('rev-parse', 'HEAD^{tree}').decode().strip(),
              'expected_tree': git('write-tree').decode().strip(), 'patch_sha256': digest,
              'entries': entries, 'refs_updated': False, 'tests_executed': tests,
              'java_native_validation': 'not executed; required after connector publication',
              'physical_trial_validation': 'not executed; requires physical Apple Silicon display'}
          (output / 'candidate.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: convergence-edit-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/convergence-edit/
          if-no-files-found: error
          retention-days: 7
