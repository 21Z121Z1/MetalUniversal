# Temporary prepared-worktree validation. Remove before final main acceptance.
# This workflow cannot publish source trees, commits, refs, tags, or settings.
name: Convergence prepared-worktree validation
on:
  push:
    branches: [convergence/main-unification-20260923]
    paths: [.github/workflows/convergence-edit.yml]
permissions:
  contents: read
  actions: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: java-contracts
            runner: ubuntu-latest
          - lane: shipping-build
            runner: macos-26
          - lane: production-e2e
            runner: macos-26
          - lane: hosted-metal
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      MTL_HUD_ENABLED: '0'
      MTL_HUD_ENCODER_TIMING_ENABLED: '0'
      MTLFX_HUD_ENABLED: '0'
      METALLUM_PSO_COMPILE_HOP: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: e493bcab34b3d3613db7eade0b5e6c40ddc69f95
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
      - name: Materialize the exact reviewed patch in this disposable workspace only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: MetalUniversal validation
          GIT_AUTHOR_EMAIL: validation@localhost
          GIT_COMMITTER_NAME: MetalUniversal validation
          GIT_COMMITTER_EMAIL: validation@localhost
          GIT_AUTHOR_DATE: '2026-09-23T01:20:00+0000'
          GIT_COMMITTER_DATE: '2026-09-23T01:20:00+0000'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e493bcab34b3d3613db7eade0b5e6c40ddc69f95
          test -z "$(git status --porcelain)"
          gh api repos/21Z121Z1/MetalUniversal/actions/artifacts/10727517785/zip > "$RUNNER_TEMP/reviewed.zip"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, zipfile
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'reviewed.zip'
          if hashlib.sha256(archive.read_bytes()).hexdigest() != 'a4596292cd617e7ec182b042d942413a97a595f4a608d1073cd0cf4ac6d4c133':
              raise RuntimeError('Reviewed artifact archive mismatch')
          with zipfile.ZipFile(archive) as source:
              patch = source.read('change.patch')
              manifest = json.loads(source.read('candidate.json'))
          if hashlib.sha256(patch).hexdigest() != '12184a246327cd265aad8af3420c291994c9dc5130380c4b942d78f4cca9f32d':
              raise RuntimeError('Reviewed patch mismatch')
          if manifest['parent_sha'] != 'e493bcab34b3d3613db7eade0b5e6c40ddc69f95' or manifest['refs_updated']:
              raise RuntimeError('Unexpected preparation provenance')
          patch_path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'reviewed.patch'
          patch_path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--index', str(patch_path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(patch_path)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          if tree != '339dd1064fcf5fca1f8e37ce3b652c8354930dc5' or tree != manifest['expected_tree']:
              raise RuntimeError('Prepared source tree mismatch')
          # Local-only detached identity permits honest clean-binary provenance.
          # No push, authenticated Git configuration, or write API exists here.
          commit = subprocess.check_output(['git', 'commit-tree', tree, '-p', manifest['parent_sha']],
              input='Prepared workload API and shared-anchor corrections; unpublished validation only\n', text=True).strip()
          subprocess.run(['git', 'reset', '--hard', commit], check=True)
          proof = {'schema_version': 1, 'proof_subject': 'unpublished-prepared-worktree',
              'published': False, 'workflow_sha': os.environ['GITHUB_SHA'],
              'source_base': manifest['parent_sha'], 'patch_sha256': manifest['patch_sha256'],
              'tested_commit_sha': commit, 'tested_tree_sha': tree,
              'main_acceptance': False, 'physical_acceptance': False}
          output = pathlib.Path('build/agent-evidence'); output.mkdir(parents=True, exist_ok=True)
          (output / 'prepared-subject.json').write_text(json.dumps(proof, indent=2) + '\n')
          subprocess.run(['git', 'bundle', 'create', str(output / 'prepared-source.bundle'), 'HEAD'], check=True)
          subprocess.run(['git', 'bundle', 'verify', str(output / 'prepared-source.bundle')], check=True)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('METALLUM_SOURCE_SHA=' + commit + '\n')
          print(json.dumps(proof, indent=2))
          PY
      - name: Validate Java and evidence contracts
        if: matrix.lane == 'java-contracts'
        run: |
          set -euo pipefail
          bash scripts/agent/verify_unified_eval.sh
          ./gradlew --no-daemon --stacktrace -Pmetallum.noOptionalMods=true vanillaRenderPearlBoundaryTest \
            -x buildMacNative -x buildIOSNative -x buildIOSSpvc
          ./gradlew --no-daemon --stacktrace compileJava test verifyProductionJarIsolation \
            -x buildMacNative -x buildIOSNative -x buildIOSSpvc
      - name: Select and record the shipping macOS SDK
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$latest"
          sw_vers
          xcodebuild -version
          python3 scripts/agent/record_sdk_contract.py --output build/agent-evidence/sdk-api-contract.txt
      - name: Require shipping native and fresh-JVM PSO compilation
        if: matrix.lane == 'shipping-build'
        run: |
          set -euo pipefail
          ./gradlew --no-daemon buildMacNative
          xcrun swiftc -O -target arm64-apple-macosx14.0 -framework Foundation -framework Metal \
            src/test/native/MetalShippingPipelineAbiSmokeTest.swift -o "$RUNNER_TEMP/shipping-abi-probe"
          "$RUNNER_TEMP/shipping-abi-probe" src/main/resources/natives/macos/libmetallum.dylib \
            2>&1 | tee build/agent-evidence/shipping-abi-threading-probe.log
          grep -Fq SHIPPING_PIPELINE_C_ABI_PASS build/agent-evidence/shipping-abi-threading-probe.log
          grep -Fq SHIPPING_PIPELINE_BACKGROUND_THREAD_C_ABI_PASS build/agent-evidence/shipping-abi-threading-probe.log
          java --enable-native-access=ALL-UNNAMED "-XX:ErrorFile=$(pwd)/build/agent-evidence/hs_err_pid%p.log" \
            .github/ci/JvmPsoThreadingProbe.java "$(pwd)/src/main/resources/natives/macos/libmetallum.dylib" \
            2>&1 | tee build/agent-evidence/jvm-pso-threading-probe.log
          grep -Fq JVM_PSO_BACKGROUND_THREAD_PASS build/agent-evidence/jvm-pso-threading-probe.log
      - name: Run the ordinary shipping build gates
        if: matrix.lane == 'shipping-build'
        run: |
          ./gradlew --no-daemon --stacktrace buildMacNative build -Pmetallum.hsErrDir=agent-evidence \
            -x metalFrameGenerationPresentationValidation -x metalFxOffscreenValidation
      - name: Run the production Vanilla client and unchanged evidence verifier
        if: matrix.lane == 'production-e2e'
        env:
          MTL_DEBUG_LAYER: '1'
          MTL_SHADER_VALIDATION: '0'
          METALLUM_HOSTED_METAL_OFFSCREEN: 'true'
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace -x buildIOSNative -x buildIOSSpvc jar verifyIsolatedClientProfiles
          jar="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-validation.jar' | head -n1)"
          test -s "$jar"
          export PREPARED_JAR="$(cd "$(dirname "$jar")" && pwd)/$(basename "$jar")"
          ./gradlew --no-daemon --stacktrace -p .github/ci/minecraft-e2e \
            -PmetallumJar="$PREPARED_JAR" -Pmetallum.noOptionalMods=true test runProductionClientGameTest
          python3 - <<'PY'
          import os, pathlib, subprocess, textwrap
          workflow = pathlib.Path('.github/workflows/minecraft-client-e2e.yml').read_text()
          marker = '      - name: Verify framebuffer, presentation, and reload evidence\n        run: |\n'
          if workflow.count(marker) != 1:
              raise RuntimeError('Cannot locate the unchanged production evidence verifier')
          body = workflow.split(marker, 1)[1].split('      - name: State evidence boundary', 1)[0]
          body = textwrap.dedent(body)
          body = body.replace('${{ steps.metallum.outputs.jar }}', os.environ['PREPARED_JAR'])
          subprocess.run(['bash', '-euo', 'pipefail', '-c', body], check=True)
          PY
      - name: Run the hosted Metal capability and shipping contract gates
        if: matrix.lane == 'hosted-metal'
        env:
          MTL_DEBUG_LAYER: '0'
          MTL_SHADER_VALIDATION: '0'
          METALLUM_HOSTED_METAL_OFFSCREEN: 'true'
        run: |
          set -euo pipefail
          xcrun swiftc -O -framework Metal .github/ci/HostedMetalCapabilityProbe.swift -o "$RUNNER_TEMP/hosted-probe"
          "$RUNNER_TEMP/hosted-probe" | tee build/agent-evidence/hosted-metal-probe.log
          grep -Fq HOSTED_METAL_GPU_PROBE_PASS build/agent-evidence/hosted-metal-probe.log
          ./gradlew --no-daemon --stacktrace -I .github/ci/HostedMetalGradle.init.gradle \
            buildMacNative verifyProductionJarIsolation metalFrameGenerationLifecycleTest \
            compileMetalMrtSmokeTest compileMetal4PipelineSmokeTest compileMetal4PipelinePathTest \
            compileMetalHudRuntimeTest compileMetalFxOffscreenValidation compileMetalFxPerformanceValidation \
            compileMetalFrameGenerationPresentationValidation
          build/metal-tests/MetalMRTSmokeTest | tee build/agent-evidence/metal-mrt.log
          ./gradlew --no-daemon --stacktrace -I .github/ci/HostedMetalGradle.init.gradle \
            metalHudDisabledEnvironmentTest metal4PipelineSmokeTest metal4PipelinePathTest \
            hostedMetalCoreIntegrationTest hostedMetalIrisIntegrationTest
      - name: Preserve exact unpublished test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unpublished-worktree-${{ matrix.lane }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/agent-evidence/
            build/test-results/
            build/reports/
            .github/ci/minecraft-e2e/build/evidence/
            .github/ci/minecraft-e2e/build/reports/
            .github/ci/minecraft-e2e/build/test-results/
            .github/ci/minecraft-e2e/build/run/clientGameTest/logs/
          if-no-files-found: error
          retention-days: 7
