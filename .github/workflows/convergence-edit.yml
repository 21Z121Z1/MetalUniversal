# Temporary exact-source validation/transport. No branch, tag or setting is mutated.
name: Convergence prepared-worktree validation
on:
  push:
    branches: [convergence/main-unification-20260923]
    paths: [.github/workflows/convergence-edit.yml]
permissions:
  contents: write
  actions: read
jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      MTL_HUD_ENABLED: '0'
      MTLFX_HUD_ENABLED: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 4cf2476e68c8d7802ef5c4eea282e75eee917a76
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
      - name: Apply reviewed source and the diagnosed text lightmap correction
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: MetalUniversal validation
          GIT_AUTHOR_EMAIL: validation@localhost
          GIT_COMMITTER_NAME: MetalUniversal validation
          GIT_COMMITTER_EMAIL: validation@localhost
        run: |
          set -euo pipefail
          gh api repos/21Z121Z1/MetalUniversal/git/blobs/82c5ee56835065a5aa29f14e6562813a04a94959 > "$RUNNER_TEMP/payload-blob.json"
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess
          base = '4cf2476e68c8d7802ef5c4eea282e75eee917a76'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          if git('rev-parse', 'HEAD') != base or git('status', '--porcelain'):
              raise RuntimeError('Unexpected preparation base or dirty checkout')
          blob = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'payload-blob.json').read_text())
          payload = gzip.decompress(base64.b64decode(blob['content']))
          digest = hashlib.sha256(payload).hexdigest()
          if digest != 'f4a6d3b18357566734c2bac740d662d9aa19bdae63fcc44464c027085af0c1c7':
              raise RuntimeError('Reviewed payload checksum mismatch')
          changes = json.loads(payload)
          if len(changes) != 21 or any(not p.startswith(('src/main/', 'src/test/')) for p in changes):
              raise RuntimeError('Unexpected payload paths')
          for name, change in changes.items():
              path = pathlib.Path(name)
              if change['base_blob'] is None:
                  if path.exists():
                      raise RuntimeError('New path already exists: ' + name)
                  text = change['content']
              else:
                  if git('hash-object', name) != change['base_blob']:
                      raise RuntimeError('Source blob changed: ' + name)
                  lines = path.read_text().splitlines(keepends=True)
                  for edit in reversed(change['edits']):
                      lines[edit['start']:edit['end']] = edit['lines']
                  text = ''.join(lines)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text)
              if git('hash-object', name) != change['expected_blob']:
                  raise RuntimeError('Prepared source blob mismatch: ' + name)
          # The first real compilation found two GUI variants calling an excluded function.
          # Pair usage with the existing include condition. Do not change GUI pipeline admission.
          name = 'src/main/resources/assets/metallum/shaders/core/text_previous_motion.vsh'
          path = pathlib.Path(name); text = path.read_text()
          old = '#ifdef IS_SEE_THROUGH\n    metallumVertexColor = Color;'
          new = '#if defined(IS_GUI) || defined(IS_SEE_THROUGH)\n    metallumVertexColor = Color;'
          if text.count(old) != 1:
              raise RuntimeError('Text shader correction no longer matches reviewed source')
          path.write_text(text.replace(old, new))
          changes[name]['expected_blob'] = 'bf509c5068e64e1acaea50f7dc13f2f4e3eb32a0'
          if git('hash-object', name) != changes[name]['expected_blob']:
              raise RuntimeError('Text shader correction blob mismatch')
          subprocess.run(['git', 'add', '--', *sorted(changes)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          tree = git('write-tree')
          if tree != 'ab866c76b9973ac05e374611fd9fcc25640f44bd':
              raise RuntimeError('Reviewed tree mismatch: ' + tree)
          output = pathlib.Path('build/agent-evidence'); output.mkdir(parents=True, exist_ok=True)
          (output / 'payload.json').write_text(json.dumps(changes, indent=2) + '\n')
          (output / 'original-payload.json').write_bytes(payload)
          (output / 'change.patch').write_bytes(subprocess.check_output(['git', 'diff', '--cached', '--binary', '--full-index']))
          commit = subprocess.check_output(['git', 'commit-tree', tree, '-p', base],
              input='Prepared optional ABI, encoder lifetime and packaged shader corrections\n', text=True).strip()
          subprocess.run(['git', 'reset', '--hard', commit], check=True)
          proof = {'schema_version': 1, 'proof_subject': 'unpublished-prepared-worktree',
              'workflow_sha': os.environ['GITHUB_SHA'], 'source_base': base,
              'tested_commit_sha': commit, 'tested_tree_sha': tree, 'original_payload_sha256': digest,
              'text_lightmap_correction': {'old': old, 'new': new},
              'expected_blobs': {p: c['expected_blob'] for p, c in changes.items()},
              'refs_updated': False, 'main_acceptance': False, 'physical_acceptance': False}
          (output / 'prepared-subject.json').write_text(json.dumps(proof, indent=2) + '\n')
          subprocess.run(['git', 'bundle', 'create', str(output / 'prepared-source.bundle'), 'HEAD'], check=True)
          print(json.dumps(proof, indent=2))
          PY
      - name: Compile packaged shaders and optional adapter regressions
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace test \
            --tests '*MetalMotionShaderCompilationTest' --tests '*MetalIrisDepthConventionTest' \
            --tests '*IrisMetalBlend*' --tests '*MetalFrameGenerationNativeSourceContractTest' \
            -x buildMacNative -x buildIOSNative -x buildIOSSpvc \
            2>&1 | tee build/agent-evidence/source-boundaries-tests.log
      - name: Validate with Iris and Sodium absent from the classpath
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace -Pmetallum.noOptionalMods=true vanillaRenderPearlBoundaryTest \
            -x buildMacNative -x buildIOSNative -x buildIOSSpvc \
            2>&1 | tee build/agent-evidence/vanilla-boundary-tests.log
      - name: Compile shipping Metal module
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        run: |
          set -euo pipefail
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$latest"
          ./gradlew --no-daemon --stacktrace buildMacNative 2>&1 | tee build/agent-evidence/native-source-build.log
      - name: Publish verified immutable source blobs only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, pathlib, subprocess
          output = pathlib.Path('build/agent-evidence')
          changes = json.loads((output / 'payload.json').read_text()); entries = []
          for name, change in changes.items():
              request = json.dumps({'encoding': 'base64', 'content': base64.b64encode(pathlib.Path(name).read_bytes()).decode()})
              response = json.loads(subprocess.check_output(['gh', 'api', '--method', 'POST',
                  'repos/21Z121Z1/MetalUniversal/git/blobs', '--input', '-'], input=request, text=True))
              if response['sha'] != change['expected_blob']:
                  raise RuntimeError('Published blob mismatch: ' + name)
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': response['sha']})
          (output / 'source-blobs.json').write_text(json.dumps(entries, indent=2) + '\n')
          PY
      - name: Preserve exact preparation and test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: source-boundaries-prepared-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/agent-evidence/
            build/test-results/
            build/reports/tests/
          if-no-files-found: error
          retention-days: 30
