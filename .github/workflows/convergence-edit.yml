# Temporary execution-workspace export; remove before final main acceptance.
# Source validation remains in build and capability workflows, not this transport job.
name: Convergence execution workspace
on:
  push:
    branches: [convergence/main-unification-20260923]
    paths: [.github/workflows/convergence-edit.yml]
permissions:
  contents: read
jobs:
  export-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Export real toolchain bytes and exact current history
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/convergence-workspace"
          mkdir -p "$out/jdk"
          # setup-java's JAVA_HOME may itself be a symlink. Copying that link
          # gives an unusable archive outside the runner; dereference its bytes.
          cp -aL "$JAVA_HOME"/. "$out/jdk/"
          test -x "$out/jdk/bin/java"
          "$out/jdk/bin/java" -version 2>&1 | tee "$out/java-version.txt"
          "$out/jdk/bin/javac" -version 2>&1 | tee "$out/javac-version.txt"
          git bundle create "$out/source.bundle" --all
          git bundle verify "$out/source.bundle"
          git ls-remote --heads origin > "$out/remote-heads.tsv"
          git rev-parse HEAD HEAD^{tree} > "$out/source-identity.txt"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/convergence-workspace.tar.gz" convergence-workspace
          sha256sum "$RUNNER_TEMP/convergence-workspace.tar.gz" > "$RUNNER_TEMP/workspace-SHA256SUMS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: convergence-workspace-${{ github.sha }}
          path: |
            ${{ runner.temp }}/convergence-workspace.tar.gz
            ${{ runner.temp }}/workspace-SHA256SUMS
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
