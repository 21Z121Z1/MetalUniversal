# Temporary convergence machinery. Remove before final main acceptance.
# This job creates Git objects only; it never moves or deletes any branch.
name: Convergence edit
on:
  push:
    branches: [convergence/main-unification-20260923]
    paths: [.github/workflows/convergence-edit.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare exact reviewed candidate without updating refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          root = pathlib.Path.cwd()
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'convergence-edit'
          output.mkdir()
          def git(*args):
              return subprocess.check_output(['git', *args])
          def api(path, data=None):
              request = urllib.request.Request('https://api.github.com/repos/21Z121Z1/MetalUniversal' + path,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2026-03-10'},
                  method='GET' if data is None else 'POST')
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          parent = git('rev-parse', 'HEAD').decode().strip()
          base = '009a1c60ef174aedddb8ce103871c03103e713c4'
          changed = git('diff', '--name-only', base, parent).decode().splitlines()
          if changed != ['.github/workflows/convergence-edit.yml']:
              raise RuntimeError('Unexpected intervening source changes: ' + repr(changed))
          blob_shas = ['58590bd42e14fc949da8ea19f13a5049d8bd10b9',
                       '6e111b3874929eed5ee4b66a3a100c6459362155',
                       'fdaf9e4357055f50574df526f8699d3d2dc91e34',
                       '7a94f8c200129cdfb31ef36f988da965ed5e2f27']
          parts = []
          for blob_sha in blob_shas:
              blob = api('/git/blobs/' + blob_sha)
              part = base64.b64decode(blob['content'])
              if hashlib.sha1(b'blob ' + str(len(part)).encode() + b'\0' + part).hexdigest() != blob_sha:
                  raise RuntimeError('Reviewed transport blob identity mismatch')
              parts.append(part)
          patch = gzip.decompress(b''.join(parts))
          digest = '2dd7f613b6402176d501f0b7bb31d385f1996120c27f2fedfad90c176cd32fb7'
          if hashlib.sha256(patch).hexdigest() != digest:
              raise RuntimeError('Reviewed patch digest mismatch')
          patch_path = output / 'change.patch'
          patch_path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--index', str(patch_path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(patch_path)], check=True)
          subprocess.run(['git', 'diff', '--check', 'HEAD'], check=True)
          if git('diff', '--binary', '--full-index', 'HEAD') != patch:
              raise RuntimeError('Applied patch differs from reviewed patch')
          allowed = {
              'src/main/java/com/metallum/client/terrain/TerrainPublicationGenerationGuard.java',
              'src/main/java/com/metallum/client/terrain/VanillaTerrainGenerationRuntime.java',
              'src/main/java/com/metallum/mixin/terrain/VanillaTerrainGenerationRuntime.java',
              'src/main/java/com/metallum/mixin/terrain/CompileTaskTerrainGenerationMixin.java',
              'src/main/java/com/metallum/mixin/terrain/LevelExtractorTerrainGenerationMixin.java',
              'src/main/java/com/metallum/mixin/terrain/RenderSectionTerrainGenerationMixin.java',
              'src/main/java/com/metallum/mixin/terrain/SectionTaskTerrainAdmissionAccessor.java',
              'src/test/java/com/metallum/client/terrain/TerrainPublicationGenerationGuardTest.java',
              'src/test/java/com/metallum/client/terrain/TerrainPublicationTransactionTest.java'}
          paths = git('diff', '--cached', '--no-renames', '--name-only', '-z').decode().rstrip('\0').split('\0')
          if set(paths) != allowed:
              raise RuntimeError('Unexpected patch paths: ' + repr(paths))
          entries = []
          for path in paths:
              entry = {'path': path, 'mode': '100644', 'type': 'blob'}
              if (root / path).exists():
                  mode = git('ls-files', '--stage', '--', path).decode().split()[0]
                  if mode != '100644':
                      raise RuntimeError('Unexpected file mode')
                  entry['content'] = (root / path).read_text()
              else:
                  entry['sha'] = None
              entries.append(entry)
          tree = api('/git/trees', {'base_tree': git('rev-parse', 'HEAD^{tree}').decode().strip(), 'tree': entries})
          if tree['sha'] != git('write-tree').decode().strip():
              raise RuntimeError('Remote tree differs from reviewed local tree')
          commit = api('/git/commits', {'message': 'fix(terrain): make generation admission and mesh exchange indivisible\n\nReimplement the valid ownership intents of mc26.3-spec-continuation without importing its competing telemetry. The only public publication API encloses the original exchange, preserving vanilla retirement ownership. Scope worker tokens with try/finally; ignore untracked dirtiness without weakening tracked invalidation or ABA protection. Move runtime state outside the reserved Mixin package. Exercise actual publication behavior in existing tests and add seven concurrent/exception/fallback regressions.', 'tree': tree['sha'], 'parents': [parent]})
          result = {'parent_sha': parent, 'candidate_sha': commit['sha'], 'candidate_tree': tree['sha'],
              'patch_sha256': digest, 'changed_paths': paths, 'refs_updated': False, 'tests_claimed': False}
          (output / 'candidate.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: convergence-edit-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/convergence-edit/
          if-no-files-found: error
          retention-days: 7
