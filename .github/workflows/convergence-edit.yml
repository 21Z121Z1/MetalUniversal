# Temporary convergence machinery. Remove before final main acceptance.
# This job creates Git objects only; it never moves or deletes any branch.
name: Convergence edit
on:
  push:
    branches: [convergence/main-unification-20260923]
    paths: [.github/workflows/convergence-edit.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare exact reviewed candidate without updating refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          root = pathlib.Path.cwd()
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'convergence-edit'
          output.mkdir()
          def git(*args):
              return subprocess.check_output(['git', *args])
          def api(path, data=None):
              request = urllib.request.Request('https://api.github.com/repos/21Z121Z1/MetalUniversal' + path,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2026-03-10'},
                  method='GET' if data is None else 'POST')
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          parent = git('rev-parse', 'HEAD').decode().strip()
          base = 'f980021b23496b49d1f5b35a6074a75511eb0a70'
          changed = git('diff', '--name-only', base, parent).decode().splitlines()
          if changed != ['.github/workflows/convergence-edit.yml']:
              raise RuntimeError('Unexpected intervening source changes: ' + repr(changed))
          blob_sha = '5ef100e3b059530baa2569fb2c63cdd25d870f1f'
          expected_patch_digest = '20422322e5cfc35656061f9bd885fb007d56899d75df22c5dd9b34baac6f3d0a'
          blob = api('/git/blobs/' + blob_sha)
          patch = base64.b64decode(blob['content'])
          if hashlib.sha1(b'blob ' + str(len(patch)).encode() + b'\0' + patch).hexdigest() != blob_sha:
              raise RuntimeError('Reviewed blob identity mismatch')
          if hashlib.sha256(patch).hexdigest() != expected_patch_digest:
              raise RuntimeError('Reviewed patch digest mismatch')
          patch_path = output / 'change.patch'
          patch_path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--index', str(patch_path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(patch_path)], check=True)
          subprocess.run(['git', 'diff', '--check', 'HEAD'], check=True)
          if git('diff', '--binary', '--full-index', 'HEAD') != patch:
              raise RuntimeError('Applied patch differs from reviewed patch')
          allowed = {'src/main/java/com/metallum/client/metal/render/FrameEvidenceArchive.java',
                     'src/main/java/com/metallum/client/metal/render/FrameEvidenceRecorder.java',
                     'src/test/java/com/metallum/client/metal/render/FrameEvidenceRecorderTest.java',
                     'src/test/java/com/metallum/client/metal/render/FrameEvidenceSegmentsTest.java'}
          paths = git('diff', '--cached', '--name-only', '-z').decode().rstrip('\0').split('\0')
          if set(paths) != allowed:
              raise RuntimeError('Unexpected patch paths')
          entries = []
          for path in paths:
              mode = git('ls-files', '--stage', '--', path).decode().split()[0]
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'content': (root / path).read_text()})
          tree = api('/git/trees', {'base_tree': git('rev-parse', 'HEAD^{tree}').decode().strip(), 'tree': entries})
          if tree['sha'] != git('write-tree').decode().strip():
              raise RuntimeError('Remote tree differs from reviewed local tree')
          commit = api('/git/commits', {'message': 'fix(evidence): publish windows and completed archives atomically\n\nRetain the valid shared-clock and abnormal-writer-exit intents of vision-cloud-convergence-20260922 without reverting subsequent segmented capture and readiness fixes. Reject failed declarations before mutation; require a positive final-flush receipt; preserve fatal writer causes. Add overflow, defensive-copy, shared-anchor and fatal-export regression tests.', 'tree': tree['sha'], 'parents': [parent]})
          result = {'parent_sha': parent, 'candidate_sha': commit['sha'], 'candidate_tree': tree['sha'],
              'patch_sha256': expected_patch_digest, 'changed_paths': paths,
              'refs_updated': False, 'tests_claimed': False}
          (output / 'candidate.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: convergence-edit-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/convergence-edit/
          if-no-files-found: error
          retention-days: 7
