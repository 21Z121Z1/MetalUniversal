# Temporary reviewed-source verification and immutable transport. No refs are changed.
name: Convergence prepared-worktree validation
on:
  push:
    branches: [convergence/main-unification-20260923]
    paths: [.github/workflows/convergence-edit.yml]
permissions:
  contents: read
jobs:
  generic-compute:
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      MTL_DEBUG_LAYER: '0'
      MTL_SHADER_VALIDATION: '0'
      MTL_HUD_ENABLED: '0'
      MTL_HUD_ENCODER_TIMING_ENABLED: '0'
      MTLFX_HUD_ENABLED: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: d40b8b3ed2f7438e2dece9d5f2836bdc0a967961
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
      - name: Materialize exact reviewed source and the diagnosed SDK label correction
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: MetalUniversal validation
          GIT_AUTHOR_EMAIL: validation@localhost
          GIT_COMMITTER_NAME: MetalUniversal validation
          GIT_COMMITTER_EMAIL: validation@localhost
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess
          base = 'd40b8b3ed2f7438e2dece9d5f2836bdc0a967961'
          expected_tree = 'afb3bc7207f322c8b76f2583d62a9d4c3a96b0a4'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          if git('rev-parse', 'HEAD') != base or git('status', '--porcelain'):
              raise RuntimeError('Unexpected source base or dirty checkout')
          parts = []
          for sha in ['3bfc4f5be75f43414f3e55ba1a75949ef41e0428',
                      'c54e0e7269e56ab57b5987ed37ffec6eb2480e3b',
                      'f5159eb5102c2588e900faf784835818690924d3',
                      '37c880ed9eaedc87e7c0289fa52acdf405156607']:
              blob = json.loads(subprocess.check_output(['gh', 'api', 'repos/21Z121Z1/MetalUniversal/git/blobs/' + sha]))
              data = base64.b64decode(blob['content'])
              if subprocess.check_output(['git', 'hash-object', '--stdin'], input=data).decode().strip() != sha:
                  raise RuntimeError('Transport blob mismatch')
              parts.append(data)
          payload = gzip.decompress(b''.join(parts))
          checksum = hashlib.sha256(payload).hexdigest()
          if checksum != '4dc491bd6ff58a7d31d19e8dc81e2b9de8708232eb66877da5c95a541435fef3':
              raise RuntimeError('Reviewed payload checksum mismatch')
          changes = json.loads(payload)
          if len(changes) != 4 or any(not p.startswith(('src/main/', 'src/test/')) for p in changes):
              raise RuntimeError('Unexpected source path set')
          for name, change in changes.items():
              path = pathlib.Path(name)
              if change['base_blob'] is None:
                  if path.exists():
                      raise RuntimeError('New source path already exists: ' + name)
                  text = change['content']
              else:
                  if git('hash-object', name) != change['base_blob']:
                      raise RuntimeError('Base blob changed: ' + name)
                  lines = path.read_text().splitlines(keepends=True)
                  for edit in reversed(change['edits']):
                      lines[edit['start']:edit['end']] = edit['lines']
                  text = ''.join(lines)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text)
              if git('hash-object', name) != change['expected_blob']:
                  raise RuntimeError('Reviewed output blob mismatch: ' + name)
          name = 'src/main/native/MetallumNative.swift'
          path = pathlib.Path(name); text = path.read_text()
          old = 'bridge.encoder.generateMipmaps(for: texture)'
          new = 'bridge.encoder.generateMipmaps(texture: texture)'
          if text.count(old) != 1:
              raise RuntimeError('SDK label correction no longer matches reviewed source')
          path.write_text(text.replace(old, new))
          changes[name]['expected_blob'] = '8cad80914ef1098951c2c598245b905abc4eeb5a'
          if git('hash-object', name) != changes[name]['expected_blob']:
              raise RuntimeError('Corrected native blob mismatch')
          subprocess.run(['git', 'add', '--', *sorted(changes)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          tree = git('write-tree')
          if tree != expected_tree:
              raise RuntimeError('Reviewed source tree mismatch: ' + tree)
          patch = subprocess.check_output(['git', 'diff', '--cached', '--binary', '--full-index'])
          commit = subprocess.check_output(['git', 'commit-tree', tree, '-p', base],
              input='Prepared shared compute ABI with SDK-correct mipmap label; unpublished validation only\n', text=True).strip()
          subprocess.run(['git', 'reset', '--hard', commit], check=True)
          output = pathlib.Path('build/agent-evidence'); output.mkdir(parents=True, exist_ok=True)
          proof = {'proof_subject': 'unpublished-prepared-worktree', 'source_base': base,
              'tested_commit_sha': commit, 'tested_tree_sha': tree, 'workflow_sha': os.environ['GITHUB_SHA'],
              'expected_blobs': {p: c['expected_blob'] for p, c in changes.items()}, 'payload_sha256': checksum,
              'sdk_label_correction': {'old': old, 'new': new},
              'main_acceptance': False, 'physical_display_acceptance': False, 'refs_updated': False}
          (output / 'prepared-subject.json').write_text(json.dumps(proof, indent=2) + '\n')
          (output / 'change.patch').write_bytes(patch)
          subprocess.run(['git', 'bundle', 'create', str(output / 'prepared-source.bundle'), 'HEAD'], check=True)
          print(json.dumps(proof, indent=2))
          PY
      - name: Record real SDK declaration authority and hosted GPU capability
        run: |
          set -euo pipefail
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$latest"
          xcodebuild -version | tee build/agent-evidence/xcode-version.txt
          headers="$(xcrun --sdk macosx --show-sdk-path)/System/Library/Frameworks/Metal.framework/Headers"
          grep -n -A8 -B4 -E 'gpuResourceID|supportArgumentBuffers' "$headers/MTLSampler.h" > build/agent-evidence/sampler-sdk-contract.txt
          grep -n -A10 -B4 -E 'dispatchThreadgroups|generateMipmaps' "$headers/MTL4ComputeCommandEncoder.h" > build/agent-evidence/metal4-compute-sdk-contract.txt
          xcrun swiftc -O -framework Metal .github/ci/HostedMetalCapabilityProbe.swift -o "$RUNNER_TEMP/metal-probe"
          "$RUNNER_TEMP/metal-probe" | tee build/agent-evidence/hosted-metal-probe.log
          grep -Fq HOSTED_METAL_GPU_PROBE_PASS build/agent-evidence/hosted-metal-probe.log
      - name: Compile both shipping Apple native targets and the real ABI regression
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace buildMacNative buildIOSNative compileMetal4PipelinePathTest \
            2>&1 | tee build/agent-evidence/compute-native-build.log
      - name: Verify fixed-width Java binding and indirect layout boundaries
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace test --tests '*MetalComputeArgumentContractTest' \
            -x buildMacNative -x buildIOSNative -x buildIOSSpvc \
            2>&1 | tee build/agent-evidence/compute-arguments.log
      - name: Execute the identical public ABI before and after genuine Metal 4 admission
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace -I .github/ci/HostedMetalGradle.init.gradle \
            metal4PipelinePathTest 2>&1 | tee build/agent-evidence/compute-common-abi.log
          grep -Fq 'GENERIC_COMPUTE_ABI_PASS Metal 3' build/agent-evidence/compute-common-abi.log
      - name: Revalidate shipping Java FFM compute and texture integration
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace -I .github/ci/HostedMetalGradle.init.gradle \
            hostedMetalCoreIntegrationTest --tests '*MetalComputeBackendIntegrationTest' \
            2>&1 | tee build/agent-evidence/compute-java-ffm.log
      - name: Publish verified immutable source blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, pathlib, subprocess
          output = pathlib.Path('build/agent-evidence')
          proof = json.loads((output / 'prepared-subject.json').read_text()); entries = []
          if subprocess.check_output(['git', 'status', '--porcelain'], text=True).strip():
              raise RuntimeError('Validation changed tracked source')
          for name, expected in proof['expected_blobs'].items():
              request = json.dumps({'encoding': 'base64', 'content': base64.b64encode(pathlib.Path(name).read_bytes()).decode()})
              response = json.loads(subprocess.check_output(['gh', 'api', '--method', 'POST',
                  'repos/21Z121Z1/MetalUniversal/git/blobs', '--input', '-'], input=request, text=True))
              if response['sha'] != expected:
                  raise RuntimeError('Published source blob mismatch: ' + name)
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': expected})
          (output / 'source-blobs.json').write_text(json.dumps(entries, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: generic-compute-prepared-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/agent-evidence/
            build/test-results/
            build/reports/tests/
          if-no-files-found: error
          retention-days: 30
