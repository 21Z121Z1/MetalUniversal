name: Agent MetalFX correctness 20260912

on:
  push:
    branches:
      - agent/metalfx-motion-coverage-26.2

permissions:
  contents: write

jobs:
  correctness:
    if: "github.event.head_commit.message == 'chore(agent): execute MetalFX correctness 20260912'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 64

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Apply bounded correctness patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_metalfx_correctness_20260912.py

      - name: Preserve production fail-closed and restored documentation
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'private static final boolean OBJECT_MOTION_PRODUCER_CONNECTED = false;' \
            src/main/java/com/metallum/client/metal/render/MetalFxManager.java
          head -n 1 docs/metalfx-frame-generation.md | grep -Fx '# MetalFX Frame Generation'
          grep -Fq 'SceneEncoding.DISPLAY_REFERRED_SRGB' \
            src/main/java/com/metallum/client/metal/render/FrameGenerationColorContract.java
          grep -Fq 'device.makeLibrary(source: copyMslSource(), options: nil)' \
            src/main/native/MetallumNative.swift
          grep -Fq 'for texture in NativeState.metalFxPreviousDepthTextures.values' \
            src/main/native/MetallumNative.swift

      - name: Compile product Java and JAR
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon compileJava compileTestJava jar

      - name: Run focused correctness contracts
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon test \
            --tests 'com.metallum.client.metal.render.FrameGenerationColorContractTest' \
            --tests 'com.metallum.client.metal.render.MetalFrameGenerationNativeSourceContractTest' \
            --tests 'com.metallum.client.metal.render.FrameSynthesisContractTest'

      - name: Check patch integrity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- \
            src/main/native/MetallumNative.swift \
            src/main/java/com/metallum/client/metal/render/FrameGenerationColorContract.java \
            src/test/java/com/metallum/client/metal/render/FrameGenerationColorContractTest.java

      - name: Remove one-shot correctness scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/agent-metalfx-correctness-20260912.yml \
            .github/scripts/apply_metalfx_correctness_20260912.py \
            .github/agent-triggers/metalfx-correctness-20260912

      - name: Commit verified runtime changes only
        shell: bash
        env:
          BRANCH: agent/metalfx-motion-coverage-26.2
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(metalfx): close resample residency and color contracts'
          git push origin "HEAD:${BRANCH}"
